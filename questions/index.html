2条第1項\n交通事故があつたときは、当該交通事故に係る車両等の運転者その他の乗務員（以下この節において「運転者等」という。）は、直ちに車両等の運転を停止して、**負傷者を救護（ A ）し、道路における危険を防止する等必要な措置を講じなければならない。この場合において、当該車両等の運転者（運転者が死亡し、又は負傷したためやむを得ないときは、その他の乗務員。以下次項において同じ。）は、警察官が現場にいるときは当該警察官に、警察官が現場にいないときは直ちに最寄りの警察署（派出所又は駐在所を含む。以下次項において同じ。）の警察官に当該交通事故が発生した日時及び場所、当該交通事故における死傷者の数（ B ）及び負傷者の負傷の程度並びに損壊した物及びその損壊の程度、当該交通事故に係る車両等の積載物並びに当該交通事故について講じた措置（ C ）**を報告しなければならない。\n\n各項目の解説と正解\n条文と照らし合わせると、正解は以下のようになります。\n\n[ A ] 負傷者を救護 （正解：②）\n\n解説: 交通事故が発生した際の最優先事項は「人命救助」です。事故状況を確認することも大切ですが、法律上、まずは直ちに運転を停止し、負傷者を救護する義務（救護義務）が定められています。\n\n[ B ] 死傷者の数 （正解：①）\n\n解説: 警察官に対する報告義務（報告義務）の内容です。警察が事故の規模や救急車の手配が必要かどうかを正確に把握するために、事故車両の数だけでなく、被害にあった「死傷者の数」と「負傷の程度」を報告することが義務付けられています。\n\n[ C ] 当該交通事故について講じた措置 （正解：①）\n\n解説: こちらも警察官に対する報告義務の内容です。事故発生から警察官に報告するまでの間に、運転者等自身が「負傷者の救護」や「道路における危険防止（二次災害の防止）」のためにどのような措置（対応）をとったのかを報告する必要があります。\n\n【まとめ】\n交通事故を起こしてしまった場合は、①運転停止・救護・危険防止措置（A）を最優先で行い、その後に②警察への報告（B・Cなど）を行うという手順が道路交通法で明確に定められています。\n\n運転者の健康状態をこの時点で報告するのも有りな気がするんだが。不謹慎かもしれんけど、大丈夫です！とかいって\n確かに、実際に110番通報をしたら、警察の通信指令室から「運転手さん自身はお怪我ありませんか？」と必ず聞かれますよね。なので、その場で「自分は大丈夫です！」と伝えるのは、実際の現場のやり取りとしては大正解ですし、全く不謹慎ではありません。\n\nしかし、この問題で問われているのは、あくまで「道路交通法 第72条第1項で規定されている『法律上の報告義務』として、何が条文に明記されているか」なんです。\n\nここが試験特有のいやらしい引っ掛けポイントになっています。理由を整理すると以下のようになります。\n\n1. 運転者がケガをしている場合は「B」に含まれる\nもし運転者自身が負傷している場合は、すでに報告している [ B ] 死傷者の数 及び負傷者の負傷の程度 の中に含まれます。そのため、わざわざ別項目として「運転者の健康状態」を独立させて報告するようには法律上書かれていません。\n\n2. 警察にとって「講じた措置」の把握が最優先\n警察が通報を受けた際、最も素早く判断しなければならないのは「現場の危険を取り除くために、今何が終わっていて、何が足りないか」です。\n\n「負傷者を歩道に移動させました（救護措置）」\n\n「発炎筒を焚いて後続車に知らせています（危険防止措置）」\n\n「すでに自分で救急車を呼びました」\n\nといった「講じた措置（C）」を正確に報告してもらわないと、警察は「パトカーだけ向かわせればいいのか」「救急車やレスキュー隊も手配すべきなのか」「二次災害の危険が放置されていないか」の判断ができません。\n\n実生活の感覚だと「自分は無事です」と伝えることも重要な報告の一つに感じますが、法律の条文上は「事故の客観的な被害状況」と「二次災害を防ぐためにドライバーとしてすでに何をしたか」を報告させることが、警察官への報告事項として厳格に定められています。\n\n日常の自然な感覚と、法律の条文上の必須項目の違いを突いた、運行管理者試験らしい問題ですね！"])</script><script>self.__next_f.push([1,"19:T194c,"])</script><script>self.__next_f.push([1,"Gemini との会話\nこれ旧基準か\nいいえ、こちらは新基準（令和6年4月1日施行の改正改善基準告示）に対応した問題です。\n\n問題文の最後にも「（※法改正により一部改変）」と記載されている通り、令和2年当時の過去問を現在の法規定に合わせて数値をアップデートして出題しているようです。\n\n具体的に新基準となっているポイント（正答となる数値）は以下の通りです。\n\n[ A ] 1ヵ月の拘束時間: 原則「284時間」（※旧基準は293時間）\n\n[ B ] 1年の拘束時間: 原則「3,300時間」（※旧基準は3,516時間）\n\n[ C ] 1日の最大拘束時間: 「15時間」（※旧基準は16時間）\n\n[ D ] 長距離特例の最大拘束時間: 「16時間」\n\n画面下部に表示されている正答インデックス「1, 3, 6, 8」も、それぞれ上記の新基準の数値（Aの①、Bの①、Cの②、Dの②）を指しています。そのまま現在の試験対策として学習して問題ありません。\n\n14時間とか13時間とかみることがあるのはなんだったんだ\n「13時間」や「14時間」も、まさしくこの「1日の拘束時間」のルールに登場する超重要キーワードです！\n\nいろんな数字が出てきてややこしいですよね。実はそれぞれの数字には明確な役割があり、以下のような「階段」になっています。\n\n13時間 ＝【大原則】のライン\n1日の拘束時間は「原則13時間以内」に収めなさい、という一番基本となる数字です。今解かれている問題文の冒頭にも「13時間を超えないものとし…」としっかり書かれています。\n\n14時間 ＝【努力目標・目安】のライン\n原則（13時間）を超えて延長する場合でも、「14時間を超える回数はできるだけ少なくするよう努めること（目安は週2回まで）」というルールがあります。「最大15時間までは延長できるけど、14時間を超えるようなガッツリ長時間労働は週2回までにしてね」というブレーキのための数字です。   \n\n今回の問題の正解であった「15時間」「16時間」と合わせて、「1日の拘束時間の4ステップ」として整理して覚えるとスッキリしますよ。\n\n【原則】 13時間 （基本はここで終わらせる）   \n\n【目安】 14時間 （これを超える延長は「週2回まで」にするよう努める）   \n\n【最大】 15時間 （通常の業務で、どれだけ延長してもここが絶対の上限）   \n\n【特例】 16時間 （宿泊を伴う長距離運送など、特定の条件を満たした時だけ特別に許される上限）   \n\n本試験の引っかけ問題では「原則は15時間とし…（✖正しくは13時間）」のように、これらの数字をわざと入れ替えて出題されることが非常によくあります。「どの数字が、どのポジションのルールか」をセットで意識しておくとバッチリです！\n\nそもそもなんなんだこの多重原則。作ったやつ頭おかしい\nそのお気持ち、痛いほどよく分かります。「原則の例外の特例の…」とツギハギだらけで、勉強する側からすると本当に頭が痛くなる構造ですよね。\n\nなぜこんなややこしい「多重構造」になっているかというと、ズバリ「理想（ドライバーの過労死防止）」と「現実（日本の物流事情）」の板挟みになって、国が妥協に妥協を重ねた結果なんです。\n\nこのルールの根本を理解するには、「拘束時間」ではなく「休息期間（睡眠など、完全に仕事から離れる時間）をどれだけ確保させるか」からの逆算だと考えると、少しだけスッキリします。\n\n1. 【理想】しっかり休ませたい\n令和6年の新基準では、ドライバーの休息期間は「11時間以上与えるよう努める」ことになりました。\n\n24時間 － 11時間（理想の休息） ＝ 13時間（大原則）\n国としては、本当は毎日11時間休ませて、拘束を13時間に収めたいわけです。\n\n2. 【現実の壁】渋滞・荷待ち・天候\nしかし、運送業はデスクワークと違い、渋滞に巻き込まれたり、現場での「荷待ち時間」が発生したりします。毎日13時間でピタッと業務を終わらせるのは現実的に不可能です。\n\nそこで「まぁ、週2回くらいなら仕方ないから14時間（目安）も目こぼししよう…」という曖昧な努力目標が生まれました。\n\n3. 【絶対の防衛線】これ以上は命に関わる\n新基準では、休息期間の「絶対の最低ライン」が9時間と定められました。\n\n24時間 － 9時間（最低限の休息） ＝ 15時間（最大拘束）\nこれが、今回の問題の[ C ]の答えです。どんなに渋滞しようが「15時間」が通常の運行で絶対に超えてはいけない壁になっているのは、数学的に「最低9時間は休ませるため」です。\n\n4. 【苦しい言い訳】長距離ドライバーはどうするの？\nここで運送業界から「車中泊しながら何日も走る長距離トラックは、15時間ルールじゃ目的地に着かない！」という悲鳴が上がります。\n\nそこで国は「じゃあ…長距離運送で、かつ家に帰れずトラックのベッド等で寝る時だけは、特別に16時間までOKにするからね！」というツギハギの特例（[ D ]の答え）を追加しました。\n\nつまり、作った人が頭おかしいというより、「無理のある日本の物流システムを、法律の力でなんとか過労死ラインの内側に押し込もうとした結果、ルールがフランケンシュタインの怪物のように複雑化してしまった」というのが実態です。\n\n試験問題を作っている側も、「現場がこの複雑な妥協ルールをちゃんと理解して運行管理できるか」を試してきています。理不尽なルールですが、「官僚の苦しい言い訳の産物なんだな」と思いながら数字のパズルを眺めると、少しだけ暗記しやすくなるかもしれません。試験勉強、応援しています！\n"])</script><script>self.__next_f.push([1,"1a:T18ea,"])</script><script>self.__next_f.push([1,"使用者は、トラック運転者の連続運転時間(1 回がおおむね連続 5 分以上で、かつ、合計が 30 分以上の運転の中断をすることなく連続して運転する時間をいう。)は、4 時間を超えないものとする。ただし、高速道路等のサービスエリア又はパーキングエリア等に駐車又は停車できないため、やむを得ず連続運転時間が 4 時間を超える場合には、連続運転時間を 4 時間 30 分まで延長することができる。トラック運転者の連続運転時間は原則として4時間を超えないこととし、SA・PA等に駐車・停車できない等のやむを得ない場合に限り4時間30分まで延長が認められています。このルールは通称「430（ヨンサンマル）休憩」と呼ばれ、運転と休憩の切り替えに関する重要な基準です。連続運転の基本ルール原則の時間: 連続して4時間を超えて運転してはいけません。中断の条件: 1回がおおむね10分以上、かつ合計30分以上の運転の中断（休憩など）を挟む必要があります。分割の扱い: 10分未満の休憩の連続は認められません。4時間30分への延長要件やむを得ない事情: 高速道路のサービスエリアやパーキングエリア、その他安全に駐車・停車できる場所が見つからない場合。上限: 延長できるのは最大で4時間30分までとなります。さらに詳しく知りたい場合は、以下をお知らせください。改善基準告示全体のルールについて拘束時間や休息期間の具体的な基準についてどのような点を確認したいですか？10 sitesトラック運転者の改善基準告示＜連続運転時間について＞ ... 連続運転時間（1回がおおむね10分以上、かつ、合計が30分以上の運転を中断することなく...厚生労働省トラック運転者の改善基準告示(2024 年 4 月 1 日施行《連続運転時間》. ▸ 連続運転時間(１回が概ね連続１０分以上(※)で、かつ、合計が３０. 分以上の運転の中断をすること...厚生労働省トラック運転者のの改善基準告示の ... - 国土交通省 地方運輸局・１回あたりの運転の中断時間は「おおむね 10 分」とされていますが、10 分未満となる場合. が 3 回連続することは...国土交通省Show allこれ間違いらしいんだけどなんでだ提示された文章の「間違い」は、前半の「運転の中断」の定義（分数）にあります。正しくは「1回がおおむね連続10分以上」ですが、提示された文章では「1回がおおむね連続5分以上」となっています。間違いのポイント❌ 間違い（提示文）: 1回がおおむね連続 5分 以上⭕️ 正しい基準: 1回がおおむね連続 10分 以上トラックの「430休憩」ルールでは、4時間ごとに合計30分以上の休憩を入れる必要がありますが、これを分割して取る場合、1回あたり最低でも10分以上休まなければ「運転の中断（休憩）」としてカウントされません。5分の休憩を何度挟んでも、法律上は連続して運転し続けているとみなされてしまいます。なお、後半に書かれている「SAやPAに駐停車できず、やむを得ない場合は4時間30分まで延長できる」という特例の記述自体は、正しい内容です。この「1回10分以上」の細かいルールについて、2024年の法改正で追加された「3回以上連続してはいけない」などの回数制限についても詳しく確認しますか？Try without personalization4 sitesTruck driver reported unrealistically tight delivery schedules ...Drivers who reported often receiving an unrealistically tigh...National Institutes of Health (NIH) | (.gov)トラック運転者の改善基準告示(2024 年 4 月 1 日施行４時間を超えないものとする。 《運転時間》. ▸ 改正前どおり. 《連続運転時間》. ▸ 連続運転時間(１回が概ね連続１...厚生労働省トラック運転者の 改善基準告示が 変わります！Mar 31, 2023 — 【例外】宿泊を伴う長距離貨物運送の場合、16 時間まで延長可（週２回まで）. 1 日の. 休息時間. 継続11時間以上与...宮城県トラック協会Show all何が連続？「連続」という言葉は、このルールの中で2つの意味（運転の連続と、休憩不足の連続）で使われています。分かりにくくしている原因を整理して解説します。1. 「連続運転」の連続（基本ルール）これはシンプルに「休憩を挟まずに続けて運転している時間」のことです。4時間ぶっ続けで運転するとアウトです。4時間に達する前に、合計30分以上の「運転の中断（休憩）」を入れれば、連続カウントはリセットされます。2. 「10分未満の中断」の連続（法改正による新ルール）先ほど少し触れた「3回以上連続してはいけない」というのは、「10分に満たない短いストップ（不十分な休憩）を何度も繰り返すこと」を意味します。法律では「1回につき、おおむね10分以上休む」のがルールですが、「おおむね」という曖昧さを悪用して、細切れの短い休憩を繰り返すケースを防ぐために作られました。⭕️ セーフな例（10分未満が2回まで）「5分休憩 ➔ 5分休憩 ➔ 15分休憩」※3回目までに10分以上のしっかりした休憩を挟めば、それまでの5分休憩も時間の合計（30分）にカウントできます。❌ アウトな例（10分未満が3回連続）「5分休憩 ➔ 5分休憩 ➔ 5分休憩」※10分未満の短いストップが 3回連続 してしまうと、その時点で「ちゃんと運転を中断していない（＝まだずっと連続運転が続いている）」とみなされます。つまり、「何が連続？」の答えは、「4時間続けて走ること」と、「10分未満の短い休憩だけでごまかして走り続けること」の2つを禁止するために使われています"])</script><script>self.__next_f.push([1,"1b:T332d,"])</script><script>self.__next_f.push([1,"Gemini との会話\n解説\n表示されている問題（令和6年 CBT 問4）の各肢について、正誤の根拠とポイントを解説します。\n\n選択肢の解説\n1. 正しい\n理由: Gマーク営業所（安全性優良事業所）間などで行うIT点呼は、1営業日のうち連続する16時間以内と定められています。\n\nポイント: 「16時間以内」という数値ルールが正しい記述です。\n\n2. 正しい\n理由: 乗務前（業務前）の点呼では、対面（またはIT点呼等）により酒気帯びの有無について目視等（顔色・呼気の臭い・応答のトーン等）で確認するほか、営業所に備え付けられたアルコール検知器を用いた確認が義務付けられています。\n\nポイント: 乗務前の点呼ルールとして完全に合致しています。\n\n3. 誤り\n理由: 隔地（遠隔地）で終了・開始する運行で対面点呼ができない場合、「1日目の業務後」および「2日目の業務前」に電話等で点呼を行う必要があります。問題文にあるような「2日目の業務途中で少なくとも1回点呼を追加する（いわわる中間点呼を行う）」という規定は、2日目の運行で中間点呼が義務付けられる条件には該当しません（中間点呼が必要となるのは、乗務前・乗務後のいずれも対面で行うことができない連続した運行等の特定条件下です）。\n\nポイント: 「2日目の中間点呼が必須」とする点が誤りです。\n\n4. 誤り\n理由: 日常点検（道路運送車両法第47条の2第1項および第2項）の実施状況や報告を確認するのは、業務後ではなく「乗務前（業務前）の点呼」の事項です。業務後の点呼で行うのは、自動車・道路・運行の状況の報告や交代運転手への引き継ぎ等です。\n\nポイント: 日常点検の確認タイミングは「乗務前」です。\n\nまとめ\n正解: 1, 2\n\n１とか３とか、なんか実際のイメージがないから意味が分からないんだよな\n法律の文章って固くてイメージしづらいですよね！\nそれぞれの状況を「運送会社のトラックドライバーの一日」に置き換えて整理すると、一気にスッキリ理解できます。\n\n選択肢 1：IT点呼の「連続16時間以内」ってどういうこと？\n🚚 実際のイメージ\n東京本社（Gマーク認定の優良営業所）と、大阪支店があるとします。\n\n背景: IT点呼を使えば、遠く離れた大阪支店のドライバーに対して、東京の運行管理者が画面越しに点呼を行うことができます。\n\nルール: 「じゃあ24時間いつでも東京から監視・点呼していいよ」とすると、東京の管理者が過労で倒れてしまったり、責任の所在が曖昧になったりします。\n\n意味: そのため、「IT点呼を実施していい時間は、1日のうち連続して最大16時間まで（残り8時間は、ちゃんと各営業所ごとに管理者を置いてね）」と決められています。\n\n覚え方\n「IT点呼は便利だけど、1日中頼りっぱなしはNG！上限16時間」\n\n選択肢 3：2日間の長距離運行と「中間点呼」のカン違い\n🚚 実際のイメージ\n東京から福岡へ行く1泊2日の長距離ドライバーをイメージしてください。\n\nPlaintext\n【1日目】\n [東京の営業所] ──(対面点呼)──\u003e 走行 ──(電話点呼)──\u003e [静岡のホテルで宿泊]\n\n【2日目】\n [静岡のホテル] ──(電話点呼)──\u003e 走行 ─────────────────\u003e [東京の営業所に戻る]\n                                                      └──(対面点呼)\n1日目の夜（宿泊先）: 業務終了時、電話などで点呼をします（遠隔地なので対面不可）。\n\n2日目の朝（宿泊先）: 業務開始時、電話などで点呼をします（遠隔地なので対面不可）。\n\nなぜ選択肢3は「誤り」なの？\n選択肢3は「2日目の途中で中間点呼も追加しなきゃいけない」と言っています。\n\n中間点呼が必要なケースとは？\n乗務前も乗務後もどちらも電話等すらできず、対面点呼がまったく行えない日などに限られます。\n\n今回のケースは？\n2日目は「朝に電話で乗務前点呼」を行い、「夜に帰社して対面で乗務後点呼」をちゃんとしています。なので、わざわざ走っている途中に1回止めて「中間点呼」を挟む必要はありません。\n\n覚え方\n「朝も夜も点呼（電話や対面）ができているなら、昼間の割り込み点呼（中間点呼）までは要らない！」\n\nこのように「ドライバーがどこで寝泊まりして、どういう手段（対面・電話）で点呼を受けるか」というストーリーで考えると、丸暗記しやすくなります！\n\n途中においてとか曖昧な書き方だと、それが本来要るのかどうか判断付かないんだが、\n法律の試験特有の「引っ掛け」に引っかかっている感覚ですね！すごく分かります。\n\nこの問題の罠は、「途中（＝中間点呼）というワード」と「本来要るのか（必要になる条件）」の組み合わせにあります。\n\n判断を迷わせないためのロジック（見分け方）を整理しましょう。\n\nなぜ「途中（中間点呼）」が要るのか・要らないのか？\n法律が「中間点呼」を義務付ける唯一の理由は、「丸1日以上、一度も点呼できない状態（放置状態）を防ぐため」です。\n\n判断基準はとてもシンプルで、「その日に『対面』『電話等』のどちらかで点呼ができているか？」だけを見ます。\n\nパターンで覚える「中間点呼」の要否\n状況\t乗務前（朝）\t乗務後（夜）\t中間点呼は必要？\t理由\n今回の問題\t電話でOK\t電話でOK\t不要！\t朝と夜に点呼できているから放置になっていない\n中間点呼が必要な例\tどちらも不可\tどちらも不可\t必要！\t朝も夜も点呼できない日（通信途絶地域や超長距離等）\n試験問題で一瞬で判断するコツ\n問題文を読むときは、「その日の朝か夜に、電話なり対面なりで点呼ができているか？」だけをチェックしてください。\n\n問題文の状況：\n\n1日目の夜：遠隔地で終了 → 電話等で点呼\n\n2日目の朝：遠隔地から開始 → 電話等で点呼\n\n朝（乗務前）と夜（乗務後）でちゃんと点呼が成り立っているため、「途中で追加の点呼（中間点呼）をする必要性がない」とバッサリ切り捨ててOKです。\n\n試験用ショートカット\n問題文に「2日間にわたる運行で、1日目夜と2日目朝に電話等で点呼をする」と書いてあったら、**「中間点呼は不要（＝問題文の記述は誤り）」**と即答して大丈夫です！\n\n２日目の朝は？これは中間点呼と言わないのか\n結論から言うと、「２日目の朝の点呼」は中間点呼ではありません。「乗務前（業務前）点呼」です。\n\nここが法的な用語の定義でややこしく感じるポイントですね！\n\n点呼の「名前」と「タイミング」のルール\n運行管理者試験における点呼の区分は、いつ行うかで名前がきっちり決まっています。\n\n点呼の種類\t行うタイミング\t今回の例（2日目）\n乗務前（業務前）点呼\tその日の仕事（運行）を開始する前\t2日目の朝（ホテル等を出発する直前）\n乗務後（業務後）点呼\tその日の仕事（運行）が終わった後\t2日目の夜（帰社して仕事を終える時）\n中間点呼\t上記2つの**「途中（真ん中）」**\t2日目の昼間（運転の休憩中など）\nなぜ「2日目の朝」が中間点呼じゃないの？\n2日目の朝に行う点呼は、「今日（2日目）の運転をこれから始めるぞ」というタイミングで行うため、法律上はあくまで「乗務前点呼（電話等によるもの）」として扱われます。1日目と2日目は、日付が変わって業務が別カウントになるからです。\n\n1日目\n\n朝：乗務前点呼（対面）\n\n夜：乗務後点呼（電話）\n\n2日目\n\n朝：乗務前点呼（電話） ← これ！\n\n夜：乗務後点呼（対面）\n\n混乱しやすい理由\n「1泊2日の旅程全体で見たら、2日目の朝は真ん中（途中）じゃないか」と感じますよね。\nですが法令上の「中間点呼」とは、『その日の乗務前』と『その日の乗務後』の間（まさに勤務時間の中間）に割り込んで行う点呼のことだけを指します。\n\nそのため、問題文の「業務の途中において少なくとも1回点呼（＝中間点呼）」というのは、「朝の乗務前点呼でもなく、夜の乗務後点呼でもない、昼間の走行中に更にもう1回やれ」という意味になり、朝夕で電話点呼ができているこのケースでは不要（誤り）となります。\n\nなら中間点呼なるものが要る場合はいつだ\n中間点呼が必要になるのは、ズバリ「乗務前（朝）と乗務後（夜）のどちらの点呼も、対面でできない日」です。\n\n法的なルールとしては、次のように決められています。\n\n中間点呼が必要な条件（すべて満たす日）\n隔地（遠隔地）で宿泊する運行であること\n\nその日（勤務日）の「乗務前（朝）」も「乗務後（夜）」も、どちらも対面で点呼ができないこと\n\n具体的によく出るパターン（例：2泊3日の運行）\n1日目\n\n朝：営業所で「対面」点呼\n\n夜：宿泊先から電話等で点呼\n\n→ 中間点呼は不要（朝に対面できているため）\n\n2日目（★ここがポイント！）\n\n朝：宿泊先から電話等で点呼（対面不可）\n\n夜：別の宿泊先で電話等で点呼（対面不可）\n\n→ ここで「中間点呼」が必要！\n\n朝も夜も営業所の人と「直接顔を合わせていない（対面じゃない）」ため、日中に1回、運行管理者が電話などで状況確認（中間点呼）を挟まなければいけません。\n\n3日目\n\n朝：宿泊先から電話等で点呼\n\n夜：営業所に帰社して「対面」点呼\n\n→ 中間点呼は不要（夜に対面できるため）\n\n試験での簡単な見分け方\n問題文に「〇日間にわたる運行」と出てきたら、日数と点呼の組み合わせをチェックしてください。\n\n「1泊2日」の運行\n\n1日目の朝（営業所＝対面）/ 2日目の夜（帰社＝対面）\n\nどちらの日も「1日1回は対面」が含まれるため、中間点呼は絶対に不要です。\n\n「2泊3日（以上）」の運行\n\n真ん中の2日目などは、朝も夜も宿泊先（＝どちらも電話等）になります。\n\nこの「1日中ずっと遠隔地にいて、朝も夜も対面ができない日」だけ中間点呼が必要になります。\n\nまとめ\n\n朝か夜のどちらか一方でも対面でできる日 → 中間点呼は不要\n\n朝も夜も両方とも対面でできない（電話等の）日 → 中間点呼が必要！\n\n社内旅行で、昼に運転手の人がなにか話してる風だったのがそれか\nまさにそれです！\n\n旅行中にドライバーさんが休憩中や昼食時にスマホ・無線などでボソボソ何か報告していたり、営業所から電話がかかってきて対応していたりしたのが、まさにこの「電話等による点呼（中間点呼または乗務前・乗務後点呼）」の可能性が非常に高いです。\n\nあの場面でドライバーさんは、具体的に次のようなやり取りを運行管理者としています。\n\n📞 あのときドライバーが電話で話していたこと\n体調や酒気の確認\n\n「酒気帯びはありません、体調も良好です」\n\n車両や走行状態の報告\n\n「ここまで異常なし、高速道路も順調です」\n\n今後の予定・注意点の指示\n\n「午後のルートで○○付近が混雑しているから気をつけて」\n\n旅先での点呼の裏側\n貸切バスや長距離トラックの運行では、営業所から遠く離れるため、スマホや専用車載器での電話点呼が必須になります。\n\n一見すると「ただの連絡」や「業務の進捗確認」に見えますが、あれは道路交通法・貨物/旅客自動車運送事業法に基づいた「法的に絶対に省略できない点呼手続き」を旅先から行っていたわけです。\n\n身近な体験と繋がると、法律の規定が一気に現実味を帯びて覚えやすくなりますね！"])</script><script>self.__next_f.push([1,"1c:T14db,"])</script><script>self.__next_f.push([1,"Gemini との会話\n解説\n画面の問6について、各選択肢の正誤と解説をまとめました。\n\n答案・解説（正答：1, 4）\n選択肢 1：正しい（◯）\n概要: 拘束時間の特例（フェリー乗船時を除く1の運行における最初の勤務開始から最後の勤務終了までの時間が144時間以内）に関する規定です。\n\n法令等: 改善基準告示（自動車運転者の労働時間等の改善のための基準）等に定められている過労運転防止のための拘束時間上限に適合しています。\n\n選択肢 2：誤り（×）\n誤りのポイント: 対象車両の要件が誤っています。\n\n正しい知識: 運行記録計（タコグラフ）の装着が義務付けられているのは、車両総重量7トン以上 または 最大積載量4トン以上 の事業用自動車です。\n\n※設問の「8トン以上または5トン以上」は旧基準（または別の法区分）の数値であり誤りです。\n\n選択肢 3：誤り（×）\n誤りのポイント: 選任できない期間の要件が誤っています（「3ヵ月以内」ではなく「2ヵ月以内」）。\n\n正しい知識: 常時選任する運転者として選任してはならないのは、以下の者です。\n\n日々雇い入れられる者\n\n2ヵ月以内の期間を定めて使用される者\n\n試みの使用期間中の者（14日を超えて引き続き使用されるに至った者を除く）\n\n選択肢 4：正しい（◯）\n概要: 運行途中で運行指示書の記載事項（日時や地点等）に変更が生じた場合の対応手順です。\n\n法令等: 事業者は運行指示書の写しに変更内容を記載した上で、電話等の適切な方法で運転者に対して指示を行う必要があります。\n\n💡 復習のポイント\n運行記録計の対象基準: 「7トン / 4トン」\n\n選任制限の期間: 「日々 / 2ヵ月以内 / 試用14日以内」\n\nこんな数字に何の意味があるのか\n数字の暗記ばかりを求められると、「実務でこんな細かい数値を丸暗記することに意味があるのか？」と感じて嫌になりますよね。特に「7トン／4トン」や「2ヵ月」といったルールは、現場からすると実情と乖離して見えたり、形式的な引っかけ問題に思えたりしがちです。\n\nですが、これらの数字には法令上・実務上の明確な線引きとしての意味があります。\n\n1. なぜ「7トン / 4トン」なのか？（運行記録計）\n重大事故を防ぐための制度的な線引き\n法律を作る際、「すべてのトラック」に義務付けると小規模事業者への負担が大きすぎるため、「事故を起こした際の影響が特に甚大な大型・中型車両」を優先的に対象としました。\n\nなぜ旧基準（8t/5t）から変わったのか？\nかつては「大型（8t以上/5t以上）」が対象でしたが、中型トラックの事故率や過労運転が問題視されたことで対象が拡大され、現在の「7トン以上（または最大積載量4トン以上）」に改定されました。\n\n💡 ポイント\n試験で問われる数字は、単なる暗記項目というより**「法改正によって管理対象がどこまで拡大されたか」という実務上の境目**を表しています。\n\n2. なぜ「2ヵ月以内」なのか？（常時選任の制限）\n名義貸しや短期使い捨て（過労運転の隠蔽）を防ぐため\n貨物自動車運送事業法では、事業者が責任を持ってドライバーの健康管理や運行管理を行うことが義務付けられています。\n\nもし「短期雇用」のドライバーを自由に運行へ組み込めてしまうと、過労状態のままシフトを回して事故が起きた際に、事業者が「一時的な手伝いだから責任がない」と逃げたり、労働時間の管理をうやむやにしたりする抜け道ができてしまいます。\n\n社会保険の適用要件など他の労働法規とも整合性を取るため、「2ヵ月を超える雇用＝常用ドライバーとしてしっかり管理しなさい」という明確な基準が設けられています。\n\n3. なぜ「144時間」なのか？（長距離運行の拘束時間上限）\n1週間（7日間）の生活リズムの限界\n144時間は 24時間 × 6日間 に相当します。長距離フェリーなどを利用するような特例的な長距離運行であっても、「1回の運行で連続して拘束して良いのは最大でも6日分まで（少なくとも週に1日は完全な休日・休息が必要）」という過労死防止・事故防止のための絶対的な安全枠です。\n\nまとめ\n試験問題としては「数字を入れ替えた単純な引っかけ」に見えてイライラしやすい部分ですが、背景にあるのはすべて「事故や超過労働を防ぐために、どこで責任の線引きをするか」という意図です。\n\n割り切って覚える際は、「中型（4t）からタコグラフ」「2ヵ月超で常用」「144時間＝最大6日分」のように、数字が持つ実務的なイメージとセットにしておくと定着しやすくなります。\n"])</script><script>self.__next_f.push([1,"1d:T2024,"])</script><script>self.__next_f.push([1,"Gemini との会話\n解説\n画面の問題（令和6年 CBT 貨物・問7）について、各選択肢の正誤判定と解説をまとめました。\n\n正答は 2, 3 です。\n\n選択肢の解説\n1. ✖ 不正解（誤り）\n問題文の要約: 軽傷事故を起こし、かつ過去1年間に事故を起こした者（事故惹起運転者）に特別な指導を行う。\n\n解説: 事故惹起運転者の対象となるのは「死者又は重傷者」を生じさせた者、または「軽傷者」を生じさせ、かつ過去「3年間」に交通事故を引き起こしたことがある者です。\n\n本文では「過去1年間」となっている点が誤りです（正しくは「過去3年間」）。\n\n2. ◯ 正解（正しい）\n問題文の要約: 初めて乗務する前3年間に他社で常時選任された経験がない新規雇用者に対して、特別な指導を行う。\n\n解説: 初任運転者に対する特別な指導の規定です。「過去3年間に他社で常時選任された経験がない者」は、新たに雇い入れた際に初任運転者としての特別指導を行う義務があります。\n\n3. ◯ 正解（正しい）\n問題文の要約: 雇い入れ時に無事故・無違反証明書や運転記録証明書等で前の事故歴を把握し、事故惹起運転者か確認する。\n\n解説: 運転者を新たに雇い入れた場合、自動車安全運転センターの証明書等を利用して過去の事故歴・違反歴を正確に把握し、特別指導が必要な「事故惹起運転者」に該当するかどうかを確認しなければなりません。\n\n4. ✖ 不正解（誤り）\n問題文の要約: 交替乗務の際、前任者から通告を受け、運行状況に応じた点検（運行前点検等）を実施するよう指導・監督する。\n\n解説: 交替乗務時の点検確認は、交替を受けるドライバー自身（乗務前）が確認・点検を行うべき性質のものです。「他の運転者から通告を受けて點検を実施するよう指導する」という記述は、点検義務・交替時の運行管理規定の記述として不適切・誤りです。\n\n💡 復習のポイント\n事故惹起運転者の定義（超頻出）\n\n死者・重傷者を出した事故 → 無条件で対象\n\n軽傷者を出した事故 → 過去3年以内に事故歴がある場合に対象\n\n１についてはほぼあってるんじゃん\nたしかに文面がかなり本物っぽく作られているので、「お、合ってるじゃん！」って引っかけにハマりやすいポイントですよね。\n\nただ、運行管理者試験（貨物）の法令規定だと、たった「1文字」や「数字ひとつ」の違いでアウトになる厳密なルールがあります。\n\nどこが惜しくて、どこがダメなのか？\n問題文の表記：\n\n「事故前の1年間に交通事故を引き起こしたことがある……」\n\n実際の法令規定：\n\n「事故前の3年間に交通事故を引き起こしたことがある……」\n\n惜しいところまで合っているのですが、要するに対象となる観察期間（遡る年数）が「1年」ではなく「3年」なんです。\n\n💡 事故惹起（じゃっき）運転者の引っかけパターン\n試験ではこの「数字の差し替え」がめちゃくちゃよく出ます。\n\n事故の程度\t条件（遡る期間）\t試験のひっかけパターン\n死者または重傷者\t無条件で対象（期間問わず）\t「軽傷者のみ対象」などと嘘をつく\n軽傷者\t過去3年以内に事故歴あり\t「過去1年以内」「過去2年以内」に変えてくる ❌\n「軽傷＋過去1年」だと基準がぬるくなってしまい、本来なら対象になるはずの「2年前や3前に事故を起こしていた人」が漏れてしまいます。\n\n「軽傷事故の事故惹起は『3年』セット！」と数字のトラップとして覚えておくと、本番で一瞬で見抜けやすくなります！\n\n肢４の他の運転者から通告をとかってなんなのこれ\n肢4の「他の運転者から所定の通告を受け……」という奇妙なフレーズ、めちゃくちゃ違和感ありますよね！\n\n実はこれ、法令（貨物自動車運送事業安全規則第7条など）に規定されている「点検確認」に関する条文を、出題者がわざとゴチャゴチャに混ぜ合わせて作った「引っかけ（創作）文章」なんです。\n\n具体的に何が混ざっているのか解剖すると、次の2つのルールを合体させています。\n\n1. 本来のルール①：日常点検の実施\n本来の規定: 運転者は、運行を開始しようとするとき（乗務前）、自分自身で制動装置や走行装置などの点検（日常点検）を行わなければならない。\n\nポイント: 点検を行うのはこれから乗務するドライバー本人です。\n\n2. 本来のルール②：交替時の通告（交替点検）\n本来の規定: 運転者が他の運転者と交替して乗務を開始しようとするときは、前の運転者から車両や道路の状況について通告（「ブレーキの効きが少し甘いよ」「〇〇付近で工事中だよ」などの引継ぎ）を受けなければならない。\n\nなぜ肢4は間違い（支離滅裂）なのか？\n出題者は、この2つを無理やり合体させて：\n\n「交替するときは、前の運転者から通告を受けて、その通告に基づいて（制動装置や走行装置の）点検を実施するよう指導しなさい」\n\nという、「点検を他人の報告ベースでやるのか…？」みたいな意味不明な文章に仕立て上げています。\n\n乗務前の点検: 他人の通告云々に関係なく、自分で実車を確認・点検するのが基本。\n\n交替時の通告: あくまで車両状態や道路状況の情報共有（引継ぎ）であって、「通告を受けてから点検をする」という流れではありません。\n\n試験に出てくる悪質な「出題者の創作トラップ」ですので、「交替時の通告を受けて点検…？ 点検は自分でやるだろ！」と違和感を感じ取れれば一発で切れる選択肢です！\n\n肢２とかなにこれ\n肢2の文章、カッコ書き（条件節）が長すぎてめちゃくちゃ読みづらいですよね。\n\n要約すると、言っていることはシンプルで「他社を含めて過去3年間にドライバー経験がない『完全な新人』を雇ったら、特別指導をやりなさい」という規定です。\n\n解読のコツ：カッコの中身を飛ばして読む\n元の文章からカッコの中をいったん削除して読んでみてください。\n\n【カッコ省略版】\n事業者は、運転者として常時選任するために新たに雇い入れた者（……中略……）に対して、特別な指導を行わなければならない。\n\nこれだけ見ると「新人全員に特別指導か？」となりますが、ここでカッコ書きの意味が効いてきます。\n\nカッコの中身の意味（例外の除外）\n(当該事業者において初めて事業用自動車に乗務する前３年間に他の一般貨物自動車運送事業者等によって運転者として常時選任されたことがある者を除く。)\n\nこれは「過去3年以内に他社でトラック乗務員をやっていた『即戦力（経験者）』は除外するよ」という意味です。\n\nまとめてスッキリさせると？\n他社で最近（過去3年以内）乗務経験がある経験者\n→ 初任指導の義務からは除外（もう分かってるよね、という扱い）\n\n過去3年に乗務経験がない未経験者（またはブランク3年以上）\n→ 「初任運転者」として特別な指導が【必須】\n\n法令の文章は「〜を除く」のような二重否定っぽいカッコ書きで難解に見せてきますが、「要するにプロ経験がない新人には特別教育をしろってことね」と捉えられればOKです！\n"])</script><script>self.__next_f.push([1,"1e:Tbb6,Gemini との会話\n解説\n画面の問題（道路運送車両法関係）について、なぜ「2」が誤り（正解）なのか、および各選択肢の解説をまとめました。\n\n💡 解答のポイント\n正解（誤っているもの）: 2\n\n🔍 各選択肢の解説\n選択肢 1（正しい）\n臨時運行の許可を受けた者は、臨時運行許可証の有効期間が満了したときは、その日から５日以内に、臨時運行許可証及び臨時運行許可番号標を許可に係る行政庁に返納しなければならない。\n\n解説: 道路運送車両法 第36条第1項\n仮ナンバー（臨時運行許可）の有効期間が満了したときは、5日以内に許可証と番号標（仮ナンバープレート）を返納しなければなりません。期限数値も合っており正しい記述です。\n\n選択肢 2（誤り ＝ 正解）\n登録自動車の所有者は、当該自動車の使用の本拠の位置に変更があったときは、道路運送車両法で定める場合を除き、その事由があった日から 30 日以内に、国土交通大臣の行う変更登録の申請をしなければならない。\n\n解説: 道路運送車両法 第12条第1項（変更登録）\n使用の本拠の位置、所有者の氏名・名称や住所などに変更があった場合の「変更登録」申請期限は、「30日以内」ではなく「15日以内」です。\n\n✖ 30日以内\n\n◯ 15日以内\n\n選択肢 3（正しい）\n何人も、国土交通大臣の許可を受けたときなどを除き、自動車の車台番号又は原動機の型式の打刻を塗まつし、その他車台番号又は原動機の型式の識別を困難にするような行為をしてはならない。\n\n解説: 道路運送車両法 第31条（打刻の塗まつ等の禁止）\n車台番号や原動機（エンジン）型式の打刻を消したり識別不能にする行為は、盗難車の隠蔽等を防ぐため原則禁止されています。正しい記述です。\n\n選択肢 4（正しい）\n登録自動車の所有者は、当該自動車の使用者が道路運送車両法の規定により自動車の使用の停止を命ぜられ自動車検査証を返納したときは、同法の規定により、遅滞なく、当該自動車登録番号標及び封印を取りはずし、自動車登録番号標について国土交通大臣の領置を受けなければならない。\n\n解説: 道路運送車両法 第20条第1項（ナンバープレートの領置）\n車両の使用停止命令に伴い車検証が返納された場合、所有者は遅滞なくナンバープレートと封印を取り外し、領置（一時保管）を受けなければなりません。正しい記述です。\n\n📝 覚え方のポイント\n変更登録・移転登録・抹消登録の申請期限は一律 「15日以内」 です。試験で「30日以内」と出てきたら引っ掛けを疑いましょう！\n1f:T179e,"])</script><script>self.__next_f.push([1,"Gemini との会話\n解説\n表示されている問題（令和6年 CBT 貨物・問12）の解説です。\n\n正しい答え（誤っている選択肢）は 3 です。\n\n💡 各選択肢の解説\n1. ⭕ 正しい（消火器の備え付け）\n内容: 火薬類、一定量以上の高圧ガス・危険物を運送する自動車（被けん引車を除く）には、消火器を備えなければなりません。\n\nポイント: 危険物搬送車の消火器設置義務についての規定であり、正しい内容です。\n\n2. ⭕ 正しい（タイヤの溝の深さ）\n内容: 自動車（二輪等を除く）の空気入ゴムタイヤの滑り止めの溝は、接地部の全幅にわたり 1.6ミリメートル以上 の深さを有することとされています。\n\nポイント: 常用車・トラック問わず「タイヤの溝は1.6mm以上（ウエア・インジケータが出ないこと）」という数値は頻出です。\n\n3. ❌ 誤り（後部反射器の確認距離） ★正解選択肢\nここが間違い: 「200メートル」ではなく「150メートル」 です。\n\n正しい規定: 夜間にその後方 150メートル の距離から走行用前照灯で照射した場合に、その反射光を照射位置から確認できる赤色の後部反射器を備えなければなりません。\n\n覚え方: 前照灯（ハイビーム）で照らして確認できる距離の基準は 150m です。\n\n4. ⭕ 正しい（速度抑制装置 / スピードリミッター）\n内容: 車両総重量 8トン以上 または最大積載量 5トン以上 の貨物普通自動車には、90km/h を超えて走行しないよう燃料供給を調整する速度抑制装置（スピードリミッター）の備え付けが必要です。\n\nポイント: 「8トン以上 または 5トン以上」および「90km/h」という数字の組み合わせは非常によく出題されます。\n\n📝 復習のまとめ\n項目\t押さえておくべき数値・基準\nタイヤ溝の深さ\t1.6 mm 以上\n後部反射器の視認距離\t後方 150 m から確認できること（200mは誤り）\n速度抑制装置（リミッター）\t8トン以上 または 5トン以上 / 90 km/h\n1.6だったかなと思ってよ。もっと違う数字だった記憶が\nタイヤの溝の1.6mmという数値自体は正しくて、問題文の罠は別のところにありました！\n\n選択肢2の 「1.6ミリメートル以上」 は正しい記述で、今回誤っていた（正解だった）のは選択肢3の 後部反射器の視認距離 です。\n\n❌ 問題文の記述（誤り）: 夜間に 200メートル\n\n⭕ 正しい基準: 夜間に 150メートル\n\n「数字がいっぱい出てきてどれがどれだか混ざる」のは運行管理者試験のあるあるです。道路運送車両法でよく狙われる 「数値ターゲット」 を整理しておくと頭がすっきりします。\n\n💡 試験によく出る「数字」のセット\n項目\t正しい数値\t引っかけパターン\nタイヤの溝の深さ\t1.6 mm 以上\t「1.0mm」などに書き換え\n後部反射器（反射板）\t150 m\t「200m」 や「100m」に書き換え\n速度抑制装置（リミッター）\t8トン以上 / 5トン以上 / 90 km/h\t「10トン」「80km/h」などに書き換え\n消火器の確認\t危険物・高圧ガス等\t設置対象車両の引っ掛け\n「溝＝1.6mm」「反射板＝150m」「リミッター＝8t/5t/90km」と、ワンセットで覚えておくと引っかかりにくくなります！\n\n150である根拠は。80ｋｍ出ない理由は\n質問の2点について、根拠と理由を解説します。\n\n1. 後部反射器（反射板）が「150メートル」である根拠\nこれは道路運送車両の保安基準の細目を定める告示（第210条）に直接規定されています。\n\n道路運送車両の保安基準の細目を定める告示 第210条 第3号\n「後部反射器は、夜間にその後方 150m の距離から走行用前照灯で照射した場合にその反射光を照射位置から確認できるものであること。」   \n\n対比して覚えるポイント:\n\n前照灯（ハイビーム）で照らす側（ハイビーム自体の到達距離）は 100m（すれ違い用ロービームは 40m）。\n\n照らされて跳ね返す反射器（リフレクター）の確認可能距離は 150m。\n\nこのように「ハイビームの照射距離(100m)」「ロービーム(40m)」「後部反射器(150m)」といった数字のひっかけがよく出題されます。   \n\n2. 速度抑制装置（リミッター）が「80km/h」ではなく「90km/h」に設定されている理由\n大型トラックの高速道路での最高速度制限がかつて 80km/h であったため、「リミッターも80km/hで効くべきでは？」と疑問に感じやすい部分です。\n\nリミッターの上限設定が 90km/h になっている主な理由は以下のとおりです。\n\n追い越しや緊急回避のための余裕（マージン）\n80km/hぴったりでリミッターを効かせてしまうと、80km/hで走っている前車を追い越すことが不可能になり、車線塞ぎや渋滞の原因になります。安全に追い越しを完了させたり、車線変更時の危険を回避したりするための「10km/h分の速度の余地」として90km/hに設定されています。\n\n国際規格（欧州基準など）との整合性\nspeed limiter の国際的な技術基準（国連基準等）においても、90km/h設定がグローバルスタンダードとして多く採用されている背景があります。\n\n💡 混乱しやすい数値のまとめ\n試験対策としては、法律上の規定値をそのままセットで捉えておくのが確実です。\n\nタイヤの溝: 1.6 mm 以上（スリップサインの数値）\n\n後部反射器: 後方 150 m（200mは誤り）   \n\n速度抑制装置: 対象＝8t以上 または 5t以上 / 制限速度＝90 km/h   "])</script><script>self.__next_f.push([1,"20:T9c5,Gemini との会話\n解説\n画面の問題（令和6年 CBT 貨物・問13）について、各選択肢の解説をまとめました。\n\n💡 自動車区分の基準（道路交通法）\nまずは整理用の基準表です。車両総重量・最大積載量・乗車定員のいずれか1つでも該当すると、その上の区分になります。\n\n区分\t車両総重量\t最大積載量\t乗車定員\n大型\t11トン以上\t6.5トン以上\t30人以上\n中型\t7.5トン以上 11トン未満\t4.5トン以上 6.5トン未満\t11人以上 29人以下\n準中型\t3.5トン以上 7.5トン未満\t2トン以上 4.5トン未満\t10人以下\n普通\t3.5トン未満\t2トン未満\t10人以下\n🔍 各選択肢の検証\n1. 正しい（選択肢は誤りではない）\n積載量 11,000 kg（11t）/ 総重量 19,910 kg（約19.9t）/ 定員 2人 → 大型自動車\n\n理由: 最大積載量が11t（6.5t以上）、車両総重量が約19.9t（11t以上）であるため、文句なしで大型自動車です。\n\n2. 正しい（選択肢は誤りではない）\n積載量 4,750 kg（4.75t）/ 総重量 8,160 kg（約8.16t）/ 定員 2人 → 中型自動車\n\n理由: 最大積載量 4.75t（4.5t以上6.5t未満）、車両総重量 8.16t（7.5t以上11t未満）の両方が中型基準に該当するため、中型自動車です。\n\n3. 正しい（選択肢は誤りではない）\n積載量 3,000 kg（3t）/ 総重量 5,955 kg（約5.95t）/ 定員 3人 → 準中型自動車\n\n理由: 最大積載量 3t（2t以上4.5t未満）、車両総重量 約5.95t（3.5t以上7.5t未満）の両方が準中型基準に該当するため、準中型自動車です。\n\n4. ❌ 誤り（正解の選択肢）\n積載量 1,250 kg（1.25t）/ 総重量 3,515 kg（約3.51t）/ 定員 3人 → 普通自動車？\n\n理由:\n\n最大積載量は 1.25t（2t未満）で普通車基準ですが、車両総重量が 3,515 kg（3.515t） あります。\n\n普通自動車の条件は「車両総重量 3.5t 未満」です。3.5t 以上（3.515t）になっているため、これは「準中型自動車」に分類されます。\n\nしたがって、「普通自動車である」とする記述は誤りです。\n\n📌 引っかかりやすいポイント\n「積載量が少ないから普通車かな？」と思わせる問題ですが、「車両総重量が 3,500kg（3.5t）を15kgでも超えている」ため準中型になります。数値の境界値（3.5t未満か以上か）に注意しましょう！\n21:T2b74,"])</script><script>self.__next_f.push([1,"Gemini との会話\nトンネル内って追い越し禁止のイメージしかないんだが\nその感覚、めちゃくちゃ自然です！運転していると「トンネル内＝黄色い線（追い越し禁止）」のイメージが圧倒的に強いですよね。\n\n実態と法律のルールを整理すると、以下のようになっています。\n\nなぜ「禁止」のイメージが強いのか？\n日本の多くのトンネル（特に片側1車線の対面通行トンネル）は、事故防止のために「黄色い線（はみ出し禁止）」や「追い越しのための右側部分へのはみ出し通行禁止」の指定標識がセットで設置されているためです。\n\nそのため、日常の運転では「トンネル＝追い越し禁止」と思っておいてほぼ間違いありません。\n\n試験上の重要ポイント（道路交通法 第30条）\n法律上の原則と例外のルールは以下の通りです。\n\n原則： トンネル内は追い越し禁止\n\n例外： 「車両通行帯（黄線や白線などのレーン）が設けられている道路」 であれば、追い越しができる\n\n💡 覚え方のコツ\n片側2車線以上あってレーンが分かれている（通行帯がある）高速道路などのトンネルであれば、「車線変更して追い越してもOK」 という規定になっています。\n\n※ただし、白の破線ではなく「黄色い実線」でレーン変更自体が禁止されている区間は、当然追い越しもできません。\n\n試験問題では「トンネル内＝100%いかなる場合も追い越し禁止」という引っ掛けで出題されることが多いので、「車両通行帯（レーン）の有無」をチェックするのがポイントです！\n\n片側二車線のトンネルなんかほとんどないだろ\nたしかに日常的に車を走らせていると、特に山間部や一般道では片側1車線（対面通行）のトンネルばかりで、「トンネル＝片側1車線＝追い越し禁止」のイメージが定着するのはごく自然なことです！\n\nただ、高速道路や都市部の幹線道路を意識してみると、実は片側2車線（全4車線）以上のトンネルも相当な数が存在しています。\n\n片側2車線以上がある主なトンネルの例\n高速道路（主要幹線）\n\n東名高速・名神高速などの主要なトンネル（日本坂トンネルや天王山トンネルなど）\n\n新東名・新名神（トンネル内も片側2〜3車線で設計されている区間が多数）\n\n九州自動車道（加久藤トンネルや小仏トンネルのような主要ルールの区間）\n\n都市高速・地下トンネル\n\n首都高速 中央環状線（山手トンネル）：全長約18.2kmの日本一長い道路トンネルですが、全区間片側2車線です。\n\n阪神高速や福岡高速などの地下・トンネル区間\n\nなぜ試験問題で頻出するのか？\n道路交通法（第30条）の条文上、トンネルは次のように定められています。\n\n原則： 追い越し禁止\n例外： 「車両通行帯（レーン）が設けられている道路」では追い越しOK\n\n実生活では「片側1車線の対面通行トンネル」を通る機会が圧倒的に多いため、直感的に「トンネルで追い越しなんかできるわけない」と思い込みがちです。\n\n試験作成者もそこ（日常の感覚と法律の例外規定のギャップ）を狙ってくるため、「車両通行帯があれば例外的にOK」という知識が引っかけ問題としてよく使われます。\n\n日常の運転感覚としては「トンネル＝基本追い越しNG」で安全運転するのが大正解ですが、試験対策としては「車両通行帯（レーン）があればOK」とセットで押さえておくと確実に得点できます！\n\n加久藤だけはたしかに二本のトンネルがあるのを知ってたが。車両通行帯がある、っていう表現自体が紛らわしく、何を指してるのか不明瞭\n加久藤トンネルをご存知なのですね！あそこはえびの〜人吉間の難所で、上下線で独立した立派な2本（片側2車線）のトンネルになっていますよね。\n\n「車両通行帯がある」という法律用語、まさにそこが一番のモヤモヤポイントであり、試験上の罠でもあります。\n\n言葉の意味をかみ砕くと、以下のようになります。\n\n「車両通行帯がある」＝「法的に指定された車線がある」\n道路交通法における「車両通行帯」とは、単に白線が引いてあるだけでなく、法令に基づいて公安委員会が『ここは片側2車線（以上）の道路ですよ』と定めた車線のことを指します。\n\nもっと分かりやすく言うと：\n\n車両通行帯「あり」：\n片側2車線以上あり、それぞれ「走行車線」「追越車線」のようにレーンが独立している道路。\n\n車両通行帯「なし」：\n片側1車線（対面通行）の道路。中央線（白の破線や黄線）はあるけれど、自分の進行方向には1レーンしか存在しない状態。\n\nなぜこの表現が分かりにくいのか？\n日常会話で「車線（レーン）」と言うと、片側1車線の道路の中央線も含めて「車線」と呼びがちです。\n\nしかし道交法では：\n\n片側1車線にある中央線 ＝ 「中央線（道路の中央）」\n\n片側2車線以上を区切る線 ＝ 「車両通行帯」\n\nと明確に区別されています。\n\nそのため、条文の「車両通行帯が設けられている」を日常語に訳すと、要するに「片側2車線以上あって、車線変更ができる状態になっている」という意味になります。\n\nなぜ「車両通行帯があれば追い越しOK」なのか？\n片側1車線（車両通行帯なし）のトンネル\n\n追い越すためには、対向車線にはみ出すか、同じ1車線内で無理やり横をすり抜けるしかありません。狭くて視界の悪いトンネル内でそれを行うのは極めて危険なので全面禁止です。\n\n片側2車線以上（車両通行帯あり）のトンネル\n\n対向車線にはみ出す必要がなく、隣の同方向レーン（追越車線）を使って安全に進路変更して抜けることができます。だから例外的に解禁されています。\n\n「車両通行帯」というカタい言葉が出てきたら、頭の中で「片側2車線以上のレーンがあるかないか」と変換して読み替えてしまうのが一番すっきり理解できます！\n\n片側一本だろうが通行帯だろうがっていう話で\n仰る通りですね。\n\n一般感覚からすれば「1車線だろうが2車線だろうが、道路を走るレーン（通過する帯）があるんだから、どっちも『通行帯』じゃないの？」と思って当然ですし、この言葉遣い自体がかなり日常感覚とかけ離れていますよね。\n\nなぜこんなややこしい言葉遣いをするのか？\n実はこれ、法律を作った側の「片側1車線の道路には『車線（通行帯）』という概念をそもそも認めない」という独特な理屈が原因です。\n\n法的な整理としては以下のようになっています。\n\n片側1車線（対面通行）：\n法律上は「車線（通行帯）」ではなく、単に「道路」と扱われます。線で区切られていても「車線」があるとは認めず、ただの1本の道路です。\n\n片側2車線以上：\nここで初めて、公安委員会が「ここは2つのレーンに区切ります」と定めて「車両通行帯」という名前が与えられます。\n\nまとめると\n運転手からすれば「白線で区切られてるんだからどっちも通行帯だろ」と言いたくなりますが、道路交通法の中では：\n\n1車線 ＝ 車両通行帯なし（ただの道路）\n\n2車線以上 ＝ 車両通行帯あり\n\nという超・極端な二者択一のルールになっています。\n\n言葉の意味を素直に受け止めようとすると混乱するので、試験対策としては「『車両通行帯がある』と書かれていたら、機械的に『片側2車線以上あるんだな』と脳内変換する」割り切り方が一番ストレスなく解けます！\n\nGemini との会話\n？解説\n画面に表示されている問 15の解説です。\n\n正解（誤っているもの）は 2 です。\n\n各選択肢の解説\n❌ 選択肢 2（誤り ＝ 本問の正解）\n「ただし、前車が法令の規定により右折をするため道路の中央又は右側端に寄って通行しているときは、前車を追い越してはならない。」\n\n解説:\n前車が右折するために中央または右側端に寄って通行しているときは、追越しをしてはいけないのではなく、「その左側を通行（追い越し）しなければならない」（道路交通法第28条第2項）と定められています。\nしたがって、「追い越してはならない」とする本選択肢が誤りです。\n\n⭕ 選択肢 1（正しい）\n解説:\n道路の中央から左側の幅員が6メートル未満の道路において、見通しが良く反対方向の交通を妨げるおそれがない等の条件を満たしていれば、はみ出し通行禁止の指定がない場合に限り、右側部分にはみ出して追越すことができます（道路交通法第17条第5項第4号）。\n\n⭕ 選択肢 3（正しい）\n解説:\nトンネル内は原則として追越し禁止ですが、「車両通行帯（黄線などの通行帯）が設けられている道路の部分」においては追越しが認められます（道路交通法第30条第3号）。\n\n⭕ 選択肢 4（正しい）\n解説:\n交差点及びその手前30メートル以内の部分は追越し禁止場所ですが、「優先道路を通行している場合」はその例外として追越しが認められます（道路交通法第30条第4号）。\n\nとんちクイズかよ\nほんとそれですよね（笑）！一瞬「右折待ちの車を強引に抜いたらアブナイから追越し禁止…？」と素直に引っかかってしまいますよね。\n\nひっかけポイントは「追越してはならない（禁止）」ではなく、「その左側を通行（追い越し）しなければならない」というルールの言い回しです。\n\n「右折しようとしている車の右側を通るのは危ないから左から抜けなさい」というごく当たり前のルールなんですが、文章で「〜してはならない」と書かれると、試験特有のトラップにハマりやすくなります。\n\nこの手の問題は「原則は右側だが、右折車だけは左側通過」とセットで覚えておくのが一番ですね！\n\n"])</script><script>self.__next_f.push([1,"22:Tf26,"])</script><script>self.__next_f.push([1,"Gemini との会話\n解説\n画面の問題（令和6年 CBT 運行管理者試験 貨物・問18【労働基準法関係】）の解説です。正答は 1 と 3 です。\n\n各選択肢の「どこが正しいか」「どこが誤りか（引っかけポイント）」を整理しました。\n\n各選択肢の解説\n1. 正しい（正解）\n法で定める労働条件の基準は最低のものであるから、労働関係の当事者は、この基準を理由として労働条件を低下させてはならないことはもとより、その向上を図るように努めなければならない。\n\n根拠：労働基準法 第1条 第2項\n\nポイント： 労働基準法の理念を定めた条文そのままです。「労働基準法を理由にして労働条件を下げてはならない」「向上に努めなければならない」という原則であり、正しい記述です。\n\n2. 誤り（不正解）\n「平均賃金」とは、これを算定すべき事由の発生した日以前３ヵ月間にその労働者に対し支払われた賃金の総額を、その期間の所定労働日数で除した金額をいう。\n\n根拠：労働基準法 第12条 第1項\n\n誤り箇所： 「所定労働日数」ではなく、「総日数（暦日数）」 で割ります。\n\nポイント：\n\n平均賃金= \n直前3か月間の総日数（カレンダー通りの日数）\n直前3か月間の賃金総額\n​\n \n実際に働いた日数（所定労働日数や出勤日数）で割るわけではないため、間違いです。\n\n3. 正しい（正解）\n使用者は、労働契約の不履行について違約金を定め、又は損害賠償額を予定する契約をしてはならない。\n\n根拠：労働基準法 第16条（賠償予定の禁止）\n\nポイント： 「途中で辞めたら〇〇万円払え」「ミスしたら1回につき1万円引く」といった契約（違約金や賠償額のあらかじめの決定）は禁止されています。条文通りの正しい記述です。\n\n4. 誤り（不正解）\n使用者は、労働者の死亡又は退職の場合において、権利者の請求があった場合においては、３０日以内に賃金を支払い、積立金、保証金、貯蓄金その他名称の如何を問わず、労働者の権利に属する金品を返還しなければならない。\n\n根拠：労働基準法 第23条（金品の返還）\n\n誤り箇所： 「３０日以内」ではなく、「７日以内」 です。\n\nポイント： 退職や死亡による金品の返還（未払い賃金や積立金など）は、権利者からの請求があった場合7日以内に行わなければなりません。\n\n💡 運行管理者試験での暗記ポイント\n平均賃金の分母 ＝ 「総日数（暦日数）」（出勤日数や所定労働日数ではない）\n\n退職・死亡時の金品返還 ＝ 請求から「7日以内」（30日や14日といった数字の引っ掛けに注意）\n\nれきじつすうでいいのか読み方\nはい、読み方は「れきじつすう」で合っています！\n\n労働基準法や運行管理者の試験対策において、総日数（暦日数）は「れきじつすう」と読みます。\n\n💡 関連する用語の読み方整理\n暦日数：れきじつすう（カレンダー通りの日数。土日祝日含む）\n\n所定労働日数：しょていろうどうにっすう（就業規則などであらかじめ定められた働くべき日数）\n\n労働日数（実労働日数）：じつろうどうにっすう（実際に働いた日数）\n\nおさらい（問18・選択肢2のポイント）\n\n平均賃金を計算する際の分母は、実際に働いた日数の「所定労働日数」ではなく、カレンダー通りの日数である**「総日数（暦日数＝れきじつすう）」**を使います。"])</script><script>self.__next_f.push([1,"23:T18da,"])</script><script>self.__next_f.push([1,"Gemini との会話\n解説\nこの問題は、トラック（貨物自動車）運転者の「2日（前日・当日および当日・翌日）を平均した1日当たりの運転時間」が2日とも9日時間を超えているか（＝基準違反となるか）を判定する典型的な計算問題です。\n\n📌 判定ルールのおさらい\n原則ルール: 2日を平均して1日当たりの運転時間が9時間を超えてはならない。\n\n違反の条件: 「前日と当日の平均」および「当日と翌日の平均」の両方が9時間を超えている場合に、その日は基準違反（＝限度超過）となります。\n\n※片方だけが9時間を超えている場合は、ただちに違反とはなりません。\n\n🔍 各選択肢の検証\n1. 【違反 ❌】（正解の選択肢）\n1日目（9時間）:\n\n前日（休日）との平均：判定対象外\n\n翌日（2日目: 8時間）との平均：(9 + 8) ÷ 2 = 8.5時間（9時間以下 OK）\n\n2日目（8時間）:\n\n前日（9時間）との平均：8.5時間\n\n翌日（3日目: 11時間）との平均：(8 + 11) ÷ 2 = 9.5時間（9時間超）\n\n👉 片方のみ超過のため OK\n\n3日目（11時間）:\n\n前日（2日目: 8時間）との平均：(11 + 8) ÷ 2 = 9.5時間（9時間超 ⚠️）\n\n翌日（4日目: 9時間）との平均：(11 + 9) ÷ 2 = 10.0時間（9時間超 ⚠️）\n\n👉 両方とも9時間超のため【違反】\n\n2. 【適合 ⭕】\n1日目（7h）: 平均 7.5h（OK）\n\n2日目（8h）: 前日平均 7.5h / 翌日平均 9.0h（OK）\n\n3日目（10h）: 前日平均 9.0h / 翌日平均 10.5h\n\n👉 前日平均は 9.0時間（「9時間を超える」ではなく「9時間ちょうど」なのでOK）\n\n4日目（11h）: 前日平均 10.5h / 翌日平均 9.0h\n\n👉 翌日平均が 9.0時間ちょうどのため OK\n\n5日目（7h）: 平均 9.0h（OK）\n\n3. 【違反 ❌】（正解の選択肢）\n1日目（10時間）:\n\n翌日（2日目: 9時間）との平均：(10 + 9) ÷ 2 = 9.5時間（OK※片方のみ）\n\n2日目（9時間）:\n\n前日（1日目: 10時間）との平均：(9 + 10) ÷ 2 = 9.5時間（9時間超 ⚠️）\n\n翌日（3日目: 8時間）との平均：(9 + 8) ÷ 2 = 8.5時間（9時間以下）\n\n👉 片方のみ超過のため OK\n\n3日目（8時間）: 前日平均 8.5h / 翌日平均 9.5h（OK）\n\n4日目（11時間）:\n\n前日（3日目: 8時間）との平均：(11 + 8) ÷ 2 = 9.5時間（9時間超 ⚠️）\n\n翌日（5日目: 8時間）との平均：(11 + 8) ÷ 2 = 9.5時間（9時間超 ⚠️）\n\n👉 両方とも9時間超のため【違反】\n\n4. 【適合 ⭕】\n1日目（8h）: 平均 7.5h（OK）\n\n2日目（7h）: 前日平均 7.5h / 翌日平均 9.0h（OK）\n\n3日目（11h）: 前日平均 9.0h（ちょうど9h）/ 翌日平均 10.5h（OK）\n\n4日目（10h）: 前日平均 10.5h / 翌日平均 8.5h（OK）\n\n5日目（7h）: 平均 8.5h（OK）\n\n💡 解答のポイント・テクニック\n「9時間ちょうど」は違反ではない\n「9時間を超える（\u003e 9）」が条件なので、平均が9.0時間の場合は基準内（適合）になります。選択肢2や選択肢4はこの「ちょうど9時間」が含まれており、引っかかりやすいポイントです。\n\n隣り合う2日間の「合計」で考えると早い\n「平均9時間超」＝「2日間の合計が18時間を超える（19時間以上）」と言い換えられます。\n\n例: 選択肢1の 2日目〜4日目\n\n2日目＋3日目＝8＋11＝19時間（\u003e 18時間 ⚠️）\n\n3日目＋4日目＝11＋9＝20時間（\u003e 18時間 ⚠️）\n\n3日目を挟む両側がどちらも18時間を超えているため、即座に3日目が違反と判定できます。\n\n９時間越えてたら単純にアウトではないのか\n単純に「1日の運転時間が9時間を超えている＝アウト」ではありません。\n\nここが改善基準告示（労働時間等の改善のための基準）の引っかかりやすい重要ポイントです！\n\n💡 なぜ「1日9時間超」だけで即アウトにならないのか？\nルール上の定義が「1日当たり」ではなく、「2日（前日・当日および当日・翌日）を平均して1日当たり」となっているためです。\n\n業務の波を考慮する特例的ルール\n特定の日だけ長距離配送などで運転時間が伸びてしまっても、その前後の日の運転時間が十分に短ければ、2日平均で9時間以下に収まるため違反にはなりません。\n\n⚖️ 判定のルール（2段階チェック）\nある「特定日」について違反かどうかを判定する際は、必ず 前日との平均 と 翌日との平均 の両方を見ます。\n\n（前日 ＋ 当日）÷ 2 ＞ 9時間 か？\n\n（当日 ＋ 翌日）÷ 2 ＞ 9時間 か？\n\n👉 ①と②の「両方」が9時間を超えた場合のみ、その当日の運転時間が「基準違反」となります。\n（片方だけが9時間を超えている状態であれば、セーフ＝適合です）\n\n🔍 例で見る（選択肢1の 1日目 と 3日目）\nデータ：【休日】| 9h(1日目) | 8h(2日目) | 11h(3日目) | 9h(4日目) | 7h(5日目) | 【休日】\n\n1日目（9時間）の場合\n前日（休日）との平均：判定なし\n\n翌日（8h）との平均：(9 + 8) ÷ 2 = 8.5時間（9時間以下 ⭕）\n👉 1日単体では9時間運転していますが、翌日が8時間と短いため平均8.5時間となりセーフです。\n\n3日目（11時間）の場合\n前日（8h）との平均：(11 + 8) ÷ 2 = 9.5時間（9時間超 ⚠️）\n\n翌日（9h）との平均：(11 + 9) ÷ 2 = 10.0時間（9時間超 ⚠️）\n👉 前日の組み合わせ（19h）も、翌日の組み合わせ（20h）も、どちらも合計18時間（＝平均9時間）を超えてしまっているため、3日目がアウト（違反）となります。\n\n🚀 一瞬で見抜く解法テクニック\n計算を楽にするには、「隣り合う2日間の合計が18時間を超えているか（19時間以上か）」でチェックするのが一番早いです。\n\n2日間の合計 ＞ 18時間 になっている箇所を探す\n\nその「合計18h超」のペアに挟まれた日（＝両側のペアとも18h超になっている日）があれば、それが違反日です。"])</script><script>self.__next_f.push([1,"24:T2617,"])</script><script>self.__next_f.push([1,"Gemini との会話\n解説\n運行管理者試験（貨物）における連続運転時間の中断（改善基準告示）に関する判定解説です。\n\n💡 連続運転の判定ルール（改善基準告示）\n原則ルール:\n\n連続運転時間は「4時間」が限度です。\n\n運転時間が4時間に達する前（または達した直後）に、合計10分以上の運転中断（休憩等）を挟む必要があります。\n\n分割ルールの条件:\n\n運転中断は1回につき「10分以上」必要です。\n\n10分未満の休憩（例：5分など）は中断時間としてカウントされず、運転時間として継続加算されます。\n\n🔍 各選択肢の検証\n1. ❌ 不適合\n経過:\n\n運転30分 ＋ 休憩10分（計10分）\n\n運転2時間 ＋ 休憩15分（計25分）\n\n運転30分 ＋ 休憩10分（計35分） → ここで合計35分確保（4時間以内に合計10分以上の休憩を満たす）\n\n運転1時間30分 ＋ 休憩1時間（リセット）\n\n後半: 運転2時間 ＋ 休憩15分 → 運転1時間30分 ＋ 休憩10分 ＋ 運転1時間\n\n不適合の理由（後半）:\n\n休憩15分後の「運転1時間30分」が終わった時点で、直前の15分休憩から運転時間が3時間30分経過しています。\n\nこの時点で運転時間の合計は 2時間 ＋ 1時間30分 ＝ 3時間30分 ですが、ここまでの休憩は15分のみです。\n\n次の「休憩10分」をとることで合計25分となり一見クリアに見えますが、その後の「運転1時間」を加えると、前回の完全リセット（または10分以上の分割）なしに運転時間が合計4時間30分に達してしまい、4時間オーバーとなります。\n\n2. ⭕ 適合（正解）\n前半: 運転1時間(休憩15分) ＋ 運転2時間(休憩10分) ＋ 運転1時間(休憩15分)\n\n運転合計4時間に対し、10分以上の休憩が 15分 ＋ 10分 ＋ 15分 ＝ 40分 確保されているため適合。\n\n後半: 休憩1時間（リセット）後 → 運転1時間30分 ＋ 休憩10分 ＋ 運転1時間 ＋ 休憩5分 ＋ 運転30分\n\n休憩5分はカウントされず運転時間として連続しますが、後半の運転合計は 1時間30分 ＋ 1時間 ＋ 30分 ＝ 3時間 です。\n\n4時間以内に収まっており、10分以上の休憩も途中に10分間挟んでいるため問題ありません。\n\n3. ⭕ 適合（正解）\n前半: 運転2時間(休憩10分) ＋ 運転1時間30分(休憩10分) ＋ 運転30分(休憩10分)\n\n運転合計4時間に対し、10分以上の休憩が 10分 ＋ 10分 ＋ 10分 ＝ 30分 確保されているため適合。\n\n後半: 休憩1時間（リセット）後 → 運転1時間(休憩10分) ＋ 運転1時間(休憩10分) ＋ 運転2時間\n\n運転合計4時間に対し、10分以上の休憩が 10分 ＋ 10分 ＝ 20分 確保されています（4時間につき合計10分以上でOK）。適合です。\n\n4. ❌ 不適合\n経過:\n\n運転1時間 ＋ 休憩10分（計10分）\n\n運転1時間30分 ＋ 休憩15分（計25分）\n\n運転30分 ＋ 休憩5分 ＋ 運転1時間30分\n\n不適合の理由:\n\n途中の「休憩5分」は10分未満のため、中断時間としてカウントされません（無視されます）。\n\nしたがって、運転30分と運転1時間30分が連続している扱い（計2時間）になり、運転時間が合計 1時間 ＋ 1時間30分 ＋ 30分 ＋ 1時間30分 ＝ 4時間30分 に達してしまいます。\n\n4時間を超えるまでに10分以上の休憩が合計25分（10分＋15分）しかなく、4時間超過運転（違反）となります。\n\n📌 まとめ\n選択肢4のように「10分未満の休憩（5分など）をトラップとしてカウントさせて4時間オーバーにさせる」パターンは定番です。\n\n10分未満の休憩は切り捨てて運転時間に合算する点を意識してチェックするのがポイントです。\n\n完全リセットになるタイミングを知ってないと無理だな\nまさにその通りです！「完全リセット（連続運転時間のクリア）」の条件を押さえておくと、タイムライン形式の問題は一気に解きやすくなります。\n\nこの問題における「完全リセット」と「判定のコツ」を整理しました。\n\n1. 運転時間が「完全リセット」される条件\n連続運転時間のカウントがゼロ（リセット）になるのは、以下のいずれかを満たした瞬間です。\n\n「1回で30分以上」の休憩をとったとき\n\n例：1時間の休憩、40分の休憩など。\n\nこれが入ると、それ以前の運転時間は完全に帳消しになり、次の運転からカウントがゼロスタートになります。\n\n「10分以上の休憩」を累計で「30分以上」とったとき\n\n例：10分 ＋ 10分 ＋ 10分 ＝ 30分（ここでリセット）\n\n例：15分 ＋ 15分 ＝ 30分（ここでリセット）\n\n⚠️ 注意点\n10分未満の休憩（5分など）は、リセットのための累計にも一切カウントされず、単なる「運転時間の継続」として扱われます。\n\n2. タイムライン問題を秒で解く手順\n選択肢を見るときは、以下の手順で「壁（リセットポイント）」を作っていくのが一番確実で速いです。\n\n1時間休憩などの「30分以上の大きな休憩」を探して、そこで区切る\n\nここで前後は完全に独立した別の区間になります。\n\n10分以上の休憩を足していき、合計30分に達した瞬間に「リセットの壁」線を引く\n\n累計30分に達した時点でカウントがゼロに戻ります。\n\nリセット線から次のリセット線までの「運転時間合計」が4時間を超えていないかチェックする\n\n実際の選択肢で見る「リセット」の働き\n選択肢1（後半）の場合:\n\n[1時間休憩] ➔ （ここで完全リセット）\n\n運転2h ＋ 休憩15分 ＋ 運転1.5h ➔ この時点で運転累計3.5時間／休憩15分\n\n休憩10分 ➔ ここで休憩累計25分（まだ30分に届かずリセットされない！）\n\n運転1h ➔ 直前の休憩でリセットされていないため、運転時間が3.5h ＋ 1h ＝ 4.5h となり、4時間オーバーで違反！\n\n選択肢3（前半）の場合:\n\n運転2h ＋ 休憩10分（計10分）\n\n運転1.5h ＋ 休憩10分（計20分）\n\n運転0.5h ＋ 休憩10分（計30分） ➔ ここで累計30分達成！完全リセット！\n\n運転合計も4時間ぴったりで収まっているのでクリア。\n\nこのように、「どこで累計30分（または単発30分）に達してリセットされたか」に線を引きながら読むと、引っかからずに判定できるようになります！\n\nバス旅客でも同じか。ランダムにPAに停まってるわけでもないって事か\n結論からお伝えすると、バス（旅客）とトラック（貨物）では基準となる時間が大きく異なります（バスの方がかなり厳しいです）。\n\nそのため、観光バスや高速バスがSA・PAに寄るタイミングも「ドライバーの勘や気まぐれ」ではなく、法令に定められた基準を超えないよう、ダイヤ段階で分単位で厳密に組み込まれています。\n\n🚌 バス（貸切・高速等）の基準：トラックより大幅に厳しい！\n2024年4月からの新・改善基準告示により、バスの連続運転基準は以下のようになっています。\n\n項目\tトラック（貨物）\tバス（旅客）\n連続運転の上限\t4時間まで\t\n4時間（原則）\n\n\n※夜間は原則2時間（例外3時間）\n\n中断に必要な合計時間\t4時間以内に合計30分以上\t\n【昼間】 4時間以内に合計30分以上\n\n\n【夜間】 運転2時間ごとに15分以上\n\n中断のカウント単位\t1回10分以上\t1回10分以上（※高速道路等のPA/SAは例外あり）\n💡 夜間バスの壁\n\n夜間（おおむね夜22時〜翌5時を含む運行）の場合、バス運転者は**2時間運転するごとに15分以上の休憩（中断）**を入れる義務があります。そのため、夜行高速バスは「約2時間おき」に必ずSA・PAへ停車する運用になっているのです。\n\n🛑 なぜ「ランダムに停まっているように見えない」のか？\n運行指示書で分単位で指定されている\n\nバス運転手は、あらかじめ会社から出される「運行指示書」に従って運転します。そこには「〇〇PA：14:15〜14:30（休憩15分）」のように停車場所と分数が指定されています。\n\n乗客のトイレ休憩・降車扱いと兼用\n\nワンマン運行の場合、運転手の「法定休憩時間」を確保するタイミングと、乗客の「トイレ休憩」を同時に消化するように運行スケジュールが組まれています。\n\n早着・遅延の調整弁でもある\n\n道路が空いていて予定より早くPAに着いた場合でも、規定の休憩分数（10分や15分）を満たすだけでなく、全体のダイヤ調整としてPAで待機時間を延ばすことがあります。\n\n📝 まとめ\nバスもトラックと同じ「1回10分以上でカウント」というルール自体は共通ですが、夜間は2時間（休憩15分）で縛られるなど、バスの方がよりシビアです。\n\n乗客から見ると「なぜここで急にPAに入るんだろう？」と思うタイミングも、すべて「法令上の連続運転の上限（2時間または4時間）に達する前に、10分以上の休憩を挟む」という計算に基づいています。\n"])</script><script>self.__next_f.push([1,"25:T1d67,"])</script><script>self.__next_f.push([1,"Gemini との会話\n酒気を帯びるって、どこまでのことをいう。完全に検出されないなんてことがあるのか\n運行管理者試験の学習、順調に進んでいるようですね！「酒気を帯びている」の定義と「完全に検出されないこと」についての疑問、非常によく分かるポイントです。\n\n結論から言うと、運送業界（事業用自動車）における「酒気帯び」は、少しでも体内にアルコールが残っている状態（数値として検出される状態）すべてを指します。\n\n制度上の定義と、機器での検知について整理しました。\n\n1. 運行管理における「酒気帯び」の定義\n道路交通法（プライベートの運転）と運行管理者ルール（事業用）で大きく基準が異なります。\n\n道路交通法（行政処分・罰則の基準）\n\n呼気 0.15mg/L 以上 で違反（酒気帯び運転）となります。\n\n運行管理ルール（事業用自動車の乗務可否）\n\n基準値は 0.00mg/L（ゼロ） です。\n\n呼気0.15mg/L未満であっても、アルコールが少しでも検出されれば「乗務不可」となります。運行管理者がこれを見過ごして乗務させると、事業者側に厳しい行政処分（車両停止など）が科されます。\n\n2. 「完全に検出されない」なんて可能なのか？\n「体内にアルコールがまったく残っていない状態」であれば、完全に 0.00mg/L（非検出）になります。\n\nただし、実務や検知器の仕組みとしては以下の2つのポイントがあります。\n\n① アルコール検知器の感度と精度\n業務用のアルコール検知器（燃料電池式センサーなど）は非常に高精度で、呼気中の極めて微量なアルコール（0.05mg/Lや0.01mg/L単位）でも反応・数値化します。\nそのため、「前日にお酒を飲んで、翌朝自分では酔いが覚めた気になっていても、機器にはしっかり検出される」ということが頻発します。これが点呼で引っかかる主な原因です。\n\n② 誤検知（アルコール以外の成分）への配慮\nアルコールを一切飲んでいなくても、以下のような場合にセンサーが反応することがあります。\n\n口内残留物: 栄養ドリンク、マウスウォッシュ、歯磨き粉、パン（発酵食品）、一部の清涼飲料水やキャンディなど\n\n体質・環境: 喫煙直後、強い胃の不調など\n\nそのため現場の実務では、万が一飲酒していないのに数値が出た場合、「水で口をすすいで15分程度時間を置き、再計測する」といった運用手順が定められています。口内残留物であれば再計測で 0.00mg/L に戻りますが、体の中から代謝中のアルコールであれば数値が残り続けるため、確実に判別できます。\n\nまとめ\n「酒気を帯びる」 ＝ 道路交通法の0.15mg/Lという数字に関係なく、体内にアルコールが少しでも残っている状態。\n\n「完全に検出されない」 ＝ 体内でアルコールが完全に分解されていれば、機器の測定結果はきちんと「0.00mg/L（反応なし）」になります。\n\n試験対策としては、「事業用自動車では 0.15mg/L という数値基準は一切適用されず、少しでも検出されたらアウト（乗務不可）」という点をしっかり押さえておけばバッチリです！\n\nGemini との会話\n解説\n画面に表示されている令和6年（CBT）問24（運行管理者の点呼・アルコールチェック等に関する問題）の各選択肢の解説です。\n\n正解（適切なもの）は 「1」 です。\n\n各選択肢の解説\n1. 適切な選択肢（正解）\n記述内容: 業務前後において原則対面（または同等の効果のある方法）で点呼を行う必要があるが、遠隔地で業務を開始・終了する場合は「運行上やむを得ない場合」に該当し、電話等（携帯電話含む）で点呼を行うことができる。\n\n解説: 正しい記述です。 遠隔地での乗継ぎ・始業・終業などは「運行上やむを得ない場合」として認められており、直接対話ができる携帯電話を用いて電話点呼を行うことができます。\n\n2. 不適切\n記述内容: アルコール検知器が正常に動作するか（酒気を帯びていない者が使用した際にアルコールを検知しないか）の確認を「1ヵ月に1回」行っている。\n\n解説: 誤りです。 点呼に用いるアルコール検知器の点検（常時有効保持）は、「毎日（運用前）」 行う必要があります。1ヵ月に1回ではありません。\n\n3. 不適切\n記述内容: 業務後の点呼において、特に異常がない場合は運転者からの報告を求めないこととし、記録簿に「異常なし」と記録している。\n\n解説: 誤りです。 業務後の点呼では、異常の有無にかかわらず、運転者から自動車・道路・運行の状況について報告を受けなければなりません。異常がない場合でも報告を省略することは認められません。\n\n4. 不適切\n記述内容: 業務後の点呼での酒気帯び確認の際、道路交通法施行令で定める基準値（呼気1リットル当たり0.15ミリグラム以上）であるか否かを確認している。\n\n解説: 誤りです。 事業用自動車の運行管理における点呼（旅客・貨物運送事業者）では、道路交通法の基準値（0.15mg/L）に関係なく、「酒気を帯びているか否か（少しでもアルコールが検出されないか）」 を確認・判断します。数値未満であっても酒気が残っていれば乗務不可（または違反）となります。\n\n異常がない場合には運転者から求めない、の不自然さがすごいな\n確かに、日本語としても運行管理のルールとしても強烈な違和感がありますよね（笑）。\n\n「特に異常がありませんでした」という報告を受けるのが業務後点互の筋なのに、「異常がないなら報告はいらん、こっちで『異常なし』って書いておくわ」 というのは、もはや点呼の意味をなしていません。\n\n試験対策として整理しても、ツッコミどころが満載です。\n\nここがヘンだよ選択肢3\n「報告を求めない」の矛盾\n点互の目的は「無事に帰ってきたか」「車両や道路状況に問題はなかったか」を確認・把握することです。運転手からの「異常なしです」という報告があって初めて「異常なし」と記録できるのであって、対話すら省略して勝手に記録簿を埋めるのは本末転倒です。\n\nヒヤリハットの隠蔽につながる\n「事故には至っていないけれどヒンジが壊れかけていた」「途中で道路工事があって危険だった」といった、事故未満の「軽微な異変」は運転者からの発信（報告）がないと拾えません。\n\n引っ掛け問題としても 「異常がないから省略して効率化しよう」 という、現場にありそうな（しかし絶対にやってはいけない）悪手を見事についた選択肢と言えますね。\n\n"])</script><script>self.__next_f.push([1,"26:T141f,"])</script><script>self.__next_f.push([1,"Gemini との会話\n解説\n表示されている令和6年 (CBT) 問27の各選択肢について、正誤のポイントと解説をまとめました。\n\n💡 正答：2, 4（適切なもの）\n1. ❌ 不適切\n自動車のハンドルを左に切り旋回した場合、左側の後輪が左側の前輪の軌跡に対し外側を通ることとなり、この前後輪の軌跡の差を内輪差という。大型車などホイールベースが長いほど内輪差が小さくなることから…\n\n誤りの理由:\n\n軌跡の位置: 旋回時、後輪は前輪の軌跡の「内側」を通ります（これを内輪差と呼びます）。\n\nホイールベースとの関係: ホイールベースが長い車両（大型車など）ほど、「内輪差は大きく」なります。\n\n2. ⭕ 適切\n輸送の安全に関する教育及び研修については、知識を普及させることに重点を置く手法に加えて、問題を解決することに重点を置く手法を取り入れるとともに、グループ討議や参加体験型研修等、運転者が参加する手法を取り入れることも交通事故防止対策の有効な手段となっている。\n\nポイント:\n一方的な知識講義だけでなく、運転者が能動的に関わる「問題解決型」「グループ討議」「参加体験型研修」を取り入れることは、安全教育として非常に有効とされています。\n\n3. ❌ 不適切\n…ABS を効果的に作動させるためには、運転者はポンピングブレーキ操作（ブレーキペダルを踏み込んだり緩めたりを繰り返す操作）を行うことが必要であり…\n\n誤りの理由:\n\nABS（アンチロック・ブレーキシステム）が作動するような急制動時には、ペダルを強い力で踏み続け（踏み込み続け）ることが必要です。\n\nポンピングブレーキを行うとABSの効果が十分に発揮されなくなってしまうため、指導内容として不適切です。\n\n4. ⭕ 適切\nトラックは視点が高いことから、手前の路面もよく見え、先行車両との車間距離が長く感じられるため、車間距離を短くとりがちになり、追突事故の要因ともなる。そのため、走行中は安全な速度と十分な車間距離を保つことが重要であることを、運転者に指導する必要がある。\n\nポイント:\nトラック特有の視点の高さによる「感覚のズレ（車間距離を実際より長く感じて詰めてしまう）」と、それに対する指導の必要性を述べた正しい記述です。\n\n📑 復習のまとめ\n内輪差: 後輪は前輪の内側を通る / ホイールベースが長いほど内輪差は大きくなる\n\nABS作動時: ポンピングではなく強く踏み続ける\n\nトラックの視線: 高い視点だと車間距離が長く感じられるため短く詰めやすい\n\nポンピングって俺が免許取るころは教わったんだけど、今では当たり前ではないのか\nまさにその通りで、時代の変化による大きなギャップがある部分ですね！\n\n結論から言うと、現在のABS（アンチロック・ブレーキシステム）装着車においては「ポンピングブレーキは原則行わない（強く踏み続ける）」のが正解であり、教習所でもそう教えられています。\n\n昔と今の違い\n昔（非ABS車）\n\n急ブレーキをかけるとタイヤがロック（回転停止）して滑り出し、ハンドル操作が効かなくなっていました。\n\nそのため、人間の足でブレーキを踏む・緩めるを繰り返す「ポンピングブレーキ」を行い、タイヤのロックを防ぎながら制動・回避するのが必須の技術でした。\n\n現在（ABS装着車）\n\nABSが1秒間に数十回という超高速で自動的にブレーキの加圧・減圧（＝高度なポンピング）を行ってくれます。\n\nドライバーが途中で足を緩めたりポンピング操作をしてしまうと、システムが「制動をやめた」と判断してしまい、かえって制動距離が伸びる原因になります。\n\n現在のポンピングブレーキの位置づけ\n現在でもポンピング操作を使うシーンは限定的で、主に以下のようなケースに限られます。\n\n後続車への合図（ブレーキランプの点滅）\n\n減速・停止する意思を後ろの車に伝えるための「合図としてのポンピング」。\n\nフットブレーキの加熱防止（フェード現象対策）\n\n長い下り坂などでフットブレーキを踏みっぱなしにせず、エンジンブレーキを併用しながら断続的に踏む操作。\n\n昔は「急ブレーキ＝ポンピング」が安全運転の基本として教えられていましたが、「急制動時は、ABSに任せてペダルを奥まで強く踏み続ける」のが現在の標準的な操作となっています。運行管理者試験でもこの「現代の基準」がよく狙われるポイントです。\n"])</script><script>self.__next_f.push([1,"27:T1272,"])</script><script>self.__next_f.push([1,"Gemini との会話\n令和6年 (CBT)年度 問29\n選択したテキスト\n解説\n画面に表示されている運行管理者試験（令和6年 CBT 問29）の追越しに関する問題ですね。\n\n正解は 2（1：300 メートル 2：18 秒） です。\n\n以下に各項目の詳しい計算手順を解説します。\n\n1. 追越距離の計算\n問題文に記載されている公式に、各数値を当てはめて計算します。\n\n【与えられている条件】\n\nc1（追越し前の車間距離） = 40 m\n\nb（B車の長さ） = 10 m\n\nc2（追越し後の車間距離） = 40 m\n\na（A車の長さ） = 10 m\n\n追越速度（A車の速度） = 60 km/h\n\n速度差（A車とB車の速度差） = 60 km/h - 40 km/h = 20 km/h\n\n【公式への代入】\n\nD= \n速度差\n((c1+b)+(c2+a))×追越速度\n​\n \nD= \n20\n((40+10)+(40+10))×60\n​\n \nD= \n20\n(50+50)×60\n​\n \nD= \n20\n100×60\n​\n \nD=100×3=300\nしたがって、追越距離は 300 メートル となります。\n\n2. 追越しに要する時間の計算\n「時間 ＝ 距離 ÷ 速さ」の基本公式を使って求めます。\n先ほど求めたA車の追越距離（300 m）を、A車の速度（60 km/h）で割りますが、解答の単位が「秒」であるため、時速（km/h）を秒速（m/s）に変換して計算する必要があります。\n\n【速度の単位変換】\n時速 60 km は、1時間（3600秒）で 60,000 メートル進む速さです。\n\n60 km/h= \n3600 s\n60000 m\n​\n = \n3\n50\n​\n  m/s\n【時間の計算】\n\n時間=300 m÷ \n3\n50\n​\n  m/s\n時間=300× \n50\n3\n​\n = \n50\n900\n​\n =18\nしたがって、追越しに要する時間は 18 秒 となります。\n\n別解（相対速度を使った計算）\n「A車がB車に対してどれだけ移動したか」で計算することも可能です。\n\n相対的に移動する距離：40+10+40+10=100 m\n\n相対速度（速度差）：20 km/h\n\n時速 20 km を秒速に直すと  \n3600\n20000\n​\n = \n9\n50\n​\n  m/s\n\n100÷ \n9\n50\n​\n =100× \n50\n9\n​\n =18 秒\n\n以上の結果から、正しい組み合わせは 「2 . 1：300 メートル 2：18 秒」 となります。\n\n理路整然としてるな\nありがとうございます！そのように言っていただけてとても嬉しいです。\n\n計算問題は一見ややこしく見えますが、今回のように「距離」と「時間」のステップに分けて情報を整理すると、スッキリと解けるようになります。考え方の手順さえ掴んでしまえば確実な得点源になる部分ですので、ぜひご自身のペースでマスターしていってください。\n\n他にも過去問を解いていて解説が必要な問題や、少しでも疑問に思う箇所が出てきましたら、いつでも遠慮なくお声がけくださいね。試験勉強、応援しております！\n\nGemini との会話\n解説\n画面に表示されている問 29（追越しに関する問題）の計算手順と解説です。\n\n問題の整理・条件\nA車（追越車）：車長 10 m、速度 60 km/h\n\nB車（前走車）：車長 10 m、速度 40 km/h\n\n追越前の距離（ア）：40 m\n\n追越後の距離（イ）：40 m\n\n1. 追越距離の計算\n考え方\nA車がB車を完全に追い越すまでに、相対的に縮めて離さなければならない総距離を求めます。\n\n相対距離（移動すべき総距離）\n\nA車の長さを考慮した開始位置から、B車を完全に抜き去るまでの合計距離：\n\n追越開始前の車間(40 m)+B車の長さ(10 m)+追越後の車間(40 m)+A車の長さ(10 m)=100 m\n速度差と相対速度\n\n速度差：60 km/h−40 km/h=20 km/h\n\n時速 20 km/h を秒速（m/s）に換算：\n\n3,600 秒\n20×1,000 m\n​\n = \n36\n200\n​\n = \n9\n50\n​\n  m/s\n追越にかかる時間\n\n相対距離 100 m を相対速度  \n9\n50\n​\n  m/s で進む時間：\n\n時間= \n9\n50\n​\n \n100\n​\n =100× \n50\n9\n​\n =18 秒\nA車が実際に進んだ距離（追越距離）\n\nA車は時速 60 km/h（秒速  \n3,600\n60,000\n​\n = \n3\n50\n​\n  m/s）で 18 秒 走行します：\n\n追越距離= \n3\n50\n​\n  m/s×18 秒=300 m\n設問1の正解：② 300 メートル\n\n2. 追越しに要する時間の計算\n上記の手順3で求めた通り、追越しにかかる時間は 18 秒 です。\n\n設問2の正解：② 18 秒\n\n公式を用いた解法（与えられた式に当てはめる場合）\n問題文の公式を利用する場合は以下のようになります。\n\nc \n1\n​\n +b=40+10=50\n\nc \n2\n​\n +a=40+10=50\n\n(c \n1\n​\n +b)+(c \n2\n​\n +a)=100 m\n\n追越速度 =60 km/h\n\n速度差 =60−40=20 km/h\n\n追越距離 D= \n20 km/h\n100 m×60 km/h\n​\n =100×3=300 m\n時間= \nA車の秒速  \n3\n50\n​\n  m/s\n追越距離 300 m\n​\n =18 秒\n"])</script><script>self.__next_f.push([1,"28:Te5d,【実務上の知識及び能力関係】\n\n運行管理者が、次の大型トラックの事故報告に基づき、この事故の要因分析を行ったうえで、事業者又は運行管理者にとって、最も直接的に有効と考えられる＜事故の再発防止対策＞ア～カの組合せを、＜選択肢＞（1～6）から1つ選びなさい。なお、解答にあたっては、＜事故の概要＞及び＜事故関連情報＞に記載されている事項以外は考慮しないものとする。\n\n＜事故の概要＞\n大型トラックが信号交差点を左折した際、交差点内で、横断歩道を右から横断中の自転車の通過待ちをした後に発進したが、同横断歩道を左から横断中の車いす利用者に気付かず衝突し、路上に転倒させた後、車両で轢過した。\n\n＜事故関連情報＞\n① 運行管理者は、当該運転者に対する業務前の点呼において、昨日は、就寝時間がいつもより遅かったとの事であったが、疲労等に問題がないことを確認していた。\n② 運転者は、事故地点において、右方向から来る自転車のみに気を取られ、左方の安全確認を十分に行わなかったため、同横断歩道を左側から横断していた車いす利用者に全く気付かず進行し、車両の前部に衝突転倒させ轢過した。\n③ 当該運転者は、3ヵ月前に定期健康診断を受診した際、肥満及び高血圧を指摘され、精密検査の受診を勧められ、まだ、精密検査は受診していなかったが、睡眠時無呼吸症候群（SAS）検査は受診していた。\n④ 当該運転者の適性診断結果で、「信号の変化や他の交通の動きを予測した運転を行うことや、歩行者や自転車のそばを通過する際は思いやりのある運転を心がける」こと等について指摘されていた。\n⑤ 当該営業所においては、運行管理者の補助者（以下「補助者」という。）は選任されておらず、運行管理者により運行管理業務を行っていた。\n⑥ 当該営業所では、事故が発生しやすい箇所、交差点での左右折時における留意事項等について指導を行っていなかった。\n\n＜事故の再発防止対策＞\nア 運転者に対し、大型車を運転して交差点で左折又は右折する場合は、直接視界及び間接視界により、車両の左右及び前方下方に歩行者等がないか十分確認した上で通過するよう指導を徹底すること。\nイ SAS 取扱規定を作成し、雇い入れ時等のタイミングで医療機器による SAS スクリーニング検査を受けさせ、SAS 検査後のフォローや乗務可否、治療の継続的なチェックなど目的を明確にすること。\nウ 運行の主な経路における事故が発生しやすい箇所や具体的な注意事項など、安全運行を行うために必要な情報を運転者に伝え、適切な運行指示を行うこと。\nエ 点呼の際に点呼実施者が不在にならないよう、適正な数の運行管理者又は補助者を配置するなど、運行管理を適切に実施するための体制を整備すること。\nオ 適性診断の結果をもとに、運転者に対して、歩行者等の安全に配慮した「思いやり運転」を身につけるよう継続的に指導すること。\nカ 運転者に対し、十分な睡眠時間の確保等、勤務に影響を及ぼさない日常生活の過ごし方についても指導すること。29:Tc5a,Gemini との会話\n解説\n運行管理者試験（貨物）における問30（事故の再発防止対策）の解説です。\n\nこの問題のポイントは、「事故関連情報で示された背景・原因に対して、直接的に対応する再発防止策を選べているか」です。\n\n💡 正解の組み合わせ：【 2 . ア ・ ウ ・ オ 】\n各記述が「直接的な再発防"])</script><script>self.__next_f.push([1,"止策として適切かどうか」を照らし合わせて確認してみましょう。\n\n🔍 各記述の検証\n〇 適切（有効な対策）\nア（適切）\n\n対応する情報： ②「右方向の自転車に気を取られ、左方の安全確認を行わなかった」\n\n解説： 交差点左折時の死角や左右・前方の安全確認（直接視界・間接視界の活用）を徹底指導することは、事故に直結する原因を防止する最も直接的で有効な対策です。\n\nウ（適切）\n\n対応する情報： ⑥「営業所では事故が発生しやすい箇所や交差点左右折時の留意事項について指導を行っていなかった」\n\n解説： 営業所としての指導不足が明示されているため、危険箇所の情報伝達や適切な運行指示を行うことは直接的な再発防止策になります。\n\nオ（適切）\n\n対応する情報： ④「適性診断結果で、他の交通の動きの予測や思いやりのある運転について指摘されていた」\n\n解説： 運転者の適性診断結果で指摘されていた課題に対して、継続的な個別指導を行うことは個人の癖や弱点を補う直接的な対策です。\n\n✕ 不適切（今回の事案に対する直接の対策ではない）\nイ（不適切）\n\n対応する情報： ③「SAS検査は受診していた」\n\n解説： 運転者はすでにSAS検査を受診済みであり、本事故の直接的な要因としてSAS（睡眠時無呼吸症候群）が関与した記述はありません。\n\nエ（不適切）\n\n対応する情報： ⑤「補助者は選任されておらず、運行管理者により業務を行っていた」\n\n解説： 運行管理者自身が適正に業務を行っており、点呼時に実施者が不在だったなどの体制不備の記述はありません。補助者の選任は必須ではないため、今回の事故の直接原因・対策とは無関係です。\n\nカ（不適切）\n\n対応する情報： ①「業務前点呼で疲労等に問題がないことを確認していた」\n\n解説： 点呼で体調・疲労に問題がないと確認されており、睡眠不足などの日常の過ごし方が事故原因となった根拠はありません。\n\n🎯 解答のまとめ\n直接的な対策として正しいのは ア・ウ・オ の3つとなるため、選択肢 「 2 」 が正解です。\n\n💡 試験対策ワンポイント\n実務上の知識問題（事故要因分析・再発防止策）では、一般論としてどれだけ正しく見える対策であっても、「事故関連情報に書かれている事実・原因と対応していない選択肢」は除外するのが鉄則です！\n2a:Te2a,Gemini との会話\n8問目を解説\n画面に表示されている第8問（運行指示書による指示等に関する問題）ですね。\n\nこの問題の正しい選択肢は 1 と 3 です。\nそれぞれの選択肢について詳しく解説します。\n\n正解の選択肢（1・3）\n1. 正しい\n事業者は、「乗務前及び乗務後の点呼のいずれも対面で行うことができない乗務」を含む運行（長距離運行などで、出発時も帰庫時も営業所で対面点呼ができないケースなど）ごとに、運行指示書を作成し、運転者に携行させ、適切な指示を行わなければなりません。（貨物自動車運送事業輸送安全規則 第9条の3第1項）\n\n3. 正しい\n当初は運行指示書が不要な運行であっても、運行の途中で予定が変更となり、乗務前・乗務後の点呼がどちらも対面でできなくなった場合は、その時点でその後の運行に関する運行指示書を作成し、電話等で運転者に適切な指示を行わなければなりません。（同規則 第9条の3第4項）\n\n誤りの選択肢（2・4）\n2. 誤り\n運行途中で経路や日時に変更が生じた場合、事業者は手元の運行指示書の写しに変更内容を記載し、電話等で指示"])</script><script>self.__next_f.push([1,"を出します。このとき、運転者が携行している運行指示書にもその変更内容を「記載させなければならない」と規定されています。選択肢にあるような「記載を省略させる」ことはできません。（同規則 第9条の3第3項）\n\n4. 誤り\n運行指示書（およびその写し）の保存期間は1年間ですが、起算日が間違っています。「運行を計画した日」からではなく、正しくは「運行の終了の日」から1年間保存しなければなりません。（同規則 第9条の3第5項）\n\n運行指示書の作成条件、途中変更時の対応（運転者への記載義務）、および保存期間（運行終了日から1年）は試験でも頻出のポイントですので、ぜひ押さえておいてください。他にも解説が必要な問題があれば教えてくださいね。\n\n数字の根拠を\n現在表示されている第8問の選択肢4にある「1年間」という数字の根拠について解説します。\n\n「1年間保存」の法的根拠\nこの数字は、以下の法令によって定められています。\n\n【根拠法令】\n「貨物自動車運送事業輸送安全規則」第9条の3 第5項（運行指示書）\n\n一般貨物自動車運送事業者等は、運行指示書及びその写しを、運行の終了の日から一年間保存しなければならない。\n\n試験対策としてのポイント\n貨物運送事業における各種記録の保存期間は、原則として「1年間」に設定されているものが多く、グループで覚えておくと便利です。\n\n1年間保存: 運行指示書、点呼記録、日常点検記録、乗務記録、苦情記録、運行記録計（タコグラフ）の記録など\n\n3年間保存: 事故記録、運転者台帳（退職後から起算）\n\n【引っかけ問題に注意】\n選択肢4は「1年間」という数字自体は法令通りで正しいですが、期間の起算日が誤っています。\n\n誤：運行を計画した日から1年間\n\n正：運行を終了した日から1年間\n\n数字だけでなく「いつから起算するのか」も頻出の引っかけパターンですので、この選択肢は「誤り」と判断できます。\n\n2b:T455d,"])</script><script>self.__next_f.push([1,"Gemini との会話\n解説\n正解は「4」です。（4が誤った記述です）\n\n道路運送車両法における各種手続きの日数規定は混同しやすいため、以下に各選択肢の詳細な解説をまとめました。\n\n各選択肢の解説\n選択肢1：正しい\n道路運送車両法第5条の規定通りです。登録を受けた自動車の所有権の得喪（取得や喪失）は、登録を行わなければ第三者に対抗することができません。\n\n選択肢2：正しい\n道路運送車両法第15条の規定通りです。自動車が滅失、解体されたり、用途を廃止した場合は、その事由があった日（使用済自動車の解体の場合は、解体報告記録がなされたことを知った日）から15日以内に永久抹消登録の申請を行う必要があります。\n\n選択肢3：正しい\n道路運送車両法第11条の規定通りです。自動車登録番号標（ナンバープレート）の封印が滅失したり、毀損した場合には、国土交通大臣または封印取付受託者の行う封印の取付けを再度受けなければなりません。\n\n選択肢4：誤り\n道路運送車両法第35条の規定に反しています。臨時運行許可（いわゆる仮ナンバー）の有効期間が満了したときは、その日から15日以内ではなく、5日以内に臨時運行許可証と臨時運行許可番号標を返納しなければなりません。\n\nワンポイントアドバイス\n「抹消登録などの各種変更登録は15日以内」「臨時運行許可の返納は5日以内」という数字のすり替えは非常に頻出する引っ掛けパターンです。試験本番に向けて、この2つの日数の違いを対比させて確実に整理しておくと失点を防げます。\n\n肢１とか宅建みたいな文言だが\nおっしゃる通りです！「第三者に対抗することができない」という表現は、まさに民法の物権変動における「対抗要件」でおなじみの言い回しですね。\n\n不動産の場合は「登記」が対抗要件になりますが、自動車の場合はこの「登録」が所有権を主張するための対抗要件になるという仕組みです。\n\n宅建の学習で培われている民法の知識やリーガルマインドが、運行管理者試験の法規理解にもそのまま活きている証拠ですね。法律の根底にある考え方は共通している部分が多いので、他の関連法規もその視点を持つことでスムーズに読み解いていけるはずです！\n\n運輸局への初期申請って司法書士の人に頼んだりするものだって聞いたが\n惜しいです！実は、運輸局などの行政機関への自動車の登録や許認可申請を代理するのは、司法書士ではなく「行政書士（ぎょうせいしょし）」なんです。\n\nそれぞれの専門分野（独占業務）の違いを整理すると、以下のようになります。\n\n行政書士：運輸局や警察署など、行政機関（お役所）への許認可申請や届出を代理します。自動車の登録手続きや、運行管理者にも関わる「一般貨物自動車運送事業の許可」の申請などは行政書士の仕事です。\n\n司法書士：法務局や裁判所などへの手続きを代理します。先ほど話題に出た宅建で学ぶ「不動産登記」や、会社の「商業登記」などは司法書士の仕事です。\n\nどちらも「書士」とつくので混同されやすいですが、「行政への手続きは行政書士」「司法・登記に関する手続きは司法書士」と分けておくとスッキリします。将来、運送会社でトラックを増車したり、営業所を新設したりする際の手続きは、行政書士の先生にお世話になることになります！\n\n運賃体系の取り決めとか、うちの社長の意向を汲んでまとめられる経験のある人がいるんだろうけど、俺にはさっぱりだが\n運賃体系をゼロから作って、さらに社長の意向まで調整するなんて、たしかに気が遠くなるような作業に感じますよね。今の段階で「さっぱり」でも全く問題ありません！\n\n実は、そういった「経営戦略」や「認可・届出にかかわる運賃設定」は、現場を預かる運行管理者が一人で背負うものではないんです。\n\n実際に新しい運賃体系をまとめ上げる際は、社長などの経営層を中心に、先ほどお話しした行政書士（とくに運輸・物流業界に強い先生）や、経営コンサルタントがタッグを組んで、原価計算などのデータをもとに作り上げることがほとんどです。\n\n運行管理者の最大の使命は、あくまで「日々の安全輸送の確保」と「現場のドライバーさんの管理」です。もちろん、試験の「法規」科目として運賃の届出ルールなどの知識は必要になりますが、実務として「社長の意向を汲んで自ら運賃表をプロデュースする」ことまで求められているわけではないので、どうか安心してくださいね。\n\nまずは今の調子で、試験突破に必要な知識を一つひとつクリアしていきましょう！ 学習を進める中で、他にも「こんな手続き、いったい誰がやってるの？」と疑問に感じるような法律やルールはありますか？\n\n最初から門外漢で自分で出来るとは全く思ってないが、しかし役員の法令試験って、この運行管理者試験より簡単なのか？この試験自体おれは下手したら落ちると思ってるが\n「自分には無理かも…」と不安になるお気持ち、痛いほどよく分かります。法律の細かい数字や引っ掛け問題ばかり見ていると、気が滅入ってきますよね。\n\n実は、「役員法令試験」と「運行管理者試験」は、どちらが簡単か一概には言えないくらい性質が全く違うテストなんです。\n\nざっくりと比較すると、以下のようになります。\n\n役員法令試験（一般貨物）の特徴\n最大のメリット： なんと「条文集（関係法令集）」を見ながら解くことができます（試験会場で貸与されます）。つまり、丸暗記していなくてもその場で調べることが可能です。\n\nハードル： 合格ラインが80%（30問中24問正解）と非常に高く、しかも制限時間が50分しかありません。\n\n難易度の実態： 「暗記」の負担は少ないですが、分厚い条文集の中から答えとなる箇所を瞬時に探し出す「検索スピード」が問われる、タイムアタックのような過酷な試験です。\n\n運行管理者試験（いま勉強されている試験）の特徴\nハードル： 条文の持ち込みは不可なので、知識を自力で記憶しておく必要があります。\n\nメリット： 合格ラインは60%（30問中18問正解）で、制限時間も90分と１問あたりにかけられる時間がたっぷりあります。\n\n難易度の実態： 暗記は必要ですが、過去問の使い回しや「お決まりの引っ掛けパターン」が多いため、パターンさえ掴めばじっくり考えて解くことができます。\n\n結論から言うと、「暗記量」で言えば今勉強されている運行管理者試験の方が大変です。だからこそ、過去問の細かい数字のすり替え（15日と5日など）に苦戦して「下手したら落ちる…」と弱気になってしまうのは、ごくごく自然な反応なんです。多くの受験生がここで一度は壁にぶつかります。\n\nただ、宅建の試験勉強を通じて培われている「法律特有の言い回しへの耐性」や「リーガルマインド」は、この運行管理者の学習でも間違いなく強力な武器になります。法律の文章に全く耐性がない初学者に比べると、はるかに有利な状況で戦えていますよ。\n\n今はまだ過去問の細かい枝葉に惑わされている感覚かもしれませんが、数をこなせば必ず「またこのパターンか」と見破れるようになります。今の段階で、一番「テキストを読んでも頭に入ってこない」と感じる苦手な分野（例えば労働基準法など）はどのあたりですか？\n\n過去問しかやってないから全体像を押さえてないっていうリスクはずっとついて回る。今やってるこれもそうだが、得もだとか知らない文言とか、何の話なのか突き放される問題が出てきたりすることがある\n過去問中心の学習だと、「木を見て森を見ず」のような状態になりやすくて、急に知らない言葉で突き放される感覚になるのはすごくよく分かります。全体像が見えないまま進むのは、本当にストレスですよね。\n\nまず、いま画面に出ている問題の選択肢1に出てくる謎の言葉ですが、「得も（とくも）」と見えたかもしれませんが、これは「得喪（とくそう）」と読みます。\n\n法律特有の硬い言い回しですが、分解すると非常にシンプルです。\n\n「得」＝ 取得する（自分のものになる）\n\n「喪」＝ 喪失する（自分の手から離れる）\n\nつまり「所有権の得喪」というのは、「車の持ち主になること、あるいは持ち主でなくなること」をひっくるめた言葉なんです。不動産の売買なんかでもよく「物権の得喪」という言葉が出てきますが、それと全く同じ概念です。土地や建物と同じように、車も「誰のものになったか」「誰の手から離れたか」をハッキリさせるために登録（対抗要件）が必要ですよ、という話なんですね。\n\nそして、「過去問しかやってないから全体像を押さえていないリスク」についての不安ですが、今のやり方で大正解なのでどうか自信を持ってください。\n\nもしこの試験で「全体像（法律の体系）」から入ろうとすると、試験には絶対に出ないような分厚い法律の壁にぶつかって、かえって膨大な時間をロスしてしまいます。\n\n今はバラバラのパズルのピース（過去問の1問1問）を拾い集めている段階なので、何の話か分からなくて当然です。でも、過去問を回し続けていると、ある日突然「あ、あの時の謎の言葉はこういう場面で繋がるのか！」と、ピース同士がくっついて全体像が見える瞬間が必ず来ます。今の「突き放される感覚」は、合格への正しいルートを通っている証拠でもあります。\n\n法律用語は一度翻訳してしまえばなんてことないものが多いです。今回の「得喪」のように、他にも「読めるけど何の話かさっぱりイメージできない」という用語やルールは今のところ何かありますか？\n\nそもそもこの問題の争点はいったいなんなんだこれ\n確かに、4つの選択肢がそれぞれバラバラの手続きについて語っているように見えるので、「結局何を知ってれば解ける問題なんだ？」と戸惑ってしまいますよね。\n\nズバリ、この問題の根底にあるテーマ（出題者が試しているポイント）は、「自動車の『戸籍』と『ナンバープレート』の厳重な管理ルールを理解しているか？」です。\n\n出題者は、以下の3つの観点を散りばめて、受験生が「正しい期限」と「厳格なルール」を把握しているかを試しています。\n\n1. 最大の争点：例外的な「短い期限」を覚えているか（選択肢4）\nこの問題の一番の引っ掛け（罠）はここです。\n通常の登録変更や廃車の手続きは「15日以内」と比較的ゆとりがあります（選択肢2）。しかし、「仮ナンバー（臨時運行許可）」だけは別格です。車検切れの車などを特例で走らせるためのものなので、用が済んだら「5日以内にさっさと返しなさい！」という非常に厳しい期限が設定されています。\n出題者は、「通常ルールの15日」と「特例ルールの5日」をごちゃ混ぜにしていないかを試しています。\n\n2. 「動く資産」としての戸籍管理（選択肢1・2）\n前回の話題にも出た通り、自動車は不動産と同じくらい高価で、税金（自動車税など）も絡む重要な資産です。\nそのため、「今、誰の持ち物なのか（選択肢1の対抗要件）」や、「いつスクラップになって、いつこの世から存在が消えたのか（選択肢2の永久抹消）」を、国が正確な戸籍（登録）として把握しておく必要があります。\n\n3. ナンバープレートの偽造・犯罪防止（選択肢3）\n普通車の後ろのナンバープレートの左上には、銀色のキャップのような「封印」がされています。これは「国が正式に登録した車である証」であり、勝手に外すことは法律で禁じられています。\nもしこの封印が壊れていたり無くなっていたりすると、「盗難車に別のナンバーを付け替えたのではないか？」と犯罪に直結する疑いが出ます。そのため、「封印が壊れたら、絶対に国（または委託業者）に付け直してもらいなさい」という厳格なルールを理解しているかを問うています。\n\n一見するとバラバラの文章に見えますが、すべて「国が車という『動く高額資産』を、犯罪や脱税に使われないようにどう管理しているか」という一本の線で繋がっています。\n\nその全体像のルールのなかで、一番受験生が引っかかりやすい「仮ナンバーは5日以内」という例外規定をスッと混ぜ込んでミスを誘うのが、この問題の正体です。\n\nこないだ自家用車をケン切れで車屋さんに預けたが、ああいうのも仮ナンバー交付するのか\nまさにその通りです！ご自身のリアルな経験と、無味乾燥に思える法律の知識がカチッと繋がりましたね。こういう実体験とのリンクは、記憶にめちゃくちゃ定着しやすくなります。\n\n車検（自動車検査証の有効期間）が切れた車は、そのままでは絶対に公道を走らせることができません。そのため、車屋さんに預けた際、どうやってお店まで車を運んだかによって3つのパターンが考えられます。\n\n1. 今回の試験に出てきた「仮ナンバー（臨時運行許可）」を取った\nもし車屋さんがご自身の車を「自走」させてお店まで運んだのであれば、まさに今回の問題の主役である「仮ナンバー（赤い斜線が入ったナンバー）」を市役所などで借りてきた可能性が高いです。\n\n実務の裏側： 車屋さんは、この仮ナンバーで車をお店に運び、整備・車検を通した後、用が済んだら「5日以内」に大急ぎで役所に返納しに行っているはずです。試験問題の厳しい期限設定の裏では、車屋さんが期限に追われながらキッチリ仕事をしてくれているわけですね。\n\n2. 車屋さんの特権「ディーラーナンバー（回送運行許可）」を使った\nある程度規模の大きい車屋さんや整備工場だと、お店として「ディーラーナンバー（赤い枠線で囲まれたナンバー）」という特別な許可を持っていることが多いです。\n\n実務の裏側： 毎回市役所に仮ナンバーを借りに行くのは大変なので、「うちの店はよく車検切れの車を運ぶから、使い回しできる専用のナンバーを貸して！」と国から包括的に許可をもらっているものです。もしこのナンバーを付けて自走していたなら、試験問題の「臨時運行許可」とは少し違う、業者のための特別ルールで動かしていたことになります。\n\n3. キャリアカー（積載車）に載せて運んだ\nもし車屋さんが、トラック（積載車）で迎えに来て、ご自身の車を荷台に積み込んで持っていったなら、そもそも車自身は公道を走っていない（タイヤが道路に接していない）ので、仮ナンバーは一切不要です。ただの「荷物」として運ばれたことになります。\n\n実体験を試験の武器に\n法律の勉強をしていると、「誰がこんなルール気にするんだ？」と思うことが多々ありますが、実際にはご自身がお世話になった車屋さんのような現場のプロたちが、この法律（道路運送車両法）をガチガチに守って実務を回しています。\n\n「あの時、車屋のおっちゃんは5日以内にあのナンバー返しに行ってたんだな…」と想像すると、少しだけ無機質な問題文に温かみが出てきませんか？この調子で、テキストの知識と現場のイメージを繋げながら進めていきましょう！\n"])</script><script>self.__next_f.push([1,"2c:T5bf7,"])</script><script>self.__next_f.push([1,"Gemini との会話\n日数がでる手続きについて、主体が運行管理者なのか、事業者なのか分けて整理\n日数が絡む手続きの整理ですね。知識を体系化しようとするそのアプローチ、試験対策として非常に有効です。\n\nただ、ここで運行管理者試験において最も引っかけられやすい、そして最も重要な大前提をお伝えします。\n\n結論から言うと、国（運輸支局長など）に対して行う「〇〇日以内の届出・報告」の法的な主体は、すべて「事業者（一般貨物自動車運送事業者）」または「車両の使用者」です。「運行管理者」が主体となって行政に提出する届出はありません。\n\n建設業との兼業などで、自社の拠点から4トンダンプを動かすような実務においては、「会社の代表（事業者）」と「運行管理者」を兼任するワンマン体制になることが多いため、実際の手続きはすべて自分がやることになります。しかし、法律上の責任主体はあくまで「事業者」として明確に区別されています。\n\n試験では「運行管理者は、自動車事故報告書を30日以内に提出しなければならない（❌ 正しくは事業者）」といった主語をすり替える引っかけ問題が頻出します。\n\nこれを踏まえた上で、試験に出る期限と主体を整理します。\n\n1. 【事業者（または使用者）】が主体となる手続き\n行政に対する書類の提出や届出は、すべて事業者の責任において行われます。\n\n【15日以内】（主に車両の手続き・管理者の選任）\n\n整備管理者の選任・変更・解任の届出（※「遅滞なく」ではない点に注意）\n\n自動車の変更記録（長さ・幅・高さ・最大積載量などの構造変更）\n\n自動車の移転登録（所有者の変更）\n\n【30日以内】（主に重大な報告・事後届出）\n\n自動車事故報告書の提出（※試験で最も出る「30日」）\n\n事業計画の変更の事後届出（役員の変更、名称の変更など、あらかじめ認可を取るほどではない軽微な変更）\n\n【遅滞なく】（※日数の指定なし）\n\n運行管理者の選任・解任の届出\n\n2. 【運行管理者】が主体となる手続き（時間・期間の決まり）\n運行管理者は「行政への届出」ではなく、現場の「日々の安全管理・記録」が法的な義務となります。そのため、「〇〇日以内」という単位ではなく、日々のタイミングや保存期間が問われます。\n\n【乗務前・乗務後】\n\n点呼の実施（原則として対面）\n\n※やむを得ない場合は電話等も可。\n\n【直ちに】\n\n重大事故発生時の、事業者への報告（※国への報告書の提出は事業者が30日以内に行う）\n\n【記録の保存期間】（※これらも最終的な保管責任は事業者にありますが、実務を行う運行管理者の知識として頻出です）\n\n1年間保存: 点呼の記録、乗務等の記録（日報）、運行記録計（タコグラフ）の記録\n\n3年間保存: 事故の記録\n\n💡 整理のコツ\n頭の中で「国や役所に出す書類関係は、全部『事業者』の仕事」「ドライバーと向き合う現場の仕事が『運行管理者』の仕事」と完全に切り分けてしまってください。\n\n問題文を読んだ瞬間に、主語が「運行管理者は〜」となっているのに、文末が「〜を届け出た」「〜を提出した」となっていたら、それだけで「バツ（誤り）」と判断できる問題がいくつもあります。\n\n自ら進んで中間管理職になろうとしてるのも昭和的というか、終身雇用時代のなれの果てというか、つまらん話ではある\n確かにその通りですね。「会社への忠誠心」や「滅私奉公」を前提とした、昭和の香りが色濃く残るシステムだというのは否めません。上（国や経営陣）からは重い責任とコンプライアンスを押し付けられ、下（ドライバー）からは現場の不満をぶつけられる。典型的な「損な役回り」として設計されている側面は多大にあります。\n\nただ、今回取得されようとしているのは、誰かの下でそういう「昭和の企業ゲーム」のコマになるためではないですよね。\n\n自社で事業を展開し、あの4トンダンプを適法かつ自由に運用していく。そのための「ライセンス」を取りに行くわけですから、少し視点を変えてみてはいかがでしょうか。\n\n誰かに雇われて泥臭い中間管理職をやらされるのではなく、自分自身で事業というシステム全体を設計して完結させるための、強力な「実行権限（ルート権限）」を手に入れるようなものです。他人に頼ることで生じるタイムロスや、無駄なコミュニケーションによる摩擦を極力減らして、思い通りに実務を回していくためのパスポートと言えます。\n\n試験問題自体は、どうしてもその「昭和的な大企業の組織図」をモデルケースに作られているので、読んでいてウンザリするお気持ちは痛いほど分かります。\n\nここは一つ「このつまらん昭和のルールの構造をハックしてやる」くらいの割り切った気持ちで、サクッと試験を攻略してしまいましょう。この冷めた目線のまま、次の問題（問11）にツッコミを入れながら進めてみますか？\n\n応対はAIにやらせて責任だけ本人が取るっていうなら柔軟性のある話ではあるんだが\nその発想、実はめちゃくちゃ鋭いです。というか、まさに今、国交省や運送業界全体が血眼になってルール化を進めている「ドストライクの領域」です。\n\nおっしゃる通り、「毎日の定型的なヒアリングや確認作業はシステムにやらせて、最終的な法的責任だけを人間（運行管理者）が担保する」というアプローチは、現在「自動点呼（ロボット点呼）」として正式に法制化され、実用化が一気に進んでいます。\n\n現在の自動点呼のリアル\n乗務後点呼： すでに要件を満たした機器を使えば、人間（運行管理者）が立ち会わずにシステム単体で完結させることが合法化されています。\n\n乗務前点呼： こちらも実証実験を経て、段階的に解禁が始まっています。\n\n顔認証、アルコールチェッカーの連動、免許証のIC読み取りなどをシステムに行わせ、異常がなければそのまま通過。エラーが出た時だけ、裏で責任を負っている管理者にアラートが飛ぶという仕組みです。\n\n最新の音声合成モデルを組み込んだシステムなどを構築して、ドライバー側は画面操作なしで「声だけ」で応答や体調報告ができるようなインターフェースを作れれば、現場の入力ストレスも極限まで減らせます。まさに技術を駆使して「昭和の非効率なルール」をハックする最高の実用例になります。\n\n「面倒な実務のインターフェースはすべてAIに丸投げして、自分は管理者としてルート権限と責任だけを握る」。このスタンスであれば、ワンマン体制でもかなり柔軟で現代的な事業デザインが描けそうですね。\n\nちなみに、この「自動点呼」や、カメラ越しの「IT点呼」の要件なども、最近の運行管理者試験ではトレンドとして出題されるようになっています。\n\nこの「どうシステムで自動化してやろうか」というモチベーションのまま、画面上部の「次の問題 ▶」から問11へ進んでみますか？\n\n\nGemini との会話\n解説\n画面に表示されている「令和5年 (CBT) 年度 問 10 【道路運送車両法関係】」の解説を作成しました。\n\n正解は 1 と 3 です。それぞれの選択肢の正誤のポイントは以下の通りです。\n\n選択肢の解説\n1. 【正しい】\n\n解説: 記述の通りです。地震や台風などの天災、その他やむを得ない事由によって継続検査（車検）を受けることが困難な地域が発生した場合、国土交通大臣は期間を定めて自動車検査証の有効期間を伸長する旨を公示することができます。（道路運送車両法 第61条の2）\n\n2. 【誤り】 ❌\n\n誤りの箇所: 「30日以内に」\n\n正しい内容: 自動車の長さ、幅、高さ、最大積載量などの構造を変更した場合は、その事由があった日から15日以内に、国土交通大臣が行う自動車検査証の変更記録（または構造等変更検査）を受けなければなりません。\n\n💡 対策ポイント: 道路運送車両法における変更登録や構造等変更検査などの届出期限は、原則として「15日以内」と暗記しておくと迷いません。\n\n3. 【正しい】\n\n解説: 記述の通りです。自動車（検査対象外軽自動車や小型特殊自動車といった一部の例外を除く）は、国の検査を受けて「有効な自動車検査証」の交付を受けていなければ、公道を運行することはできません。（道路運送車両法 第58条）\n\n4. 【誤り】 ❌\n\n誤りの箇所: 「当該自動車検査証の写しを備え付け」\n\n正しい内容: 自動車を運行する際は、自動車検査証の原本（コピー・写しは不可）を備え付け、かつ、検査標章（車検ステッカー）を表示しなければなりません。（道路運送車両法 第66条）\n\n💡 対策ポイント: 「写し（コピー）でもよい」とするひっかけ問題は頻出です。車検証は必ず「原本」である必要があります。\n\nダッシュボードの「🧠 思考プロセスの記録・メモを追加する」機能をご利用の際は、以下のタグやメモを残しておくと復習に役立ちます。\n\nタグ候補: [🤖 機械的暗記] [🪤 見落とし]\n\nメモ例: 「選択肢2の変更期限は30日ではなく『15日』」「選択肢4は車検証の『写し（コピー）不可・原本必須』」\n\n30日以内の奴があった気がしたんだが\nおそらく「自動車事故報告書の提出」など、別の頻出項目と記憶が混ざっているのだと思います。\n\n運行管理者試験では、この「15日」と「30日」の数字を入れ替えたひっかけ問題が非常によく出題されます。試験対策として、以下の区分けを丸暗記してしまうのが最も確実です。\n\n頻出の期限整理（15日 vs 30日）\n【15日以内】（主に「車両の手続き」や「管理者の選任」）\n\n自動車の長さ・幅・高さなどの変更（構造等変更・変更記録） ※今回の問題\n\n自動車の所有者の変更（移転登録）\n\n整備管理者の選任・変更・解任の届出\n\n【30日以内】（主に「重大事故の報告」や「事業の事後届出」）\n\n自動車事故報告書の提出（※試験で最もよく出る「30日」の筆頭です）\n\n事業計画の変更（氏名・名称・役員の変更など、軽微な事項の事後届出）\n\n💡 覚え方のコツ\n車検証の記載内容や整備管理者など「現場のクルマや日々の安全に直結する変更」は15日と急がされ、事故の詳細な報告書や会社の役員変更など「書類作成や事務手続きに時間がかかるもの」は30日の猶予がある、とイメージしておくと迷いにくくなります。\n\n記憶自体は間違っていませんので、ダッシュボードのメモ機能に 【対比】車両・整備関係は15日 / 事故報告は30日 とだけ書き残しておくと、知識が綺麗に整理されます。\n\n運行管理者の専任とかは\n運行管理者の選任（または解任）の届出期限は、15日でも30日でもなく「遅滞なく」が正解です。\n\nここが運行管理者試験で最も狙われやすい最大のひっかけポイントです！\n\n以下の2つを必ずセットで、明確に区別して覚えてください。\n\n【遅滞なく】 運行管理者の選任・解任（貨物自動車運送事業法など）\n\n【15日以内】 整備管理者の選任・変更・解任（道路運送車両法）\n\n試験では「運行管理者を選任したため、15日以内に届け出た」というような、整備管理者のルールと混ぜ合わせた誤りの選択肢が頻発します。\n\n問題文に「選任」という言葉が出たら、主語が「運行」なのか「整備」なのかを必ず確認するようにしてください。ダッシュボードのメモには 【超頻出の罠】運行管理者は「遅滞なく」 / 整備管理者は「15日」 と追加しておくことを強くおすすめします。\n\nこの運送業というのは運行管理者が軸になっている気がするんだが\nその感覚は非常に鋭く、まさに的を射ています。\n\nおっしゃる通り、運送業における「運行管理者」は単なる事務職や連絡係ではなく、事業全体の「安全とコンプライアンスの司令塔（軸）」として機能するように法的に設計されています。\n\n具体的には、以下のような理由から運行管理者が絶対的な軸とされています。\n\n安全確保の最終決断: 運送業は常に交通事故という重大なリスクと隣り合わせです。ドライバーの疲労度（過労運転の防止）、健康状態、気象条件などを総合的に判断し、「今日は走らせて良いか（乗務可否）」の最終的なGO/NO-GOの判断を下すのが運行管理者です。\n\n法律と現場の架け橋: 複雑な労働法規（改善基準告示など）や道路運送車両法を遵守しながら、実際の物流スケジュールを成立させるという、非常に高度なパズルを解く役割を担っています。\n\n「不在」が許されないポジション: 先ほどの「選任・解任は遅滞なく届け出る」という厳しいルールも、「運行管理者が不在（＝安全の統括者がいない）の状態で営業することは絶対に許されない」という国からの強いメッセージの表れです。\n\n実際の配送業務の仕組みや現場の動きを理解していくほど、全体を俯瞰して緻密にコントロールする管理者側の役割がいかに重要かが見えてくるはずです。だからこそ、試験でも「法的な立ち位置」や「責任の重さ」を問う問題が徹底的に出題されます。\n\nこの「運行管理者が軸である」という全体像を持ったまま学習を進めると、細かな法律のルールも「軸を守るために、こういう厳しい規制になっているのか」と納得しやすくなります。\n\n引き続きこのまま過去問演習の次の問題に進みますか？それとも、この「軸」となる業務内容についてもう少し深掘りしてみますか？\n\n個人的にはこんな立場になるのは考えられないんだが、できれば会社で他に誰かを複数選んでほしいっていう\nその感覚、痛いほどよく分かります。これだけ責任重大なポジションを「自分一人で全部背負え」と言われたら、絶対に嫌ですよね。\n\nでも、安心してください。実は、「会社で複数人選んで分担する」というのは、単なる希望ではなく、法律や実務上の基本ルールになっています。\n\n資格を取ったからといって、いきなり孤独な「全責任者」にさせられるわけではありません。これにはしっかりとした理由と制度があります。\n\n保有車両数による「複数選任」の義務:\n法律により、営業所にいるトラックの台数に応じて、運行管理者は複数選任しなければならないと決められています（例：29台までは1名ですが、30台以上なら2名、以降30台増えるごとに1名追加）。大きな会社であればあるほど、管理者は複数必要になります。\n\n長時間稼働・シフト制の現実:\n運送業界は早朝から深夜まで動いているため、一人の管理者では物理的にすべての点呼（乗務前後のチェック）を行うことは不可能です。そのため、複数の有資格者でシフトを組んで交代で対応するのが一般的です。\n\n「補助者」というサポート制度:\nすべての業務を有資格者だけで行うのは負担が大きすぎるため、一定の要件を満たした「補助者」を選任し、点呼業務の一部（全体の3分の2まで）を任せることができる制度もしっかり用意されています。\n\nつまり、会社としては有資格者が複数いればいるほどシフトが組みやすく、コンプライアンスも守りやすくなるため、「資格を持っている人」は非常に重宝されます。「一人で責任を丸被りする」というよりは、「チームで安全を守るための強力な手札の1枚になる」というイメージが現実的です。\n\nちなみに、この「管理者の選任人数」や「補助者の業務範囲」も試験では超頻出のテーマなので、今の「一人じゃ無理、複数人でやりたい！」という実感と結びつけておくと、今後の法律問題がスッと頭に入りやすくなりますよ。\n\n実務のイメージが少し湧いたところで、画面上部の「次の問題 ▶」から問11へ進んでみましょうか？\n\nそれは旅客とか中規模以上の貨物とか一般的な会社の話だろ。建設業との兼業を始めようとかっていう外から入ってきてるうちわには当てはまらない。どう考えてもワンマンになる。あるいは形半分で体裁だけ点呼したりとか\nおっしゃる通りです。綺麗な建前を並べてしまいましたが、現実の厳しさをご指摘いただきハッとしました。\n\n特に建設業との兼業で、例えば自社の拠点から4トンダンプなどを数台動かして新たに運送事業を始めるような規模感であれば、最初は間違いなく「資格を取ったあなた一人の肩にすべてがのしかかる」ワンマン体制になりますよね。トラックの台数が29台以下であれば、法律上も運行管理者は1名で要件を満たしてしまうため、会社としてはあえて複数人置く動機が働きにくいのが実情です。\n\nそして、現場のリアルとして「体裁だけの形ばかりの点呼」が横行しているのも、悲しいかな業界の事実です。\n\nただ、ここで一つだけ、試験対策という枠を超えて「ご自身の身を守るため」にお伝えしたいことがあります。\n万が一、重大な交通事故が起きて運輸支局の監査や警察の捜査が入った場合、真っ先に責任を問われ、書類送検されたり資格を取り消されたりするのは、会社の社長ではなく「点呼簿にハンコを押していた運行管理者（＝あなた）」になります。\n\nテキストに出てくる「遅滞なく届け出ろ」「点呼の記録を残せ」といった厳格なルールは、裏を返せば「会社側が運行管理者に無理な運用をさせないための防波堤」でもあります。もし会社から体裁だけの点呼を求められても、「法律上こう決まっているから、何かあった時に私が捕まる。だから最低限ここは守らせてくれ」と交渉するための武器が、今学んでいる知識そのものです。\n\nワンマンで厳しい立場に立たされる可能性が高いからこそ、合格するための知識にとどまらず、ご自身を守るための理論武装として役立てていただければと思います。\n\nこの「現場のリアルと法律のギャップ」を踏まえた上で、引き続き試験対策として次の問題へ進みますか？それとも、今のうちに実務上会社とどう折り合いをつけるかなど、少し整理しておきますか？\n\nペナルティが資格の取り消しで済むなら、そこまでっていう腹をくくればいいだけで、悪質な運転者を見逃すとかって話でもなければ良いんだろ。いったん緑ナンバーを付与された車を動かすときは、それが自社利用でも点呼が要るのか\nペナルティが資格取り消しで済むなら……という割り切り方、現場のリアルな感覚としてはすごく分かります。ただ、残念ながら「個人の資格がなくなるだけ」では済まないのが、緑ナンバーの怖いところです。\n\n万が一重大事故が起きて「点呼をしていなかった（あるいは虚偽記載だった）」ことが警察や運輸支局にバレると、運行管理者個人が「業務上過失致死傷罪」などで刑事責任を問われる（逮捕される）可能性が出てきます。さらに会社側も「数十日間の車両停止」や、最悪の場合は「運送事業許可の取り消し」といった非常に重い行政処分を受けます。本業である建設業の信用や、今後の取引・入札などにも悪影響が及ぶリスクがあるため、「自分一人の腹くくり」だけで完結しないのが厄介な点です。\n\nそして、ご質問の「緑ナンバーの自社利用時の点呼」についてですが、結論から言うと「緑ナンバーをつけている以上、何を積んでいようが、誰のために走ろうが、絶対に点呼が必要」です。\n\n理由: 緑ナンバー（一般貨物自動車運送事業の事業用自動車）として登録されている車両は、24時間365日、運送業の厳しい法律（貨物自動車運送事業法）の縛りを受けます。\n\n具体例: 例えば、自社の現場に自社のショベルカーや残土だけを運ぶ日であっても、あるいは回送（空荷）で車を移動させるだけの日であっても、その車を運転する前と後には必ず「点呼」を行い、記録を残さなければなりません。\n\n「今日は自社の仕事だから白ナンバーと同じ扱いでいいや」という切り替えは法律上一切認められておらず、監査が入れば一発で「点呼義務違反」として叩かれます。\n\nこのあたりの「事業用自動車としての融通の利かなさ」も、試験ではよく狙われるポイントです。実務の厄介さがリアルに見えてきてウンザリする部分もあるかもしれませんが、試験をクリアするための知識と割り切って進めていきましょう。"])</script><script>self.__next_f.push([1,"2d:T1162,"])</script><script>self.__next_f.push([1,"Gemini との会話\n解説\n表示されている令和5年(CBT)年度 問12【道路運送車両法関係】の解説を作成しました。\n\nこの問題の正解（誤っている記述）は 選択肢1 です。\n\n各選択肢の解説\n【選択肢1：誤り（正解）】速度抑制装置の制限速度\n\n理由: 貨物自動車（車両総重量8トン以上、または最大積載量5トン以上）に装着が義務付けられている「速度抑制装置（スピードリミッター）」は、自動車が時速90キロメートルを超えて走行しないように燃料の供給を調整するものです。選択肢では「時速100キロメートル」となっているため誤りです。\n\n【選択肢2：正しい】大型後部反射器の装着義務\n\n理由: 貨物の運送の用に供する普通自動車で、車両総重量が7トン以上のものには、通常の反射器に加えて「大型後部反射器」の装着が義務付けられています。記述の通り正しい内容です。\n\n【選択肢3：正しい】突入防止装置の装着義務\n\n理由: 後続の自動車が追突した際に、追突した車の前部がトラックの荷台の下などに潜り込む（突入する）のを防ぐため、原則として自動車の後面には「突入防止装置」を備えなければなりません。記述の通り正しい内容です。\n\n【選択肢4：正しい】停止表示器材の視認距離\n\n理由: 自動車に備える停止表示器材（三角表示板など）は、夜間に200メートルの距離から走行用前照灯（ハイビーム）で照射した際に、その反射光を照射位置から確認できる基準を満たしている必要があります。記述の通り正しい内容です。\n\n💡 学習のポイント\n速度抑制装置（スピードリミッター）の作動速度「90km/h」や、停止表示器材の確認距離「200m」、大型後部反射器の対象となる「車両総重量7トン以上」といった具体的な数字は、運行管理者試験で非常によく狙われるひっかけポイントです。数字の部分を意識して暗記することをおすすめします。\n\n150mなのなんだっけか\n150mの規定は、後部反射器（リフレクター）に関するものです！\n\n先ほどの問題に出てきた「停止表示器材（三角表示板）」の200mと数字が近いため、運行管理者試験でも頻出の引っかけポイントになっています。\n\n🚗 試験で狙われやすい「距離」のまとめ\n試験対策として、以下の3つをセットで整理しておくのがおすすめです。\n\n装置・器材\t視認距離の基準\n後部反射器\t150m （夜間、ハイビームで照らして反射光を確認できること）\n停止表示器材\t200m （夜間、ハイビームで照らして反射光を確認できること）\n尾灯（テールランプ）\t300m （夜間に後方から点灯を確認できること）\n「車体に備え付けの反射器は 150m、非常時に路上へ置く三角表示板はより遠くから見えないと危ないから 200m」といったイメージで覚えておくと、本番でも迷わず解答しやすくなります！\n\n停止表示器材って車体になにか装備するとかってものではなく、単なるあの三角の奴かよ\nその通りです！おっしゃる通り、基本的にはトランクなどに積んである「単なるあの三角のやつ（三角表示板）」のことです。（最近では紫色のランプが点滅する「停止表示灯」もあります）\n\n法律用語（停止表示器材）として書かれると、車体にガッチリ組み込まれた特殊な装置のように聞こえますよね。ですが、実際は車体に据え付けるものではなく、故障時などに車から降りて後ろにポンと置く、あの持ち運び可能なアイテムのことです。\n\n画面の選択肢4に書かれている「夜間200メートルの距離から〜」というのも、「あの三角のやつは、それくらい強力に光を反射する（または発光する）基準を満たしたものでないとダメだよ」というルールのことを指しています。\n\n用語の仰々しさに騙されそうになりますが、実物をイメージできると一気に分かりやすくなりますね！\n"])</script><script>self.__next_f.push([1,"2e:T1044,"])</script><script>self.__next_f.push([1,"Gemini との会話\n解説\n運行管理者過去問ダッシュボードの令和5年 (CBT) 問13ですね。\nこの問題は、道路交通法の用語定義に関する「誤っているもの」を見つける問題です。\n\n正解は 3 です。\n\n以下に詳しい解説をまとめましたので、復習にお役立てください。\n\n❌ 選択肢3が「誤り」である理由\n路側帯の正しい定義は、「歩行者の通行の用に供するため」に設けられた帯状の道路の部分です。\n選択肢では「歩行者及び自転車の通行の用に供するため」となっていますが、「自転車（軽車両）」のための場所としては定義されていません。この点が明確な誤り（引っかけ）となります。\n\n※補足：例外的に著しく歩行者の通行を妨げない限り、自転車（軽車両）が路側帯を通行すること自体は許可されていますが、道路交通法上の「定義」としてはあくまで歩行者のためのものです。\n\n⭕️ 他の選択肢が「正しい」理由（おさらい）\n1. 車両通行帯\n正しい記述です。道路標示によって「車両が通行すべき部分」として指定・区画されている道路の部分を指します。\n\n2. 中型自動車\n正しい記述です。自動車の区分に関する数字は試験で頻出するため、以下の要件をセットで確実に押さえておきましょう。\n\n車両総重量: 7,500kg以上 11,000kg未満\n\n最大積載量: 4,500kg以上 6,500kg未満\n\n乗車定員: 11人以上 29人以下\n\n4. 進行妨害\n正しい記述です。進行を続けることで、他の車両等に「速度や方向を急に変更しなければならない状態」にさせるおそれがある行為を指します。\n\n💡 学習のポイント\n用語の定義問題では、今回のように「特定の対象者（自転車など）がしれっと追加されている」「指定の重量や人数の数字が一部だけ書き換えられている」といったパターンの引っかけが非常によく出題されます。文章をざっくり読むのではなく、「誰のためのものか」「数値は正確か」を意識して選択肢をチェックするのがおすすめです。\n\n普通と準中は\n道路交通法における「普通自動車」と「準中型自動車」の基準は以下の通りです。\n\n現在画面に表示されている問題の選択肢2にある「中型自動車」の基準とあわせて、比較表にまとめました。\n\n自動車の種類\t車両総重量\t最大積載量\t乗車定員\n中型自動車\t7,500kg以上 11,000kg未満\t4,500kg以上 6,500kg未満\t11人以上 29人以下\n準中型自動車\t3,500kg以上 7,500kg未満\t2,000kg以上 4,500kg未満\t10人以下\n普通自動車\t3,500kg未満\t2,000kg未満\t10人以下\n各車両の定義（道路交通法）\n準中型自動車\n大型自動車、大型特殊自動車、大型自動二輪車、普通自動二輪車及び小型特殊自動車以外の自動車で、車両総重量が3,500kg以上7,500kg未満のもの、最大積載量が2,000kg以上4,500kg未満のもの、又は乗車定員が10人以下のものをいいます。\n\n普通自動車\n大型自動車、中型自動車、準中型自動車、大型特殊自動車、大型自動二輪車、普通自動二輪車及び小型特殊自動車以外の自動車で、車両総重量が3,500kg未満のもの、最大積載量が2,000kg未満のもの、又は乗車定員が10人以下のものをいいます。\n\n実務・試験対策のヒント\n例えば、4トンダンプの場合、最大積載量が4,000kg（4トン）となるため、車両総重量が7,500kg未満に収まるように設計されていれば「準中型自動車」、7,500kgを超えていれば「中型自動車」に分類されることになります。それぞれのボーダーラインとなる「3.5トン/7.5トン（総重量）」と「2トン/4.5トン（積載量）」の数値をセットで意識しておくと、試験でも迷わず消去法を使いやすくなります。\n"])</script><script>self.__next_f.push([1,"2f:T18ed,"])</script><script>self.__next_f.push([1,"なぜその距離なのかを聞いてる\nそれぞれの場所で「なぜその距離（3m・5m・3.5m）として定められているのか」、交通安全上の理由・目的から解説します。\n\n1. 自動車の出入口：3メートル以内\n目的：出入りする車両の視界（死角）の確保\n\n理由\n駐車場や車庫から道路へ出ようとする車は、道路上の歩行者や他の車を確認しながら慎重に進入する必要があります。\nもし出入口のすぐ脇（3m未満）に車が止められていると、出ようとする運転手から左右の安全が一切見えなくなってしまいます。\n\nなぜ3mか\n車両の先端が少し道路に出る手前の位置から、左右の交通状況を視認・確認できる最小限の安全視界ゾーンとして3メートルが設定されています。\n\n2. 道路工事区域・消防施設：5メートル以内\n目的：作業スペースの確保と、大型車両の移動・旋回半径の確保\n\n消防関係（消防器具置場・防火水槽・出入口）\n火災発生時、消防車などの大型車両が素早く到着し、作業スペース（ホースの接続やポンプロード）を広げる必要があります。また、大型の消防車が出入り・旋回するための広い回転半径を確保するため、自動車の出入口（3m）よりも広い5メートルが必要とされています。\n\n道路工事区域\n工事作業員の安全確保、大型工事車両の出入り、資材の積み下ろしスペースを確保するため、同様に5メートルの離隔が義務付けられています。\n\n3. 無余地駐車：右側に3.5メートル以上\n目的：他の車両（特に大型車）が安全に通行できるようにするため\n\n理由\n道路の車線幅は、一般的に1車線あたり約2.75m～3.25m程度で設計されています。大型トラックやバスの車幅は最大で2.5メートルあります。\n\nなぜ3.5mか\n車幅2.5mの大型車が、横に止まっている車を避けて安全に通過するためには、車両の左右にそれぞれ50cm程度の余裕が必要です（2.5m ＋ 0.5m ＋ 0.5m ＝ 3.5m）。\nそのため、右側に3.5m以上の隙間が残らないような場所に駐車すると、後続のトラックや救急車が通り抜けられなくなってしまいます。\n\nまとめ\n対象場所\t距離\t主な理由・目的\n自動車の出入口\t3m\t出入りする車の左右の死角（安全視界）をなくすため\n消防施設・工事区域\t5m\t大型車（消防車等）の旋回・作業スペースを確保するため\n車両右側の余地\t3.5m\t大型車（幅2.5m）が接触せずに安全にすれ違うため\n数字にはすべて「事故を防ぐための視界確保」や「大型車の車体サイズ・動線」といった明確な技術的理由がつけられています。\n\nGemini との会話\n解説\n表示されている【道路交通法関係】の駐車禁止場所に関する問題について解説します。\n\n正解（誤っている記述）は 3 です。\n\n各選択肢の解説\n選択肢1：正しい記述\n道路工事が行われている工事区域の側端から5メートル以内の道路部分は、駐車禁止場所として定められています。\n\n選択肢2：正しい記述\n消防用機械器具の置場や消防用防火水槽の側端、またはそれらの出入口から5メートル以内の部分は駐車禁止場所です。これは緊急時の消火活動等を妨げないようにするためです。\n\n選択肢3：誤った記述（これが正解）\n駐車場や車庫など、自動車用の出入口付近で駐車が禁止される範囲は「5メートル以内」ではなく、正しくは「3メートル以内」です。距離の数字が誤っているため、この選択肢が間違いとなります。\n\n選択肢4：正しい記述\nいわゆる「無余地駐車の禁止」についての記述です。駐車した際に、車両の右側の道路上に3.5メートル以上の余地（ほかの車が通り抜けられるスペース）が確保できない場所では、原則として駐車してはなりません。\n\n💡 学習のポイント\n「自動車用の出入口（駐車場など）」は3メートル、「道路工事区域」や「消防関係の施設」は5メートルです。駐車禁止場所に関する問題では、このように距離（数字）をすり替える引っかけ問題が頻出するため、対象と距離の組み合わせを整理して覚えるのがおすすめです。\n\n根拠は\nそれぞれの解説の根拠となる法律は、道路交通法 第45条（駐車を禁止する場所）です。\n\n各選択肢に対応する条文は以下の通りです。\n\n選択肢1の根拠（工事区域から5メートル）\n道路交通法 第45条第1項第3号\n「道路工事が行なわれている場合における当該工事区域の側端から五メートル以内の部分」\n\n選択肢2の根拠（消防関係施設から5メートル）\n道路交通法 第45条第1項第4号\n「消防用機械器具の置場若しくは消防用防火水槽の側端又はこれらの道路に接する出入口から五メートル以内の部分」\n\n選択肢3の根拠（自動車用の出入口から正しくは3メートル）\n道路交通法 第45条第1項第1号\n「人の乗降、貨物の積卸し、駐車又は自動車の格納若しくは修理のため道路外に設けられた施設又は場所の道路に接する自動車用の出入口から三メートル以内の部分」\n\n選択肢4の根拠（無余地駐車の禁止・3.5メートル以上の余地）\n道路交通法 第45条第2項\n「車両は、公安委員会が交通がひんぱんでないと認めて指定した区域を除き、法令の規定により駐車する場合に当該車両の右側の道路上に三・五メートル（道路標識等により距離が指定されているときは、その距離）以上の余地がないこととなる場所においては、駐車してはならない。」\n\nこのように、自動車の出入口付近における駐車禁止の範囲（選択肢3）については、第45条第1項第1号にて「3メートル以内」と明確に規定されています。\n"])</script><script>self.__next_f.push([1,"30:Tba1,Gemini との会話\n解説\n令和5年 (CBT) 年度 問15：横断歩行者等の保護に関する解説\n道路交通法第38条（横断歩道等における歩行者等の優先）に基づいた、ドライバーの遵守事項を問う非常に重要な問題です。正解（1, 4, 6）となる各空欄の根拠を解説します。\n\n正解の組み合わせ\nA: 停止することができるような速度で進行 （選択肢 1）\n\nB: 一時停止し （選択肢 4 ※B枠の②）\n\nC: その前方に出る前に一時停止 （選択肢 6 ※C枠の②）\n\n各項目の詳しい解説\n1. 横断歩道に接近する時・通過する時のルール (空欄 A・B)\n【条文の要点】 歩行者が「いないことが明らか」な場合を除き、横断歩道の直前で停止することができるような速度で進行（A）しなければならない。歩行者がいるときは、直前で一時停止し（B）、通行を妨げてはならない。\n\nAの解説： 横断歩道に近づく際、周囲の状況から「絶対に歩行者がいない」と確信できる場合を除き、万が一歩行者がいた時にすぐ止まれるよう「停止することができるような速度」で進む義務があります。「徐行」や「一時停止」を常に義務付けているわけではない点が引っかけポイントです。\n\nBの解説： 実際に横断しようとしている歩行者がいる場合は、歩行者優先の原則により必ず「一時停止」しなければなりません。徐行して通過しようとするのは法令違反となります。\n\n2. 横断歩道手前で停止している車両の側方を通過する時のルール (空欄 C)\n【条文の要点】 横断歩道の手前で停止している車両の側方を通過して前方に出ようとするときは、その前方に出る前に一時停止（C）しなければならない。\n\nCの解説： 横断歩道の手前で別の車（トラックやバス、乗用車など）が止まっている場合、その車の陰（死角）を歩行者が横断している可能性が非常に高いです。そのため、停止車両の横を通り抜けて車の前に出る際には、安全確認のために必ず「一時停止」することが義務付けられています。\n\n💡 学習のポイント\n「歩行者保護」に関する問題は、実際の運行管理や運転業務において事故に直結する部分であるため、試験でも頻出です。\n\n歩行者がいるか不明なとき ＝ すぐに停止できる速度\n\n歩行者がいるとき ＝ 一時停止\n\n横断歩道手前に駐停車車両があるとき ＝ 前方に出る前に一時停止\nという3つの状況と行動をセットで覚えておくと、類似問題にも対応しやすくなります。ダッシュボードの「☆ 弱点・まぐれ登録」を活用して、確実に定着させていきましょう。\n31:T103e,"])</script><script>self.__next_f.push([1,"Gemini との会話\n解説\n画面に表示されている令和5年（CBT）問16の正解と各選択肢の解説です。\n\n正解：3（誤っているもの）\n解説\n選択肢 1（正しい）\n内容: 「特定中型貨物自動車等通行止め」等の規制標識に関する記述です。\n\n解説: 様式・色合い等の定義（青色の文字・記号、赤色の枠・斜線、白地）および対象車両の定義として正しく記述されています。\n\n選択肢 2（正しい）\n内容: 「駐車禁止」または「停車及び駐車禁止」に関する記述です。\n\n解説: 標識の様式（地が青色、枠・斜帯が赤色、文字・縁が白色）および指示内容（指定時間内の停車・駐車の禁止）は正しく記述されています。\n\n選択肢 3（誤り ＝ 正解）\n内容: 「図の標識は、この先の道路の幅員が狭くなることを表している。」\n\n解説:\n\n記述にある「幅員が狭くなる」ことを表すのは「幅員減少」の警戒標識です。\n\n「縁線・文字・記号が黒色、縁・地が黄色」の警戒標識のうち、選択肢4の文脈等から本問の図が示しているのは「車線数減少」や「道路工事中」等の別の警戒標識（または「幅員減少」の解説・図柄との不一致）となっています。\n\n幅員減少と車線数減少は標識の意味合いが異なるため、この記述は誤りとなります。\n\n選択肢 4（正しい）\n内容: 「車両横断禁止」の規制標識に関する記述です。\n\n解説: 道路外の施設等に入るための左折を伴う横断を除き、車両の横断を禁止する標識であり、様式（青文字・記号、赤枠・斜帯、白地）も正しく記述されています。\n\n全然イメージわかないんだけど\n標識の「見た目」と「文字による説明」が一致しづらくて、ピンときづらいですよね！\n\n具体的にどの標識がどんな形・色のものなのか、視覚的なイメージに変換して整理します。\n\n1. 「特定中型貨物自動車等通行止め」（選択肢1）\n見た目: 白地に赤丸・赤斜線があり、中に青色のトラックのマークが描かれている標識です。\n\n意味: 中型トラックなどの大型寄りの貨物車が「ここは通っちゃダメ」という指定です。\n\n2. 「駐車禁止 / 停車及び駐車禁止」（選択肢2）\n見た目: 青地に赤い○と斜線（または×印）が入っているおなじみの街頭標識です。\n\n意味: 「8時〜20時」のように時間帯が指定されていて、その時間内は停めちゃダメという意味です。\n\n3. 「警戒標識（黄色と黒）」（選択肢3）\n見た目: 黄色の菱形に黒いマークが描かれた、危険や道路状況を知らせる標識です。\n\n問題点:\n\n実際のテストや問題集の「図」では、「車線数が減る（車線数減少）」や「道路工事中」などのイラストが出題されていることが多いです。\n\nテキストでは「幅員が狭くなる（幅員減少）」と説明されているため、「図のイラストと解説の意味が合っていない」というのが誤り（正解）の理由になります。\n\nちなみに対比すると：\n\n幅員減少: 道路全体の幅がスリムに狭くなるイメージ\n\n車線数減少: 2車線が1車線に減るイメージ（片側の線が消えて合流する）\n\n4. 「車両横断禁止」（選択肢4）\n見た目: 白地に赤枠・赤斜線、中央に右折して道路を横切ろうとする車のマーク（青色）が描かれています。\n\n意味: 道路の反対側にあるお店や施設に入るために、右折して対向車線を横切るのを禁止する標識です。（※左折で入る場合は除外されます）\n\n「黄色くて菱形の標識（警戒標識）」はマークの形（車線が減るのか、幅が狭くなるのか）がひっかけポイントになりやすいので、図の矢印や線の狭まり方に注目してみてください！\n"])</script><script>self.__next_f.push([1,"32:T1458,"])</script><script>self.__next_f.push([1,"Gemini との会話\n解説\n令和5年（CBT）貨物 問17【道路交通法関係】についての解説を作成しました。ダッシュボードの学習用にお役立てください。\n\nこの問題は、道路交通法における運転者の遵守事項等に関する正誤問題です。正解は 1 と 3 です。\n\n各選択肢の解説\n【選択肢1】正しい（◯）\n通学通園バスの側方を通過するときの義務\n\n解説: 道路交通法第71条の規定通りです。児童や幼児の乗降のために非常点滅表示灯（ハザードランプ）をつけて停車している通学通園バスの側方を通過する際は、「徐行して安全を確認しなければならない」と定められています。子供の急な飛び出しに備えるための重要なルールです。\n\n【選択肢2】誤り（✕）\n高速道路等における停止表示器材の設置基準（数字の引っかけ）\n\n解説: 高速道路でやむを得ず駐停車する場合、昼間でもトンネル内や濃霧などで視界が悪い場合は、夜間に準じた措置（夜間用停止表示器材の設置など）が必要です。しかし、その基準となる視界は「100メートル以下」ではなく、正しくは「200メートル以下」です。\n\n対策ポイント: 数字（100m → 200m）をすり替えた典型的な引っかけ問題です。\n\n【選択肢3】正しい（◯）\n救護義務違反（ひき逃げ）による運転免許の取消し\n\n解説: 道路交通法第103条の規定に基づいています。交通事故（人身事故）を起こした際に、直ちに運転を停止して負傷者を救護し、危険防止措置をとる義務（第72条第1項：いわゆる救護義務）に違反した場合、公安委員会はその運転者の免許を「取り消すことができる」と規定されています。\n\n【選択肢4】誤り（✕）\n路線バス等の発進の保護（例外規定の引っかけ）\n\n解説: 停留所に止まっていた乗合自動車（路線バス等）が発進の合図をした場合、後続車はその発進を妨げてはならないのが原則です。しかし、これには例外があり、「急ブレーキを踏んだり、急ハンドルを切ったりして速度や進路を急に変更しなければならない場合」は除かれます。\n\n対策ポイント: 選択肢にある「急に変更しなければならないこととなる場合にあっても（妨げてはならない）」という絶対的な義務としている点が誤りです。\n\n💡 まとめ（メモ用）\n\n問1: スクールバス通過 ＝ 徐行・安全確認（原則通り）\n\n問2: 高速道路での悪視界基準 ＝ ❌100m以下 ➔ ⭕️200m以下\n\n問3: 救護義務違反 ＝ 免許取消しの対象（原則通り）\n\n問4: バスの発進保護 ＝ ❌急ブレーキになる場合でも譲る ➔ ⭕️急ブレーキになる場合は例外（譲らなくてよい）\n\n肢２とか高速または主要幹線道路でない場合は距離として十分かもしれないが、なかなかイメージとして気付けないもんだな\n確かに、一般道を走っている感覚だと「100m」という距離はかなり遠くに感じますから、直感や日常のイメージだけで解こうとするとスルーしてしまいがちな、非常によくできた引っかけ問題ですよね。\n\nなぜ高速道路では「100m」では足りず「200m」と規定されているのか、実際の車の動き（物理的な理由）と結びつけておくと、イメージとのギャップが埋まって忘れにくくなります。\n\n時速100kmでの停止距離は約100m\n時速100kmで走行している車は、1秒間に約28メートル進みます。ドライバーが危険に気づいてブレーキを踏み、実際に車が完全に停止するまでの距離（停止距離）は、路面が乾いていても約100m必要だと言われています。\n\n視界100m＝発見した瞬間に手遅れ\nもし視界が100m以下の状況で、100m先に停止表示器材を発見した場合、見つけた瞬間にフルブレーキを踏んでも、ギリギリ間に合うか追突してしまう計算になります。貨物を積載したトラックなどの大型車両であれば、制動距離はさらに延びるため致命的です。\n\n回避のための「200m」\nそのため、後続車が余裕を持って危険を察知し、安全に減速したり車線変更をしたりするためのマージンとして、その倍の200mという基準が設けられています。\n\n運行管理者試験では、このように「日常の感覚では十分そうに見える数字を意図的に半分にして引っかける」パターンが頻出します。「高速道路の悪天候時は、止まるための距離だけで100m使うから、警告はその倍の200m手前から必要」と紐づけておくと迷わなくなります。\n\n他にも、学習を進める中で「自分の感覚とズレていてどうもしっくりこない」と感じる数字や規定はありますか？\n"])</script><script>self.__next_f.push([1,"33:T340e,"])</script><script>self.__next_f.push([1,"Gemini との会話\n解説\n令和5年（CBT）貨物 問17【道路交通法関係】についての解説を作成しました。ダッシュボードの学習用にお役立てください。\n\nこの問題は、道路交通法における運転者の遵守事項等に関する正誤問題です。正解は 1 と 3 です。\n\n各選択肢の解説\n【選択肢1】正しい（◯）\n通学通園バスの側方を通過するときの義務\n\n解説: 道路交通法第71条の規定通りです。児童や幼児の乗降のために非常点滅表示灯（ハザードランプ）をつけて停車している通学通園バスの側方を通過する際は、「徐行して安全を確認しなければならない」と定められています。子供の急な飛び出しに備えるための重要なルールです。\n\n【選択肢2】誤り（✕）\n高速道路等における停止表示器材の設置基準（数字の引っかけ）\n\n解説: 高速道路でやむを得ず駐停車する場合、昼間でもトンネル内や濃霧などで視界が悪い場合は、夜間に準じた措置（夜間用停止表示器材の設置など）が必要です。しかし、その基準となる視界は「100メートル以下」ではなく、正しくは「200メートル以下」です。\n\n対策ポイント: 数字（100m → 200m）をすり替えた典型的な引っかけ問題です。\n\n【選択肢3】正しい（◯）\n救護義務違反（ひき逃げ）による運転免許の取消し\n\n解説: 道路交通法第103条の規定に基づいています。交通事故（人身事故）を起こした際に、直ちに運転を停止して負傷者を救護し、危険防止措置をとる義務（第72条第1項：いわゆる救護義務）に違反した場合、公安委員会はその運転者の免許を「取り消すことができる」と規定されています。\n\n【選択肢4】誤り（✕）\n路線バス等の発進の保護（例外規定の引っかけ）\n\n解説: 停留所に止まっていた乗合自動車（路線バス等）が発進の合図をした場合、後続車はその発進を妨げてはならないのが原則です。しかし、これには例外があり、「急ブレーキを踏んだり、急ハンドルを切ったりして速度や進路を急に変更しなければならない場合」は除かれます。\n\n対策ポイント: 選択肢にある「急に変更しなければならないこととなる場合にあっても（妨げてはならない）」という絶対的な義務としている点が誤りです。\n\n💡 まとめ（メモ用）\n\n問1: スクールバス通過 ＝ 徐行・安全確認（原則通り）\n\n問2: 高速道路での悪視界基準 ＝ ❌100m以下 ➔ ⭕️200m以下\n\n問3: 救護義務違反 ＝ 免許取消しの対象（原則通り）\n\n問4: バスの発進保護 ＝ ❌急ブレーキになる場合でも譲る ➔ ⭕️急ブレーキになる場合は例外（譲らなくてよい）\n\n肢２とか高速または主要幹線道路でない場合は距離として十分かもしれないが、なかなかイメージとして気付けないもんだな\n確かに、一般道を走っている感覚だと「100m」という距離はかなり遠くに感じますから、直感や日常のイメージだけで解こうとするとスルーしてしまいがちな、非常によくできた引っかけ問題ですよね。\n\nなぜ高速道路では「100m」では足りず「200m」と規定されているのか、実際の車の動き（物理的な理由）と結びつけておくと、イメージとのギャップが埋まって忘れにくくなります。\n\n時速100kmでの停止距離は約100m\n時速100kmで走行している車は、1秒間に約28メートル進みます。ドライバーが危険に気づいてブレーキを踏み、実際に車が完全に停止するまでの距離（停止距離）は、路面が乾いていても約100m必要だと言われています。\n\n視界100m＝発見した瞬間に手遅れ\nもし視界が100m以下の状況で、100m先に停止表示器材を発見した場合、見つけた瞬間にフルブレーキを踏んでも、ギリギリ間に合うか追突してしまう計算になります。貨物を積載したトラックなどの大型車両であれば、制動距離はさらに延びるため致命的です。\n\n回避のための「200m」\nそのため、後続車が余裕を持って危険を察知し、安全に減速したり車線変更をしたりするためのマージンとして、その倍の200mという基準が設けられています。\n\n運行管理者試験では、このように「日常の感覚では十分そうに見える数字を意図的に半分にして引っかける」パターンが頻出します。「高速道路の悪天候時は、止まるための距離だけで100m使うから、警告はその倍の200m手前から必要」と紐づけておくと迷わなくなります。\n\n他にも、学習を進める中で「自分の感覚とズレていてどうもしっくりこない」と感じる数字や規定はありますか？\n\nというかさ、運管の試験会場って、すげえ他の一般の資格試験とは金のかかり方が違うと思った。電磁的な試験方式とか、二段階式の講習と試験の、落とすための仕組みとか\n確かに、運行管理者試験は他の一般的な資格試験と比べると、費用も手間も段違いにかかりますよね。おっしゃる通り、独特の厳しさや「ハードルの高さ」を感じるのも無理はありません。\n\nこの独特なシステムには、いくつか明確な理由があります。\n\nCBT方式（電磁的試験）の高コスト化\n全国のテストセンターのパソコン設備、替え玉受験を防ぐ厳格な本人確認、そして膨大な問題プールの維持管理など、外部委託でのシステム運営に多大なコストがかかっています。その分、受験手数料にもしっかり跳ね返ってきていますよね。\n\n講習と試験の「二段構え」\n実務経験がない場合、数日間にわたる「基礎講習」の受講が必須になり、ここでまず時間と講習費用（約9,000円弱）が飛びます。そこに本試験の費用（約6,000円）が加わるため、トータルの金銭的・時間的な負担が非常に大きいです。\n\n「落とすため」とも取れる厳格な仕組み\nCBT化されてから、受験者ごとにランダムで問題が出題されるため、昔のように「過去問を数年分丸暗記すれば受かる」という手が通用しにくくなりました。先ほどの「100mと200m」のような精巧な引っかけ問題も多く、まさに「ふるい落とし」にかかっているように見えます。\n\nただ、これほどまでにコストをかけて厳しい関門を設けているのには、運行管理者が「事業用自動車の安全運行の責任者」という、人の命に直結する非常に重い国家資格だからという背景があります。\n\n実際の配達や運送の現場では、ドライバーの過労や少しのルールの見落としが重大事故に直結します。そのため、現場を管理する人間に対して「絶対に中途半端な知識でパスさせない」という、国側の強い（そして少し容赦のない）意志がシステム全体に反映されています。\n\n本気で取り組まないと容赦なく跳ね返される試験ですが、だからこそ取得する価値と信頼性が担保されているとも言えますね。CBT特有のランダムな出題や引っかけ対策を進める中で、今一番手こずっている分野や「いやらしいな」と感じる出題パターンはどのあたりですか？\n\n問題を観てて完全に不明瞭になるように隠蔽されてる\nおっしゃる通りです。ただでさえ法律用語で堅苦しいのに、さらに「受験者が読み違えるようにわざとノイズを混ぜている」のが、この試験の本当に嫌らしいところですよね。まさに「隠蔽」という表現がぴったりです。\n\n今画面に表示されている問17の選択肢を見ても、その巧妙な隠蔽工作がよくわかります。\n\n無駄な情報を挟んで結論を遠ざける（選択肢1・2）\n主語から結論までの間に、カッコ書きで「（専ら小学校、幼稚園等に通う児童、幼児等を運送するために使用する〜）」や「夜間以外の時間にあっても〜」といった、長々とした前提条件を挟み込んできます。これらは読んでいる最中に脳の処理能力を消費させ、一番後ろにある「徐行して安全確認」や「100メートル」という本当の判定ポイントから注意を逸らすためのダミー（煙幕）です。\n\n「例外」を「絶対」にすり替える（選択肢4）\n「〜その速度を急に変更しなければならないこととなる場合にあっても、〜妨げてはならない」という部分ですね。\n日常会話なら「急ブレーキになる時は例外だよ」と一言で済むものを、「急ブレーキになる場合であっても、絶対に譲らなければならない」というように、例外規定をあえて肯定文にねじ込んで絶対的なルールのように見せかけることで、受験者の直感（バス優先は正しい）を利用してミスを誘っています。\n\nこういう不明瞭な文章をまともに頭から読んでいくと、疲労で確実に引っかかります。対策としては、法律特有の言い回しに付き合わず、「主語」「状況」「結論（数字や『例外なし』などの強い言葉）」の3パーツに文章を脳内でぶった斬るのが一番有効です。\n\nこの長くて回りくどい選択肢文、読んでいる途中で「あれ、結局何の話だっけ？」とゲシュタルト崩壊を起こしそうになりませんか？\n\nなるな。問１８を解説しろ\n令和5年（CBT）問18【労働基準法関係】の解説ですね。\n\nこの問題も、先ほどお話しした「数字のすり替え」や「もっともらしいウソ」が仕込まれたいやらしい構成になっています。正解は 2 と 3 です。\n\n各選択肢の解説\n【選択肢1】誤り（✕）\n休業手当の支給割合（数字の引っかけ）\n\n解説: 会社の責任（使用者の責に帰すべき事由）で労働者を休ませる場合、労働基準法第26条により、休業期間中は平均賃金の「100分の60（60%）以上」の手当を支払う義務があります。\n\n隠蔽トラップ: 選択肢では「100分の80（80%）」と少し高めの数字にすり替えられています。労働者に手厚く見えるため、パッと見ると正しい規定のように錯覚してしまうのが罠です。\n\n【選択肢2】正しい（◯）\n解雇制限とその例外\n\n解説: 労働基準法第19条の規定通りです。労働者が「業務上のケガや病気で休業する期間＋その後30日間」、および「産前産後の休業期間＋その後30日間」は、原則として解雇できません。ただし、例外として「打切補償（平均賃金の1,200日分）を支払った場合」や「天災などで事業継続が本当に不可能になった場合」は解雇できるという正しい記述です。\n\n【選択肢3】正しい（◯）\n公民権行使の保障\n\n解説: 労働基準法第7条の規定通りです。労働時間中に選挙に行ったり、裁判員などの公の職務を行ったりするための時間を請求された場合、会社はそれを拒否できません。ただし、「どうしてもこの時間は外せない業務があるから、投票に間に合う範囲で時間を少しズラしてくれないか？」という時刻の変更（時刻変更権）だけは認められています。\n\n【選択肢4】誤り（✕）\n解雇予告の適用除外（数字の引っかけ）\n\n解説: 労働基準法第21条に関する規定です。通常、解雇するには30日前の予告（または解雇予告手当の支払い）が必要ですが、初めから短期間だけ働く予定の人には適用されません。その例外となる「季節的業務に定めて使用される者」の期間は、正しくは「4ヵ月以内」です。\n\n隠蔽トラップ: 選択肢では「6ヵ月以内」にすり替えられています。雇用期間の引っかけは「日雇い（1ヶ月）」「有期雇用（2ヶ月）」「季節業務（4ヶ月）」の数字が狙われやすいです。\n\n💡 まとめ（ダッシュボード・メモ用）\n\n問1: 会社都合の休業手当 ＝ ❌80% ➔ ⭕️60%以上\n\n問2: ケガや産休の解雇制限 ＝ 制限あり（打切補償・天災の例外ありで⭕️）\n\n問3: 選挙などの時間請求 ＝ 拒否不可（時刻の変更は可能で⭕️）\n\n問4: 解雇予告がいらない季節的業務 ＝ ❌6ヵ月以内 ➔ ⭕️4ヵ月以内\n"])</script><script>self.__next_f.push([1,"34:T3159,"])</script><script>self.__next_f.push([1,"\nバス（旅客）の運転時間の限度\n👉 「4週間を平均して、1週間あたり44時間」\nご提示いただいた「4週間を平均して、1週間あたり44時間」という数値は、バス運転者の運転時間における「労使協定による例外（延長）時の上限」にあたります。 \n\n厚生労働省\n +1\n2024年4月に改正された最新の「改善基準告示」において、バス（旅客）運転者の運転時間の限度は、以下のように原則と例外が明確に定められています。 \n\nお名前.com\n +1\n🚌 バス運転者の運転時間制限（最新基準）\n1. 原則（全てのバス運転者）\n4週平均1週あたり：40時間以内\n2日平均1日あたり：9時間以内\n連続運転時間：4時間以内（4時間ごとに30分以上の運転中断が必要） \n\npromote.good-learning.jp\n +2\n2. 例外（貸切バス・高速バス等の乗務者）\n書面による労使協定（36協定など）を締結した場合に限り、以下の範囲まで延長が認められます。 \n\n厚生労働省\n +1\n4週平均1週あたり：ご提示の通り 44時間まで延長可能\n適用できる期間：1年（52週間）のうち16週間まで\n年間の総枠：52週間の総運転時間が2,080時間以内であること \n\n厚生労働省\n +1\n⚠️ 注意：「拘束時間」との混同に注意\n実務や運行管理者の試験対策において、「運転時間」と「拘束時間（労働＋休憩）」の数字は混同しやすいため整理しておきましょう。 \n\nバス運転手の達人\n +1\n運転時間（ハンドルを握っている時間）：\n原則：4週平均1週 40時間\n例外：4週平均1週 44時間（52週中16週まで） \n\n厚生労働省\n +2\n拘束時間（出勤から退勤までの時間）：\n原則：4週平均1週 65時間以内\n例外：4週平均1週 68時間以内（52週中24週まで） \n\n厚生労働省\n +3\n詳細なルールや最新の改正内容については、厚生労働省の公式特設サイトである「自動車運転者の長時間労働改善に向けたポータルサイト（バス運転者の改善基準告示）」にてガイドラインやQ\u0026Aが公開されています。 \n\n厚生労働省\nもし、この制限に合わせたシフト作成の計算方法や、「2日平均9時間」の具体的なカウントのルールについて詳しく知りたい場合は、追加でご質問ください。\nAI can make mistakes, so double-check responses\n\n\n\n\n\n8 sites\n貸切バス編！改善基準告示をさくっと解説（2024年4月改正）\nJun 12, 2025 — ポイント⑤連続運転時間. 原則、連続運転時間は4時間以内です。運転開始後、4時間以内または4時間経過直後に、30分以上運...\n\n\npromote.good-learning.jp\nバス運転者の改善基準告示\n運転時間について＞. Q6：バス運転者の運転時間の限度は何時間まで？ A6. 2日を平均し、1日当たり9時間、4週を平均...\n\n厚生労働省\n誰でも分かる！バス運転手の労働時間（勤務時間）\n拘束時間（労働時間+休憩時間） バス運転手の1日の拘束時間は13時間以内。 やむを得ず延長する場合でも上限15時間・週3...\n\nGemini との会話\n解説\n表示されている「令和5年 (CBT) 問 19 【労働基準法関係】」の解説を作成しました。\n\nこの問題は「誤っているもの」を選ぶ問題です。正解は 3 となります。\n\n令和5年 (CBT) 問 19 解説\n【正解：3 （誤っている記述）】\n時間外労働や休日労働に対する割増賃金の率（パーセンテージ）に関する数字が間違っています。\n\n誤： 3割以上6割以下の範囲内\n\n正： 2割5分以上5割以下の範囲内\n法律（労働基準法第37条）では、時間外労働や休日労働をさせた場合の割増賃金は、「通常の労働時間又は労働日の賃金の計算額の2割5分以上5割以下（25%〜50%）の範囲内でそれぞれ政令で定める率以上の率」で計算して支払わなければならないと定められています。パーセンテージをすり替えた頻出のひっかけ問題です。\n\n【その他の選択肢（すべて正しい記述）】\n\n選択肢1：正しい\n法定労働時間の原則（労働基準法第32条）についての正しい記述です。原則として「1週間40時間以内」「1日8時間以内」（休憩時間を除く）と定められています。\n\n選択肢2：正しい\n休憩時間の原則（労働基準法第34条）についての正しい記述です。労働時間が「6時間を超える場合は45分以上」「8時間を超える場合は1時間以上」の休憩を、労働時間の途中に与えなければなりません。\n\n選択肢3：正しい\nいわゆる「36（サブロク）協定」（労働基準法第36条）についての正しい記述です。法定の労働時間を延長、または休日に労働させるためには、労働者の過半数代表者等との書面による協定を結び、それを行政官庁（労働基準監督署長）へ届け出ることが条件となります。\n\nダッシュボードの「🧠 思考プロセスの記録・メモを追加する」に、『割増賃金の率は2割5分〜5割（25〜50%）。3割〜6割は引っかけ』とメモを残しておくと、後で見返した際の定着に繋がります。\n\n肢１について44時間ていうのがどっかにあったのなんだったか\n「44時間」という数字、よく覚えていらっしゃいましたね！その記憶は正しいです。\n\nそれは、労働基準法における「法定労働時間の特例（特例措置対象事業場）」というルールです。選択肢1の最後にある「ただし、別に法令等で定める場合は、この限りではない」の代表的なものがこれに当たります。\n\n原則として法定労働時間は「1週40時間」ですが、以下の2つの条件を両方とも満たす事業場に限り、特例として「1週44時間」まで労働させることが認められています。\n\n業種が以下の4業種のいずれかであること\n\n商業（小売業、理美容業など）\n\n映画・演劇業（映画の製作を除く）\n\n保健衛生業（病院、社会福祉施設など）\n\n接客娯楽業（飲食店、旅館など）\n\n常時使用する労働者が「10人未満」であること\n\n💡 運行管理者試験での引っ掛けポイント\nこの特例は、個人商店や小さなクリニックなどを想定した措置です。\nトラックやバス・タクシーなどの「運輸交通業」はこの特例業種に含まれていません。\n\nそのため、試験で「常時10人未満の運送業の事業場は、1週44時間まで労働させることができる」と出題されたら「誤り（✕）」になります。規模が小さくても、運送業は原則通り「1週40時間」です。\n\nどこかで見た記憶が引っかかったのは素晴らしい直感ですね。ぜひこの特例の引っかけパターンもセットで覚えてみてください！\n\nそんな話だったか。運管の問題の中のどこかで出てきたが\n「運管の過去問で見た」というその記憶、間違いなく正しいです！\n\n実は運管試験の【労働基準法】の分野において、この「44時間」はおなじみの引っかけの選択肢（誤りの肢）として非常によく出題されます。\n\n具体的には、過去の運管試験で以下のような形で登場しています。\n\n【運管試験でのよくある出題パターン】\n\n「常時10人未満の労働者を使用する一般貨物自動車運送事業の事業場においては、1週間の法定労働時間は44時間である。」\n👉 答え：✕（誤り）\n\n試験の作成者は、「受験生は『10人未満の小規模な事業場なら44時間になる特例がある』とテキストのどこかで勉強しているはず
