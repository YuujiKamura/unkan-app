\":[],\"attempts\":[],\"_count\":{\"attempts\":0},\"isDebated\":false,\"isBookmarked\":false},{\"id\":151,\"year\":\"令和2年 (CBT)\",\"questionNumber\":30,\"field\":\"実務上の知識及び能力\",\"majorField\":null,\"subField\":null,\"content\":\"運行管理者が運転者に対し実施する危険予知訓練に関し、下図の交通場面の状況において考えられる＜運転者が予知すべき危険要因＞とそれに対応する＜運行管理者による指導事項＞として、【最もふさわしい＜選択肢の組み合わせ＞1～10 の中から3つ】選びなさい。\\n\\n【交通場面の状況】\\n・住宅街の道路を走行している。\\n・前方に二輪車が走行している。\\n・右側の脇道から車や自転車が出ようとしている。\\n・前方の駐車車両の向こうに人影が見える。\\n\\n1. ＜運転者が予知すべき危険要因＞\\n① 二輪車を避けようとしてセンターラインをはみ出すと、対向車と衝突する危険がある。\\n② 駐車車両に進路を塞がれた二輪車が右に進路を変更してくることが予測されるので、このまま進行すると二輪車と衝突する危険がある。\\n③ 前方右側の脇道から左折しようとしている車の影に見える自転車が道路を横断してくると衝突する危険がある。\\n④ 後方の状況を確認せずに右側に進路変更をすると、後続の二輪車と接触する危険がある。\\n⑤ 駐車車両の先に歩行者が見えるが、この歩行者が道路を横断してくるとはねる危険がある。\\n\\n2. ＜運行管理者による指導事項＞\\nア 住宅街を走行する際に駐車車両があるときは、その付近の歩行者の動きにも注意しスピードを落として走行する。\\nイ 単路でも、いつ前車が進路変更などのために減速や停止をするかわからないので、常に車間距離を保持しておく。\\nウ 進路変更するときは、必ず後続車の有無を確認するとともに、後続車があるときは、決して強引な進路変更はしない。\\nエ 右側の脇道から自転車が出ようとしているので、周辺の交通状況を確認のうえ、脇道の自転車の動きに注意し走行する。仮に出てきた場合は先に行かせる。\\nオ 二輪車は、後方の確認をしないまま進路を変更することがよくあるので、二輪車を追い越そうとはせず先に行かせる。\",\"imageUrl\":\"/pdf_pages/R02.CBT_Q30.png\",\"sourceSheet\":null,\"knowledgeTags\":\"#駐停車禁止ルール,#交通事故の要因・防止策\",\"riskCategory\":null,\"situationCategory\":\"#表・グラフ\",\"format\":\"SINGLE\",\"pdfUrl\":null,\"pdfPage\":null,\"options\":[{\"id\":567,\"questionId\":151,\"optionNumber\":1,\"content\":\"①－イ\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":568,\"questionId\":151,\"optionNumber\":2,\"content\":\"①－ウ\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":569,\"questionId\":151,\"optionNumber\":3,\"content\":\"②－エ\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":570,\"questionId\":151,\"optionNumber\":4,\"content\":\"②－オ\",\"isCorrect\":true,\"explanation\":null,\"structuredData\":null},{\"id\":571,\"questionId\":151,\"optionNumber\":5,\"content\":\"③－ア\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":572,\"questionId\":151,\"optionNumber\":6,\"content\":\"③－エ\",\"isCorrect\":true,\"explanation\":null,\"structuredData\":null},{\"id\":573,\"questionId\":151,\"optionNumber\":7,\"content\":\"④－イ\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":574,\"questionId\":151,\"optionNumber\":8,\"content\":\"④－オ\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":575,\"questionId\":151,\"optionNumber\":9,\"content\":\"⑤－ア\",\"isCorrect\":true,\"explanation\":null,\"structuredData\":null},{\"id\":576,\"questionId\":151,\"optionNumber\":10,\"content\":\"⑤－ウ\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null}],\"explanation\":null,\"correctOptions\":[],\"attempts\":[],\"_count\":{\"attempts\":0},\"isDebated\":false,\"isBookmarked\":false},{\"id\":158,\"year\":\"令和2年 第1回\",\"questionNumber\":1,\"field\":\"貨物自動車運送事業法\",\"majorField\":null,\"subField\":null,\"content\":\"一般貨物自動車運送事業に関する次の記述のうち、正しいものを1つ選び、解答用紙の該当する欄にマークしなさい。なお、解答にあたっては、各選択肢に記載されている事項以外は考慮しないものとする。（※法改正により一部改変）\",\"imageUrl\":\"/pdf_pages/R02.1_Q1.png\",\"sourceSheet\":\"R02.1_full.json\",\"knowledgeTags\":null,\"riskCategory\":null,\"situationCategory\":null,\"format\":\"SINGLE\",\"pdfUrl\":\"/data/R02.1.pdf\",\"pdfPage\":1,\"options\":[{\"id\":621,\"questionId\":158,\"optionNumber\":1,\"content\":\"1: 一般貨物自動車運送事業を経営しようとする者は、国土交通大臣の認可を受けなければならない。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":622,\"questionId\":158,\"optionNumber\":2,\"content\":\"2: 貨物自動車利用運送とは、一般貨物自動車運送事業、特定貨物自動車運送事業又は貨物軽自動車運送事業を経営する者が他の一般貨物自動車運送事業、特定貨物自動車運送事業又は貨物軽自動車運送事業を経営する者の行う運送（自動車を使用しないで貨物の運送を行わせることを内容とする契約によるものを除く。）を利用してする貨物の運送をいう。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":623,\"questionId\":158,\"optionNumber\":3,\"content\":\"3: 特別積合せ貨物運送とは、特定の者の需要に応じて有償で自動車を使用し、営業所その他の事業場（以下「事業場」という。）において、限定された貨物の集貨を行い、集貨された貨物を積み合わせて他の事業場に運送し、当該他の事業場において運送された貨物の配達に必要な仕分を行うものであって、これらの事業場の間における当該積合せ貨物の運送を定期的に行うものをいう。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":624,\"questionId\":158,\"optionNumber\":4,\"content\":\"4: 国土交通大臣が標準運送約款を定めて公示した場合（これを変更して公示した場合を含む。）において、一般貨物自動車運送事業者が、標準運送約款と同一の運送約款を定め、又は現に定めている運送約款を標準運送約款と同一のものに変更したときは、その運送約款については、国土交通大臣の認可を受けたものとみなす。\",\"isCorrect\":true,\"explanation\":null,\"structuredData\":null}],\"explanation\":null,\"correctOptions\":[],\"attempts\":[],\"_count\":{\"attempts\":0},\"isDebated\":false,\"isBookmarked\":false},{\"id\":159,\"year\":\"令和2年 第1回\",\"questionNumber\":2,\"field\":\"貨物自動車運送事業法\",\"majorField\":null,\"subField\":null,\"content\":\"一般貨物自動車運送事業者（以下「事業者」という。）の過労運転等の防止等についての法令の定めに関する次の記述のうち、【正しいものを2つ】選びなさい。なお、解答にあたっては、各選択肢に記載されている事項以外は考慮しないものとする。（※法改正により一部改変）\",\"imageUrl\":\"/pdf_pages/R02.1_Q2.png\",\"sourceSheet\":\"R02.1_full.json\",\"knowledgeTags\":\"#点呼・乗務制限(管理者義務)\",\"riskCategory\":null,\"situationCategory\":null,\"format\":\"SINGLE\",\"pdfUrl\":\"/data/R02.1.pdf\",\"pdfPage\":2,\"options\":[{\"id\":625,\"questionId\":159,\"optionNumber\":1,\"content\":\"1: 事業者は、事業計画に従い業務を行うに必要な員数の運転者を常時選任しておかなければならず、この場合、選任する運転者は、日々雇い入れられる者、3ヵ月以内の期間を定めて使用される者又は試みの使用期間中の者（14日を超えて引き続き使用されるに至った者を除く。）であってはならない。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":626,\"questionId\":159,\"optionNumber\":2,\"content\":\"2: 事業者は、乗務員等が有効に利用することができるように、休憩に必要な施設を整備し、及び乗務員等に睡眠を与える必要がある場合にあっては睡眠に必要な施設を整備し、並びにこれらの施設を適切に管理し、及び保守しなければならない。\",\"isCorrect\":true,\"explanation\":null,\"structuredData\":null},{\"id\":627,\"questionId\":159,\"optionNumber\":3,\"content\":\"3: 事業者は、運転者が長距離運転又は夜間の運転に従事する場合であって、疲労等により安全な運転を継続することができないおそれがあるときは、あらかじめ、当該運転者と交替するための運転者を配置しておかなければならない。\",\"isCorrect\":true,\"explanation\":null,\"structuredData\":null},{\"id\":628,\"questionId\":159,\"optionNumber\":4,\"content\":\"4: 運転者等の業務について、当該事業用自動車の瞬間速度、運行距離及び運行時間を運行記録計により記録しなければならない車両は、車両総重量が8トン以上又は最大積載量が5トン以上の普通自動車である。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null}],\"explanation\":null,\"correctOptions\":[],\"attempts\":[],\"_count\":{\"attempts\":0},\"isDebated\":false,\"isBookmarked\":false},{\"id\":160,\"year\":\"令和2年 第1回\",\"questionNumber\":3,\"field\":\"貨物自動車運送事業法\",\"majorField\":null,\"subField\":null,\"content\":\"一般貨物自動車運送事業者（以下「事業者」という。）の安全管理規程等及び輸送の安全に係る情報の公表についての次の記述のうち、【誤っているものを1つ】選びなさい。なお、解答にあたっては、各選択肢に記載されている事項以外は考慮しないものとする。（※法改正により一部改変）\",\"imageUrl\":\"/pdf_pages/R02.1_Q3.png\",\"sourceSheet\":\"R02.1_full.json\",\"knowledgeTags\":null,\"riskCategory\":null,\"situationCategory\":null,\"format\":\"SINGLE\",\"pdfUrl\":\"/data/R02.1.pdf\",\"pdfPage\":2,\"options\":[{\"id\":629,\"questionId\":160,\"optionNumber\":1,\"content\":\"1: 貨物自動車運送事業法（以下「法」という。）第14条第1項の規定により安全管理規程を定めなければならない事業者は、安全統括管理者を選任したときは、国土交通省令で定めるところにより、遅滞なく、その氏名及び役職を国土交通大臣に届け出なければならない。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":630,\"questionId\":160,\"optionNumber\":2,\"content\":\"2: 事業用自動車（被けん引自動車を除く。）の保有車両数が100両以上の事業者は、安全管理規程を定めて国土交通大臣に届け出なければならない。これを変更しようとするときも、同様とする。\",\"isCorrect\":true,\"explanation\":null,\"structuredData\":null},{\"id\":631,\"questionId\":160,\"optionNumber\":3,\"content\":\"3: 事業者は、毎事業年度の経過後100日以内に、輸送の安全に関する基本的な方針その他の輸送の安全に係る情報であって国土交通大臣が告示で定める①輸送の安全に関する基本的な方針、②輸送の安全に関する目標及びその達成状況、③自動車事故報告規則第2条に規定する事故に関する統計について、インターネットの利用その他の適切な方法により公表しなければならない。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":632,\"questionId\":160,\"optionNumber\":4,\"content\":\"4: 事業者は、法第22条（輸送の安全確保の命令）、法第27条（事業改善の命令）又は法第33条（許可の取消し等）の規定による処分（輸送の安全に係るものに限る。）を受けたときは、遅滞なく、当該処分の内容並びに当該処分に基づき講じた措置及び講じようとする措置の内容をインターネットの利用その他の適切な方法により公表しなければならない。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null}],\"explanation\":null,\"correctOptions\":[],\"attempts\":[],\"_count\":{\"attempts\":0},\"isDebated\":false,\"isBookmarked\":false},{\"id\":161,\"year\":\"令和2年 第1回\",\"questionNumber\":4,\"field\":\"貨物自動車運送事業法\",\"majorField\":null,\"subField\":null,\"content\":\"貨物自動車運送事業の事業用自動車の運転者に対する点呼についての法令等の定めに関する次の記述のうち、誤っているものを1つ選び、解答用紙の該当する欄にマークしなさい。なお、解答にあたっては、各選択肢に記載されている事項以外は考慮しないものとする。（※法改正により一部改変）\",\"imageUrl\":\"/pdf_pages/R02.1_Q4.png\",\"sourceSheet\":\"R02.1_full.json\",\"knowledgeTags\":\"#点呼・乗務制限(管理者義務)\",\"riskCategory\":null,\"situationCategory\":null,\"format\":\"SINGLE\",\"pdfUrl\":\"/data/R02.1.pdf\",\"pdfPage\":3,\"options\":[{\"id\":633,\"questionId\":161,\"optionNumber\":1,\"content\":\"1: 次のいずれにも該当する一般貨物自動車運送事業者の営業所にあっては、当該営業所と当該営業所の車庫間において、当該営業所で管理するIT点呼機器を用いたIT点呼を行うことができる。① 開設されてから3年を経過していること。② 過去3年間所属する貨物自動車運送事業の用に供する事業用自動車の運転者が自らの責に帰する自動車事故報告規則第2条に規定する事故を発生させていないこと。③ 過去3年間点呼の違反に係る行政処分又は警告を受けていないこと。④ 貨物自動車運送適正化事業実施機関が行った直近の巡回指導において、総合評価が「D、E」以外であり、点呼の項目の判定が「適」であること。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":634,\"questionId\":161,\"optionNumber\":2,\"content\":\"2: 同一事業者内の全国貨物自動車運送適正化事業実施機関が認定している安全性優良事業所（Gマーク営業所）間でIT点呼を実施した場合、点呼簿に記録する内容を、IT点呼を行う営業所及びIT点呼を受ける運転者が所属する営業所の双方で記録し、保存すること。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":635,\"questionId\":161,\"optionNumber\":3,\"content\":\"3: 貨物自動車運送事業者は、点呼に用いるアルコール検知器を常時有効に保持しなければならない。このため、確実に酒気を帯びていない者が当該アルコール検知器を使用した場合に、アルコールを検知しないこと及び洗口液等アルコールを含有する液体又はこれを希釈したものをスプレー等により口内に噴霧した上で、当該アルコール検知器を使用した場合にアルコールを検知すること等により、定期的に故障の有無を確認しなければならない。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":636,\"questionId\":161,\"optionNumber\":4,\"content\":\"4: 運行管理者の業務を補助させるために選任された補助者に対し、点呼の一部を行わせる場合にあっても、当該営業所において選任されている運行管理者が行う点呼は、点呼を行うべき総回数の少なくとも2分の1以上でなければならない。\",\"isCorrect\":true,\"explanation\":null,\"structuredData\":null}],\"explanation\":null,\"correctOptions\":[],\"attempts\":[],\"_count\":{\"attempts\":0},\"isDebated\":false,\"isBookmarked\":false},{\"id\":162,\"year\":\"令和2年 第1回\",\"questionNumber\":5,\"field\":\"貨物自動車運送事業法\",\"majorField\":null,\"subField\":null,\"content\":\"一般貨物自動車運送事業者の自動車事故報告規則に基づく自動車事故報告書の提出等に関する次の記述のうち、正しいものを2つ選び、解答用紙の該当する欄にマークしなさい。なお、解答にあたっては、各選択肢に記載されている事項以外は考慮しないものとする。\",\"imageUrl\":\"/pdf_pages/R02.1_Q5.png\",\"sourceSheet\":\"R02.1_full.json\",\"knowledgeTags\":null,\"riskCategory\":null,\"situationCategory\":\"#事故対応事例\",\"format\":\"SINGLE\",\"pdfUrl\":\"/data/R02.1.pdf\",\"pdfPage\":4,\"options\":[{\"id\":637,\"questionId\":162,\"optionNumber\":1,\"content\":\"1: 事業用自動車が鉄道車両（軌道車両を含む。）と接触する事故を起こした場合には、当該事故のあった日から15日以内に、自動車事故報告規則に定める自動車事故報告書（以下「事故報告書」という。）を当該事業用自動車の使用の本拠の位置を管轄する運輸支局長等を経由して、国土交通大臣に提出しなければならない。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":638,\"questionId\":162,\"optionNumber\":2,\"content\":\"2: 事業用自動車の運転者が、運転中に胸に強い痛みを感じたので、直近の駐車場に駐車し、その後の運行を中止した。当該運転者は狭心症と診断された。この場合、事故報告書を国土交通大臣に提出しなければならない。\",\"isCorrect\":true,\"explanation\":null,\"structuredData\":null},{\"id\":639,\"questionId\":162,\"optionNumber\":3,\"content\":\"3: 事業用自動車が高速自動車国道法に定める高速自動車国道において、路肩に停車中の車両に追突したため、後続車6台が衝突する多重事故が発生し、この事故により6人が重傷、4人が軽傷を負った。この場合、24時間以内においてできる限り速やかに、その事故の概要を運輸支局長等に速報することにより、国土交通大臣への事故報告書の提出を省略することができる。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":640,\"questionId\":162,\"optionNumber\":4,\"content\":\"4: 自動車の装置（道路運送車両法第41条各号に掲げる装置をいう。）の故障により、事業用自動車が運行できなくなった場合には、国土交通大臣に提出する事故報告書に当該事業用自動車の自動車検査証の有効期間、使用開始後の総走行距離等所定の事項を記載した書面及び故障の状況を示す略図又は写真を添付しなければならない。\",\"isCorrect\":true,\"explanation\":null,\"structuredData\":null}],\"explanation\":null,\"correctOptions\":[],\"attempts\":[],\"_count\":{\"attempts\":0},\"isDebated\":false,\"isBookmarked\":false},{\"id\":163,\"year\":\"令和2年 第1回\",\"questionNumber\":6,\"field\":\"貨物自動車運送事業法\",\"majorField\":null,\"subField\":null,\"content\":\"次の記述のうち、一般貨物自動車運送事業の運行管理者が行わなければならない業務として、正しいものを2つ選び、解答用紙の該当する欄にマークしなさい。なお、解答にあたっては、各選択肢に記載されている事項以外は考慮しないものとする。（※法改正により一部改変）\",\"imageUrl\":\"/pdf_pages/R02.1_Q6.png\",\"sourceSheet\":\"R02.1_full.json\",\"knowledgeTags\":null,\"riskCategory\":null,\"situationCategory\":null,\"format\":\"SINGLE\",\"pdfUrl\":\"/data/R02.1.pdf\",\"pdfPage\":4,\"options\":[{\"id\":641,\"questionId\":163,\"optionNumber\":1,\"content\":\"1: 自動車事故報告規則第5条（事故警報）の規定により定められた事故防止対策に基づき、事業用自動車の運行の安全の確保について、事故を発生させた運転者に限り、指導及び監督を行うこと。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":642,\"questionId\":163,\"optionNumber\":2,\"content\":\"2: 法令の規定により、運転者として常時選任するため新たに雇い入れた者であって当該貨物自動車運送事業者において初めて事業用自動車に乗務する前3年間に初任診断（初任運転者のための適性診断として国土交通大臣が認定したもの）を受診したことがない者に対して、当該診断を受診させること。\",\"isCorrect\":true,\"explanation\":null,\"structuredData\":null},{\"id\":643,\"questionId\":163,\"optionNumber\":3,\"content\":\"3: 従業員に対し、効果的かつ適切に指導及び監督を行うため、輸送の安全に関する基本的な方針を策定し、かつ、これに基づき指導及び監督を行うこと。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":644,\"questionId\":163,\"optionNumber\":4,\"content\":\"4: 法令の規定により、運行指示書を作成し、及びその写しに変更の内容を記載し、運転者等に対し適切な指示を行い、運行指示書を事業用自動車の運転者等に携行させ、及び変更の内容を記載させ、並びに運行指示書及びその写しの保存をすること。\",\"isCorrect\":true,\"explanation\":null,\"structuredData\":null}],\"explanation\":null,\"correctOptions\":[],\"attempts\":[],\"_count\":{\"attempts\":0},\"isDebated\":false,\"isBookmarked\":false},{\"id\":164,\"year\":\"令和2年 第1回\",\"questionNumber\":7,\"field\":\"貨物自動車運送事業法\",\"majorField\":null,\"subField\":null,\"content\":\"一般貨物自動車運送事業者の事業用自動車の運行の安全を確保するために、事業者が行う国土交通省告示で定める特定の運転者に対する特別な指導の指針に関する次の文中、A、B、Cに入るべき字句としていずれか正しいものを1つ選び、解答用紙の該当する欄にマークしなさい。\\n1. 軽傷者（法令で定める傷害を受けた者）を生じた交通事故を引き起こし、かつ、当該事故前の[ A ]間に交通事故を引き起こしたことがある運転者に対し、国土交通大臣が告示で定める適性診断であって国土交通大臣の認定を受けたものを受診させなければならない。\\n2. 運転者として常時選任するために新たに雇い入れた者（当該貨物自動車運送事業者において初めて事業用自動車に乗務する前[ B ]間に他の一般貨物自動車運送事業者等によって運転者として常時選任されたことがある者を除く。）に対して、特別な指導を行わなければならない。\\nこの指導の時期については、当該貨物自動車運送事業者において初めて事業用自動車に乗務する前に実施する。ただし、やむを得ない事情がある場合には、乗務を開始した後[ C ]以内に実施する。\",\"imageUrl\":\"/pdf_pages/R02.1_Q7.png\",\"sourceSheet\":\"R02.1_full.json\",\"knowledgeTags\":null,\"riskCategory\":null,\"situationCategory\":null,\"format\":\"SINGLE\",\"pdfUrl\":\"/data/R02.1.pdf\",\"pdfPage\":5,\"options\":[{\"id\":645,\"questionId\":164,\"optionNumber\":1,\"content\":\"A①: 1年\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":646,\"questionId\":164,\"optionNumber\":2,\"content\":\"A②: 3年\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":647,\"questionId\":164,\"optionNumber\":3,\"content\":\"B①: 1年\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":648,\"questionId\":164,\"optionNumber\":4,\"content\":\"B②: 3年\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":649,\"questionId\":164,\"optionNumber\":5,\"content\":\"C①: 1ヵ月\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":650,\"questionId\":164,\"optionNumber\":6,\"content\":\"C②: 3ヵ月\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null}],\"explanation\":null,\"correctOptions\":[],\"attempts\":[],\"_count\":{\"attempts\":0},\"isDebated\":false,\"isBookmarked\":false},{\"id\":165,\"year\":\"令和2年 第1回\",\"questionNumber\":8,\"field\":\"貨物自動車運送事業法\",\"majorField\":null,\"subField\":null,\"content\":\"一般貨物自動車運送事業者が運転者に記録させる業務の記録についての次の記述のうち、誤っているものを1つ選び、解答用紙の該当する欄にマークしなさい。なお、解答にあたっては、各選択肢に記載されている事項以外は考慮しないものとする。（※法改正により一部改変）\",\"imageUrl\":\"/pdf_pages/R02.1_Q8.png\",\"sourceSheet\":\"R02.1_full.json\",\"knowledgeTags\":null,\"riskCategory\":null,\"situationCategory\":null,\"format\":\"SINGLE\",\"pdfUrl\":\"/data/R02.1.pdf\",\"pdfPage\":5,\"options\":[{\"id\":651,\"questionId\":165,\"optionNumber\":1,\"content\":\"1: 事業用自動車に係る運転者の業務について、休憩又は睡眠をした場合にあっては、その地点及び日時を、当該業務を行った運転者ごとに「業務の記録」（法令に規定する運行記録計に記録する場合を除く。以下同じ。）に記録させなければならない。ただし、10分未満の休憩については、その記録を省略しても差しつかえない。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":652,\"questionId\":165,\"optionNumber\":2,\"content\":\"2: 事業用自動車に係る運転者の業務について、道路交通法に規定する交通事故若しくは自動車事故報告規則に規定する事故又は著しい運行の遅延その他の異常な事態が発生した場合にあっては、その概要及び原因について、当該業務を行った運転者ごとに「業務の記録」に記録させなければならない。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":653,\"questionId\":165,\"optionNumber\":3,\"content\":\"3: 事業用自動車に係る運転者の業務について、荷主の都合により集貨又は配達を行った地点（以下「集貨地点等」という。）で30分以上待機した場合にあっては、①集貨地点等、②集貨地点等に到着した日時、③集貨地点等における積込み又は取卸しの開始及び終了の日時、④集貨地点等から出発した日時等を、当該業務を行った運転者ごとに「業務の記録」に記録させなければならない。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":654,\"questionId\":165,\"optionNumber\":4,\"content\":\"4: 事業用自動車に係る運転者の業務について、車両総重量が8トン以上又は最大積載量が5トン以上の普通自動車である事業用自動車の運行の業務に従事した場合にあっては、「貨物の積載状況」を「業務の記録」に記録させなければならない。ただし、当該業務において、法令の規定に基づき作成された運行指示書に「貨物の積載状況」が記載されているときは、「業務の記録」への当該事項の記録を省略することができる。\",\"isCorrect\":true,\"explanation\":null,\"structuredData\":null}],\"explanation\":null,\"correctOptions\":[],\"attempts\":[],\"_count\":{\"attempts\":0},\"isDebated\":false,\"isBookmarked\":false},{\"id\":166,\"year\":\"令和2年 第1回\",\"questionNumber\":9,\"field\":\"道路運送車両法\",\"majorField\":null,\"subField\":null,\"content\":\"自動車の登録等についての次の記述のうち、誤っているものを1つ選び、解答用紙の該当する欄にマークしなさい。なお、解答にあたっては、各選択肢に記載されている事項以外は考慮しないものとする。\",\"imageUrl\":\"/pdf_pages/R02.1_Q9.png\",\"sourceSheet\":\"R02.1_full.json\",\"knowledgeTags\":\"#自動車の登録・車検\",\"riskCategory\":null,\"situationCategory\":null,\"format\":\"SINGLE\",\"pdfUrl\":\"/data/R02.1.pdf\",\"pdfPage\":6,\"options\":[{\"id\":655,\"questionId\":166,\"optionNumber\":1,\"content\":\"1: 一時抹消登録を受けた自動車（国土交通省令で定めるものを除く。）の所有者は、自動車の用途を廃止したときには、その事由があった日から15日以内に、国土交通省令で定めるところにより、その旨を国土交通大臣に届け出なければならない。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":656,\"questionId\":166,\"optionNumber\":2,\"content\":\"2: 臨時運行の許可を受けた者は、臨時運行許可証の有効期間が満了したときは、その日から15日以内に、当該臨時運行許可証及び臨時運行許可番号標を行政庁に返納しなければならない。\",\"isCorrect\":true,\"explanation\":null,\"structuredData\":null},{\"id\":657,\"questionId\":166,\"optionNumber\":3,\"content\":\"3: 登録自動車の使用者は、当該自動車が滅失し、解体し（整備又は改造のために解体する場合を除く。）、又は自動車の用途を廃止したときは、その事由があった日（使用済自動車の解体である場合には解体報告記録がなされたことを知った日）から15日以内に、当該自動車検査証を国土交通大臣に返納しなければならない。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":658,\"questionId\":166,\"optionNumber\":4,\"content\":\"4: 自動車の所有者は、当該自動車の使用の本拠の位置に変更があったときは、道路運送車両法で定める場合を除き、その事由があった日から15日以内に、国土交通大臣の行う変更登録の申請をしなければならない。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null}],\"explanation\":null,\"correctOptions\":[],\"attempts\":[],\"_count\":{\"attempts\":0},\"isDebated\":false,\"isBookmarked\":false},{\"id\":167,\"year\":\"令和2年 第1回\",\"questionNumber\":10,\"field\":\"道路運送車両法\",\"majorField\":null,\"subField\":null,\"content\":\"自動車の検査等についての次の記述のうち、誤っているものを1つ選び、解答用紙の該当する欄にマークしなさい。なお、解答にあたっては、各選択肢に記載されている事項以外は考慮しないものとする。\",\"imageUrl\":\"/pdf_pages/R02.1_Q10.png\",\"sourceSheet\":\"R02.1_full.json\",\"knowledgeTags\":\"#自動車の登録・車検\",\"riskCategory\":null,\"situationCategory\":null,\"format\":\"SINGLE\",\"pdfUrl\":\"/data/R02.1.pdf\",\"pdfPage\":6,\"options\":[{\"id\":659,\"questionId\":167,\"optionNumber\":1,\"content\":\"1: 自動車は、指定自動車整備事業者が継続検査の際に交付した有効な保安基準適合標章を表示しているときは、自動車検査証を備え付けていなくても、運行の用に供することができる。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":660,\"questionId\":167,\"optionNumber\":2,\"content\":\"2: 初めて自動車検査証の交付を受ける車両総重量7,990キログラムの貨物の運送の用に供する自動車については、当該自動車検査証の有効期間は1年である。\",\"isCorrect\":true,\"explanation\":null,\"structuredData\":null},{\"id\":661,\"questionId\":167,\"optionNumber\":3,\"content\":\"3: 自動車の使用者は、自動車検査証又は検査標章が滅失し、き損し、又はその識別が困難となった場合には、その再交付を受けることができる。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":662,\"questionId\":167,\"optionNumber\":4,\"content\":\"4: 検査標章は、自動車検査証がその効力を失ったとき、又は継続検査、臨時検査若しくは構造等変更検査の結果、当該自動車検査証の返付を受けることができなかったときは、当該自動車に表示してはならない。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null}],\"explanation\":null,\"correctOptions\":[],\"attempts\":[],\"_count\":{\"attempts\":0},\"isDebated\":false,\"isBookmarked\":false},{\"id\":168,\"year\":\"令和2年 第1回\",\"questionNumber\":11,\"field\":\"道路運送車両法\",\"majorField\":null,\"subField\":null,\"content\":\"道路運送車両法に定める検査等についての次の文中、A、B、C、Dに入るべき字句を下の枠内の選択肢（①〜⑥）から選び、解答用紙の該当する欄にマークしなさい。（※法改正により一部改変）\\n1. 登録を受けていない道路運送車両法第4条に規定する自動車又は同法第60条第1項の規定による車両番号の指定を受けていない検査対象軽自動車若しくは二輪の小型自動車を運行の用に供しようとするときは、当該自動車の使用者は、当該自動車を提示して、国土交通大臣の行う[ A ]を受けなければならない。\\n2. 登録自動車又は車両番号の指定を受けた検査対象軽自動車若しくは二輪の小型自動車の使用者は、自動車検査証の有効期間の満了後も当該自動車を使用しようとするときは、当該自動車を提示して、国土交通大臣の行う[ B ]を受けなければならない。この場合において、当該自動車の使用者は、当該自動車検査証を国土交通大臣に提出しなければならない。\\n3. 自動車の使用者は、自動車検査証記録事項について変更があったときは、法令で定める場合を除き、その事由があった日から[ C ]以内に、当該変更について、国土交通大臣が行う自動車検査証の変更記録を受けなければならない。\\n4. 国土交通大臣は、一定の地域に使用の本拠の位置を有する自動車の使用者が、天災その他やむを得ない事由により、[ D ]を受けることができないと認めるときは、当該地域に使用の本拠の位置を有する自動車の自動車検査証の有効期間を、期間を定めて伸長する旨を公示することができる。\",\"imageUrl\":\"/pdf_pages/R02.1_Q11.png\",\"sourceSheet\":\"R02.1_full.json\",\"knowledgeTags\":\"#自動車の登録・車検\",\"riskCategory\":null,\"situationCategory\":null,\"format\":\"SINGLE\",\"pdfUrl\":\"/data/R02.1.pdf\",\"pdfPage\":7,\"options\":[{\"id\":663,\"questionId\":168,\"optionNumber\":1,\"content\":\"1: 新規検査\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":664,\"questionId\":168,\"optionNumber\":2,\"content\":\"2: 継続検査\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":665,\"questionId\":168,\"optionNumber\":3,\"content\":\"3: 構造等変更検査\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":666,\"questionId\":168,\"optionNumber\":4,\"content\":\"4: 予備検査\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":667,\"questionId\":168,\"optionNumber\":5,\"content\":\"5: 15日\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":668,\"questionId\":168,\"optionNumber\":6,\"content\":\"6: 30日\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null}],\"explanation\":null,\"correctOptions\":[],\"attempts\":[],\"_count\":{\"attempts\":0},\"isDebated\":false,\"isBookmarked\":false},{\"id\":169,\"year\":\"令和2年 第1回\",\"questionNumber\":12,\"field\":\"道路運送車両法\",\"majorField\":null,\"subField\":null,\"content\":\"道路運送車両の保安基準及びその細目を定める告示についての次の記述のうち、誤っているものを1つ選び、解答用紙の該当する欄にマークしなさい。なお、解答にあたっては、各選択肢に記載されている事項以外は考慮しないものとする。\",\"imageUrl\":\"/pdf_pages/R02.1_Q12.png\",\"sourceSheet\":\"R02.1_full.json\",\"knowledgeTags\":\"#保安基準(寸法・重量・灯火)\",\"riskCategory\":null,\"situationCategory\":null,\"format\":\"SINGLE\",\"pdfUrl\":\"/data/R02.1.pdf\",\"pdfPage\":7,\"options\":[{\"id\":669,\"questionId\":169,\"optionNumber\":1,\"content\":\"1: 自動車の前面ガラス及び側面ガラス（告示で定める部分を除く。）は、フィルムが貼り付けられた場合、当該フィルムが貼り付けられた状態においても、透明であり、かつ、運転者が交通状況を確認するために必要な視野の範囲に係る部分における可視光線の透過率が60%以上であることが確保できるものでなければならない。\",\"isCorrect\":true,\"explanation\":null,\"structuredData\":null},{\"id\":670,\"questionId\":169,\"optionNumber\":2,\"content\":\"2: 貨物の運送の用に供する普通自動車であって、車両総重量が8トン以上又は最大積載量が5トン以上のものの原動機には、自動車が時速90キロメートルを超えて走行しないよう燃料の供給を調整し、かつ、自動車の速度の制御を円滑に行うことができるものとして、告示で定める基準に適合する速度抑制装置を備えなければならない。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":671,\"questionId\":169,\"optionNumber\":3,\"content\":\"3: 自動車の後面には、夜間にその後方150メートルの距離から走行用前照灯で照射した場合にその反射光を照射位置から確認できる赤色の後部反射器を備えなければならない。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":672,\"questionId\":169,\"optionNumber\":4,\"content\":\"4: 自動車は、告示で定める方法により測定した場合において、長さ（セミトレーラにあっては、連結装置中心から当該セミトレーラの後端までの水平距離）12メートル（セミトレーラのうち告示で定めるものにあっては、13メートル）、幅2.5メートル、高さ3.8メートルを超えてはならない。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null}],\"explanation\":null,\"correctOptions\":[],\"attempts\":[],\"_count\":{\"attempts\":0},\"isDebated\":false,\"isBookmarked\":false},{\"id\":170,\"year\":\"令和2年 第1回\",\"questionNumber\":13,\"field\":\"道路交通法\",\"majorField\":null,\"subField\":null,\"content\":\"道路交通法に定める車両の交通方法等についての次の記述のうち、誤っているものを1つ選び、解答用紙の該当する欄にマークしなさい。なお、解答にあたっては、各選択肢に記載されている事項以外は考慮しないものとする。\",\"imageUrl\":\"/pdf_pages/R02.1_Q13.png\",\"sourceSheet\":\"R02.1_full.json\",\"knowledgeTags\":null,\"riskCategory\":null,\"situationCategory\":null,\"format\":\"SINGLE\",\"pdfUrl\":\"/data/R02.1.pdf\",\"pdfPage\":8,\"options\":[{\"id\":673,\"questionId\":170,\"optionNumber\":1,\"content\":\"1: 車両は、車両通行帯の設けられた道路においては、道路の左側端から数えて1番目の車両通行帯を通行しなければならない。ただし、自動車（小型特殊自動車及び道路標識等によって指定された自動車を除く。）は、当該道路の左側部分（当該道路が一方通行となっているときは、当該道路）に3以上の車両通行帯が設けられているときは、政令で定めるところにより、その速度に応じ、その最も右側の車両通行帯以外の車両通行帯を通行することができる。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":674,\"questionId\":170,\"optionNumber\":2,\"content\":\"2: 車両等は、踏切を通過しようとするときは、踏切の直前（道路標識等による停止線が設けられているときは、その停止線の直前。以下同じ。）で停止し、かつ、安全であることを確認した後でなければ進行してはならない。ただし、信号機の表示する信号に従うときは、踏切の直前で停止しないで進行することができる。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":675,\"questionId\":170,\"optionNumber\":3,\"content\":\"3: 車両は、道路外の施設又は場所に出入するためやむを得ない場合において歩道等を横断するとき、又は法令の規定により歩道等で停車し、若しくは駐車するため必要な限度において歩道等を通行するときは、徐行しなければならない。\",\"isCorrect\":true,\"explanation\":null,\"structuredData\":null},{\"id\":676,\"questionId\":170,\"optionNumber\":4,\"content\":\"4: 貨物自動車運送事業の用に供する車両総重量8,500キログラムの自動車は、法令の規定によりその速度を減ずる場合及び危険を防止するためやむを得ない場合を除き、道路標識等により自動車の最低速度が指定されていない区間の高速自動車国道の本線車道（政令で定めるものを除く。）における最低速度は、時速50キロメートルである。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null}],\"explanation\":null,\"correctOptions\":[],\"attempts\":[],\"_count\":{\"attempts\":0},\"isDebated\":false,\"isBookmarked\":false},{\"id\":171,\"year\":\"令和2年 第1回\",\"questionNumber\":14,\"field\":\"道路交通法\",\"majorField\":null,\"subField\":null,\"content\":\"道路交通法に定める追越し等についての次の記述のうち、誤っているものを1つ選び、解答用紙の該当する欄にマークしなさい。なお、解答にあたっては、各選択肢に記載されている事項以外は考慮しないものとする。（※法改正により一部改変）\",\"imageUrl\":\"/pdf_pages/R02.1_Q14.png\",\"sourceSheet\":\"R02.1_full.json\",\"knowledgeTags\":\"#追い越し・交差点\",\"riskCategory\":null,\"situationCategory\":null,\"format\":\"SINGLE\",\"pdfUrl\":\"/data/R02.1.pdf\",\"pdfPage\":8,\"options\":[{\"id\":677,\"questionId\":171,\"optionNumber\":1,\"content\":\"1: 車両は、他の車両を追い越そうとするときは、その追い越されようとする車両（以下「前車」という。）の右側を通行しなければならない。ただし、法令の規定により追越しを禁止されていない場所において、前車が法令の規定により右折をするため道路の中央又は右側端に寄って通行しているときは、その左側を通行しなければならない。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":678,\"questionId\":171,\"optionNumber\":2,\"content\":\"2: 車両は、法令の規定若しくは警察官の命令により、又は危険を防止するため、停止し、若しくは停止しようとして徐行している車両等に追いついたときは、その前方にある車両等の側方を通過して当該車両等の前方に割り込み、又はその前方を横切ってはならない。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":679,\"questionId\":171,\"optionNumber\":3,\"content\":\"3: 車両は、法令に規定する優先道路を通行している場合における当該優先道路にある交差点を除き、交差点の手前の側端から前に30メートル以内の部分においては、他の車両（特定小型原動機付自転車及び軽車両を除く。）を追い越そうとするときは、速やかに進路を変更しなければならない。\",\"isCorrect\":true,\"explanation\":null,\"structuredData\":null},{\"id\":680,\"questionId\":171,\"optionNumber\":4,\"content\":\"4: 車両は、進路を変更した場合にその変更した後の進路と同一の進路を後方から進行してくる車両等の速度又は方向を急に変更させることとなるおそれがあるときは、進路を変更してはならない。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null}],\"explanation\":null,\"correctOptions\":[],\"attempts\":[],\"_count\":{\"attempts\":0},\"isDebated\":false,\"isBookmarked\":false},{\"id\":172,\"year\":\"令和2年 第1回\",\"questionNumber\":15,\"field\":\"道路交通法\",\"majorField\":null,\"subField\":null,\"content\":\"道路交通法及び道路交通法施行令に定める酒気帯び運転等の禁止等に関する次の文中、A、B、Cに入るべき字句としていずれか正しいものを1つ選び、解答用紙の該当する欄にマークしなさい。（※法改正により一部改変）\\n(1) 何人も、酒気を帯びて車両等を運転してはならない。\\n(2) 何人も、酒気を帯びている者で、(1)の規定に違反して車両等を運転することとなるおそれがあるものに対し、[ A ]してはならない。\\n(3) 何人も、(1)の規定に違反して車両等を運転することとなるおそれがある者に対し、酒類を提供し、又は飲酒をすすめてはならない。\\n(4) 何人も、車両（トロリーバス及び旅客自動車運送事業の用に供する自動車で当該業務に従事中のものその他の政令で定める自動車を除く。）の運転者が酒気を帯びていることを知りながら、当該運転者に対し、当該車両を運転して自己を運送することを要求し、又は依頼して、当該運転者が(1)の規定に違反して運転する[ B ]してはならない。\\n(5) (1)の規定に違反して車両等（自転車以外の軽車両を除く。）を運転した者で、その運転をした場合において身体に血液1ミリリットルにつき0.3ミリグラム又は呼気1リットルにつき[ C ]ミリグラム以上にアルコールを保有する状態にあったものは、3年以下の拘禁刑又は50万円以下の罰金に処する。\",\"imageUrl\":\"/pdf_pages/R02.1_Q15.png\",\"sourceSheet\":\"R02.1_full.json\",\"knowledgeTags\":\"#過労・酒気・過積載(禁止行為)\",\"riskCategory\":null,\"situationCategory\":null,\"format\":\"SINGLE\",\"pdfUrl\":\"/data/R02.1.pdf\",\"pdfPage\":9,\"options\":[{\"id\":681,\"questionId\":172,\"optionNumber\":1,\"content\":\"A①: 運転を指示\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":682,\"questionId\":172,\"optionNumber\":2,\"content\":\"A②: 車両等を提供\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":683,\"questionId\":172,\"optionNumber\":3,\"content\":\"B①: 車両に同乗\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":684,\"questionId\":172,\"optionNumber\":4,\"content\":\"B②: 機会を提供\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":685,\"questionId\":172,\"optionNumber\":5,\"content\":\"C①: 0.15\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":686,\"questionId\":172,\"optionNumber\":6,\"content\":\"C②: 0.25\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null}],\"explanation\":null,\"correctOptions\":[],\"attempts\":[],\"_count\":{\"attempts\":0},\"isDebated\":false,\"isBookmarked\":false},{\"id\":173,\"year\":\"令和2年 第1回\",\"questionNumber\":16,\"field\":\"道路交通法\",\"majorField\":null,\"subField\":null,\"content\":\"道路交通法に定める交差点等における通行方法についての次の記述のうち、誤っているものを1つ選び、解答用紙の該当する欄にマークしなさい。なお、解答にあたっては、各選択肢に記載されている事項以外は考慮しないものとする。\",\"imageUrl\":\"/pdf_pages/R02.1_Q16.png\",\"sourceSheet\":\"R02.1_full.json\",\"knowledgeTags\":\"#追い越し・交差点\",\"riskCategory\":null,\"situationCategory\":null,\"format\":\"SINGLE\",\"pdfUrl\":\"/data/R02.1.pdf\",\"pdfPage\":9,\"options\":[{\"id\":687,\"questionId\":173,\"optionNumber\":1,\"content\":\"1: 車両等（優先道路を通行している車両等を除く。）は、交通整理の行われていない交差点に入ろうとする場合において、交差道路が優先道路であるとき、又はその通行している道路の幅員よりも交差道路の幅員が明らかに広いものであるときは、その前方に出る前に必ず一時停止しなければならない。\",\"isCorrect\":true,\"explanation\":null,\"structuredData\":null},{\"id\":688,\"questionId\":173,\"optionNumber\":2,\"content\":\"2: 車両等は、交差点に入ろうとし、及び交差点内を通行するときは、当該交差点の状況に応じ、交差道路を通行する車両等、反対方向から進行してきて右折する車両等及び当該交差点又はその直近で道路を横断する歩行者に特に注意し、かつ、できる限り安全な速度と方法で進行しなければならない。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":689,\"questionId\":173,\"optionNumber\":3,\"content\":\"3: 車両は、左折するときは、あらかじめその前からできる限り道路の左側端に寄り、かつ、できる限り道路の左側端に沿って（道路標識等により通行すべき部分が指定されているときは、その指定された部分を通行して）徐行しなければならない。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":690,\"questionId\":173,\"optionNumber\":4,\"content\":\"4: 左折又は右折しようとする車両が、法令の規定により、それぞれ道路の左側端、中央又は右側端に寄ろうとして手又は方向指示器による合図をした場合においては、その後方にある車両は、その速度又は方向を急に変更しなければならないこととなる場合を除き、当該合図をした車両の進路の変更を妨げてはならない。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null}],\"explanation\":null,\"correctOptions\":[],\"attempts\":[],\"_count\":{\"attempts\":0},\"isDebated\":false,\"isBookmarked\":false},{\"id\":174,\"year\":\"令和2年 第1回\",\"questionNumber\":17,\"field\":\"道路交通法\",\"majorField\":null,\"subField\":null,\"content\":\"道路交通法に定める運転者及び使用者の義務等についての次の記述のうち、正しいものを2つ選び、解答用紙の該当する欄にマークしなさい。なお、解答にあたっては、各選択肢に記載されている事項以外は考慮しないものとする。\",\"imageUrl\":\"/pdf_pages/R02.1_Q17.png\",\"sourceSheet\":\"R02.1_full.json\",\"knowledgeTags\":null,\"riskCategory\":null,\"situationCategory\":null,\"format\":\"SINGLE\",\"pdfUrl\":\"/data/R02.1.pdf\",\"pdfPage\":10,\"options\":[{\"id\":691,\"questionId\":174,\"optionNumber\":1,\"content\":\"1: 免許を受けた者が自動車等を運転することが著しく道路における交通の危険を生じさせるおそれがあるときは、その者の住所地を管轄する公安委員会は、点数制度による処分に至らない場合であっても運転免許の停止処分を行うことができる。\",\"isCorrect\":true,\"explanation\":null,\"structuredData\":null},{\"id\":692,\"questionId\":174,\"optionNumber\":2,\"content\":\"2: 免許証の更新を受けようとする者で更新期間が満了する日における年齢が70歳以上のもの（当該講習を受ける必要がないものとして法令で定める者を除く。）は、更新期間が満了する日前6ヵ月以内にその者の住所地を管轄する公安委員会が行った「高齢者講習」を受けていなければならない。\",\"isCorrect\":true,\"explanation\":null,\"structuredData\":null},{\"id\":693,\"questionId\":174,\"optionNumber\":3,\"content\":\"3: 車両等は、横断歩道等に接近する場合には、当該横断歩道等によりその進路の前方を横断し、又は横断しようとする歩行者等があるときは、当該歩行者等の直前で停止することができるような速度で進行し、かつ、その通行を妨げないようにしなければならない。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":694,\"questionId\":174,\"optionNumber\":4,\"content\":\"4: 下の道路標識は、「車両は、8時から20時までの間は停車してはならない。」ことを示している。（※道路標識に関する解説省略）\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null}],\"explanation\":null,\"correctOptions\":[],\"attempts\":[],\"_count\":{\"attempts\":0},\"isDebated\":false,\"isBookmarked\":false},{\"id\":175,\"year\":\"令和2年 第1回\",\"questionNumber\":18,\"field\":\"労働基準法\",\"majorField\":null,\"subField\":null,\"content\":\"労働基準法の定めに関する次の記述のうち、正しいものを2つ選び、解答用紙の該当する欄にマークしなさい。なお、解答にあたっては、各選択肢に記載されている事項以外は考慮しないものとする。\",\"imageUrl\":\"/pdf_pages/R02.1_Q18.png\",\"sourceSheet\":\"R02.1_full.json\",\"knowledgeTags\":null,\"riskCategory\":null,\"situationCategory\":null,\"format\":\"SINGLE\",\"pdfUrl\":\"/data/R02.1.pdf\",\"pdfPage\":10,\"options\":[{\"id\":695,\"questionId\":175,\"optionNumber\":1,\"content\":\"1: 使用者は、労働者名簿、賃金台帳及び雇入、解雇、災害補償、賃金その他労働関係に関する重要な書類を1年間保存しなければならない。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":696,\"questionId\":175,\"optionNumber\":2,\"content\":\"2: 使用者は、労働者に、休憩時間を除き1週間について40時間を超えて、労働させてはならない。また、1週間の各日については、労働者に、休憩時間を除き1日について8時間を超えて、労働させてはならない。\",\"isCorrect\":true,\"explanation\":null,\"structuredData\":null},{\"id\":697,\"questionId\":175,\"optionNumber\":3,\"content\":\"3: 使用者は、労働時間が6時間を超える場合においては少なくとも45分、8時間を超える場合においては少なくとも1時間の休憩時間を労働時間の途中に与えなければならない。\",\"isCorrect\":true,\"explanation\":null,\"structuredData\":null},{\"id\":698,\"questionId\":175,\"optionNumber\":4,\"content\":\"4: 労働契約は、期間の定めのないものを除き、一定の事業の完了に必要な期間を定めるもののほかは、1年を超える期間について締結してはならない。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null}],\"explanation\":null,\"correctOptions\":[],\"attempts\":[],\"_count\":{\"attempts\":0},\"isDebated\":false,\"isBookmarked\":false},{\"id\":176,\"year\":\"令和2年 第1回\",\"questionNumber\":19,\"field\":\"労働基準法\",\"majorField\":null,\"subField\":null,\"content\":\"労働基準法及び労働安全衛生法の定める健康診断に関する次の記述のうち、誤っているものを1つ選び、解答用紙の該当する欄にマークしなさい。なお、解答にあたっては、各選択肢に記載されている事項以外は考慮しないものとする。\",\"imageUrl\":\"/pdf_pages/R02.1_Q19.png\",\"sourceSheet\":\"R02.1_full.json\",\"knowledgeTags\":\"#健康管理・疾病\",\"riskCategory\":null,\"situationCategory\":null,\"format\":\"SINGLE\",\"pdfUrl\":\"/data/R02.1.pdf\",\"pdfPage\":11,\"options\":[{\"id\":699,\"questionId\":176,\"optionNumber\":1,\"content\":\"1: 事業者は、常時使用する労働者を雇い入れるときは、当該労働者に対し、労働安全衛生規則に定める既往歴及び業務歴の調査等の項目について医師による健康診断を行わなければならない。ただし、医師による健康診断を受けた後、3ヵ月を経過しない者を雇い入れる場合において、その者が当該健康診断の結果を証明する書面を提出したときは、当該健康診断の項目に相当する項目については、この限りでない。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":700,\"questionId\":176,\"optionNumber\":2,\"content\":\"2: 事業者は、事業者が行う健康診断を受けた労働者に対し、遅滞なく、当該健康診断の結果を通知しなければならない。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":701,\"questionId\":176,\"optionNumber\":3,\"content\":\"3: 事業者は、深夜業を含む業務等に常時従事する労働者に対し、当該業務への配置替えの際及び6ヵ月以内ごとに1回、定期に、労働安全衛生規則に定める所定の項目について医師による健康診断を行わなければならない。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":702,\"questionId\":176,\"optionNumber\":4,\"content\":\"4: 事業者は、労働安全衛生規則で定めるところにより、深夜業に従事する労働者が、自ら受けた健康診断の結果を証明する書面を事業者に提出した場合において、その健康診断の結果（当該健康診断の項目に異常の所見があると診断された労働者に係るものに限る。）に基づく医師からの意見聴取は、当該健康診断の結果を証明する書面が事業者に提出された日から4ヵ月以内に行わなければならない。\",\"isCorrect\":true,\"explanation\":null,\"structuredData\":null}],\"explanation\":null,\"correctOptions\":[],\"attempts\":[],\"_count\":{\"attempts\":0},\"isDebated\":false,\"isBookmarked\":false},{\"id\":177,\"year\":\"令和2年 第1回\",\"questionNumber\":20,\"field\":\"労働基準法\",\"majorField\":null,\"subField\":null,\"content\":\"「自動車運転者の労働時間等の改善のための基準」（以下「改善基準告示」という。）に定める目的等についての次の文中、A、B、C、Dに入るべき字句としていずれか正しいものを1つ選び、解答用紙の該当する欄にマークしなさい。（※法改正により一部改変）\\n\\n1. この基準は、自動車運転者（労働基準法第9条に規定する労働者であって、四輪以上の自動車の運転の業務（厚生労働省労働基準局長が定めるものを除く。）に主として従事する者をいう。以下同じ。）の労働時間等の改善のための基準を定めることにより、自動車運転者の[ A ]等の労働条件の向上を図ることを目的とする。\\n\\n2. [ B ]は、この基準を理由として自動車運転者の労働条件を低下させてはならないことはもとより、その[ C ]に努めなければならない。\\n\\n3. 使用者及び労働者の過半数で組織する労働組合又は労働者の過半数を代表する者は、[ D ]、又は休日に労働させるための時間外・休日労働協定をする場合において、改善基準告示に定める所定の事項に十分留意しなければならない。\",\"imageUrl\":\"/pdf_pages/R02.1_Q20.png\",\"sourceSheet\":\"R02.1_full.json\",\"knowledgeTags\":\"#改善基準(拘束・休息),#労働契約・休日\",\"riskCategory\":null,\"situationCategory\":null,\"format\":\"MULTI_GROUP\",\"pdfUrl\":\"/data/R02.1.pdf\",\"pdfPage\":11,\"options\":[{\"id\":1335,\"questionId\":177,\"optionNumber\":1,\"content\":\"1 : ① A:\",\"isCorrect\":true,\"explanation\":null,\"structuredData\":\"{\\\"title\\\":\\\"1\\\",\\\"choices\\\":[{\\\"num\\\":1,\\\"text\\\":\\\"A:\\\"},{\\\"num\\\":2,\\\"text\\\":\\\"労働時間\\\"},{\\\"num\\\":3,\\\"text\\\":\\\"運転時間\\\"}]}\"},{\"id\":1336,\"questionId\":177,\"optionNumber\":2,\"content\":\"1 : ② 労働時間\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":\"{\\\"title\\\":\\\"1\\\",\\\"choices\\\":[{\\\"num\\\":1,\\\"text\\\":\\\"A:\\\"},{\\\"num\\\":2,\\\"text\\\":\\\"労働時間\\\"},{\\\"num\\\":3,\\\"text\\\":\\\"運転時間\\\"}]}\"},{\"id\":1337,\"questionId\":177,\"optionNumber\":3,\"content\":\"1 : ② 運転時間\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":\"{\\\"title\\\":\\\"1\\\",\\\"choices\\\":[{\\\"num\\\":1,\\\"text\\\":\\\"A:\\\"},{\\\"num\\\":2,\\\"text\\\":\\\"労働時間\\\"},{\\\"num\\\":3,\\\"text\\\":\\\"運転時間\\\"}]}\"},{\"id\":1338,\"questionId\":177,\"optionNumber\":4,\"content\":\"2 : ① B:\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":\"{\\\"title\\\":\\\"2\\\",\\\"choices\\\":[{\\\"num\\\":1,\\\"text\\\":\\\"B:\\\"},{\\\"num\\\":2,\\\"text\\\":\\\"使用者\\\"},{\\\"num\\\":3,\\\"text\\\":\\\"労働関係の当事者\\\"}]}\"},{\"id\":1339,\"questionId\":177,\"optionNumber\":5,\"content\":\"2 : ② 使用者\",\"isCorrect\":true,\"explanation\":null,\"structuredData\":\"{\\\"title\\\":\\\"2\\\",\\\"choices\\\":[{\\\"num\\\":1,\\\"text\\\":\\\"B:\\\"},{\\\"num\\\":2,\\\"text\\\":\\\"使用者\\\"},{\\\"num\\\":3,\\\"text\\\":\\\"労働関係の当事者\\\"}]}\"},{\"id\":1340,\"questionId\":177,\"optionNumber\":6,\"content\":\"2 : ② 労働関係の当事者\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":\"{\\\"title\\\":\\\"2\\\",\\\"choices\\\":[{\\\"num\\\":1,\\\"text\\\":\\\"B:\\\"},{\\\"num\\\":2,\\\"text\\\":\\\"使用者\\\"},{\\\"num\\\":3,\\\"text\\\":\\\"労働関係の当事者\\\"}]}\"},{\"id\":1341,\"questionId\":177,\"optionNumber\":7,\"content\":\"3 : ① C:\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":\"{\\\"title\\\":\\\"3\\\",\\\"choices\\\":[{\\\"num\\\":1,\\\"text\\\":\\\"C:\\\"},{\\\"num\\\":2,\\\"text\\\":\\\"維持\\\"},{\\\"num\\\":3,\\\"text\\\":\\\"向上\\\"}]}\"},{\"id\":1342,\"questionId\":177,\"optionNumber\":8,\"content\":\"3 : ② 維持\",\"isCorrect\":true,\"explanation\":null,\"structuredData\":\"{\\\"title\\\":\\\"3\\\",\\\"choices\\\":[{\\\"num\\\":1,\\\"text\\\":\\\"C:\\\"},{\\\"num\\\":2,\\\"text\\\":\\\"維持\\\"},{\\\"num\\\":3,\\\"text\\\":\\\"向上\\\"}]}\"},{\"id\":1343,\"questionId\":177,\"optionNumber\":9,\"content\":\"3 : ② 向上\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":\"{\\\"title\\\":\\\"3\\\",\\\"choices\\\":[{\\\"num\\\":1,\\\"text\\\":\\\"C:\\\"},{\\\"num\\\":2,\\\"text\\\":\\\"維持\\\"},{\\\"num\\\":3,\\\"text\\\":\\\"向上\\\"}]}\"},{\"id\":1344,\"questionId\":177,\"optionNumber\":10,\"content\":\"4 : ① D:\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":\"{\\\"title\\\":\\\"4\\\",\\\"choices\\\":[{\\\"num\\\":1,\\\"text\\\":\\\"D:\\\"},{\\\"num\\\":2,\\\"text\\\":\\\"休息期間を短縮し\\\"},{\\\"num\\\":3,\\\"text\\\":\\\"労働時間を延長し\\\"}]}\"},{\"id\":1345,\"questionId\":177,\"optionNumber\":11,\"content\":\"4 : ② 休息期間を短縮し\",\"isCorrect\":true,\"explanation\":null,\"structuredData\":\"{\\\"title\\\":\\\"4\\\",\\\"choices\\\":[{\\\"num\\\":1,\\\"text\\\":\\\"D:\\\"},{\\\"num\\\":2,\\\"text\\\":\\\"休息期間を短縮し\\\"},{\\\"num\\\":3,\\\"text\\\":\\\"労働時間を延長し\\\"}]}\"},{\"id\":1346,\"questionId\":177,\"optionNumber\":12,\"content\":\"4 : ② 労働時間を延長し\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":\"{\\\"title\\\":\\\"4\\\",\\\"choices\\\":[{\\\"num\\\":1,\\\"text\\\":\\\"D:\\\"},{\\\"num\\\":2,\\\"text\\\":\\\"休息期間を短縮し\\\"},{\\\"num\\\":3,\\\"text\\\":\\\"労働時間を延長し\\\"}]}\"}],\"explanation\":null,\"correctOptions\":[],\"attempts\":[],\"_count\":{\"attempts\":0},\"isDebated\":false,\"isBookmarked\":false},{\"id\":178,\"year\":\"令和2年 第1回\",\"questionNumber\":21,\"field\":\"労働基準法\",\"majorField\":null,\"subField\":null,\"content\":\"「自動車運転者の労働時間等の改善のための基準」（以下「改善基準告示」という。）に定める貨物自動車運送事業に従事する自動車運転者（以下「トラック運転者」という。）の拘束時間等に関する次の記述のうち、正しいものを2つ選び、解答用紙の該当する欄にマークしなさい。なお、解答にあたっては、各選択肢に記載されている事項以外は考慮しないものとする。（※法改正により一部改変）\",\"imageUrl\":\"/pdf_pages/R02.1_Q21.png\",\"sourceSheet\":\"R02.1_full.json\",\"knowledgeTags\":\"#改善基準(拘束・休息)\",\"riskCategory\":null,\"situationCategory\":null,\"format\":\"SINGLE\",\"pdfUrl\":\"/data/R02.1.pdf\",\"pdfPage\":12,\"options\":[{\"id\":707,\"questionId\":178,\"optionNumber\":1,\"content\":\"1: トラック運転者の拘束時間は、1ヵ月について284時間を超えず、かつ、1年について3,300時間を超えないものとすること。ただし、労使協定により、1年について6ヵ月までは、1ヵ月について310時間まで延長することができ、かつ、1年について3,400時間まで延長することができるものとする。\",\"isCorrect\":true,\"explanation\":null,\"structuredData\":null},{\"id\":708,\"questionId\":178,\"optionNumber\":2,\"content\":\"2: トラック運転者の1日（始業時刻から起算して24時間をいう。以下同じ。）についての拘束時間は、13時間を超えないものとし、当該拘束時間を延長する場合であっても、最大拘束時間は15時間とすること。ただし、1週間における運行が全て長距離貨物運送であり、かつ、一の運行における休息期間が、当該トラック運転者の住所地以外の場所におけるものである場合においては、当該1週間について3回に限り最大拘束時間を16時間とすることができる。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":709,\"questionId\":178,\"optionNumber\":3,\"content\":\"3: 業務の必要上やむを得ない場合には、当分の間、2暦日についての拘束時間が21時間を超えず、かつ、勤務終了後、継続20時間以上の休息期間を与える場合に限り、トラック運転者を隔日勤務に就かせることができる。\",\"isCorrect\":true,\"explanation\":null,\"structuredData\":null},{\"id\":710,\"questionId\":178,\"optionNumber\":4,\"content\":\"4: 業務の必要上、トラック運転者に勤務の終了後継続9時間（改善基準告示第4条第1項第3号ただし書に該当する場合は継続8時間）以上の休息期間を与えることが困難な場合、当分の間、一定期間における全勤務回数の2分の1を限度に、休息期間を拘束時間の途中及び拘束時間の経過直後に分割して与えることができる。この場合において、分割された休息期間は、1回当たり継続2時間以上とし、2分割又は3分割とする。また、1日において、2分割の場合は合計10時間以上、3分割の場合は合計12時間以上の休息期間を与えなければならない。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null}],\"explanation\":null,\"correctOptions\":[],\"attempts\":[],\"_count\":{\"attempts\":0},\"isDebated\":false,\"isBookmarked\":false},{\"id\":179,\"year\":\"令和2年 第1回\",\"questionNumber\":22,\"field\":\"労働基準法\",\"majorField\":null,\"subField\":null,\"content\":\"下図は、貨物自動車運送事業に従事する自動車運転者の3日間の勤務状況の例を示したものであるが、「自動車運転者の労働時間等の改善のための基準」（以下「改善基準告示」という。）に定める拘束時間及び連続運転時間に関する次の記述のうち、正しいものを2つ選び、解答用紙の該当する欄にマークしなさい。（※法改正により一部改変）\\n[図表省略]\\n（注）「高速自動車国道のサービスエリア等に駐車又は停車できないため、やむを得ず連続運転時間を延長できる場合」には該当しないものとする。\",\"imageUrl\":\"/pdf_pages/R02.1_Q22.png\",\"sourceSheet\":\"R02.1_full.json\",\"knowledgeTags\":\"#駐停車禁止ルール,#改善基準(拘束・休息)\",\"riskCategory\":null,\"situationCategory\":\"#表・グラフ\",\"format\":\"SINGLE\",\"pdfUrl\":\"/data/R02.1.pdf\",\"pdfPage\":13,\"options\":[{\"id\":711,\"questionId\":179,\"optionNumber\":1,\"content\":\"1: 各日の拘束時間は、1日目は12時間10分、2日目は12時間5分、3日目は12時間20分である。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":712,\"questionId\":179,\"optionNumber\":2,\"content\":\"2: 各日の拘束時間は、1日目は13時間40分、2日目は12時間5分、3日目は12時間20分である。\",\"isCorrect\":true,\"explanation\":null,\"structuredData\":null},{\"id\":713,\"questionId\":179,\"optionNumber\":3,\"content\":\"3: 連続運転時間が改善基準告示に違反している勤務日は、1日目及び3日目であり、2日目は違反していない。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":714,\"questionId\":179,\"optionNumber\":4,\"content\":\"4: 連続運転時間が改善基準告示に違反している勤務日は、1日目及び2日目であり、3日目は違反していない。\",\"isCorrect\":true,\"explanation\":null,\"structuredData\":null}],\"explanation\":null,\"correctOptions\":[],\"attempts\":[],\"_count\":{\"attempts\":0},\"isDebated\":false,\"isBookmarked\":false},{\"id\":180,\"year\":\"令和2年 第1回\",\"questionNumber\":23,\"field\":\"労働基準法\",\"majorField\":null,\"subField\":null,\"content\":\"下表は、貨物自動車運送事業に従事する自動車運転者の1ヵ月の勤務状況の例を示したものであるが、「自動車運転者の労働時間等の改善のための基準」に定める拘束時間（拘束時間が14時間を超える1週間の回数についての目安を含む。）及び運転時間等に照らし、次の1～4の中から違反している事項をすべて選び、解答用紙の該当する欄にマークしなさい。なお、1人乗務とし、「1ヵ月についての拘束時間の延長に関する労使協定」があり、下表の1ヵ月は、当該協定により1ヵ月についての拘束時間を延長することができる月に該当するものとする。「時間外労働及び休日労働に関する労働協定」があるものとする。（※法改正により一部改変）\\n[表省略]\\n（注1）2週間の起算日は1日とする。\\n（注2）各労働日の始業時刻は午前8時とする。\\n※いずれの週においても、宿泊を伴う長距離貨物運送（1週間における運行が全て長距離貨物運送であり、かつ、一の運行における休息期間が、運転者の住所地以外の場所になる場合）には該当しないものとする。\",\"imageUrl\":\"/pdf_pages/R02.1_Q23.png\",\"sourceSheet\":\"R02.1_full.json\",\"knowledgeTags\":\"#改善基準(拘束・休息),#労働契約・休日\",\"riskCategory\":null,\"situationCategory\":\"#表・グラフ\",\"format\":\"SINGLE\",\"pdfUrl\":\"/data/R02.1.pdf\",\"pdfPage\":14,\"options\":[{\"id\":715,\"questionId\":180,\"optionNumber\":1,\"content\":\"1: 1日についての最大拘束時間\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":716,\"questionId\":180,\"optionNumber\":2,\"content\":\"2: 当該5週間のすべての日を特定日とした2日を平均した1日当たりの運転時間\",\"isCorrect\":true,\"explanation\":null,\"structuredData\":null},{\"id\":717,\"questionId\":180,\"optionNumber\":3,\"content\":\"3: 1日を起算日とし、2週間を平均した1週間当たりの運転時間\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":718,\"questionId\":180,\"optionNumber\":4,\"content\":\"4: 1日についての拘束時間が14時間を超える1週間の回数\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null}],\"explanation\":null,\"correctOptions\":[],\"attempts\":[],\"_count\":{\"attempts\":0},\"isDebated\":false,\"isBookmarked\":false},{\"id\":181,\"year\":\"令和2年 第1回\",\"questionNumber\":24,\"field\":\"実務上の知識及び能力\",\"majorField\":null,\"subField\":null,\"content\":\"運行管理者の日常業務の記録等に関する次の記述のうち、適切なものには解答用紙の「適」の欄に、適切でないものには解答用紙の「不適」の欄にマークしなさい。なお、解答にあたっては、各選択肢に記載されている事項以外は考慮しないものとする。（※法改正により一部改変）\",\"imageUrl\":\"/pdf_pages/R02.1_Q24.png\",\"sourceSheet\":\"R02.1_full.json\",\"knowledgeTags\":null,\"riskCategory\":null,\"situationCategory\":null,\"format\":\"SINGLE\",\"pdfUrl\":\"/data/R02.1.pdf\",\"pdfPage\":15,\"options\":[{\"id\":719,\"questionId\":181,\"optionNumber\":1,\"content\":\"1: 運行管理者は、事業用自動車の運転者が他の営業所に転出し当該営業所の運転者でなくなったときは、直ちに、運転者等台帳に運転者でなくなった年月日及び理由を記載して1年間保存している。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":720,\"questionId\":181,\"optionNumber\":2,\"content\":\"2: 運行管理者は、運行記録計により記録される「瞬間速度」、「運行距離」及び「運行時間」等により運転者の運行の実態や車両の運行の実態を分析し、運転者の日常の乗務を把握し、過労運転の防止及び運行の適正化を図る資料として活用しており、この運行記録計の記録を1年間保存している。\",\"isCorrect\":true,\"explanation\":null,\"structuredData\":null},{\"id\":721,\"questionId\":181,\"optionNumber\":3,\"content\":\"3: 運行管理者は、事業用自動車の運転者に対し、事業用自動車の構造上の特性、貨物の正しい積載方法など事業用自動車の運行の安全を確保するために必要な運転の技術及び自動車の運転に関して遵守すべき事項等について、適切に指導を行うとともに、その内容等について記録し、かつ、その記録を営業所において1年間保存している。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":722,\"questionId\":181,\"optionNumber\":4,\"content\":\"4: 運行管理者は、事業用自動車の運転者に対する業務前点呼において、酒気帯びの有無については、目視等で確認するほか、アルコール検知器を用いて確認するとともに、点呼を行った旨並びに報告及び指示の内容等を記録し、かつ、その記録を1年間保存している。\",\"isCorrect\":true,\"explanation\":null,\"structuredData\":null}],\"explanation\":null,\"correctOptions\":[],\"attempts\":[],\"_count\":{\"attempts\":0},\"isDebated\":false,\"isBookmarked\":false},{\"id\":182,\"year\":\"令和2年 第1回\",\"questionNumber\":25,\"field\":\"実務上の知識及び能力\",\"majorField\":null,\"subField\":null,\"content\":\"一般貨物自動車運送事業者が事業用自動車の運転者に対して行う指導・監督に関する次の記述のうち、適切なものをすべて選び、解答用紙の該当する欄にマークしなさい。なお、解答にあたっては、各選択肢に記載されている事項以外は考慮しないものとする。\",\"imageUrl\":\"/pdf_pages/R02.1_Q25.png\",\"sourceSheet\":\"R02.1_full.json\",\"knowledgeTags\":null,\"riskCategory\":null,\"situationCategory\":null,\"format\":\"SINGLE\",\"pdfUrl\":\"/data/R02.1.pdf\",\"pdfPage\":15,\"options\":[{\"id\":723,\"questionId\":182,\"optionNumber\":1,\"content\":\"1: 車長が長い自動車は、①内輪差が大きく、左折時に左側方のバイクや歩行者を巻き込んでしまう、②狭い道路への左折時には、車体がふくらみ、センターラインをはみ出してしまう、③右折時には、車体後部のオーバーハング部が隣接する車線へはみ出して車体後部が後続車に接触する、などの事故の要因となり得る危険性を有していることを運転者に対し指導している。\",\"isCorrect\":true,\"explanation\":null,\"structuredData\":null},{\"id\":724,\"questionId\":182,\"optionNumber\":2,\"content\":\"2: 鉄道車両など関係法令の制限を超えた積載物を運搬する場合は、関係当局から発行された許可証を携行するとともに、許可の際に付された通行経路・通行時間等の条件を遵守し、運送するよう指導している。また、運行前には、必ず、通行経路の事前情報を入手し、許可された経路の道路状況を確認するよう指導している。\",\"isCorrect\":true,\"explanation\":null,\"structuredData\":null},{\"id\":725,\"questionId\":182,\"optionNumber\":3,\"content\":\"3: 国土交通大臣が認定する適性診断（以下「適性診断」という。）を受診した運転者の診断結果において、「感情の安定性」の項目で、「すぐかっとするなど衝動的な傾向」との判定が出た。適性診断は、性格等を客観的に把握し、運転の適性を判定することにより、運転業務に適さない者を選任しないようにするためのものであるため、運行管理者は、当該運転者は運転業務に適さないと判断し、他の業務へ配置替えを行った。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":726,\"questionId\":182,\"optionNumber\":4,\"content\":\"4: 飲酒により体内に摂取されたアルコールを処理するために必要な時間の目安については、個人差はあるが、例えばチューハイ350ミリリットル（アルコール7%）の場合、概ね2時間とされている。事業者は、これらを参考に、社内教育の中で酒気帯び運転防止の観点から飲酒が運転に及ぼす影響等について指導している。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null}],\"explanation\":null,\"correctOptions\":[],\"attempts\":[],\"_count\":{\"attempts\":0},\"isDebated\":false,\"isBookmarked\":false},{\"id\":183,\"year\":\"令和2年 第1回\",\"questionNumber\":26,\"field\":\"実務上の知識及び能力\",\"majorField\":null,\"subField\":null,\"content\":\"事業用自動車の運転者の健康管理及び就業における判断・対処に関する次の記述のうち、適切なものには解答用紙の「適」の欄に、適切でないものには解答用紙の「不適」の欄にマークしなさい。なお、解答にあたっては、各選択肢に記載されている事項以外は考慮しないものとする。\",\"imageUrl\":\"/pdf_pages/R02.1_Q26.png\",\"sourceSheet\":\"R02.1_full.json\",\"knowledgeTags\":null,\"riskCategory\":null,\"situationCategory\":null,\"format\":\"SINGLE\",\"pdfUrl\":\"/data/R02.1.pdf\",\"pdfPage\":16,\"options\":[{\"id\":727,\"questionId\":183,\"optionNumber\":1,\"content\":\"1: 自動車の運転中に、心臓疾患（心筋梗塞、心不全等）や、大血管疾患（急性大動脈解離、大動脈瘤破裂等）が起こると、ショック状態、意識障害、心停止等を生じ、運転者が事故を回避するための行動をとることができなくなり、重大事故を引き起こすおそれがある。そのため、健康起因事故を防止するためにも発症する前の早期発見や予防が重要となってくる。\",\"isCorrect\":true,\"explanation\":null,\"structuredData\":null},{\"id\":728,\"questionId\":183,\"optionNumber\":2,\"content\":\"2: 事業者は、業務に従事する運転者に対し法令で定める健康診断を受診させ、その結果に基づいて健康診断個人票を作成して5年間保存している。また、運転者が自ら受けた健康診断の結果を提出したものについても同様に保存している。\",\"isCorrect\":true,\"explanation\":null,\"structuredData\":null},{\"id\":729,\"questionId\":183,\"optionNumber\":3,\"content\":\"3: 自動車事故報告規則に基づく平成29年中のすべての事業用自動車の乗務員に起因する重大事故報告件数約2,000件の中で、健康起因による事故件数は約300件を占めている。そのうち運転者が死亡に至った事案は60件あり、原因病名別にみると、心臓疾患が半数以上を占めている。\",\"isCorrect\":true,\"explanation\":null,\"structuredData\":null},{\"id\":730,\"questionId\":183,\"optionNumber\":4,\"content\":\"4: 睡眠時無呼吸症候群（SAS）は、大きないびきや昼間の強い眠気など容易に自覚症状を感じやすいので、事業者は、自覚症状を感じていると自己申告をした運転者に限定して、SASスクリーニング検査を実施している。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null}],\"explanation\":null,\"correctOptions\":[],\"attempts\":[],\"_count\":{\"attempts\":0},\"isDebated\":false,\"isBookmarked\":false},{\"id\":184,\"year\":\"令和2年 第1回\",\"questionNumber\":27,\"field\":\"実務上の知識及び能力\",\"majorField\":null,\"subField\":null,\"content\":\"自動車の運転に関する次の記述のうち、適切なものには解答用紙の「適」の欄に、適切でないものには解答用紙の「不適」の欄にマークしなさい。なお、解答にあたっては、各選択肢に記載されている事項以外は考慮しないものとする。\",\"imageUrl\":\"/pdf_pages/R02.1_Q27.png\",\"sourceSheet\":\"R02.1_full.json\",\"knowledgeTags\":null,\"riskCategory\":null,\"situationCategory\":null,\"format\":\"SINGLE\",\"pdfUrl\":\"/data/R02.1.pdf\",\"pdfPage\":16,\"options\":[{\"id\":731,\"questionId\":184,\"optionNumber\":1,\"content\":\"1: 四輪車を運転する場合、二輪車との衝突事故を防止するための注意点として、①二輪車は死角に入りやすいため、その存在に気づきにくく、また、②二輪車は速度が実際より速く感じたり、距離が近くに見えたりする特性がある。したがって、運転者に対してこのような点に注意するよう指導する必要がある。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":732,\"questionId\":184,\"optionNumber\":2,\"content\":\"2: アンチロック・ブレーキシステム（ABS）は、急ブレーキをかけた時などにタイヤがロック（回転が止まること）するのを防ぐことにより、車両の進行方向の安定性を保ち、また、ハンドル操作で障害物を回避できる可能性を高める装置である。ABSを効果的に作動させるためには、できるだけ強くブレーキペダルを踏み続けることが重要であり、この点を運転者に指導する必要がある。\",\"isCorrect\":true,\"explanation\":null,\"structuredData\":null},{\"id\":733,\"questionId\":184,\"optionNumber\":3,\"content\":\"3: バン型トラックの後方は、ほとんど死角となって見えない状態となることから、後退時の事故の要因となることがある。その対策として、バックアイカメラを装着して、死角を大きく減少させることができるが、その使用にあたっては、バックアイカメラにも限界があり、過信しないよう運転者に指導する必要がある。\",\"isCorrect\":true,\"explanation\":null,\"structuredData\":null},{\"id\":734,\"questionId\":184,\"optionNumber\":4,\"content\":\"4: 車両の重量が重い自動車は、スピードを出すことにより、カーブでの遠心力が大きくなるため横転などの危険性が高くなり、また、制動距離が長くなるため追突の危険性も高くなる。このため、法定速度を遵守し、十分な車間距離を保つことを運転者に指導する必要がある。\",\"isCorrect\":true,\"explanation\":null,\"structuredData\":null}],\"explanation\":null,\"correctOptions\":[],\"attempts\":[],\"_count\":{\"attempts\":0},\"isDebated\":false,\"isBookmarked\":false},{\"id\":185,\"year\":\"令和2年 第1回\",\"questionNumber\":28,\"field\":\"実務上の知識及び能力\",\"majorField\":null,\"subField\":null,\"content\":\"高速自動車国道において、A自動車（車両総重量8トンの事業用トラック）が前方のB自動車とともにほぼ同じ速度で50メートルの車間距離を保ちながらB自動車に追従して走行していたところ、突然、前方のB自動車が急ブレーキをかけたのを認め、A自動車も直ちに急ブレーキをかけ、A自動車、B自動車とも停止した。A自動車、B自動車とも安全を確認した後、走行を開始した。この運行に関する次のア～ウについて解答しなさい。\\nなお、下図は、A自動車に備えられたデジタル式運行記録計で上記運行に関して記録された6分間記録図表の一部を示す。\\n[図表省略]\\nア　上の記録図表からA自動車の急ブレーキを操作する直前の速度を読み取ったうえで、当該速度における空走距離（危険認知から、その状況を判断してブレーキを操作するという動作に至る間（空走時間）に自動車が走行した距離）を求めるとおよそ何メートルか。次の①～②の中から正しいものを1つ選び、解答用紙の該当する欄にマークしなさい。なお、この場合の空走時間は1秒間とする。\\nイ　A自動車の急ブレーキを操作する直前の速度における制動距離（ブレーキが実際に効き始めてから止まるまでに走行した距離）を40メートルとした場合、A自動車が危険を認知してから停止するまでに走行した距離は、およそ何メートルか。次の①～②の中から正しいものを1つ選び、解答用紙の該当する欄にマークしなさい。なお、この場合の空走時間は1秒間とする。\\nウ　B自動車が急ブレーキをかけA自動車、B自動車とも停止した際の、A自動車とB自動車の車間距離は、およそ何メートルか。次の①～②の中から正しいものを1つ選び、解答用紙の該当する欄にマークしなさい。なお、この場合において、A自動車の制動距離及び空走時間は上記イに示すとおりであり、また、B自動車の制動距離は35メートルとする。\",\"imageUrl\":\"/pdf_pages/R02.1_Q28.png\",\"sourceSheet\":\"R02.1_full.json\",\"knowledgeTags\":null,\"riskCategory\":null,\"situationCategory\":\"#乗務記録・タコグラフ,#表・グラフ,#距離・速度計算\",\"format\":\"MULTI_GROUP\",\"pdfUrl\":\"/data/R02.1.pdf\",\"pdfPage\":17,\"options\":[{\"id\":1347,\"questionId\":185,\"optionNumber\":1,\"content\":\"1 : ① ア:\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":\"{\\\"title\\\":\\\"1\\\",\\\"choices\\\":[{\\\"num\\\":1,\\\"text\\\":\\\"ア:\\\"},{\\\"num\\\":2,\\\"text\\\":\\\"15メートル\\\"},{\\\"num\\\":3,\\\"text\\\":\\\"20メートル\\\"}]}\"},{\"id\":1348,\"questionId\":185,\"optionNumber\":2,\"content\":\"1 : ② 15メートル\",\"isCorrect\":true,\"explanation\":null,\"structuredData\":\"{\\\"title\\\":\\\"1\\\",\\\"choices\\\":[{\\\"num\\\":1,\\\"text\\\":\\\"ア:\\\"},{\\\"num\\\":2,\\\"text\\\":\\\"15メートル\\\"},{\\\"num\\\":3,\\\"text\\\":\\\"20メートル\\\"}]}\"},{\"id\":1349,\"questionId\":185,\"optionNumber\":3,\"content\":\"1 : ② 20メートル\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":\"{\\\"title\\\":\\\"1\\\",\\\"choices\\\":[{\\\"num\\\":1,\\\"text\\\":\\\"ア:\\\"},{\\\"num\\\":2,\\\"text\\\":\\\"15メートル\\\"},{\\\"num\\\":3,\\\"text\\\":\\\"20メートル\\\"}]}\"},{\"id\":1350,\"questionId\":185,\"optionNumber\":4,\"content\":\"2 : ① イ:\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":\"{\\\"title\\\":\\\"2\\\",\\\"choices\\\":[{\\\"num\\\":1,\\\"text\\\":\\\"イ:\\\"},{\\\"num\\\":2,\\\"text\ \nこの事業用自動車の運行に関する次のア～ウについて解答しなさい。なお、解答にあたっては、「当日の運行計画」及び各選択肢に記載されている事項以外は考慮しないものとする。（※法改正により一部改変）\\n\\n「当日の運行計画」\\n往路\\n○ A営業所を出庫し、30キロメートル離れたB地点まで平均時速30キロメートルで走行する。\\n○ B地点にて20分間の荷積みを行う。\\n○ B地点から165キロメートル離れたC地点までの間、一部高速自動車国道を利用し、平均時速55キロメートルで走行して、C地点に12時に到着する。1時間の休憩後、15分間の荷下ろしを行う。\\n\\n復路\\n○ C地点にて15分間の荷積みを行い、13時30分に出発し、60キロメートル離れたD地点まで平均時速30キロメートルで走行する。D地点で30分間の休憩をとる。\\n○ 休憩後、D地点からE地点まで平均時速25キロメートルで走行して、E地点に18時に到着し、20分間の荷下ろしを行う。\\n○ E地点から20キロメートル離れたA営業所まで平均時速30キロメートルで走行し、19時に帰庫する。\\n[図表省略]\\n（注）「高速自動車国道のサービスエリア等に駐車又は停車できないため、やむを得ず連続運転時間を延長できる場合」には該当しないものとする。\\n\\nア　C地点に12時に到着させるためにふさわしいA営業所の出庫時刻[ ア ]について、次の①～④の中から正しいものを1つ選び、解答用紙の該当する欄にマークしなさい。\\nイ　D地点とE地点間の距離[ イ ]について、次の①～④の中から正しいものを1つ選び、解答用紙の該当する欄にマークしなさい。\\nウ　当日の全運行において、連続運転時間は「自動車運転者の労働時間等の改善のための基準」に照らし、違反しているか否かについて、次の①～②の中から正しいものを1つ選び、解答用紙の該当する欄にマークしなさい。\",\"imageUrl\":\"/pdf_pages/R02.1_Q29.png\",\"sourceSheet\":\"R02.1_full.json\",\"knowledgeTags\":\"#駐停車禁止ルール,#改善基準(拘束・休息)\",\"riskCategory\":null,\"situationCategory\":\"#表・グラフ\",\"format\":\"MULTI_GROUP\",\"pdfUrl\":\"/data/R02.1.pdf\",\"pdfPage\":18,\"options\":[{\"id\":1356,\"questionId\":186,\"optionNumber\":1,\"content\":\"1 : ① ア:\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":\"{\\\"title\\\":\\\"1\\\",\\\"choices\\\":[{\\\"num\\\":1,\\\"text\\\":\\\"ア:\\\"},{\\\"num\\\":2,\\\"text\\\":\\\"7時00分\\\"},{\\\"num\\\":3,\\\"text\\\":\\\"7時20分\\\"},{\\\"num\\\":4,\\\"text\\\":\\\"7時40分\\\"},{\\\"num\\\":5,\\\"text\\\":\\\"8時00分\\\"}]}\"},{\"id\":1357,\"questionId\":186,\"optionNumber\":2,\"content\":\"1 : ② 7時00分\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":\"{\\\"title\\\":\\\"1\\\",\\\"choices\\\":[{\\\"num\\\":1,\\\"text\\\":\\\"ア:\\\"},{\\\"num\\\":2,\\\"text\\\":\\\"7時00分\\\"},{\\\"num\\\":3,\\\"text\\\":\\\"7時20分\\\"},{\\\"num\\\":4,\\\"text\\\":\\\"7時40分\\\"},{\\\"num\\\":5,\\\"text\\\":\\\"8時00分\\\"}]}\"},{\"id\":1358,\"questionId\":186,\"optionNumber\":3,\"content\":\"1 : ② 7時20分\",\"isCorrect\":true,\"explanation\"
