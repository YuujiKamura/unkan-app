":null,\"structuredData\":null},{\"id\":1517,\"questionId\":333,\"optionNumber\":4,\"content\":\"2 日を平均し 1 日当たりの運転時間は、改善基準告示に違反している。\",\"isCorrect\":true,\"explanation\":null,\"structuredData\":null}],\"explanation\":{\"id\":115,\"questionId\":333,\"content\":\"$40\",\"isDebated\":true},\"correctOptions\":[],\"attempts\":[],\"_count\":{\"attempts\":0},\"isDebated\":false,\"isBookmarked\":false},{\"id\":334,\"year\":\"令和4年 (CBT)\",\"questionNumber\":23,\"field\":\"労働基準法\",\"majorField\":null,\"subField\":null,\"content\":\"下表の 1～3 は、貨物自動車運送事業に従事する自動車運転者（隔日勤務に就く運転者以外のもの）の 1 年間における各月の拘束時間の例を示したものである。下表の空欄Ａ、Ｂ、Ｃについて、次の選択肢ア～ウの拘束時間の組み合わせをあてはめた場合、「自動車運転者の労働時間等の改善のための基準」に【適合するものを選択肢ア～ウの中から 1 つ】選びなさい。なお、解答にあたっては「1 ヵ月及び 1 年についての拘束時間の延長に関する労使協定」があるものとし、下表に示された内容及び各選択肢に記載されている事項以外は考慮しないものとする。（※法改正により一部改変）\",\"imageUrl\":\"https://www.unkan-net.com/kakomon/R04.CBT.pdf\",\"sourceSheet\":null,\"knowledgeTags\":\"#改善基準(拘束・休息)\",\"riskCategory\":null,\"situationCategory\":\"#表・グラフ\",\"format\":\"SINGLE\",\"pdfUrl\":\"https://www.unkan-net.com/kakomon/R04.CBT.pdf\",\"pdfPage\":13,\"options\":[{\"id\":1518,\"questionId\":334,\"optionNumber\":1,\"content\":\"ア Ａ(時間):288 Ｂ(時間):286 Ｃ(時間):290\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":1519,\"questionId\":334,\"optionNumber\":2,\"content\":\"イ Ａ(時間):312 Ｂ(時間):284 Ｃ(時間):293\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":1520,\"questionId\":334,\"optionNumber\":3,\"content\":\"ウ Ａ(時間):279 Ｂ(時間):277 Ｃ(時間):295\",\"isCorrect\":true,\"explanation\":null,\"structuredData\":null}],\"explanation\":null,\"correctOptions\":[],\"attempts\":[],\"_count\":{\"attempts\":0},\"isDebated\":false,\"isBookmarked\":false},{\"id\":335,\"year\":\"令和4年 (CBT)\",\"questionNumber\":24,\"field\":\"実務上の知識及び能力\",\"majorField\":null,\"subField\":null,\"content\":\"運行管理者の日常業務の記録等に関する次の記述のうち、【適切なものをすべて】選びなさい。なお、解答にあたっては、各選択肢に記載されている事項以外は考慮しないものとする。（※法改正により一部改変）\",\"imageUrl\":null,\"sourceSheet\":null,\"knowledgeTags\":null,\"riskCategory\":null,\"situationCategory\":null,\"format\":\"SINGLE\",\"pdfUrl\":\"https://www.unkan-net.com/kakomon/R04.CBT.pdf\",\"pdfPage\":14,\"options\":[{\"id\":1521,\"questionId\":335,\"optionNumber\":1,\"content\":\"運行管理者は、事業用自動車の運転者が他の営業所に転出し当該営業所の運転者でなくなったときは、直ちに、運転者等台帳に運転者でなくなった年月日及び理由を記載して 1 年間保存している。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":1522,\"questionId\":335,\"optionNumber\":2,\"content\":\"運行管理者は、運行記録計により記録される「瞬間速度」、「運行距離」及び「運行時間」等により運転者の運行の実態や車両の運行の実態を分析し、運転者の日常の乗務を把握し、過労運転の防止及び運行の適正化を図る資料として活用しており、この運行記録計の記録を 1 年間保存している。\",\"isCorrect\":true,\"explanation\":null,\"structuredData\":null},{\"id\":1523,\"questionId\":335,\"optionNumber\":3,\"content\":\"運行管理者は、事業用自動車の運転者に対し、事業用自動車の構造上の特性、貨物の正しい積載方法など事業用自動車の運行の安全を確保するために必要な運転の技術及び自動車の運転に関して遵守すべき事項等について、適切に指導を行うとともに、その内容等について記録し、かつ、その記録を営業所において 3 年間保存している。\",\"isCorrect\":true,\"explanation\":null,\"structuredData\":null},{\"id\":1524,\"questionId\":335,\"optionNumber\":4,\"content\":\"運行管理者は、事業者が定めた勤務時間及び乗務時間の範囲内で、運転者が過労とならないよう十分考慮しながら、天候や道路状況などを勘案しつつ、乗務割を作成している。なお、乗務については、早めに運転者に知らせるため、事前に予定を示すことにしている。\",\"isCorrect\":true,\"explanation\":null,\"structuredData\":null}],\"explanation\":null,\"correctOptions\":[],\"attempts\":[],\"_count\":{\"attempts\":0},\"isDebated\":false,\"isBookmarked\":false},{\"id\":336,\"year\":\"令和4年 (CBT)\",\"questionNumber\":25,\"field\":\"実務上の知識及び能力\",\"majorField\":null,\"subField\":null,\"content\":\"一般貨物自動車運送事業者が事業用自動車の運転者に対して行う指導・監督に関する次の記述のうち、【適切なものをすべて】選びなさい。なお、解答にあたっては、各選択肢に記載されている事項以外は考慮しないものとする。\",\"imageUrl\":null,\"sourceSheet\":null,\"knowledgeTags\":null,\"riskCategory\":null,\"situationCategory\":null,\"format\":\"SINGLE\",\"pdfUrl\":\"https://www.unkan-net.com/kakomon/R04.CBT.pdf\",\"pdfPage\":15,\"options\":[{\"id\":1525,\"questionId\":336,\"optionNumber\":1,\"content\":\"時速 36 キロメートルで走行中の自動車を例に取り、運転者が前車との追突の危険を認知しブレーキ操作を行い、ブレーキが効きはじめるまでに要する空走時間を 1秒間とし、ブレーキが効きはじめてから停止するまでに走る制動距離を 8 メートルとすると、当該自動車の停止距離は約 13 メートルとなるなど、危険が発生した場合でも安全に止まれるような速度と車間距離を保って運転するよう指導している。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":1526,\"questionId\":336,\"optionNumber\":2,\"content\":\"危険ドラッグ等の薬物を使用して運転した場合には、重大な事故を引き起こす危険性が高まり、その結果取り返しのつかない被害を生じることもあることから、運行管理者は、常日頃からこれらの薬物を使用しないよう、運転者等に対し強く指導している。\",\"isCorrect\":true,\"explanation\":null,\"structuredData\":null},{\"id\":1527,\"questionId\":336,\"optionNumber\":3,\"content\":\"大雨、大雪、土砂災害などの異常気象時の措置については、異常気象時等処理要領を作成し運転者全員に周知させておくとともに、運転者とも速やかに連絡がとれるよう緊急時における連絡体制を整えているので、普段から事業用自動車の運行の中断、待避所の確保、徐行運転等の運転に関わることについてはすべて運転者の判断に任せ、中断、待避したときは報告するよう指導している。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":1528,\"questionId\":336,\"optionNumber\":4,\"content\":\"実際の事故事例やヒヤリハット事例のドライブレコーダー映像を活用して、事故前にどのような危険が潜んでいるか、それを回避するにはどのような運転をすべきかなどを運転者に考えさせる等、実事例に基づいた危険予知訓練を実施している。\",\"isCorrect\":true,\"explanation\":null,\"structuredData\":null}],\"explanation\":{\"id\":117,\"questionId\":336,\"content\":\"出前館とかのサポートコールみたいなものか直感的にそう考えてしまいますが、実は仕組みや法的な責任の重さが決定的に異なります。出前館などのフードデリバリーと、緑ナンバー（営業用トラック・バスなど）の運行管理を比べると、以下の2つの大きな違いがあります。1. 契約関係と自己責任の有無が違うフードデリバリー（ギグワーカー）配達員の多くは「独立した個人事業主」です。そのため、大雨や台風の日に「危ないから今日は休む」「途中でやめて帰る」という判断は、配達員本人の完全な自己責任に委ねられています。緑ナンバーの運転者（労働者）運送会社のドライバーは「雇用されている従業員」です。会社には安全配慮義務があり、労働者を危険な環境に放置してはなりません。そのため、現場の判断をすべてドライバーに丸投げすることは法律（貨物自動車運送事業法など）で禁止されています。2. 「ストッパー」の役割が違うフードデリバリーの場合台風などの際は、運営プラットフォーム（出前館やUber Eatsの運営側）がエリア全体のサービスを強制停止にするか、配達員が自らアプリをオフにするシステムです。運行管理者の場合運行管理者は、単なる連絡窓口（サポートコール）ではありません。リアルタイムの気象情報や道路の通行止め予測を分析し、個々のドライバーに対して「〇〇パーキングエリアで待機しなさい」「一般道へ迂回しなさい」と個別・具体的に指示を出す決裁権を持った「指揮官」です。簡単にまとめると、出前館のサポートは「現場のトラブルを処理する窓口」ですが、運行管理者は「運行の可否や安全ルートを最終決定する責任者」という違いがあります。\",\"isDebated\":true},\"correctOptions\":[],\"attempts\":[],\"_count\":{\"attempts\":0},\"isDebated\":false,\"isBookmarked\":false},{\"id\":337,\"year\":\"令和4年 (CBT)\",\"questionNumber\":26,\"field\":\"実務上の知識及び能力\",\"majorField\":null,\"subField\":null,\"content\":\"一般貨物自動車運送事業者（以下「事業者」という。）が行う事業用自動車の運転者の健康管理に関する次の記述のうち、【適切なものをすべて】選びなさい。なお、解答にあたっては、各選択肢に記載されている事項以外は考慮しないものとする。\",\"imageUrl\":null,\"sourceSheet\":null,\"knowledgeTags\":null,\"riskCategory\":null,\"situationCategory\":null,\"format\":\"SINGLE\",\"pdfUrl\":\"https://www.unkan-net.com/kakomon/R04.CBT.pdf\",\"pdfPage\":15,\"options\":[{\"id\":1529,\"questionId\":337,\"optionNumber\":1,\"content\":\"事業者は、業務に従事する運転者に対し法令で定める健康診断を受診させ、その結果に基づいて健康診断個人票を作成して 5 年間保存している。また、運転者が自ら受けた健康診断の結果を提出したものについても同様に保存している。\",\"isCorrect\":true,\"explanation\":null,\"structuredData\":null},{\"id\":1530,\"questionId\":337,\"optionNumber\":2,\"content\":\"事業者は、日頃から運転者の健康状態を把握し、点呼において、意識の異常、眼の異常、めまい、頭痛、言葉の異常、手足の異常等の申告又はその症状が見られたら、脳血管疾患の初期症状とも考えられるためすぐに専門医療機関で受診させるよう対応している。\",\"isCorrect\":true,\"explanation\":null,\"structuredData\":null},{\"id\":1531,\"questionId\":337,\"optionNumber\":3,\"content\":\"トラック運転者は、単独で判断する、連続作業をする、とっさの対応が必要、同じ姿勢で何時間も過ごすなどから、心身の状態が運行に及ぼす影響は大きく、健康状態を保持することが必要不可欠である。このため、事業者は、運転者が運転中に異常を感じたときには、運行継続の可否を自らの判断で行うよう指導している。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":1532,\"questionId\":337,\"optionNumber\":4,\"content\":\"睡眠時無呼吸症候群（ＳＡＳ）は、大きないびきや昼間の強い眠気などの症状があるが、必ずしも眠気を感じることがない場合もある。ＳＡＳスクリーニング検査を実施する場合には、本人の自覚症状による問診票だけで検査対象者を絞ってしまうと、重症のＳＡＳ患者を見過ごしてしまうリスクがあるため、定期的に、また、雇い入れ時等のタイミングで医療機器によるＳＡＳスクリーニング検査を受けることが重要である。\",\"isCorrect\":true,\"explanation\":null,\"structuredData\":null}],\"explanation\":null,\"correctOptions\":[],\"attempts\":[],\"_count\":{\"attempts\":0},\"isDebated\":false,\"isBookmarked\":false},{\"id\":338,\"year\":\"令和4年 (CBT)\",\"questionNumber\":27,\"field\":\"実務上の知識及び能力\",\"majorField\":null,\"subField\":null,\"content\":\"交通事故防止対策に関する次の記述のうち、【適切なものをすべて】選びなさい。なお、解答にあたっては、各選択肢に記載されている事項以外は考慮しないものとする。\",\"imageUrl\":null,\"sourceSheet\":null,\"knowledgeTags\":null,\"riskCategory\":null,\"situationCategory\":null,\"format\":\"SINGLE\",\"pdfUrl\":\"https://www.unkan-net.com/kakomon/R04.CBT.pdf\",\"pdfPage\":16,\"options\":[{\"id\":1533,\"questionId\":338,\"optionNumber\":1,\"content\":\"交通事故は、そのほとんどが運転者等のヒューマンエラーにより発生するものである。したがって、事故惹起運転者の社内処分及び再教育に特化した対策を講ずることが、交通事故の再発を未然に防止するには最も有効である。そのためには、発生した事故の要因の調査・分析を行うことなく、事故惹起運転者及び運行管理者に対する特別講習を確実に受講させる等、ヒューマンエラーの再発防止を中心とした対策に努めるべきである。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":1534,\"questionId\":338,\"optionNumber\":2,\"content\":\"ドライブレコーダーは、事故時の映像だけでなく、運転者のブレーキ操作やハンドル操作などの運転状況を記録し、解析することにより運転のクセ等を読み取ることができるものがあり、運行管理者が行う運転者の安全運転の指導に活用されている。\",\"isCorrect\":true,\"explanation\":null,\"structuredData\":null},{\"id\":1535,\"questionId\":338,\"optionNumber\":3,\"content\":\"指差呼称は、運転者の錯覚、誤判断、誤操作等を防止するための手段であり、道路の信号や標識などを指で差し、その対象が持つ名称や状態を声に出して確認することをいい、安全確認に重要な運転者の意識レベルを高めるなど交通事故防止対策に有効な手段の一つとして活用されている。\",\"isCorrect\":true,\"explanation\":null,\"structuredData\":null},{\"id\":1536,\"questionId\":338,\"optionNumber\":4,\"content\":\"適性診断は、運転者の運転能力、運転態度及び性格等を客観的に把握し、運転の適性を判定することにより、運転に適さない者を運転者として選任しないようにするためのものであり、ヒューマンエラーによる交通事故の発生を未然に防止するための有効な手段となっている。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null}],\"explanation\":null,\"correctOptions\":[],\"attempts\":[],\"_count\":{\"attempts\":0},\"isDebated\":false,\"isBookmarked\":false},{\"id\":339,\"year\":\"令和4年 (CBT)\",\"questionNumber\":28,\"field\":\"実務上の知識及び能力\",\"majorField\":null,\"subField\":null,\"content\":\"自動車の運転等に関する次の記述のうち、【適切なものを 2 つ】選びなさい。なお、解答にあたっては、各選択肢に記載されている事項以外は考慮しないものとする。\",\"imageUrl\":null,\"sourceSheet\":null,\"knowledgeTags\":null,\"riskCategory\":null,\"situationCategory\":null,\"format\":\"SINGLE\",\"pdfUrl\":\"https://www.unkan-net.com/kakomon/R04.CBT.pdf\",\"pdfPage\":16,\"options\":[{\"id\":1537,\"questionId\":339,\"optionNumber\":1,\"content\":\"自動車の夜間の走行時において、自車のライトと対向車のライトで、お互いの光が重なり合い、その間にいる歩行者や自転車が見えなくなることをクリープ現象という。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":1538,\"questionId\":339,\"optionNumber\":2,\"content\":\"自動車の乗員が自分の両手両足で支えられる力は、自分の体重のせいぜい 2～3 倍が限度といわれている。これは、自動車が時速 7 キロメートル程度で衝突したときの力に相当することになる。このため、危険から自身を守るためにシートベルトを着用することが必要である。\",\"isCorrect\":true,\"explanation\":null,\"structuredData\":null},{\"id\":1539,\"questionId\":339,\"optionNumber\":3,\"content\":\"自動車がカーブを走行するとき、自動車の重量及びカーブの半径が同一の場合に、速度を 2 分の 1 に落として走行すると遠心力の大きさは 2 分の 1 になる。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":1540,\"questionId\":339,\"optionNumber\":4,\"content\":\"自動車が衝突するときの衝撃力は、速度が 2 倍になると 4 倍になる。\",\"isCorrect\":true,\"explanation\":null,\"structuredData\":null}],\"explanation\":null,\"correctOptions\":[],\"attempts\":[],\"_count\":{\"attempts\":0},\"isDebated\":false,\"isBookmarked\":false},{\"id\":340,\"year\":\"令和4年 (CBT)\",\"questionNumber\":29,\"field\":\"実務上の知識及び能力\",\"majorField\":null,\"subField\":null,\"content\":\"運行管理者は、荷主からの運送依頼を受けて、下の図に示す運行計画を立てた。この運行に関する次の 1～3 の記述について、解答しなさい。なお、解答にあたっては､＜運行計画＞及び各選択肢に記載されている事項以外は考慮しないものとする。（※法改正により一部改変）\",\"imageUrl\":\"https://www.unkan-net.com/kakomon/R04.CBT.pdf\",\"sourceSheet\":null,\"knowledgeTags\":null,\"riskCategory\":null,\"situationCategory\":\"#表・グラフ\",\"format\":\"MULTI_GROUP\",\"pdfUrl\":\"https://www.unkan-net.com/kakomon/R04.CBT.pdf\",\"pdfPage\":17,\"options\":[{\"id\":1578,\"questionId\":340,\"optionNumber\":1,\"content\":\"1．Ｅ料金所からＦ料金所までの間の高速自動車国道（本線車道に限る。以下同じ。）の運転時間を 2 時間、及びＧ料金所からＨ料金所までの間の高速自動車国道の運転時間を 2 時間 30 分と設定したことは、道路交通法令に定める制限速度に照らし適切か否かについて、【正しいものを 1 つ】選びなさい。 : 適切\",\"isCorrect\":true,\"explanation\":null,\"structuredData\":\"{\\\"title\\\":\\\"1．Ｅ料金所からＦ料金所までの間の高速自動車国道（本線車道に限る。以下同じ。）の運転時間を 2 時間、及びＧ料金所からＨ料金所までの間の高速自動車国道の運転時間を 2 時間 30 分と設定したことは、道路交通法令に定める制限速度に照らし適切か否かについて、【正しいものを 1 つ】選びなさい。\\\",\\\"choices\\\":[{\\\"num\\\":1,\\\"text\\\":\\\"適切\\\"},{\\\"num\\\":2,\\\"text\\\":\\\"不適切\\\"}]}\"},{\"id\":1579,\"questionId\":340,\"optionNumber\":2,\"content\":\"1．Ｅ料金所からＦ料金所までの間の高速自動車国道（本線車道に限る。以下同じ。）の運転時間を 2 時間、及びＧ料金所からＨ料金所までの間の高速自動車国道の運転時間を 2 時間 30 分と設定したことは、道路交通法令に定める制限速度に照らし適切か否かについて、【正しいものを 1 つ】選びなさい。 : 不適切\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":\"{\\\"title\\\":\\\"1．Ｅ る\",\"isCorrect\":true,\"explanation\":null,\"structuredData\":\"{\\\"title\\\":\\\"3．当該運行の連続運転時間の中断方法について「改善基準告示」に照らし、違反しているか否かについて、【正しいものを 1 つ】選びなさい。\\\",\\\"choices\\\":[{\\\"num\\\":1,\\\"text\\\":\\\"違反していない\\\"},{\\\"num\\\":2,\\\"text\\\":\\\"違反している\\\"}]}\"}],\"explanation\":null,\"correctOptions\":[],\"attempts\":[],\"_count\":{\"attempts\":0},\"isDebated\":false,\"isBookmarked\":false},{\"id\":341,\"year\":\"令和4年 (CBT)\",\"questionNumber\":30,\"field\":\"実務上の知識及び能力\",\"majorField\":null,\"subField\":null,\"content\":\"運行管理者が次の事業用普通トラックの事故報告に基づき、事故の要因分析を行ったうえで、同種事故の再発を防止するための対策として、【最も直接的に有効と考えられるものを＜事故の再発防止対策＞から 3 つ】選びなさい。なお、解答にあたっては、＜事故の概要＞及び＜事故関連情報＞に記載されている事項以外は考慮しないものとする。（※法改正により一部改変）\",\"imageUrl\":\"https://www.unkan-net.com/kakomon/R04.CBT.pdf\",\"sourceSheet\":null,\"knowledgeTags\":\"#交通事故の要因・防止策\",\"riskCategory\":null,\"situationCategory\":\"#事故対応事例\",\"format\":\"SINGLE\",\"pdfUrl\":\"https://www.unkan-net.com/kakomon/R04.CBT.pdf\",\"pdfPage\":18,\"options\":[{\"id\":1544,\"questionId\":341,\"optionNumber\":1,\"content\":\"① 運行管理者は、運転者に対して、交通事故を惹起した場合の社会的影響の大きさや過労が運転に及ぼす危険性を認識させ、疲労や眠気を感じた場合は直ちに運転を中止し、休憩するよう指導を徹底する。\",\"isCorrect\":true,\"explanation\":null,\"structuredData\":null},{\"id\":1545,\"questionId\":341,\"optionNumber\":2,\"content\":\"② 事業者は、運転者に対して、疾病が交通事故の要因となるおそれがあることを理解させ、健康診断結果に基づき、生活習慣の改善を図るなど、適切な心身の健康管理を行うことを理解させる。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":1546,\"questionId\":341,\"optionNumber\":3,\"content\":\"③ 運行管理者は、「改善基準告示」に違反しないよう、適切な乗務割を作成するとともに、点呼の際適切な運行指示を行う。\",\"isCorrect\":true,\"explanation\":null,\"structuredData\":null},{\"id\":1547,\"questionId\":341,\"optionNumber\":4,\"content\":\"④ 運行管理者は、法定等に定められた適齢診断を運転者に確実に受診させるとともに、その結果を活用し、個々の運転者の特性に応じた指導を行う。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":1548,\"questionId\":341,\"optionNumber\":5,\"content\":\"⑤ 運行管理者は、点呼を実施する際、運転者の体調や疲労の蓄積などをきちんと確認し、疲労等により安全な運転を継続することができないおそれがあるときは、当該運転者を交替させる措置をとる。\",\"isCorrect\":true,\"explanation\":null,\"structuredData\":null},{\"id\":1549,\"questionId\":341,\"optionNumber\":6,\"content\":\"⑥ 法令で定められた日常点検及び定期点検整備を確実に実施する。その際、速度抑制装置の正常な作動についても、警告灯により確認する。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null}],\"explanation\":null,\"correctOptions\":[],\"attempts\":[],\"_count\":{\"attempts\":0},\"isDebated\":false,\"isBookmarked\":false},{\"id\":432,\"year\":\"令和3年 (CBT)\",\"questionNumber\":1,\"field\":null,\"majorField\":\"貨物\",\"subField\":\"その他\",\"content\":\"一般貨物自動車運送事業者（以下「事業者」という。）の事業計画の変更に関する次の記述のうち、【正しいものを 2 つ】選びなさい。なお、解答にあたっては、各選択肢に記載されている事項以外は考慮しないものとする。（※法改正により一部改変）\",\"imageUrl\":null,\"sourceSheet\":null,\"knowledgeTags\":\"\",\"riskCategory\":null,\"situationCategory\":null,\"format\":\"MULTI_GROUP\",\"pdfUrl\":\"/data/R03.CBT.pdf\",\"pdfPage\":1,\"options\":[{\"id\":1752,\"questionId\":432,\"optionNumber\":1,\"content\":\"事業者は、「自動車車庫の位置及び収容能力」の事業計画の変更をしたときは、遅滞なくその旨を、国土交通大臣に届け出なければならない。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":1753,\"questionId\":432,\"optionNumber\":2,\"content\":\"事業者は、「各営業所に配置する事業用自動車の種別ごとの数」の事業計画の変更をするときは、法令に定める場合を除き、あらかじめその旨を、国土交通大臣に届け出なければならない。\",\"isCorrect\":true,\"explanation\":null,\"structuredData\":null},{\"id\":1754,\"questionId\":432,\"optionNumber\":3,\"content\":\"事業者は、「乗務員等の休憩又は睡眠のための施設の位置及び収容能力」の事業計画の変更をしようとするときは、国土交通大臣の認可を受けなければならない。\",\"isCorrect\":true,\"explanation\":null,\"structuredData\":null},{\"id\":1755,\"questionId\":432,\"optionNumber\":4,\"content\":\"事業者は、「主たる事務所の名称及び位置」の事業計画の変更をするときは、あらかじめその旨を、国土交通大臣に届け出なければならない。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null}],\"explanation\":null,\"correctOptions\":[],\"attempts\":[],\"_count\":{\"attempts\":0},\"isDebated\":false,\"isBookmarked\":false},{\"id\":433,\"year\":\"令和3年 (CBT)\",\"questionNumber\":2,\"field\":null,\"majorField\":\"貨物\",\"subField\":\"その他\",\"content\":\"貨物自動車運送事業法に定める運行管理者等の義務についての次の文中、Ａ、Ｂ、Ｃ、Ｄに入るべき字句として【下の選択肢（①～⑧）から】選びなさい。\\n1．運行管理者は、 Ａ にその業務を行わなければならない。\\n2．一般貨物自動車運送事業者は、運行管理者に対し、法令で定める業務を行うため必要な Ｂ を与えなければならない。\\n3．一般貨物自動車運送事業者は、運行管理者がその業務として行う Ｃ を尊重しなければならず、事業用自動車の運転者その他の従業員は、運行管理者がその業務として行う Ｄ に従わなければならない。\",\"imageUrl\":null,\"sourceSheet\":null,\"knowledgeTags\":\"\",\"riskCategory\":null,\"situationCategory\":null,\"format\":\"SINGLE\",\"pdfUrl\":\"/data/R03.CBT.pdf\",\"pdfPage\":1,\"options\":[{\"id\":1756,\"questionId\":433,\"optionNumber\":1,\"content\":\"指導\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":1757,\"questionId\":433,\"optionNumber\":2,\"content\":\"適切\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":1758,\"questionId\":433,\"optionNumber\":3,\"content\":\"権限\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":1759,\"questionId\":433,\"optionNumber\":4,\"content\":\"指示\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":1760,\"questionId\":433,\"optionNumber\":5,\"content\":\"助言\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":1761,\"questionId\":433,\"optionNumber\":6,\"content\":\"地位\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":1762,\"questionId\":433,\"optionNumber\":7,\"content\":\"勧告\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":1763,\"questionId\":433,\"optionNumber\":8,\"content\":\"誠実\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null}],\"explanation\":null,\"correctOptions\":[],\"attempts\":[],\"_count\":{\"attempts\":0},\"isDebated\":false,\"isBookmarked\":false},{\"id\":434,\"year\":\"令和3年 (CBT)\",\"questionNumber\":3,\"field\":null,\"majorField\":\"貨物\",\"subField\":\"その他\",\"content\":\"次の記述のうち、一般貨物自動車運送事業の運行管理者の行わなければならない業務として【正しいものを 2 つ】選びなさい。なお、解答にあたっては、各選択肢に記載されている事項以外は考慮しないものとする。（※法改正により一部改変）\",\"imageUrl\":null,\"sourceSheet\":null,\"knowledgeTags\":\"\",\"riskCategory\":null,\"situationCategory\":null,\"format\":\"MULTI_GROUP\",\"pdfUrl\":\"/data/R03.CBT.pdf\",\"pdfPage\":2,\"options\":[{\"id\":1764,\"questionId\":434,\"optionNumber\":1,\"content\":\"乗務員等が有効に利用することができるように、休憩に必要な施設を整備し、及び乗務員等に睡眠を与える必要がある場合にあっては睡眠に必要な施設を整備し、並びにこれらの施設を適切に管理し、及び保守すること。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":1765,\"questionId\":434,\"optionNumber\":2,\"content\":\"法令の規定により、死者又は負傷者（法令に掲げる傷害を受けた者）が生じた事故を引き起こした者等特定の運転者に対し、国土交通大臣が告示で定める適性診断であって国土交通大臣の認定を受けたものを受けさせること。\",\"isCorrect\":true,\"explanation\":null,\"structuredData\":null},{\"id\":1766,\"questionId\":434,\"optionNumber\":3,\"content\":\"法令の規定により、運転者等に対して点呼を行い、報告を求め、確認を行い、及び指示を与え、並びに記録し、及びその記録を保存し、並びに運転者に対して使用するアルコール検知器を備え置くこと。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":1767,\"questionId\":434,\"optionNumber\":4,\"content\":\"法令の規定により、運行指示書を作成し、及びその写しに変更の内容を記載し、運転者等に対し適切な指示を行い、運行指示書を事業用自動車の運転者等に携行させ、及び変更の内容を記載させ、並びに運行指示書及びその写の保存をすること。\",\"isCorrect\":true,\"explanation\":null,\"structuredData\":null}],\"explanation\":null,\"correctOptions\":[],\"attempts\":[],\"_count\":{\"attempts\":0},\"isDebated\":false,\"isBookmarked\":false},{\"id\":435,\"year\":\"令和3年 (CBT)\",\"questionNumber\":4,\"field\":null,\"majorField\":\"貨物\",\"subField\":\"その他\",\"content\":\"貨物自動車運送事業の事業用自動車の運転者に対する点呼についての法令等の定めに関する次の記述のうち、【正しいものをすべて】選びなさい。なお、解答にあたっては、各選択肢に記載されている事項以外は考慮しないものとする。（※法改正により一部改変）\",\"imageUrl\":null,\"sourceSheet\":null,\"knowledgeTags\":\"\",\"riskCategory\":null,\"situationCategory\":null,\"format\":\"MULTI_GROUP\",\"pdfUrl\":\"/data/R03.CBT.pdf\",\"pdfPage\":2,\"options\":[{\"id\":1768,\"questionId\":435,\"optionNumber\":1,\"content\":\"業務前及び業務後の点呼のいずれも対面等で行うことができない業務を行う運転者に対しては、業務前及び業務後の点呼のほかに、当該業務の途中において少なくとも 1 回、対面による点呼と同等の効果を有するものとして国土交通大臣が定める方法（当該方法により点呼を行うことが困難である場合にあっては、電話その他の方法）により点呼（中間点呼）を行わなければならない。当該点呼においては、①酒気帯びの有無、②疾病、疲労、睡眠不足その他の理由により安全な運転をすることができないおそれの有無について報告を求め、及び確認を行い、並びに事業用自動車の運行の安全を確保するために必要な指示をしなければならない。\",\"isCorrect\":true,\"explanation\":null,\"structuredData\":null},{\"id\":1769,\"questionId\":435,\"optionNumber\":2,\"content\":\"運転者に対する業務後の点呼は、対面等（運行上やむを得ない場合は電話その他の方法）により行い、当該業務に係る事業用自動車、道路及び運行の状況について報告を求め、かつ、酒気帯びの有無について確認を行わなければならない。この場合において、当該運転者が他の運転者と交替した場合にあっては、当該運転者が交替した運転者に対して行った法令の規定による通告についても報告を求めなければならない。\",\"isCorrect\":true,\"explanation\":null,\"structuredData\":null},{\"id\":1770,\"questionId\":435,\"optionNumber\":3,\"content\":\"全国貨物自動車運送適正化事業実施機関が認定している安全優良事業所（Ｇマーク営業所）以外であっても、①開設されてから 3 年を経過していること。②過去 1 年間点呼の違反に係る行政処分又は警告を受けていないことなどに該当する一般貨物自動車運送事業者の営業所にあっては、当該営業所と当該営業所の車庫間において、当該営業所で管理するＩＴ点呼機器を用いたＩＴ点呼を実施できる。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":1771,\"questionId\":435,\"optionNumber\":4,\"content\":\"同一事業者内の全国貨物自動車運送適正化事業実施機関が認定している安全優良事業所（Ｇマーク営業所）である営業所間で行うＩＴ点呼の実施は、1 営業日のうち連続する 20 時間以内とする。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null}],\"explanation\":null,\"correctOptions\":[],\"attempts\":[],\"_count\":{\"attempts\":0},\"isDebated\":false,\"isBookmarked\":false},{\"id\":436,\"year\":\"令和3年 (CBT)\",\"questionNumber\":5,\"field\":null,\"majorField\":\"貨物\",\"subField\":\"その他\",\"content\":\"次の自動車事故に関する記述のうち、一般貨物自動車運送事業者が自動車事故報告規則に基づき国土交通大臣への【報告を要するものを 2 つ】選びなさい。なお、解答にあたっては、各選択肢に記載されている事項以外は考慮しないものとする。\",\"imageUrl\":null,\"sourceSheet\":null,\"knowledgeTags\":\"\",\"riskCategory\":null,\"situationCategory\":null,\"format\":\"MULTI_GROUP\",\"pdfUrl\":\"/data/R03.CBT.pdf\",\"pdfPage\":3,\"options\":[{\"id\":1772,\"questionId\":436,\"optionNumber\":1,\"content\":\"事業用自動車が左折したところ、左後方から走行してきた自転車を巻き込む事故を起こした。この事故で、当該自転車に乗車していた者に通院による 40 日間の医師の治療を要する傷害を生じさせた。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":1773,\"questionId\":436,\"optionNumber\":2,\"content\":\"事業用自動車が走行中、アクセルを踏んでいるものの速度が徐々に落ち、しばらく走行したところでエンジンが停止して走行が不能となった。再度エンジンを始動させようとしたが、燃料装置の故障によりエンジンを再始動させることができず、運行ができなくなった。\",\"isCorrect\":true,\"explanation\":null,\"structuredData\":null},{\"id\":1774,\"questionId\":436,\"optionNumber\":3,\"content\":\"事業用自動車の運転者がハンドル操作を誤り、当該自動車が車道と歩道の区別がない道路を逸脱し、当該道路との落差が 0.3 メートルの畑に転落した。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":1775,\"questionId\":436,\"optionNumber\":4,\"content\":\"事業用自動車の運転者が高速自動車国道を走行中、ハンドル操作を誤り、道路の中央分離帯に衝突したことにより、当該事業用自動車に積載していた消防法に規定する危険物の高圧ガスが一部漏えいした。この事故により当該自動車の運転者が軽傷を負った。\",\"isCorrect\":true,\"explanation\":null,\"structuredData\":null}],\"explanation\":null,\"correctOptions\":[],\"attempts\":[],\"_count\":{\"attempts\":0},\"isDebated\":false,\"isBookmarked\":false},{\"id\":437,\"year\":\"令和3年 (CBT)\",\"questionNumber\":6,\"field\":null,\"majorField\":\"貨物\",\"subField\":\"その他\",\"content\":\"一般貨物自動車運送事業者（以下「事業者」という。）の過労運転等の防止等についての法令の定めに関する次の記述のうち、【誤っているものを 1 つ】選びなさい。なお、解答にあたっては、各選択肢に記載されている事項以外は考慮しないものとする。（※法改正により一部改変）\",\"imageUrl\":null,\"sourceSheet\":null,\"knowledgeTags\":\"\",\"riskCategory\":null,\"situationCategory\":null,\"format\":\"SINGLE\",\"pdfUrl\":\"/data/R03.CBT.pdf\",\"pdfPage\":3,\"options\":[{\"id\":1776,\"questionId\":437,\"optionNumber\":1,\"content\":\"事業者は、事業計画に従い業務を行うに必要な員数の運転者を常時選任しておかなければならず、この場合、選任する運転者は、日々雇い入れられる者、2 ヵ月以内の期間を定めて使用される者又は試みの使用期間中の者（14 日を超えて引き続き使用されるに至った者を除く。）であってはならない。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":1777,\"questionId\":437,\"optionNumber\":2,\"content\":\"運転者等の業務について、当該事業用自動車の瞬間速度、運行距離及び運行時間を運行記録計により記録しなければならない車両は、車両総重量が 8 トン以上又は最大積載量が 5 トン以上の普通自動車である。\",\"isCorrect\":true,\"explanation\":null,\"structuredData\":null},{\"id\":1778,\"questionId\":437,\"optionNumber\":3,\"content\":\"事業者は、乗務員等の健康状態の把握に努め、疾病、疲労、睡眠不足その他の理由により安全に運行の業務を遂行し、又はその補助をすることができないおそれがある乗務員等を事業用自動車の運行の業務に従事させてはならない。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":1779,\"questionId\":437,\"optionNumber\":4,\"content\":\"事業者は、運転者が長距離運転又は夜間の運転に従事する場合であって、疲労等により安全な運転を継続することができないおそれがあるときは、あらかじめ、当該運転者と交替するための運転者を配置しておかなければならない。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null}],\"explanation\":null,\"correctOptions\":[],\"attempts\":[],\"_count\":{\"attempts\":0},\"isDebated\":false,\"isBookmarked\":false},{\"id\":438,\"year\":\"令和3年 (CBT)\",\"questionNumber\":7,\"field\":null,\"majorField\":\"貨物\",\"subField\":\"その他\",\"content\":\"一般貨物自動車運送事業者（以下「事業者」という。）の事業用自動車の運行の安全を確保するために、国土交通省告示等に基づき運転者に対して行わなければならない指導監督及び特定の運転者に対して行わなければならない特別な指導に関する次の記述のうち、【誤っているものを 1 つ】選びなさい。なお、解答にあたっては、各選択肢に記載されている事項以外は考慮しないものとする。\",\"imageUrl\":null,\"sourceSheet\":null,\"knowledgeTags\":\"\",\"riskCategory\":null,\"situationCategory\":null,\"format\":\"SINGLE\",\"pdfUrl\":\"/data/R03.CBT.pdf\",\"pdfPage\":4,\"options\":[{\"id\":1780,\"questionId\":438,\"optionNumber\":1,\"content\":\"事業者は、事故惹起運転者に対する特別な指導については、当該交通事故を引き起こした後再度事業用自動車に乗務する前に実施する。ただし、やむを得ない事情がある場合には、再度乗務を開始した後 1 ヵ月以内に実施する。なお、外部の専門的機関における指導講習を受講する予定である場合は、この限りではない。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":1781,\"questionId\":438,\"optionNumber\":2,\"content\":\"運転者は、乗務を終了して他の運転者と交替するときは、交替する運転者に対し、当該乗務に係る事業用自動車、道路及び運行の状況について通告すること。この場合において、交替して乗務する運転者は、当該通告を受け、当該事業用自動車の制動装置、走行装置その他の重要な装置の機能について、これを点検すること。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":1782,\"questionId\":438,\"optionNumber\":3,\"content\":\"事業者は、初任運転者に対する特別な指導について、当該事業者において初めて事業用自動車に乗務する前に実施すること。ただし、やむを得ない事情がある場合には、乗務を開始した後 1 ヵ月以内に実施すること。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":1783,\"questionId\":438,\"optionNumber\":4,\"content\":\"事業者が行う初任運転者に対する特別な指導は、法令に基づき運転者が遵守すべき事項、事業用自動車の運行の安全を確保するために必要な運転に関する事項などについて、6 時間以上実施するとともに、安全運転の実技について、15 時間以上実施すること。\",\"isCorrect\":true,\"explanation\":null,\"structuredData\":null}],\"explanation\":null,\"correctOptions\":[],\"attempts\":[],\"_count\":{\"attempts\":0},\"isDebated\":false,\"isBookmarked\":false},{\"id\":439,\"year\":\"令和3年 (CBT)\",\"questionNumber\":8,\"field\":null,\"majorField\":\"貨物\",\"subField\":\"その他\",\"content\":\"一般貨物自動車運送事業者（以下「事業者」という。）の事業用自動車の運行に係る記録等に関する次の記述のうち、【正しいものを 2 つ】選びなさい。なお、解答にあたっては、各選択肢に記載されている事項以外は考慮しないものとする。（※法改正により一部改変）\",\"imageUrl\":null,\"sourceSheet\":null,\"knowledgeTags\":\"\",\"riskCategory\":null,\"situationCategory\":null,\"format\":\"MULTI_GROUP\",\"pdfUrl\":\"/data/R03.CBT.pdf\",\"pdfPage\":4,\"options\":[{\"id\":1784,\"questionId\":439,\"optionNumber\":1,\"content\":\"同一事業者内の全国貨物自動車運送適正化事業実施機関が認定している安全性優良事業所（Ｇマーク営業所）間でＩＴ点呼を実施した場合、点呼簿に記録する内容を、ＩＴ点呼を行う営業所及びＩＴ点呼を受ける運転者が所属する営業所の双方で記録し、保存すること。\",\"isCorrect\":true,\"explanation\":null,\"structuredData\":null},{\"id\":1785,\"questionId\":439,\"optionNumber\":2,\"content\":\"事業者は、車両総重量が 8 トン以上又は最大積載量が 5 トン以上の普通自動車である事業用自動車の運行の業務に運転者等を従事させた場合にあっては、当該業務を行った運転者等ごとに貨物の積載状況を「業務の記録」に記録させ、かつ、その記録を 1 年間保存しなければならない。\",\"isCorrect\":true,\"explanation\":null,\"structuredData\":null},{\"id\":1786,\"questionId\":439,\"optionNumber\":3,\"content\":\"事業者は、法令の規定により運行指示書を作成した場合には、当該運行指示書を、運行を計画した日から 1 年間保存しなければならない。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":1787,\"questionId\":439,\"optionNumber\":4,\"content\":\"事業者は、運転者が転任、退職その他の理由により運転者でなくなった場合には、直ちに、当該運転者に係る法令に基づき作成した運転者等台帳に運転者でなくなった年月日及び理由を記載し、これを 1 年間保存しなければならない。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null}],\"explanation\":null,\"correctOptions\":[],\"attempts\":[],\"_count\":{\"attempts\":0},\"isDebated\":false,\"isBookmarked\":false},{\"id\":440,\"year\":\"令和3年 (CBT)\",\"questionNumber\":9,\"field\":null,\"majorField\":\"貨物\",\"subField\":\"その他\",\"content\":\"自動車の登録等についての次の記述のうち、【正しいものを 2 つ】選びなさい。なお、解答にあたっては、各選択肢に記載されている事項以外は考慮しないものとする。\",\"imageUrl\":null,\"sourceSheet\":null,\"knowledgeTags\":\"\",\"riskCategory\":null,\"situationCategory\":null,\"format\":\"MULTI_GROUP\",\"pdfUrl\":\"/data/R03.CBT.pdf\",\"pdfPage\":5,\"options\":[{\"id\":1788,\"questionId\":440,\"optionNumber\":1,\"content\":\"登録自動車について所有者の変更があったときは、新所有者は、その事由があった日から 30 日以内に、国土交通大臣の行う移転登録の申請をしなければならない。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":1789,\"questionId\":440,\"optionNumber\":2,\"content\":\"登録自動車の所有者は、当該自動車が滅失し、解体し（整備又は改造のために解体する場合を除く。）、又は自動車の用途を廃止したときは、その事由があった日（使用済自動車の解体である場合には解体報告記録がなされたことを知った日）から 15 日以内に、永久抹消登録の申請をしなければならない。\",\"isCorrect\":true,\"explanation\":null,\"structuredData\":null},{\"id\":1790,\"questionId\":440,\"optionNumber\":3,\"content\":\"臨時運行の許可を受けた者は、臨時運行許可証の有効期間が満了したときは、その日から 15 日以内に、当該臨時運行許可証及び臨時運行許可番号標を行政庁に返納しなければならない。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":1791,\"questionId\":440,\"optionNumber\":4,\"content\":\"道路運送車両法に規定する自動車の種別は、自動車の大きさ及び構造並びに原動機の種類及び総排気量又は定格出力を基準として定められ、その別は、普通自動車、小型自動車、軽自動車、大型特殊自動車、小型特殊自動車である。\",\"isCorrect\":true,\"explanation\":null,\"structuredData\":null}],\"explanation\":null,\"correctOptions\":[],\"attempts\":[],\"_count\":{\"attempts\":0},\"isDebated\":false,\"isBookmarked\":false},{\"id\":441,\"year\":\"令和3年 (CBT)\",\"questionNumber\":10,\"field\":null,\"majorField\":\"貨物\",\"subField\":\"その他\",\"content\":\"自動車の検査等についての次の記述のうち、【誤っているものを 1 つ】選びなさい。なお、解答にあたっては、各選択肢に記載されている事項以外は考慮しないものとする。（※法改正により一部改変）\",\"imageUrl\":null,\"sourceSheet\":null,\"knowledgeTags\":\"\",\"riskCategory\":null,\"situationCategory\":null,\"format\":\"SINGLE\",\"pdfUrl\":\"/data/R03.CBT.pdf\",\"pdfPage\":5,\"options\":[{\"id\":1792,\"questionId\":441,\"optionNumber\":1,\"content\":\"国土交通大臣は、一定の地域に使用の本拠の位置を有する自動車の使用者が、天災その他やむを得ない事由により、継続検査を受けることができないと認めるときは、当該地域に使用の本拠の位置を有する自動車の自動車検査証の有効期間を、期間を定めて伸長する旨を公示することができる。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":1793,\"questionId\":441,\"optionNumber\":2,\"content\":\"自動車の使用者は、自動車の長さ、幅又は高さを変更したときは、道路運送車両法で定める場合を除き、その事由があった日から 15 日以内に、当該変更について、国土交通大臣が行う自動車検査証の変更記録を受けなければならない。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":1794,\"questionId\":441,\"optionNumber\":3,\"content\":\"何人も、有効な自動車検査証の交付を受けている自動車について、自動車又はその部分の改造、装置の取付け又は取り外しその他これらに類する行為であって、当該自動車が保安基準に適合しないこととなるものを行ってはならない。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":1795,\"questionId\":441,\"optionNumber\":4,\"content\":\"車両総重量 8,990 キログラムの貨物自動車運送事業の用に供する自動車の使用者は、スペアタイヤの取付状態等について、1 ヵ月ごとに国土交通省令で定める技術上の基準により自動車を点検しなければならない。\",\"isCorrect\":true,\"explanation\":null,\"structuredData\":null}],\"explanation\":null,\"correctOptions\":[],\"attempts\":[],\"_count\":{\"attempts\":0},\"isDebated\":false,\"isBookmarked\":false},{\"id\":442,\"year\":\"令和3年 (CBT)\",\"questionNumber\":11,\"field\":null,\"majorField\":\"貨物\",\"subField\":\"その他\",\"content\":\"道路運送車両法に定める自動車の点検整備等に関する次の文中、Ａ、Ｂ、Ｃ、Ｄに入るべき字句として【いずれか正しいものを 1 つ】選びなさい。\\n1．自動車運送事業の用に供する自動車の使用者は、 Ａ ごとに国土交通省令で定める技術上の基準により、自動車を点検しなければならない。\\n2．自動車の使用者は、自動車の点検及び整備等に関する事項を処理させるため、車両総重量 8 トン以上の自動車その他の国土交通省令で定める自動車であって国土交通省令で定める台数以上のものの使用の本拠ごとに、自動車の点検及び整備に関する実務の経験その他について国土交通省令で定める一定の要件を備える者のうちから、 Ｂ を選任しなければならない。\\n3．地方運輸局長は、保安基準に適合しない状態にある当該自動車の使用者に対し、当該自動車が保安基準に適合するに至るまでの間の運行に関し、当該自動車の使用の方法又は経路の制限その他の保安上又は Ｃ その他の環境保全上必要な指示をすることができる。\\n4．事業用自動車の使用者又は当該自動車を運行する者は、1 日 1 回、その運行開始前において、国土交通省令で定める技術上の基準により自動車を Ｄ しなければならない。\",\"imageUrl\":null,\"sourceSheet\":null,\"knowledgeTags\":\"\",\"riskCategory\":null,\"situationCategory\":null,\"format\":\"MULTI_GROUP\",\"pdfUrl\":\"/data/R03.CBT.pdf\",\"pdfPage\":6,\"options\":[{\"id\":1796,\"questionId\":442,\"optionNumber\":1,\"content\":\"Ａ：① 3 ヵ月 ② 6 ヵ月\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":1797,\"questionId\":442,\"optionNumber\":2,\"content\":\"Ｂ：① 安全統括管理者 ② 整備管理者\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":1798,\"questionId\":442,\"optionNumber\":3,\"content\":\"Ｃ：① 事故防止 ② 公害防止\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":1799,\"questionId\":442,\"optionNumber\":4,\"content\":\"Ｄ：① 点検 ② 整備\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null}],\"explanation\":null,\"correctOptions\":[],\"attempts\":[],\"_count\":{\"attempts\":0},\"isDebated\":false,\"isBookmarked\":false},{\"id\":443,\"year\":\"令和3年 (CBT)\",\"questionNumber\":12,\"field\":null,\"majorField\":\"貨物\",\"subField\":\"その他\",\"content\":\"道路運送車両の保安基準及びその細目を定める告示についての次の記述のうち、【誤っているものを 1 つ】選びなさい。なお、解答にあたっては、各選択肢に記載されている事項以外は考慮しないものとする。\",\"imageUrl\":null,\"sourceSheet\":null,\"knowledgeTags\":\"\",\"riskCategory\":null,\"situationCategory\":null,\"format\":\"SINGLE\",\"pdfUrl\":\"/data/R03.CBT.pdf\",\"pdfPage\":6,\"options\":[{\"id\":1800,\"questionId\":443,\"optionNumber\":1,\"content\":\"停止表示器材は、夜間 200 メートルの距離から走行用前照灯で照射した場合にその反射光を照射位置から確認できるものであることなど告示で定める基準に適合するものでなければならない。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":1801,\"questionId\":443,\"optionNumber\":2,\"content\":\"自動車（被けん引自動車を除く。）には、警音器の警報音発生装置の音が、連続するものであり、かつ、音の大きさ及び音色が一定なものである警音器を備えなければならない。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":1802,\"questionId\":443,\"optionNumber\":3,\"content\":\"自動車（二輪自動車等を除く。）の空気入ゴムタイヤの接地部は滑り止めを施したものであり、滑り止めの溝は、空気入ゴムタイヤの接地部の全幅にわたり滑り止めのために施されている凹部（サイピング、プラットフォーム及びウエア・インジケータの部分を除く。）のいずれの部分においても 1.4 ミリメートル以上の深さを有すること。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":1803,\"questionId\":443,\"optionNumber\":4,\"content\":\"電力により作動する原動機を有する自動車（二輪自動車、側車付二輪自動車、三輪自動車、カタピラ及びそりを有する軽自動車、大型特殊自動車、小型特殊自動車並びに被けん引自動車を除く。）には、当該自動車の接近を歩行者等に通報するものとして、機能、性能等に関し告示で定める基準に適合する車両接近通報装置を備えなければならない。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null}],\"explanation\":null,\"correctOptions\":[],\"attempts\":[],\"_count\":{\"attempts\":0},\"isDebated\":false,\"isBookmarked\":false},{\"id\":444,\"year\":\"令和3年 (CBT)\",\"questionNumber\":13,\"field\":null,\"majorField\":\"貨物\",\"subField\":\"その他\",\"content\":\"道路交通法に定める自動車の種類についての次の記述のうち、【誤っているもの1 つ】選びなさい。なお、解答にあたっては、各選択肢に記載されている事項以外は考慮しないものとする。\",\"imageUrl\":null,\"sourceSheet\":null,\"knowledgeTags\":\"\",\"riskCategory\":null,\"situationCategory\":null,\"format\":\"SINGLE\",\"pdfUrl\":\"/data/R03.CBT.pdf\",\"pdfPage\":7,\"options\":[{\"id\":1804,\"questionId\":444,\"optionNumber\":1,\"content\":\"乗車定員が 2 人、最大積載量が 6,250 キログラム、及び車両総重量 10,110 キログラムの貨物自動車の種類は、大型自動車である。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":1805,\"questionId\":444,\"optionNumber\":2,\"content\":\"乗車定員が 2 人、最大積載量が 4,750 キログラム、及び車両総重量 8,160 キログラムの貨物自動車の種類は、中型自動車である。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":1806,\"questionId\":444,\"optionNumber\":3,\"content\":\"乗車定員が 3 人、最大積載量が 3,000 キログラム、及び車両総重量 5,955 キログラムの貨物自動車の種類は、準中型自動車である。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":1807,\"questionId\":444,\"optionNumber\":4,\"content\":\"乗車定員が 2 人、最大積載量が 1,750 キログラム、及び車両総重量 3,490 キログラムの貨物自動車の種類は、普通自動車である。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null}],\"explanation\":null,\"correctOptions\":[],\"attempts\":[],\"_count\":{\"attempts\":0},\"isDebated\":false,\"isBookmarked\":false},{\"id\":445,\"year\":\"令和3年 (CBT)\",\"questionNumber\":14,\"field\":null,\"majorField\":\"貨物\",\"subField\":\"その他\",\"content\":\"道路交通法に定める車両の交通方法等について次の記述のうち、【正しいものを2 つ】選びなさい。なお、解答にあたっては、各選択肢に記載されている事項以外は考慮しないものとする。\",\"imageUrl\":null,\"sourceSheet\":null,\"knowledgeTags\":\"\",\"riskCategory\":null,\"situationCategory\":null,\"format\":\"SINGLE\",\"pdfUrl\":\"/data/R03.CBT.pdf\",\"pdfPage\":7,\"options\":[{\"id\":1808,\"questionId\":445,\"optionNumber\":1,\"content\":\"車両の運転者が同一方向に進行しながら進路を左方又は右方に変えるときの合図を行う時期は、その行為をしようとする地点から 30 メートル手前の地点に達したときである。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":1809,\"questionId\":445,\"optionNumber\":2,\"content\":\"車両は、道路の中央から左の部分の幅員が 8 メートルに満たない道路において、他の車両を追い越そうとするとき（道路の中央から右の部分を見とおすことができ、かつ、反対の方向からの交通を妨げるおそれがない場合に限るものとし、道路標識等により追越しのため道路の中央から右の部分にはみ出して通行することが禁止されている場合を除く。）は、道路の中央から右の部分にその全部又は一部をはみ出して通行することができる。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":1810,\"questionId\":445,\"optionNumber\":3,\"content\":\"車両は、道路外の施設又は場所に出入するためやむを得ない場合において歩道又は路側帯（以下「歩道等」という。）を横断するとき、又は法令の規定により歩道等で停車し、若しくは駐車するため必要な限度において歩道等を通行するときは、一時停止し、かつ、歩行者の通行を妨げないようにしなければならない。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":1811,\"questionId\":445,\"optionNumber\":4,\"content\":\"一般乗合旅客自動車運送事業者による路線定期運行の用に供する自動車（以下「路線バス等」という。）の優先通行帯であることが道路標識等により表示されている車両通行帯が設けられている道路においては、自動車（路線バス等を除く。）は、路線バス等が後方から接近してきた場合に当該道路における交通の混雑のため当該車両通行帯から出ることができないこととなるときは、当該車両通行帯を通行してはならない。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null}],\"explanation\":null,\"correctOptions\":[],\"attempts\":[],\"_count\":{\"attempts\":0},\"isDebated\":false,\"isBookmarked\":false},{\"id\":446,\"year\":\"令和3年 (CBT)\",\"questionNumber\":15,\"field\":null,\"majorField\":\"貨物\",\"subField\":\"その他\",\"content\":\"道路交通法及び道路交通法施行令に定める酒気帯び運転等の禁止等に関する次の文中、Ａ、Ｂ、Ｃに入るべき字句として【いずれか正しいものを 1 つ】選びなさい。（※法改正により一部改変）\\n(1) 何人も、酒気を帯びて車両等を運転してはならない。\\n(2) 何人も、酒気を帯びている者で、(1)の規定に違反して車両等を運転することとなるおそれがあるものに対し、 Ａ してはならない。\\n(3) 何人も、(1)の規定に違反して車両等を運転することとなるおそれがある者に対し、酒類を提供し、又は飲酒をすすめてはならない。\\n(4) 何人も、車両（トロリーバス及び旅客自動車運送事業の用に供する自動車で当該業務に従事中のものその他の政令で定める自動車を除く。）の運転者が酒気を帯びていることを知りながら、当該運転者に対し、当該車両を運転して自己を運送することを要求し、又は依頼して、当該運転者が(1)の規定に違反して運転するＢ してはならない。\\n(5) (1)の規定に違反して車両等（自転車以外の軽車両を除く。）を運転した者で、その運転をした場合において身体に血液 1 ミリリットルにつき 0.3 ミリグラム又は呼気 1 リットルにつき Ｃ ミリグラム以上にアルコールを保有する状態にあったものは、3 年以下の拘禁刑又は 50 万円以下の罰金に処する。\",\"imageUrl\":null,\"sourceSheet\":null,\"knowledgeTags\":\"\",\"riskCategory\":null,\"situationCategory\":null,\"format\":\"MULTI_GROUP\",\"pdfUrl\":\"/data/R03.CBT.pdf\",\"pdfPage\":8,\"options\":[{\"id\":1812,\"questionId\":446,\"optionNumber\":1,\"content\":\"Ａ：① 車両等を提供 ② 運転を指示\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":1813,\"questionId\":446,\"optionNumber\":2,\"content\":\"Ｂ：① 機会を提供 ② 車両に同乗\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":1814,\"questionId\":446,\"optionNumber\":3,\"content\":\"Ｃ：① 0.15 ② 0.25\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null}],\"explanation\":null,\"correctOptions\":[],\"attempts\":[],\"_count\":{\"attempts\":0},\"isDebated\":false,\"isBookmarked\":false},{\"id\":447,\"year\":\"令和3年 (CBT)\",\"questionNumber\":16,\"field\":null,\"majorField\":\"貨物\",\"subField\":\"その他\",\"content\":\"次に掲げる標識に関する次の記述のうち、【正しいものを 2 つ】選びなさい。\",\"imageUrl\":\"/extracted_images/R03.CBT_Q16.png\",\"sourceSheet\":null,\"knowledgeTags\":\"#NEEDS_IMAGE\",\"riskCategory\":null,\"situationCategory\":null,\"format\":\"SINGLE\",\"pdfUrl\":\"/data/R03.CBT.pdf\",\"pdfPage\":9,\"options\":[{\"id\":1815,\"questionId\":447,\"optionNumber\":1,\"content\":\"車両は、指定された方向以外の方向に進行してはならない。\\n「道路標識、区画線及び道路標示に関する命令」に定める様式\\n文字及び記号を青色、斜めの帯及び枠を赤色、縁及び地を白色とする。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":1816,\"questionId\":447,\"optionNumber\":2,\"content\":\"車両は、黄色又は赤色の灯火の信号にかかわらず左折することができる。\\n道路交通法施行規則 別記様式第 1\\n矢印及びわくの色彩は青色、地の色彩は白色とする。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":1817,\"questionId\":447,\"optionNumber\":3,\"content\":\"車両総重量が 7,980 キログラムで最大積載量が 4,000 キログラムの中型自動車（専ら人を運搬する構造のもの以外のもの）は通行してはならない。\\n「道路標識、区画線及び道路標示に関する命令」に定める様式\\n文字及び記号を青色、斜めの帯及び枠を赤色、縁及び地を白色とする。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":1818,\"questionId\":447,\"optionNumber\":4,\"content\":\"大型貨物自動車、特定中型貨物自動車及び大型特殊自動車は、最も左側の車両通行帯を通行しなければならない。\\n「道路標識、区画線及び道路標示に関する命令」に定める様式\\n文字、記号及び縁を白色、地を青色とする。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null}],\"explanation\":null,\"correctOptions\":[],\"attempts\":[],\"_count\":{\"attempts\":0},\"isDebated\":false,\"isBookmarked\":false},{\"id\":448,\"year\":\"令和3年 (CBT)\",\"questionNumber\":17,\"field\":null,\"majorField\":\"貨物\",\"subField\":\"その他\",\"content\":\"道路交通法に定める運転者の遵守事項等についての次の記述のうち、【誤っているものを 1 つ】選びなさい。なお、解答にあたっては、各選択肢に記載されている事項以外は考慮しないものとする。（※法改正により一部改変）\",\"imageUrl\":null,\"sourceSheet\":null,\"knowledgeTags\":\"\",\"riskCategory\":null,\"situationCategory\":null,\"format\":\"SINGLE\",\"pdfUrl\":\"/data/R03.CBT.pdf\",\"pdfPage\":10,\"options\":[{\"id\":1819,\"questionId\":448,\"optionNumber\":1,\"content\":\"車両等の運転者は、児童、幼児等の乗降のため、道路運送車両の保安基準に関する規定に定める非常点滅表示灯をつけて停車している通学通園バス（専ら小学校、幼稚園等に通う児童、幼児等を運送するために使用する自動車で政令で定めるものをいう。）の側方を通過するときは、徐行して安全を確認しなければならない。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":1820,\"questionId\":448,\"optionNumber\":2,\"content\":\"自動車の運転者は、故障その他の理由により高速自動車国道等の本線車道若しくはこれに接する加速車線、減速車線若しくは登坂車線又はこれらに接する路肩若しくは路側帯において当該自動車を運転することができなくなったときは、道路交通法施行令で定めるところにより、停止表示器材を後方から進行してくる自動車の運転者が見やすい位置に置いて、当該自動車が故障その他の理由により停止しているものであることを表示しなければならない。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":1821,\"questionId\":448,\"optionNumber\":3,\"content\":\"運転免許（仮運転免許を除く。）を受けた者が自動車等の運転に関し、当該自動車等の交通による人の死傷があった場合において、道路交通法第 72 条第 1 項前段の規定（交通事故があったときは、直ちに車両等の運転を停止して、負傷者を救護し、道路における危険を防止する等必要な措置を講じなければならない。）に違反したときは、その者が当該違反をしたときにおけるその者の住所地を管轄する公安委員会は、その者の運転免許を取り消すことができる。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":1822,\"questionId\":448,\"optionNumber\":4,\"content\":\"車両等の運転者は、身体障害者用の車が通行しているときは、その側方を離れて走行し、通行を妨げないようにしなければならない。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null}],\"explanation\":null,\"correctOptions\":[],\"attempts\":[],\"_count\":{\"attempts\":0},\"isDebated\":false,\"isBookmarked\":false},{\"id\":449,\"year\":\"令和3年 (CBT)\",\"questionNumber\":18,\"field\":null,\"majorField\":\"貨物\",\"subField\":\"その他\",\"content\":\"労働基準法（以下「法」という。）に定める労働契約等についての次の記述のうち、【正しいものを 2 つ】選びなさい。なお、解答にあたっては、各選択肢に記載されている事項以外は考慮しないものとする。\",\"imageUrl\":null,\"sourceSheet\":null,\"knowledgeTags\":\"\",\"riskCategory\":null,\"situationCategory\":null,\"format\":\"SINGLE\",\"pdfUrl\":\"/data/R03.CBT.pdf\",\"pdfPage\":10,\"options\":[{\"id\":1823,\"questionId\":449,\"optionNumber\":1,\"content\":\"使用者は、労働契約の不履行について違約金を定め、又は損害賠償額を予定する契約をしてはならない。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":1824,\"questionId\":449,\"optionNumber\":2,\"content\":\"法第 20 条（解雇の予告）の規定は、「季節的業務に 4 ヵ月以内の期間を定めて使用される者」に該当する労働者について、当該者が法に定める期間を超えて引き続き使用されるに至らない限り適用しない。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":1825,\"questionId\":449,\"optionNumber\":3,\"content\":\"「平均賃金」とは、これを算定すべき事由の発生した日以前 3 ヵ月間にその労働者に対し支払われた賃金の総額を、その期間の所定労働日数で除した金額をいう。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":1826,\"questionId\":449,\"optionNumber\":4,\"content\":\"出来高払制その他の請負制で使用する労働者については、使用者は、労働時間にかかわらず一定額の賃金の保障をしなければならない。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null}],\"explanation\":null,\"correctOptions\":[],\"attempts\":[],\"_count\":{\"attempts\":0},\"isDebated\":false,\"isBookmarked\":false},{\"id\":450,\"year\":\"令和3年 (CBT)\",\"questionNumber\":19,\"field\":null,\"majorField\":\"貨物\",\"subField\":\"その他\",\"content\":\"労働基準法（以下「法」という。）に定める労働時間及び休日等に関する次の記述のうち、【誤っているものを 1 つ】選びなさい。なお、解答にあたっては、各選択肢に記載されている事項以外は考慮しないものとする。\",\"imageUrl\":null,\"sourceSheet\":null,\"knowledgeTags\":\"\",\"riskCategory\":null,\"situationCategory\":null,\"format\":\"SINGLE\",\"pdfUrl\":\"/data/R03.CBT.pdf\",\"pdfPage\":11,\"options\":[{\"id\":1827,\"questionId\":450,\"optionNumber\":1,\"content\":\"使用者は、当該事業場に、労働者の過半数で組織する労働組合がある場合においてはその労働組合、労働者の過半数で組織する労働組合がない場合においては使用者が指名する労働者との書面による協定をし、これを行政官庁に届け出た場合においては、法定労働時間又は法定休日に関する規定にかかわらず、その協定で定めるところによって労働時間を延長し、又は休日に労働させることができる。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":1828,\"questionId\":450,\"optionNumber\":2,\"content\":\"生後満 1 年に達しない生児を育てる女性は､法で定める所定の休憩時間のほか、1日 2 回各々少なくとも 30 分、その生児を育てるための時間を請求することができる。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":1829,\"questionId\":450,\"optionNumber\":3,\"content\":\"使用者は、労働者に対して、毎週少くとも 1 回の休日を与えなければならない。ただし、この規定は、4 週間を通じ 4 日以上の休日を与える使用者については適用しない。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":1830,\"questionId\":450,\"optionNumber\":4,\"content\":\"使用者が、法の規定により労働時間を延長し、又は休日に労働させた場合においては、その時間又はその日の労働については、通常の労働時間又は労働日の賃金の計算額の 2 割 5 分以上 5 割以下の範囲内でそれぞれ政令で定める率以上の率で計算した割増賃金を支払わなければならない。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null}],\"explanation\":null,\"correctOptions\":[],\"attempts\":[],\"_count\":{\"attempts\":0},\"isDebated\":false,\"isBookmarked\":false},{\"id\":451,\"year\":\"令和3年 (CBT)\",\"questionNumber\":20,\"field\":null,\"majorField\":\"貨物\",\"subField\":\"その他\",\"content\":\"「自動車運転者の労働時間等の改善のための基準」等に定める貨物自動車運送事業に従事する自動車運転者（以下「トラック運転者」という。）の拘束時間等に関する次の文中、Ａ、Ｂ、Ｃ、Ｄに入るべき字句として【いずれか正しいものを 1 つ】選びなさい。（※法改正により一部改変）\\n1．拘束時間は、1 ヵ月について 284 時間を超えず、かつ、1 年について Ａ を超えないものとすること。ただし、労使協定により、1 年について 6 ヵ月までは、1 ヵ月について Ｂ まで延長することができ、かつ、1 年について Ｃ まで延長することができる。\\n2．トラック運転者のフェリー乗船時間は、原則として、 Ｄ として取り扱うものとする。\",\"imageUrl\":null,\"sourceSheet\":null,\"knowledgeTags\":\"\",\"riskCategory\":null,\"situationCategory\":null,\"format\":\"MULTI_GROUP\",\"pdfUrl\":\"/data/R03.CBT.pdf\",\"pdfPage\":11,\"options\":[{\"id\":1831,\"questionId\":451,\"optionNumber\":1,\"content\":\"Ａ：① 3,300 時間 ② 3,360 時間\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":1832,\"questionId\":451,\"optionNumber\":2,\"content\":\"Ｂ：① 310 時間 ② 315 時間\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":1833,\"questionId\":451,\"optionNumber\":3,\"content\":\"Ｃ：① 3,400 時間 ② 3,408 時間\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":1834,\"questionId\":451,\"optionNumber\":4,\"content\":\"Ｄ：① 拘束時間 ② 休息期間\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null}],\"explanation\":null,\"correctOptions\":[],\"attempts\":[],\"_count\":{\"attempts\":0},\"isDebated\":false,\"isBookmarked\":false},{\"id\":452,\"year\":\"令和3年 (CBT)\",\"questionNumber\":21,\"field\":null,\"majorField\":\"貨物\",\"subField\":\"その他\",\"content\":\"「自動車運転者の労働時間等の改善のための基準」において定める貨物自動車運送事業に従事する自動車運転者（以下「トラック運転者」という。）の拘束時間等の規定に関する次の記述のうち、【正しいものを２つ】選びなさい。なお、解答にあたっては、各選択肢に記載されている事項以外は考慮しないものとする。\",\"imageUrl\":null,\"sourceSheet\":null,\"knowledgeTags\":\"\",\"riskCategory\":null,\"situationCategory\":null,\"format\":\"MULTI_GROUP\",\"pdfUrl\":\"/data/R03.CBT.pdf\",\"pdfPage\":12,\"options\":[{\"id\":1835,\"questionId\":452,\"optionNumber\":1,\"content\":\"使用者は、業務の必要上やむを得ない場合には、当分の間、2 暦日についての拘束時間が 21 時間を超えず、かつ、勤務終了後、継続 20 時間以上の休息期間を与える場合に限り、トラック運転者を隔日勤務に就かせることができる。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":1836,\"questionId\":452,\"optionNumber\":2,\"content\":\"使用者は、トラック運転者の運転時間については、2 日（始業時刻から起算して48 時間をいう。）を平均し 1 日当たり 9 時間、2 週間を平均し 1 週間当たり 44 時間を超えないものとする。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":1837,\"questionId\":452,\"optionNumber\":3,\"content\":\"使用者は、トラック運転者の 1 日（始業時刻から起算して 24 時間をいう。以下同じ。）についての拘束時間は、12 時間を超えないものとし、当該拘束時間を延長する場合であっても、最大拘束時間は 14 時間とすること。ただし、1 週間における運行が全て法令に定める長距離貨物運送であり、かつ、一の運行における休息期間が、当該トラック運転者の住所地以外の場所におけるものである場合においては、当該1 週間について 2 回に限り最大拘束時間を 16 時間とすることができる。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":1838,\"questionId\":452,\"optionNumber\":4,\"content\":\"業務の必要上、トラック運転者に勤務の終了後継続 9 時間（改善基準告示第 4 条第 1 項第 3 号ただし書に該当する場合は継続 8 時間）以上の休息期間を与えることが困難な場合、当分の間、一定期間における全勤務回数の 2 分の 1 を限度に、休息期間を拘束時間の途中及び拘束時間の経過直後に分割して与えることができる。この場合において、分割された休息期間は、1 回当たり継続 3 時間以上とし、2 分割又は 3 分割とする。また、1 日において、2 分割及び 3 分割いずれの場合も合計 10 時間以上の休息期間を与えなければならない。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null}],\"explanation\":null,\"correctOptions\":[],\"attempts\":[],\"_count\":{\"attempts\":0},\"isDebated\":false,\"isBookmarked\":false},{\"id\":453,\"year\":\"令和3年 (CBT)\",\"questionNumber\":22,\"field\":null,\"majorField\":\"貨物\",\"subField\":\"その他\",\"content\":\"下図は、貨物自動車運送事業に従事する自動車運転者の運転時間及び休憩時間の例を示したものであるが、このうち、連続運転の中断方法として「自動車運転者の労働時間等の改善のための基準」に【適合しているものを２つ】選びなさい。なお、解答にあたっては、下図に示された内容以外は考慮しないものとする。\",\"imageUrl\":\"/extracted_images/R03.CBT_Q22.png\",\"sourceSheet\":null,\"knowledgeTags\":\"#NEEDS_IMAGE\",\"riskCategory\":null,\"situationCategory\":null,\"format\":\"MULTI_GROUP\",\"pdfUrl\":\"/data/R03.CBT.pdf\",\"pdfPage\":13,\"options\":[{\"id\":1839,\"questionId\":453,\"optionNumber\":1,\"content\":\"パターン1\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":1840,\"questionId\":453,\"optionNumber\":2,\"content\":\"パターン2\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":1841,\"questionId\":453,\"optionNumber\":3,\"content\":\"パターン3\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":1842,\"questionId\":453,\"optionNumber\":4,\"content\":\"パターン4\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null}],\"explanation\":null,\"correctOptions\":[],\"attempts\":[],\"_count\":{\"attempts\":0},\"isDebated\":false,\"isBookmarked\":false},{\"id\":454,\"year\":\"令和3年 (CBT)\",\"questionNumber\":23,\"field\":null,\"majorField\":\"貨物\",\"subField\":\"その他\",\"content\":\"下表は、貨物自動車運送事業に従事する自動車運転者（隔日勤務に就く運転者以外のもの。）の 1 年間における各月の拘束時間の例を示したものであるが、このうち、「自動車運転者の労働時間等の改善のための基準」に【適合するものを 1 つ】選びなさい。ただし、「1 ヵ月及び 1 年についての拘束時間の延長に関する労使協定」があるものとする。\",\"imageUrl\":\"/extracted_images/R03.CBT_Q23.png\",\"sourceSheet\":null,\"knowledgeTags\":\"#NEEDS_IMAGE\",\"riskCategory\":null,\"situationCategory\":null,\"format\":\"SINGLE\",\"pdfUrl\":\"/data/R03.CBT.pdf\",\"pdfPage\":13,\"options\":[{\"id\":1843,\"questionId\":454,\"optionNumber\":1,\"content\":\"表1のパターン\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":1844,\"questionId\":454,\"optionNumber\":2,\"content\":\"表2のパターン\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":1845,\"questionId\":454,\"optionNumber\":3,\"content\":\"表3のパターン\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":1846,\"questionId\":454,\"optionNumber\":4,\"content\":\"表4のパターン\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null}],\"explanation\":null,\"correctOptions\":[],\"attempts\":[],\"_count\":{\"attempts\":0},\"isDebated\":false,\"isBookmarked\":false},{\"id\":455,\"year\":\"令和3年 (CBT)\",\"questionNumber\":24,\"field\":null,\"majorField\":\"貨物\",\"subField\":\"その他\",\"content\":\"下表は、貨物自動車運送事業者が、法令の規定により運転者ごとに行う点呼の記録表の一例を示したものである。この記録表に関し、Ａ、Ｂ、Ｃに入る【最もふさわしい事項を下の選択肢（①～⑧）から 1 つ】選びなさい。\",\"imageUrl\":\"/extracted_images/R03.CBT_Q24.png\",\"sourceSheet\":null,\"knowledgeTags\":\"#NEEDS_IMAGE\",\"riskCategory\":null,\"situationCategory\":null,\"format\":\"SINGLE\",\"pdfUrl\":\"/data/R03.CBT.pdf\",\"pdfPage\":14,\"options\":[{\"id\":1847,\"questionId\":455,\"optionNumber\":1,\"content\":\"車両の異常の有無\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":1848,\"questionId\":455,\"optionNumber\":2,\"content\":\"貨物の積載状況\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":1849,\"questionId\":455,\"optionNumber\":3,\"content\":\"運転者交替時の通告内容\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":1850,\"questionId\":455,\"optionNumber\":4,\"content\":\"薬物の使用状況\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":1851,\"questionId\":455,\"optionNumber\":5,\"content\":\"指示事項\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":1852,\"questionId\":455,\"optionNumber\":6,\"content\":\"日常点検の状況\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":1853,\"questionId\":455,\"optionNumber\":7,\"content\":\"疾病・疲労・睡眠不足等の状況\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":1854,\"questionId\":455,\"optionNumber\":8,\"content\":\"自動車・道路・運行の状況\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null}],\"explanation\":null,\"correctOptions\":[],\"attempts\":[],\"_count\":{\"attempts\":0},\"isDebated\":false,\"isBookmarked\":false},{\"id\":456,\"year\":\"令和3年 (CBT)\",\"questionNumber\":25,\"field\":null,\"majorField\":\"貨物\",\"subField\":\"その他\",\"content\":\"一般貨物自動車運送事業者が事業用自動車の運転者に対して行う指導・監督に関する次の記述のうち、【適切なものをすべて】選びなさい。なお、解答にあたっては、各選択肢に記載されている事項以外は考慮しないものとする。\",\"imageUrl\":null,\"sourceSheet\":null,\"knowledgeTags\":\"\",\"riskCategory\":null,\"situationCategory\":null,\"format\":\"MULTI_GROUP\",\"pdfUrl\":\"/data/R03.CBT.pdf\",\"pdfPage\":15,\"options\":[{\"id\":1855,\"questionId\":456,\"optionNumber\":1,\"content\":\"運転者が交通事故を起こした場合、事故の被害状況を確認し、負傷者がいるときは、まず最初に運行管理者に連絡した後、負傷者の救護、道路における危険の防止、警察への報告などの必要な措置を講じるよう運転者に対し指導している。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":1856,\"questionId\":456,\"optionNumber\":2,\"content\":\"他の自動車に追従して走行するときは、常に「秒」の意識をもって自車の速度と制動距離（ブレーキが効きはじめてから止まるまでに走った距離）に留意し、前車への追突の危険が発生した場合でも安全に停止できるよう、制動距離と同程度の車間距離を保って運転するよう指導している。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":1857,\"questionId\":456,\"optionNumber\":3,\"content\":\"実際の事故事例やヒヤリハット事例のドライブレコーダー映像を活用して、事故前にどのような危険が潜んでいるか、それを回避するにはどのような運転をすべきかなどを運転者に考えさせる等、実事例に基づいた危険予知訓練を実施している。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":1858,\"questionId\":456,\"optionNumber\":4,\"content\":\"飲酒は、速度感覚の麻痺、視力の低下、反応時間の遅れ、眠気が生じるなど自動車の運転に極めて深刻な影響を及ぼす。個人差はあるものの、体内に入ったビール500 ミリリットル（アルコール 5％）が分解処理されるのに概ね 2 時間が目安とされていることから、乗務前日の飲酒・酒量については、運転に影響のないよう十分気をつけることを運転者に指導している。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null}],\"explanation\":null,\"correctOptions\":[],\"attempts\":[],\"_count\":{\"attempts\":0},\"isDebated\":false,\"isBookmarked\":false},{\"id\":457,\"year\":\"令和3年 (CBT)\",\"questionNumber\":26,\"field\":null,\"majorField\":\"貨物\",\"subField\":\"その他\",\"content\":\"事業用自動車の運転者の健康管理に関する次の記述のうち、【適切なものをすべて】選びなさい。なお、解答にあたっては、各選択肢に記載されている事項以外は考慮しないものとする。\",\"imageUrl\":null,\"sourceSheet\":null,\"knowledgeTags\":\"\",\"riskCategory\":null,\"situationCategory\":null,\"format\":\"MULTI_GROUP\",\"pdfUrl\":\"/data/R03.CBT.pdf\",\"pdfPage\":15,\"options\":[{\"id\":1859,\"questionId\":457,\"optionNumber\":1,\"content\":\"事業者は、業務に従事する運転者に対し法令で定める健康診断を受診させ、その結果に基づいて健康診断個人票を作成して 3 年間保存している。また、運転者が自ら受けた健康診断の結果を提出したものについても同様に保存している。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":1860,\"questionId\":457,\"optionNumber\":2,\"content\":\"事業者は、運転者が軽症度の睡眠時無呼吸症候群（ＳＡＳ）と診断された場合は、残業を控えるなど業務上での負荷の軽減や、睡眠時間を多く取る、過度な飲酒を控えるなどの生活習慣の改善によって、業務が可能な場合があるので、医師と相談して慎重に対応している。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":1861,\"questionId\":457,\"optionNumber\":3,\"content\":\"常習的な飲酒運転の背景には、アルコール依存症という病気があるといわれている。この病気は専門医による早期の治療をすることにより回復が可能とされているが、一度回復しても飲酒することにより再発することがあるため、事業者は、アルコール依存症から回復した運転者に対しても飲酒に関する指導を行う必要がある。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":1862,\"questionId\":457,\"optionNumber\":4,\"content\":\"運転者が運転中に安全運転の継続が困難となるような体調不良や異常を感じた場合、速やかに安全な場所に事業用自動車を停止させ、運行管理者に連絡し、指示を受けるよう指導している。また、交替運転者が配置されていない場合は、その後の運行再開の可否については、体調の状況を運転者が自ら判断し決定するよう指導している。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null}],\"explanation\":null,\"correctOptions\":[],\"attempts\":[],\"_count\":{\"attempts\":0},\"isDebated\":false,\"isBookmarked\":false},{\"id\":458,\"year\":\"令和3年 (CBT)\",\"questionNumber\":27,\"field\":null,\"majorField\":\"貨物\",\"subField\":\"その他\",\"content\":\"交通事故防止対策に関する次の記述のうち、【適切なものをすべて】選びなさい。なお、解答にあたっては、各選択肢に記載されている事項以外は考慮しないものとする。\",\"imageUrl\":null,\"sourceSheet\":null,\"knowledgeTags\":\"\",\"riskCategory\":null,\"situationCategory\":null,\"format\":\"MULTI_GROUP\",\"pdfUrl\":\"/data/R03.CBT.pdf\",\"pdfPage\":16,\"options\":[{\"id\":1863,\"questionId\":458,\"optionNumber\":1,\"content\":\"ドライブレコーダーは、事故時の映像だけでなく、運転者のブレーキ操作やハンドル操作などの運転状況を記録し、解析することにより運転のクセ等を読み取ることができるものがあり、運行管理者が行う運転者の安全運転の指導に活用されている。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":1864,\"questionId\":458,\"optionNumber\":2,\"content\":\"前方の自動車を大型車と乗用車から同じ距離で見た場合、それぞれの視界や見え方が異なり、大型車の場合には運転席が高いため、車間距離をつめてもあまり危険に感じない傾向となるので、この点に注意して常に適正な車間距離をとるよう運転者を指導する必要がある。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":1865,\"questionId\":458,\"optionNumber\":3,\"content\":\"四輪車を運転する場合、二輪車との衝突事故を防止するための注意点として、①二輪車は死角に入りやすいため、その存在に気づきにくく、また、②二輪車は速度が実際より速く感じたり、距離が近くに見えたりする特性がある。したがって、運転者に対してこのような点に注意するよう指導する必要がある。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":1866,\"questionId\":458,\"optionNumber\":4,\"content\":\"自動車のハンドルを左に切り旋回した場合、左側の後輪が左側の前輪の軌跡に対し外側を通ることとなり、この前後輪の軌跡の差を内輪差という。大型車などホイールベースが長いほど内輪差が小さくなることから、運転者に対し、交差点での左折時には、内輪差による歩行者や自転車等との接触、巻き込み事故に注意するよう指導する必要がある。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null}],\"explanation\":null,\"correctOptions\":[],\"attempts\":[],\"_count\":{\"attempts\":0},\"isDebated\":false,\"isBookmarked\":false},{\"id\":459,\"year\":\"令和3年 (CBT)\",\"questionNumber\":28,\"field\":null,\"majorField\":\"貨物\",\"subField\":\"その他\",\"content\":\"自動車の運転に関する次の記述のＡ、Ｂ、Ｃ、Ｄに入るべき字句として【いずれか正しいものを 1 つ】選びなさい。\\n1．自動車の夜間の走行時において、自車のライトと対向車のライトで、お互いの光が反射し合い、その間にいる歩行者や自転車が見えなくなることを［ Ａ ］という。\\n2．自動車がカーブを走行するとき、自動車の重量及びカーブの半径が同一の場合に、速度を 2 分の 1 に落として走行すると遠心力の大きさは［ Ｂ ］になる。\\n3．長い下り坂などでフット・ブレーキを使い過ぎるとブレーキ・ドラムやブレーキ・ライニングなどが摩擦のため過熱することによりドラムとライニングの間の摩擦力が減り、制動力が低下することを［ Ｃ ］という。\\n4．自動車が衝突するときの衝撃力は、車両総重量が 2 倍になると［ Ｄ ］になる。\",\"imageUrl\":null,\"sourceSheet\":null,\"knowledgeTags\":\"\",\"riskCategory\":null,\"situationCategory\":null,\"format\":\"SINGLE\",\"pdfUrl\":\"/data/R03.CBT.pdf\",\"pdfPage\":16,\"options\":[{\"id\":1867,\"questionId\":459,\"optionNumber\":1,\"content\":\"Ａ：① 蒸発現象\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":1868,\"questionId\":459,\"optionNumber\":2,\"content\":\"Ａ：② クリープ現象\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":1869,\"questionId\":459,\"optionNumber\":3,\"content\":\"Ｂ：① 4 分の 1\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":1870,\"questionId\":459,\"optionNumber\":4,\"content\":\"Ｂ：② 2 分の 1\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":1871,\"questionId\":459,\"optionNumber\":5,\"content\":\"Ｃ：① べーパー・ロック現象\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":1872,\"questionId\":459,\"optionNumber\":6,\"content\":\"Ｃ：② フェード現象\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":1873,\"questionId\":459,\"optionNumber\":7,\"content\":\"Ｄ：① 2 倍\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":1874,\"questionId\":459,\"optionNumber\":8,\"content\":\"Ｄ：② 4 倍\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null}],\"explanation\":null,\"correctOptions\":[],\"attempts\":[],\"_count\":{\"attempts\":0},\"isDebated\":false,\"isBookmarked\":false},{\"id\":460,\"year\":\"令和3年 (CBT)\",\"questionNumber\":29,\"field\":null,\"majorField\":\"貨物\",\"subField\":\"その他\",\"content\":\"荷主から貨物自動車運送事業者に対し、往路と復路において、それぞれ荷積みと荷下ろしを行うよう運送の依頼があった。これを受けて運行管理者は下の図に示す運行計画を立てた。この運行に関する次の 1～3 の記述について、解答しなさい。なお、解答にあたっては＜運行計画＞及び各選択肢に記載されている事項以外は考慮しないものとする。\\n1．Ｃ料金所からＤ料金所までの間の高速自動車国道の運転時間を、2 時間と設定したことは、道路交通法令に定める制限速度に照らし適切か否かについて、【いずれか正しいものを 1 つ】選びなさい。\\n2．当該運転者の前日の運転時間は 9 時間 20 分であり、また、当該運転者の翌日の運転時間は 9 時間 20 分と予定した場合、当日を特定日とした場合の 2 日を平均した 1日当たりの運転時間は、「自動車運転者の労働時間等の改善のための基準」（以下「改善基準告示」という。）に照らし、違反しているか否かについて、【いずれか正しいものを 1 つ】選びなさい。\\n3．当日の全運行において、連続運転時間は「改善基準告示」に照らし、違反しているか否かについて、【いずれか正しいものを 1 つ】選びなさい。\",\"imageUrl\":\"/extracted_images/R03.CBT_Q29.png\",\"sourceSheet\":null,\"knowledgeTags\":\"#NEEDS_IMAGE\",\"riskCategory\":null,\"situationCategory\":null,\"format\":\"MULTI_GROUP\",\"pdfUrl\":\"/data/R03.CBT.pdf\",\"pdfPage\":17,\"options\":[{\"id\":1875,\"questionId\":460,\"optionNumber\":1,\"content\":\"1. ① 適切\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":1876,\"questionId\":460,\"optionNumber\":2,\"content\":\"1. ② 不適切\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":1877,\"questionId\":460,\"optionNumber\":3,\"content\":\"2. ① 違反している\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":1878,\"questionId\":460,\"optionNumber\":4,\"content\":\"2. ② 違反していない\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":1879,\"questionId\":460,\"optionNumber\":5,\"content\":\"3. ① 違反している\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":1880,\"questionId\":460,\"optionNumber\":6,\"content\":\"3. ② 違反していない\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null}],\"explanation\":null,\"correctOptions\":[],\"attempts\":[],\"_count\":{\"attempts\":0},\"isDebated\":false,\"isBookmarked\":false},{\"id\":461,\"year\":\"令和3年 (CBT)\",\"questionNumber\":30,\"field\":null,\"majorField\":\"貨物\",\"subField\":\"その他\",\"content\":\"運行管理者が次の事業用普通トラックの事故報告に基づき、この事故の要因分析を行ったうえで、同種事故の再発を防止するための対策として、【最も直接的に有効と考えられる組合せを、下の選択肢（①～⑧）から 1 つ】選びなさい。なお、解答にあたっては、＜事故の概要＞及び＜事故関連情報＞に記載されている事項以外は考慮しないものとする。\\n＜事故の概要＞\\n当該トラックは、17 時頃、霧で見通しの悪い高速道路を走行中、居眠り運転により渋滞車列の最後尾にいた乗用車に追突した。当該トラックは当該乗用車を中央分離帯に押し出したのち、前方の乗用車 3 台に次々と追突し、通行帯上に停止した。\\nこの事故により、最初に追突された乗用車に乗車していた 3 人が死亡し、当該トラックの運転者を含む 7 人が重軽傷を負った。当時霧のため当該道路の最高速度は時速 50 キロメートルに制限されていたが、当該トラックは追突直前には時速 80 キロメートルで走行していた。\\n＜事故関連情報＞\\n○ 当該運転者は、事故日前日運行先に積雪があり、帰庫時間が 5 時間程度遅くなって業務を早朝 5 時に終了した。その後、事故当日の正午に業務前点呼を受け出庫した。\\n○ 当該運転者は、事故日前 1 ヵ月間の勤務において、拘束時間及び休息期間について複数回の「自動車運転者の労働時間等の改善のための基準」（以下「改善基準告示」という｡）違反があった。\\n○ 当該運転者に対する業務前点呼はアルコール検知器を使用し対面で行われていたが、睡眠不足等の運転者の体調確認は行われていなかった。\\n○ 当該営業所では、年度ごとの教育計画に基づき、所長自ら月 1 回ミーティングを実施していたが、交通事故を惹起した場合の社会的影響の大きさや、疲労などの生理的要因による交通事故の危険性などについて理解させる指導・教育が不足していた。\\n○ 当該運転者は、採用後 2 年が経過していたが、初任運転者に対する適性診断を受診していなかった。\\n○ 当該事業者は、年 2 回の定期健康診断の実施計画に基づき実施しており、当該運転者は、これらの定期健康診断を受診していた。\\n○ 当該トラックは、法令で定められた日常点検及び定期点検を実施していた。また、速度抑制装置（スピードリミッター）が取り付けられていた。\",\"imageUrl\":\"/extracted_images/R03.CBT_Q30.png\",\"sourceSheet\":null,\"knowledgeTags\":\"#NEEDS_IMAGE\",\"riskCategory\":null,\"situationCategory\":null,\"format\":\"SINGLE\",\"pdfUrl\":\"/data/R03.CBT.pdf\",\"pdfPage\":18,\"options\":[{\"id\":1881,\"questionId\":461,\"optionNumber\":1,\"content\":\"① ア・イ・エ・オ\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":1882,\"questionId\":461,\"optionNumber\":2,\"content\":\"② ア・イ・カ・キ\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":1883,\"questionId\":461,\"optionNumber\":3,\"content\":\"③ ア・ウ・エ・キ\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":1884,\"questionId\":461,\"optionNumber\":4,\"content\":\"④ ア・ウ・オ・カ\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":1885,\"questionId\":461,\"optionNumber\":5,\"content\":\"⑤ イ・エ・キ・ク\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":1886,\"questionId\":461,\"optionNumber\":6,\"content\":\"⑥ イ・エ・カ・ク\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":1887,\"questionId\":461,\"optionNumber\":7,\"content\":\"⑦ ウ・オ・キ・ク\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":1888,\"questionId\":461,\"optionNumber\":8,\"content\":\"⑧ ウ・オ・カ・ク\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null}],\"explanation\":null,\"correctOptions\":[],\"attempts\":[],\"_count\":{\"attempts\":0},\"isDebated\":false,\"isBookmarked\":false}],\"attemptsByDate\":{}}]}]\n"])</script><script>self.__next_f.push([1,"f:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n"])</script><script>self.__next_f.push([1,"41:I[27201,[\"/unkan-app/_next/static/chunks/0u19eq300ch3y.js\",\"/unkan-app/_next/static/chunks/2im7c515bo69p.js\"],\"IconMark\"]\nc:null\n11:[[\"$\",\"title\",\"0\",{\"children\":\"運行管理者 過去問演習・学習ダッシュボード\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"運行管理者の過去問演習・進捗管理アプリ\"}],[\"$\",\"link\",\"2\",{\"rel\":\"icon\",\"href\":\"/unkan-app/favicon.ico?favicon.2vob68tjqpejf.ico\",\"sizes\":\"256x256\",\"type\":\"image/x-icon\"}],[\"$\",\"$L41\",\"3\",{}]]\n"])</script></body></html>
