ほか、反射光の色、明るさ等に関し告示で定める基準に適合する大型後部反射器を備えなければならない。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":1144,\"questionId\":289,\"optionNumber\":3,\"content\":\"自動車（法令に規定する自動車を除く。）の後面には、他の自動車が追突した場合に追突した自動車の車体前部が突入することを有効に防止することができるものとして、強度、形状等に関し告示で定める基準に適合する突入防止装置を備えなければならない。ただし、告示で定める構造の自動車にあっては、この限りでない。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":1145,\"questionId\":289,\"optionNumber\":4,\"content\":\"自動車に備える停止表示器材は、夜間200メートルの距離から走行用前照灯で照射した場合にその反射光を照射位置から確認できるものであることなど告示で定める基準に適合するものでなければならない。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null}],\"explanation\":{\"id\":58,\"questionId\":289,\"content\":\"$2d\",\"isDebated\":true},\"correctOptions\":[],\"attempts\":[],\"_count\":{\"attempts\":0},\"isDebated\":false,\"isBookmarked\":false},{\"id\":290,\"year\":\"令和5年 (CBT)\",\"questionNumber\":13,\"field\":\"道路交通法\",\"majorField\":null,\"subField\":null,\"content\":\"【道路交通法関係】\\n\\n道路交通法に定める用語の定義等についての次の記述のうち、誤っているものを１つ選びなさい。なお、解答にあたっては、各選択肢に記載されている事項以外は考慮しないものとする。\",\"imageUrl\":null,\"sourceSheet\":null,\"knowledgeTags\":null,\"riskCategory\":null,\"situationCategory\":null,\"format\":\"SINGLE\",\"pdfUrl\":null,\"pdfPage\":null,\"options\":[{\"id\":1146,\"questionId\":290,\"optionNumber\":1,\"content\":\"車両通行帯とは、車両が道路の定められた部分を通行すべきことが道路標示により示されている場合における当該道路標示により示されている道路の部分をいう。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":1147,\"questionId\":290,\"optionNumber\":2,\"content\":\"中型自動車とは、大型自動車、大型特殊自動車、大型自動二輪車、普通自動二輪車及び小型特殊自動車以外の自動車で、車両総重量が7,500キログラム以上11,000キログラム未満のもの、最大積載量が4,500キログラム以上6,500キログラム未満のもの又は乗車定員が11人以上29人以下のものをいう。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":1148,\"questionId\":290,\"optionNumber\":3,\"content\":\"路側帯とは、歩行者及び自転車の通行の用に供するため、歩道の設けられていない道路又は道路の歩道の設けられていない側の路端寄りに設けられた帯状の道路の部分で、道路標示によって区画されたものをいう。\",\"isCorrect\":true,\"explanation\":null,\"structuredData\":null},{\"id\":1149,\"questionId\":290,\"optionNumber\":4,\"content\":\"進行妨害とは、車両等が、進行を継続し、又は始めた場合においては危険を防止するため他の車両等がその速度又は方向を急に変更しなければならないこととなるおそれがあるときに、その進行を継続し、又は始めることをいう。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null}],\"explanation\":{\"id\":60,\"questionId\":290,\"content\":\"$2e\",\"isDebated\":true},\"correctOptions\":[],\"attempts\":[],\"_count\":{\"attempts\":0},\"isDebated\":false,\"isBookmarked\":false},{\"id\":291,\"year\":\"令和5年 (CBT)\",\"questionNumber\":14,\"field\":\"道路交通法\",\"majorField\":null,\"subField\":null,\"content\":\"【道路交通法関係】\\n\\n道路交通法に定める駐車を禁止する場所についての次の記述のうち、誤っているものを１つ選びなさい。なお、解答にあたっては、各選択肢に記載されている事項以外は考慮しないものとする。\",\"imageUrl\":null,\"sourceSheet\":null,\"knowledgeTags\":\"#駐停車禁止ルール\",\"riskCategory\":null,\"situationCategory\":null,\"format\":\"SINGLE\",\"pdfUrl\":null,\"pdfPage\":null,\"options\":[{\"id\":1150,\"questionId\":291,\"optionNumber\":1,\"content\":\"車両は、道路工事が行なわれている場合における当該工事区域の側端から5メートル以内の道路の部分においては、駐車してはならない。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":1151,\"questionId\":291,\"optionNumber\":2,\"content\":\"車両は、消防用機械器具の置場若しくは消防用防火水槽の側端又はこれらの道路に接する出入口から5メートル以内の道路の部分においては、駐車してはならない。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":1152,\"questionId\":291,\"optionNumber\":3,\"content\":\"車両は、人の乗降、貨物の積卸し、駐車又は自動車の格納若しくは修理のため道路外に設けられた施設又は場所の道路に接する自動車用の出入口から5メートル以内の道路の部分においては、駐車してはならない。\",\"isCorrect\":true,\"explanation\":null,\"structuredData\":null},{\"id\":1153,\"questionId\":291,\"optionNumber\":4,\"content\":\"車両は、都道府県公安委員会が交通がひんぱんでないと認めて指定した区域を除き、法令の規定により駐車する場合に当該車両の右側の道路上に3.5メートル（道路標識等により距離が指定されているときは、その距離）以上の余地がないこととなる場所においては、駐車してはならない。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null}],\"explanation\":{\"id\":62,\"questionId\":291,\"content\":\"$2f\",\"isDebated\":true},\"correctOptions\":[],\"attempts\":[],\"_count\":{\"attempts\":0},\"isDebated\":false,\"isBookmarked\":false},{\"id\":292,\"year\":\"令和5年 (CBT)\",\"questionNumber\":15,\"field\":\"道路交通法\",\"majorField\":null,\"subField\":null,\"content\":\"【道路交通法関係】\\n\\n道路交通法に定める横断歩行者等の保護のための通行方法についての次の文中、A、B、Cに入るべき字句としていずれか正しいものを１つ選びなさい。\\n\\n1. 車両等は、横断歩道に接近する場合には、当該横断歩道を通過する際に当該横断歩道によりその進路の前方を横断しようとする歩行者がないことが明らかな場合を除き、当該横断歩道の直前で A しなければならない。この場合において、横断歩道によりその進路の前方を横断し、又は横断しようとする歩行者があるときは、当該横断歩道の直前で B 、かつ、その通行を妨げないようにしなければならない。\\n\\n2. 車両等は、横断歩道（当該車両等が通過する際に信号機の表示する信号又は警察官等の手信号等により当該横断歩道による歩行者等の横断が禁止されているものを除く。）又はその手前の直前で停止している車両等がある場合において、当該停止している車両等の側方を通過してその前方に出ようとするときは、 C しなければならない。\",\"imageUrl\":null,\"sourceSheet\":null,\"knowledgeTags\":null,\"riskCategory\":null,\"situationCategory\":null,\"format\":\"MULTI_GROUP\",\"pdfUrl\":null,\"pdfPage\":null,\"options\":[{\"id\":1418,\"questionId\":292,\"optionNumber\":1,\"content\":\"A : ① 停止することができるような速度で進行\",\"isCorrect\":true,\"explanation\":null,\"structuredData\":\"{\\\"title\\\":\\\"A\\\",\\\"choices\\\":[{\\\"num\\\":1,\\\"text\\\":\\\"停止することができるような速度で進行\\\"},{\\\"num\\\":2,\\\"text\\\":\\\"徐行又は一時停止を\\\"}]}\"},{\"id\":1419,\"questionId\":292,\"optionNumber\":2,\"content\":\"A : ② 徐行又は一時停止を\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":\"{\\\"title\\\":\\\"A\\\",\\\"choices\\\":[{\\\"num\\\":1,\\\"text\\\":\\\"停止することができるような速度で進行\\\"},{\\\"num\\\":2,\\\"text\\\":\\\"徐行又は一時停止を\\\"}]}\"},{\"id\":1420,\"questionId\":292,\"optionNumber\":3,\"content\":\"B : ① 徐行し\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":\"{\\\"title\\\":\\\"B\\\",\\\"choices\\\":[{\\\"num\\\":1,\\\"text\\\":\\\"徐行し\\\"},{\\\"num\\\":2,\\\"text\\\":\\\"一時停止し\\\"}]}\"},{\"id\":1421,\"questionId\":292,\"optionNumber\":4,\"content\":\"B : ② 一時停止し\",\"isCorrect\":true,\"explanation\":null,\"structuredData\":\"{\\\"title\\\":\\\"B\\\",\\\"choices\\\":[{\\\"num\\\":1,\\\"text\\\":\\\"徐行し\\\"},{\\\"num\\\":2,\\\"text\\\":\\\"一時停止し\\\"}]}\"},{\"id\":1422,\"questionId\":292,\"optionNumber\":5,\"content\":\"C : ① 安全な速度で進行\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":\"{\\\"title\\\":\\\"C\\\",\\\"choices\\\":[{\\\"num\\\":1,\\\"text\\\":\\\"安全な速度で進行\\\"},{\\\"num\\\":2,\\\"text\\\":\\\"その前方に出る前に一時停止\\\"}]}\"},{\"id\":1423,\"questionId\":292,\"optionNumber\":6,\"content\":\"C : ② その前方に出る前に一時停止\",\"isCorrect\":true,\"explanation\":null,\"structuredData\":\"{\\\"title\\\":\\\"C\\\",\\\"choices\\\":[{\\\"num\\\":1,\\\"text\\\":\\\"安全な速度で進行\\\"},{\\\"num\\\":2,\\\"text\\\":\\\"その前方に出る前に一時停止\\\"}]}\"}],\"explanation\":{\"id\":64,\"questionId\":292,\"content\":\"$30\",\"isDebated\":true},\"correctOptions\":[],\"attempts\":[],\"_count\":{\"attempts\":0},\"isDebated\":false,\"isBookmarked\":false},{\"id\":293,\"year\":\"令和5年 (CBT)\",\"questionNumber\":16,\"field\":\"道路交通法\",\"majorField\":null,\"subField\":null,\"content\":\"【道路交通法関係】\\n\\n次に掲げる標識に関する次の記述のうち、誤っているものを１つ選びなさい。\",\"imageUrl\":\"https://www.unkan-net.com/kakomon/R05.CBT.pdf\",\"sourceSheet\":null,\"knowledgeTags\":null,\"riskCategory\":null,\"situationCategory\":\"#標識・マーク\",\"format\":\"SINGLE\",\"pdfUrl\":null,\"pdfPage\":null,\"options\":[{\"id\":1156,\"questionId\":293,\"optionNumber\":1,\"content\":\"車両総重量が9,800キログラムで最大積載量が5,500キログラムの特定中型自動車（専ら人を運搬する構造のもの以外のもの）は通行してはならない。\\n「道路標識、区画線及び道路標示に関する命令」に定める様式\\n文字及び記号を青色、斜めの帯及び枠を赤色、縁及び地を白色とする。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":1157,\"questionId\":293,\"optionNumber\":2,\"content\":\"車両は、法令の規定若しくは警察官の命令により、又は危険を防止するため一時停止する場合のほか、8時から20時までの間は、停車し、又は駐車してはならない。\\n「道路標識、区画線及び道路標示に関する命令」に定める様式\\n斜めの帯及び枠を赤色、文字及び縁を白色、地を青色とする。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":1158,\"questionId\":293,\"optionNumber\":3,\"content\":\"図の標識は、この先の道路の幅員が狭くなることを表している。\\n「道路標識、区画線及び道路標示に関する命令」に定める様式\\n縁線、文字及び記号を黒色、縁及び地を黄色とする。\",\"isCorrect\":true,\"explanation\":null,\"structuredData\":null},{\"id\":1159,\"questionId\":293,\"optionNumber\":4,\"content\":\"車両は横断（道路外の施設又は場所に出入りするための左折を伴う横断を除く。）することができない。\\n「道路標識、区画線及び道路標示に関する命令」に定める様式\\n文字及び記号を青色、斜めの帯及び枠を赤色、縁及び地を白色とする。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null}],\"explanation\":{\"id\":66,\"questionId\":293,\"content\":\"$31\",\"isDebated\":true},\"correctOptions\":[],\"attempts\":[],\"_count\":{\"attempts\":0},\"isDebated\":false,\"isBookmarked\":false},{\"id\":294,\"year\":\"令和5年 (CBT)\",\"questionNumber\":17,\"field\":\"道路交通法\",\"majorField\":null,\"subField\":null,\"content\":\"【道路交通法関係】\\n\\n道路交通法に定める運転者の遵守事項等についての次の記述のうち、正しいものを２つ選びなさい。なお、解答にあたっては、各選択肢に記載されている事項以外は考慮しないものとする。\",\"imageUrl\":null,\"sourceSheet\":null,\"knowledgeTags\":null,\"riskCategory\":null,\"situationCategory\":null,\"format\":\"SINGLE\",\"pdfUrl\":null,\"pdfPage\":null,\"options\":[{\"id\":1160,\"questionId\":294,\"optionNumber\":1,\"content\":\"車両等の運転者は、児童、幼児等の乗降のため、道路運送車両の保安基準に関する規定に定める非常点滅表示灯をつけて停車している通学通園バス（専ら小学校、幼稚園等に通う児童、幼児等を運送するために使用する自動車で政令で定めるものをいう。）の側方を通過するときは、徐行して安全を確認しなければならない。\",\"isCorrect\":true,\"explanation\":null,\"structuredData\":null},{\"id\":1161,\"questionId\":294,\"optionNumber\":2,\"content\":\"自動車の運転者は、故障その他の理由により高速自動車国道等の本線車道等において当該自動車を運転することができなくなったときは、道路交通法施行令で定めるところにより、夜間以外の時間にあっても当該自動車が停止している場所がトンネルの中その他視界が100メートル以下である場所の場合は、夜間用停止表示器材を後方から進行してくる自動車の運転者が見やすい位置に置いて、当該自動車が故障その他の理由により停止しているものであることを表示しなければならない。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":1162,\"questionId\":294,\"optionNumber\":3,\"content\":\"運転免許（仮運転免許を除く。）を受けた者が自動車等の運転に関し、当該自動車等の交通による人の死傷があった場合において、道路交通法第72条第1項前段の規定（交通事故があったときは、直ちに自動車等の運転を停止して、負傷者を救護し、道路における危険を防止する等必要な措置を講じなければならない。）に違反したときは、その者が当該違反をしたときにおけるその者の住所地を管轄する都道府県公安委員会は、その者の運転免許を取り消すことができる。\",\"isCorrect\":true,\"explanation\":null,\"structuredData\":null},{\"id\":1163,\"questionId\":294,\"optionNumber\":4,\"content\":\"停留所において乗客の乗降のため停車していた乗合自動車が発進するため進路を変更しようとして手又は方向指示器により合図をした場合においては、その後方にある車両は、その速度を急に変更しなければならないこととなる場合にあっても、当該合図をした乗合自動車の進路の変更を妨げてはならない。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null}],\"explanation\":{\"id\":68,\"questionId\":294,\"content\":\"$32\",\"isDebated\":true},\"correctOptions\":[],\"attempts\":[],\"_count\":{\"attempts\":0},\"isDebated\":false,\"isBookmarked\":false},{\"id\":295,\"year\":\"令和5年 (CBT)\",\"questionNumber\":18,\"field\":\"労働基準法\",\"majorField\":null,\"subField\":null,\"content\":\"【労働基準法関係】\\n\\n労働基準法（以下「法」という。）の定めに関する次の記述のうち、正しいものを２つ選びなさい。なお、解答にあたっては、各選択肢に記載されている事項以外は考慮しないものとする。\",\"imageUrl\":null,\"sourceSheet\":null,\"knowledgeTags\":null,\"riskCategory\":null,\"situationCategory\":null,\"format\":\"SINGLE\",\"pdfUrl\":null,\"pdfPage\":null,\"options\":[{\"id\":1164,\"questionId\":295,\"optionNumber\":1,\"content\":\"使用者の責に帰すべき事由による休業の場合においては、使用者は、休業期間中当該労働者に、その平均賃金の100分の80以上の手当を支払わなければならない。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":1165,\"questionId\":295,\"optionNumber\":2,\"content\":\"使用者は、労働者が業務上負傷し、又は疾病にかかり療養のために休業する期間及びその後30日間並びに産前産後の女性が法第65条(産前産後)の規定によって休業する期間及びその後30日間は、解雇してはならない。ただし、使用者が、法第81条の規定によって打切補償を支払う場合又は天災事変その他やむを得ない事由のために事業の継続が不可能となった場合においては、この限りでない。\",\"isCorrect\":true,\"explanation\":null,\"structuredData\":null},{\"id\":1166,\"questionId\":295,\"optionNumber\":3,\"content\":\"使用者は、労働者が労働時間中に、選挙権その他公民としての権利を行使し、又は公の職務を執行するために必要な時間を請求した場合においては、拒んではならない。ただし、権利の行使又は公の職務の執行に妨げがない限り、請求された時刻を変更することができる。\",\"isCorrect\":true,\"explanation\":null,\"structuredData\":null},{\"id\":1167,\"questionId\":295,\"optionNumber\":4,\"content\":\"法第20条（解雇の予告）の規定は、法に定める期間を超えて引き続き使用されない限りにおいて、「日日雇い入れられる者」、「1ヵ月以内の期間を定めて使用される者」、「季節的業務に6ヵ月以内の期間を定めて使用される者」又は「試の使用期間中の者」のいずれかに該当する労働者については適用しない。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null}],\"explanation\":{\"id\":70,\"questionId\":295,\"content\":\"$33\",\"isDebated\":true},\"correctOptions\":[],\"attempts\":[],\"_count\":{\"attempts\":0},\"isDebated\":false,\"isBookmarked\":false},{\"id\":296,\"year\":\"令和5年 (CBT)\",\"questionNumber\":19,\"field\":\"労働基準法\",\"majorField\":null,\"subField\":null,\"content\":\"【労働基準法関係】\\n\\n労働基準法（以下「法」という。）の定めに関する次の記述のうち、誤っているものを１つ選びなさい。なお、解答にあたっては、各選択肢に記載されている事項以外は考慮しないものとする。\",\"imageUrl\":null,\"sourceSheet\":null,\"knowledgeTags\":null,\"riskCategory\":null,\"situationCategory\":null,\"format\":\"SINGLE\",\"pdfUrl\":null,\"pdfPage\":null,\"options\":[{\"id\":1168,\"questionId\":296,\"optionNumber\":1,\"content\":\"使用者は、労働者に、休憩時間を除き1週間について40時間を超えて、労働させてはならない。また、1週間の各日については、労働者に、休憩時間を除き1日について8時間を超えて、労働させてはならない。ただし、別に法令等で定める場合は、この限りではない。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":1169,\"questionId\":296,\"optionNumber\":2,\"content\":\"使用者は、労働時間が6時間を超える場合においては少なくとも45分、8時間を超える場合においては少なくとも1時間の休憩時間を労働時間の途中に与えなければならない。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":1170,\"questionId\":296,\"optionNumber\":3,\"content\":\"使用者が、法の規定により労働時間を延長し、又は休日に労働させた場合においては、その時間又はその日の労働については、通常の労働時間又は労働日の賃金の計算額の3割以上6割以下の範囲内でそれぞれ政令で定める率以上の率で計算した割増賃金を支払わなければならない。\",\"isCorrect\":true,\"explanation\":null,\"structuredData\":null},{\"id\":1171,\"questionId\":296,\"optionNumber\":4,\"content\":\"使用者は、当該事業場に、労働者の過半数で組織する労働組合がある場合においてはその労働組合、労働者の過半数で組織する労働組合がない場合においては労働者の過半数を代表する者との書面による協定をし、これを行政官庁に届け出た場合においては、法定労働時間又は法定休日に関する規定にかかわらず、その協定で定めるところによって労働時間を延長し、又は休日に労働させることができる。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null}],\"explanation\":{\"id\":72,\"questionId\":296,\"content\":\"$34\",\"isDebated\":true},\"correctOptions\":[],\"attempts\":[],\"_count\":{\"attempts\":0},\"isDebated\":false,\"isBookmarked\":false},{\"id\":297,\"year\":\"令和5年 (CBT)\",\"questionNumber\":20,\"field\":\"労働基準法\",\"majorField\":null,\"subField\":null,\"content\":\"【労働基準法関係】\\n\\n「自動車運転者の労働時間等の改善のための基準」（以下「改善基準告示」という。）に定める貨物自動車運送事業に従事する自動車運転者（以下「トラック運転者」という。）の拘束時間等に関する次の文中、A、B、C、Dに入るべき字句としていずれか正しいものを１つ選びなさい。\\n\\n1. 使用者は、トラック運転者に労働基準法（以下「法」という。）第35条の休日に労働させる場合は、当該労働させる休日は2週間について A を超えないものとし、当該休日の労働によって改善基準告示第4条第1項に定める拘束時間及び B の限度を超えないものとする。\\n\\n2. 労使当事者は、法第36条第1項の協定（時間外労働協定（労働時間の延長に係るものに限る。））においてトラック運転者に係る一定期間についての延長時間について協定するに当たっては、当該一定期間は、 C 及び D 以内の一定の期間とするものとする。\",\"imageUrl\":null,\"sourceSheet\":null,\"knowledgeTags\":\"#改善基準(拘束・休息),#労働契約・休日\",\"riskCategory\":null,\"situationCategory\":null,\"format\":\"MULTI_GROUP\",\"pdfUrl\":null,\"pdfPage\":null,\"options\":[{\"id\":1424,\"questionId\":297,\"optionNumber\":1,\"content\":\"A : ① 1回\",\"isCorrect\":true,\"explanation\":null,\"structuredData\":\"{\\\"title\\\":\\\"A\\\",\\\"choices\\\":[{\\\"num\\\":1,\\\"text\\\":\\\"1回\\\"},{\\\"num\\\":2,\\\"text\\\":\\\"2回\\\"}]}\"},{\"id\":1425,\"questionId\":297,\"optionNumber\":2,\"content\":\"A : ② 2回\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":\"{\\\"title\\\":\\\"A\\\",\\\"choices\\\":[{\\\"num\\\":1,\\\"text\\\":\\\"1回\\\"},{\\\"num\\\":2,\\\"text\\\":\\\"2回\\\"}]}\"},{\"id\":1426,\"questionId\":297,\"optionNumber\":3,\"content\":\"B : ① 連続運転時間\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":\"{\\\"title\\\":\\\"B\\\",\\\"choices\\\":[{\\\"num\\\":1,\\\"text\\\":\\\"連続運転時間\\\"},{\\\"num\\\":2,\\\"text\\\":\\\"最大拘束時間\\\"}]}\"},{\"id\":1427,\"questionId\":297,\"optionNumber\":4,\"content\":\"B : ② 最大拘束時間\",\"isCorrect\":true,\"explanation\":null,\"structuredData\":\"{\\\"title\\\":\\\"B\\\",\\\"choices\\\":[{\\\"num\\\":1,\\\"text\\\":\\\"連続運転時間\\\"},{\\\"num\\\":2,\\\"text\\\":\\\"最大拘束時間\\\"}]}\"},{\"id\":1428,\"questionId\":297,\"optionNumber\":5,\"content\":\"C : ① 2週間\",\"isCorrect\":true,\"explanation\":null,\"structuredData\":\"{\\\"title\\\":\\\"C\\\",\\\"choices\\\":[{\\\"num\\\":1,\\\"text\\\":\\\"2週間\\\"},{\\\"num\\\":2,\\\"text\\\":\\\"4週間\\\"}]}\"},{\"id\":1429,\"questionId\":297,\"optionNumber\":6,\"content\":\"C : ② 4週間\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":\"{\\\"title\\\":\\\"C\\\",\\\"choices\\\":[{\\\"num\\\":1,\\\"text\\\":\\\"2週間\\\"},{\\\"num\\\":2,\\\"text\\\":\\\"4週間\\\"}]}\"},{\"id\":1430,\"questionId\":297,\"optionNumber\":7,\"content\":\"D : ① 1ヵ月以上3ヵ月\",\"isCorrect\":true,\"explanation\":null,\"structuredData\":\"{\\\"title\\\":\\\"D\\\",\\\"choices\\\":[{\\\"num\\\":1,\\\"text\\\":\\\"1ヵ月以上3ヵ月\\\"},{\\\"num\\\":2,\\\"text\\\":\\\"3ヵ月以上6ヵ月\\\"}]}\"},{\"id\":1431,\"questionId\":297,\"optionNumber\":8,\"content\":\"D : ② 3ヵ月以上6ヵ月\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":\"{\\\"title\\\":\\\"D\\\",\\\"choices\\\":[{\\\"num\\\":1,\\\"text\\\":\\\"1ヵ月以上3ヵ月\\\"},{\\\"num\\\":2,\\\"text\\\":\\\"3ヵ月以上6ヵ月\\\"}]}\"}],\"explanation\":{\"id\":75,\"questionId\":297,\"content\":\"$35\",\"isDebated\":true},\"correctOptions\":[],\"attempts\":[],\"_count\":{\"attempts\":0},\"isDebated\":false,\"isBookmarked\":false},{\"id\":298,\"year\":\"令和5年 (CBT)\",\"questionNumber\":21,\"field\":\"労働基準法\",\"majorField\":null,\"subField\":null,\"content\":\"【労働基準法関係】\\n「自動車運転者の労働時間等の改善のための基準」等に定める貨物自動車運送事業に従事する自動車運転者（以下「トラック運転者」という。）の拘束時間等の規定に関する次の記述のうち、正しいものをすべて選びなさい。なお、解答にあたっては、各選択肢に記載されている事項以外は考慮しないものとする。\",\"imageUrl\":null,\"sourceSheet\":null,\"knowledgeTags\":\"#改善基準(拘束・休息)\",\"riskCategory\":null,\"situationCategory\":null,\"format\":\"SINGLE\",\"pdfUrl\":null,\"pdfPage\":null,\"options\":[{\"id\":1174,\"questionId\":298,\"optionNumber\":1,\"content\":\"使用者は、業務の必要上やむを得ない場合には、当分の間、トラック運転者を隔日勤務に就かせることができる。この場合、2暦日における拘束時間は、事業場内仮眠施設又は使用者が確保した同種の施設において、夜間に4時間以上の仮眠時間を与える場合を除き、21時間を超えてはならないものとし、勤務終了後、継続20時間以上の休息期間を与えなければならない。\",\"isCorrect\":true,\"explanation\":null,\"structuredData\":null},{\"id\":1175,\"questionId\":298,\"optionNumber\":2,\"content\":\"拘束時間とは、始業時間から終業時間までの時間で、休憩時間を除く労働時間の合計をいう。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":1176,\"questionId\":298,\"optionNumber\":3,\"content\":\"使用者は、トラック運転者の拘束時間については、1ヵ月について293時間を超えないものとすること。ただし、労使協定があるときは、1年のうち6ヵ月までは、1年間についての拘束時間が3,516時間を超えない範囲内において、329時間まで延長することができる。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":1177,\"questionId\":298,\"optionNumber\":4,\"content\":\"使用者は、業務の必要上、トラック運転者に勤務の終了後継続8時間以上の休息期間を与えることが困難な場合には、当分の間、一定期間における全勤務回数の2分の1を限度に、休息期間を拘束時間の途中及び拘束時間の経過直後に分割して与えることができるものとする。この場合において、分割された休息期間は、1日において1回当たり継続4時間以上、合計10時間以上でなければならないものとする。\",\"isCorrect\":true,\"explanation\":null,\"structuredData\":null}],\"explanation\":{\"id\":77,\"questionId\":298,\"content\":\"$36\",\"isDebated\":true},\"correctOptions\":[],\"attempts\":[],\"_count\":{\"attempts\":0},\"isDebated\":false,\"isBookmarked\":false},{\"id\":299,\"year\":\"令和5年 (CBT)\",\"questionNumber\":22,\"field\":\"労働基準法\",\"majorField\":null,\"subField\":null,\"content\":\"【労働基準法関係】\\n下表の1～4は、貨物自動車運送事業に従事する自動車運転者の2週間の運転時間の例を示したものであるが、このうち、すべての日を特定日とした2日を平均して1日当たりの運転時間及び2週間を平均し1週間当たりの運転時間がともに「自動車運転者の労働時間等の改善のための基準」に適合するものを1つ選びなさい。なお、解答にあたっては、下表に示された内容以外は考慮しないものとする。\",\"imageUrl\":null,\"sourceSheet\":null,\"knowledgeTags\":\"#改善基準(拘束・休息)\",\"riskCategory\":null,\"situationCategory\":\"#表・グラフ,#時間計算(改善基準等)\",\"format\":\"SINGLE\",\"pdfUrl\":null,\"pdfPage\":null,\"options\":[{\"id\":1178,\"questionId\":299,\"optionNumber\":1,\"content\":\"【表の通り】2週間の運転時間計 87時間\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":1179,\"questionId\":299,\"optionNumber\":2,\"content\":\"【表の通り】2週間の運転時間計 89時間\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":1180,\"questionId\":299,\"optionNumber\":3,\"content\":\"【表の通り】2週間の運転時間計 88時間\",\"isCorrect\":true,\"explanation\":null,\"structuredData\":null},{\"id\":1181,\"questionId\":299,\"optionNumber\":4,\"content\":\"【表の通り】2週間の運転時間計 90時間\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null}],\"explanation\":{\"id\":79,\"questionId\":299,\"content\":\"$37\",\"isDebated\":true},\"correctOptions\":[],\"attempts\":[],\"_count\":{\"attempts\":0},\"isDebated\":false,\"isBookmarked\":false},{\"id\":300,\"year\":\"令和5年 (CBT)\",\"questionNumber\":23,\"field\":\"労働基準法\",\"majorField\":null,\"subField\":null,\"content\":\"【労働基準法関係】\\n下図は、貨物自動車運送事業に従事する自動車運転者の1週間の勤務状況の例を示したものであるが、「自動車運転者の労働時間等の改善のための基準」（以下「改善基準告示」という。）に定める拘束時間等に関する次の記述のうち、正しいものを2つ選びなさい。ただし、すべて1人乗務の場合とする。なお、解答にあたっては、下図に示された内容及び各選択肢に記載されている事項以外は考慮しないものとする。\",\"imageUrl\":\"https://www.unkan-net.com/kakomon/R05.CBT.pdf\",\"sourceSheet\":null,\"knowledgeTags\":\"#改善基準(拘束・休息)\",\"riskCategory\":null,\"situationCategory\":\"#表・グラフ\",\"format\":\"SINGLE\",\"pdfUrl\":null,\"pdfPage\":null,\"options\":[{\"id\":1182,\"questionId\":300,\"optionNumber\":1,\"content\":\"1日についての拘束時間が改善基準告示に定める最大拘束時間に違反する勤務がある。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":1183,\"questionId\":300,\"optionNumber\":2,\"content\":\"1日についての拘束時間が15時間を超えることができる1週間についての回数は、改善基準告示に違反している。\",\"isCorrect\":true,\"explanation\":null,\"structuredData\":null},{\"id\":1184,\"questionId\":300,\"optionNumber\":3,\"content\":\"月曜日に始まる勤務の1日についての拘束時間は、この1週間の勤務の中で1日についての拘束時間が最も短い。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":1185,\"questionId\":300,\"optionNumber\":4,\"content\":\"勤務終了後の休息期間が改善基準告示に違反するものはない。\",\"isCorrect\":true,\"explanation\":null,\"structuredData\":null}],\"explanation\":null,\"correctOptions\":[],\"attempts\":[],\"_count\":{\"attempts\":0},\"isDebated\":false,\"isBookmarked\":false},{\"id\":301,\"year\":\"令和5年 (CBT)\",\"questionNumber\":24,\"field\":\"実務上の知識及び能力\",\"majorField\":null,\"subField\":null,\"content\":\"【実務上の知識及び能力】\\n事業用自動車の運転者に対する点呼の実施に関する次の記述のうち、適切なものをすべて選びなさい。なお、解答にあたっては、各選択肢に記載されている事項以外は考慮しないものとする。\",\"imageUrl\":null,\"sourceSheet\":null,\"knowledgeTags\":\"#点呼・乗務制限(管理者義務)\",\"riskCategory\":null,\"situationCategory\":null,\"format\":\"SINGLE\",\"pdfUrl\":null,\"pdfPage\":null,\"options\":[{\"id\":1186,\"questionId\":301,\"optionNumber\":1,\"content\":\"運行の業務前の点呼においてアルコール検知器を使用するのは、身体に保有している酒気帯びの有無を確認するためのものであり、道路交通法施行令で定める呼気中のアルコール濃度1リットル当たり0.15ミリグラム以上であるか否かを判定するためのものではない。\",\"isCorrect\":true,\"explanation\":null,\"structuredData\":null},{\"id\":1187,\"questionId\":301,\"optionNumber\":2,\"content\":\"運行管理者は、業務前及び業務後の運転者に対し、原則、対面で点呼を実施しなければならないが、遠隔地で業務を開始又は終了する場合、車庫と営業所が離れている場合、又は運転者の出庫・帰庫が早朝・深夜であり、点呼を行う運行管理者が営業所に出勤していない場合等、運行上やむを得ず、対面での点呼が実施できないときには、電話、その他の方法で行っている。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":1188,\"questionId\":301,\"optionNumber\":3,\"content\":\"通常は、運行管理者又は補助者による対面点呼が実施されているが、両者が休暇等で不在の時には、社内の運行管理体制に明記されていない事務員が代わりに点呼を行い、運行管理者にその内容を報告している。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":1189,\"questionId\":301,\"optionNumber\":4,\"content\":\"運行管理者が業務前の点呼において、運転者に対して酒気帯びの有無を確認しようとしたところ、営業所に設置されているアルコール検知器が停電により全て使用できなかったことから、当該運行管理者は、運転者に携帯させるために営業所に備えてある携帯型アルコール検知器を使用して酒気帯びの有無を確認した。\",\"isCorrect\":true,\"explanation\":null,\"structuredData\":null}],\"explanation\":{\"id\":82,\"questionId\":301,\"content\":\"$38\",\"isDebated\":true},\"correctOptions\":[],\"attempts\":[],\"_count\":{\"attempts\":0},\"isDebated\":false,\"isBookmarked\":false},{\"id\":302,\"year\":\"令和5年 (CBT)\",\"questionNumber\":25,\"field\":\"実務上の知識及び能力\",\"majorField\":null,\"subField\":null,\"content\":\"【実務上の知識及び能力】\\n運行管理者の役割等に関する次の記述のうち、適切なものをすべて選びなさい。なお、解答にあたっては、各選択肢に記載されている事項以外は考慮しないものとする。\",\"imageUrl\":null,\"sourceSheet\":null,\"knowledgeTags\":null,\"riskCategory\":null,\"situationCategory\":null,\"format\":\"SINGLE\",\"pdfUrl\":null,\"pdfPage\":null,\"options\":[{\"id\":1190,\"questionId\":302,\"optionNumber\":1,\"content\":\"事業者が、事業用自動車の定期点検を怠ったことが原因で重大事故を起こしたことにより、行政処分を受けることになった。この場合に、運行管理者は当該重大事故を含む運行管理業務上に一切問題がなくても、事業者に代わって事業用自動車の運行管理を行っていることから、運行管理者資格者証の返納を命じられる。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":1191,\"questionId\":302,\"optionNumber\":2,\"content\":\"運行管理者は、運行管理業務に精通し、確実に遂行しなければならない。そのためにも自動車輸送に関連する諸規制を理解し、実務知識を身につけると共に、日頃から運転者と積極的にコミュニケーションを図り、必要な場合にあっては運転者の声を自動車運送事業者に伝え、常に安全で明るい職場環境を築いていくことも重要な役割である。\",\"isCorrect\":true,\"explanation\":null,\"structuredData\":null},{\"id\":1192,\"questionId\":302,\"optionNumber\":3,\"content\":\"運行管理者は、運転者の指導教育を実施していく際、運転者一人ひとりの個性に応じた助言・指導（カウンセリング）を行うことも重要である。そのためには、日頃から運転者の性格や能力、事故歴のほか、場合によっては個人的な事情についても把握し、そして、これらに基づいて助言・指導を積み重ねることによって事故防止を図ることも重要な役割である。\",\"isCorrect\":true,\"explanation\":null,\"structuredData\":null},{\"id\":1193,\"questionId\":302,\"optionNumber\":4,\"content\":\"運行管理者は、事業者に代わって法令に定められた事業用自動車の運行の安全確保に関する業務を行い、交通事故を防止するという重要な役割を果たすことが求められていることから、運行管理者以外に複数の補助者を選任し運行管理業務に当たらせ、運行管理者は運行管理に関し、これらの補助者の指導・監督のみを行っている。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null}],\"explanation\":null,\"correctOptions\":[],\"attempts\":[],\"_count\":{\"attempts\":0},\"isDebated\":false,\"isBookmarked\":false},{\"id\":303,\"year\":\"令和5年 (CBT)\",\"questionNumber\":26,\"field\":\"実務上の知識及び能力\",\"majorField\":null,\"subField\":null,\"content\":\"【実務上の知識及び能力】\\n一般貨物自動車運送事業者（以下「事業者」という。）が行う事業用自動車の運転者の健康管理に関する次の記述のうち、適切なものをすべて選びなさい。なお、解答にあたっては、各選択肢に記載されている事項以外は考慮しないものとする。\",\"imageUrl\":null,\"sourceSheet\":null,\"knowledgeTags\":null,\"riskCategory\":null,\"situationCategory\":null,\"format\":\"SINGLE\",\"pdfUrl\":null,\"pdfPage\":null,\"options\":[{\"id\":1194,\"questionId\":303,\"optionNumber\":1,\"content\":\"事業者は、深夜業（22時～5時）を含む業務に常時従事する運転者に対し、法令に定める定期健康診断を6ヵ月以内ごとに1回、必ず、定期的に受診させるようにしている。\",\"isCorrect\":true,\"explanation\":null,\"structuredData\":null},{\"id\":1195,\"questionId\":303,\"optionNumber\":2,\"content\":\"睡眠時無呼吸症候群(SAS)は、大きないびきや昼間の強い眠気など容易に自覚症状を感じやすいので、事業者は、自覚症状を感じていると自己申告をした運転者に限定して、SASスクリーニング検査を実施している。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":1196,\"questionId\":303,\"optionNumber\":3,\"content\":\"トラック運転者は、単独で判断する、連続作業をする、とっさの対応が必要、同じ姿勢で何時間も過ごすなどから、心身の状態が運行に及ぼす影響は大きく、健康な状態を保持することが必要不可欠である。このため、事業者は、運転者が運転中に体調の異常を感じたときには、運行継続の可否を自らの判断で行うよう指導している。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":1197,\"questionId\":303,\"optionNumber\":4,\"content\":\"運転者が脳検診において、異常所見の疑いが認められたため、当該運転者に脳検診を再受診させたところ、医師から診断結果に基づき、乗務時間を減らすなど、乗務の際の配慮が必要であるとの意見があった。このため、事業者は、医師からの意見等を勘案し、当該運転者について、乗務時間の短縮、夜間乗務の回数の削減等の就業上の措置を決定している。\",\"isCorrect\":true,\"explanation\":null,\"structuredData\":null}],\"explanation\":{\"id\":84,\"questionId\":303,\"content\":\"その記述は誤りです。運転中に体調の異常を感じたときは、自らの判断で運行を継続するのではなく、速やかに営業所（運行管理者）に連絡して指示を仰ぐよう指導しなければなりません。正しい指導のポイント運転中に少しでも体調の異常を感じた場合、無理に運行を続けると大きな事故につながる危険性を理解させます。自ら判断せず、速やかに営業所や運行管理者へ連絡するよう徹底させます。\",\"isDebated\":true},\"correctOptions\":[],\"attempts\":[],\"_count\":{\"attempts\":0},\"isDebated\":false,\"isBookmarked\":false},{\"id\":304,\"year\":\"令和5年 (CBT)\",\"questionNumber\":27,\"field\":\"実務上の知識及び能力\",\"majorField\":null,\"subField\":null,\"content\":\"【実務上の知識及び能力】\\n交通事故防止対策に関する次の記述のうち、適切なものをすべて選びなさい。なお、解答にあたっては、各選択肢に記載されている事項以外は考慮しないものとする。\",\"imageUrl\":null,\"sourceSheet\":null,\"knowledgeTags\":null,\"riskCategory\":null,\"situationCategory\":null,\"format\":\"SINGLE\",\"pdfUrl\":null,\"pdfPage\":null,\"options\":[{\"id\":1198,\"questionId\":304,\"optionNumber\":1,\"content\":\"交通事故は、そのほとんどが運転者等のヒューマンエラーにより発生するものである。したがって、事故惹起運転者の社内処分を行うことが、交通事故の再発を未然に防止するには最も有効である。そのため、発生した事故の要因の調査・分析を行うことなく、事故惹起運転者及び運行管理者に対する特別講習を確実に受講させる等、ヒューマンエラーの再発防止を中心とした対策に努めるべきである。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":1199,\"questionId\":304,\"optionNumber\":2,\"content\":\"ドライブレコーダーは、事故時の映像だけでなく、運転者のブレーキ操作やハンドル操作などの運転状況を記録し、解析することにより運転のクセ等を読み取ることができるものがあり、運行管理者が行う運転者の安全運転の指導に活用されている。\",\"isCorrect\":true,\"explanation\":null,\"structuredData\":null},{\"id\":1200,\"questionId\":304,\"optionNumber\":3,\"content\":\"いわゆる「ヒヤリ・ハット体験」とは、運転者が運転中に他の自動車等と衝突又は接触するおそれがあったと認識した状態をいい、1件の重大な事故（死亡・重傷事故等）が発生する背景には多くのヒヤリ・ハットがあるとされており、このヒヤリ・ハット体験情報を収集・活用していくことは、交通事故防止対策に有効な手段となっている。\",\"isCorrect\":true,\"explanation\":null,\"structuredData\":null},{\"id\":1201,\"questionId\":304,\"optionNumber\":4,\"content\":\"適性診断は、運転者の運転能力、運転態度及び性格等を客観的に把握し、運転の適性を判定することにより、運転に適さない者を運転者として選任しないようにするためのものであり、ヒューマンエラーによる交通事故の発生を未然に防止するための有効な手段となっている。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null}],\"explanation\":{\"id\":86,\"questionId\":304,\"content\":\"$39\",\"isDebated\":true},\"correctOptions\":[],\"attempts\":[],\"_count\":{\"attempts\":0},\"isDebated\":false,\"isBookmarked\":false},{\"id\":305,\"year\":\"令和5年 (CBT)\",\"questionNumber\":28,\"field\":\"実務上の知識及び能力\",\"majorField\":null,\"subField\":null,\"content\":\"【実務上の知識及び能力】\\n自動車の運転等に関する次の記述のA、B、Cに入るべき字句としていずれか正しいものを1つ選びなさい。\\n1. 自動車がカーブを走行するとき、自動車の重量及びカーブの半径が同じ条件の場合に、速度を2分の1に落として走行すると遠心力の大きさは A になる。\\n2. フット・ブレーキを使い過ぎると、ブレーキ・ドラムやブレーキ・ライニングなどが摩擦のため過熱してその熱がブレーキ液に伝わり、液内に気泡が発生することによりブレーキが正常に作用しなくなり制動力が低下することを B という。\\n3. 雨の降りはじめに、路面の油や土砂などの微粒子が雨と混じって滑りやすい膜を形成するため、タイヤと路面との摩擦係数が低下し急ブレーキをかけたときなどにスリップすることを C という。\",\"imageUrl\":null,\"sourceSheet\":null,\"knowledgeTags\":null,\"riskCategory\":null,\"situationCategory\":\"#悪天候・異常気象\",\"format\":\"MULTI_GROUP\",\"pdfUrl\":null,\"pdfPage\":null,\"options\":[{\"id\":1202,\"questionId\":305,\"optionNumber\":1,\"content\":\"A : ① 4分の1\",\"isCorrect\":true,\"explanation\":null,\"structuredData\":\"{\\\"title\\\":\\\"A\\\",\\\"choices\\\":[{\\\"num\\\":1,\\\"text\\\":\\\"4分の1\\\"},{\\\"num\\\":2,\\\"text\\\":\\\"2分の1\\\"}]}\"},{\"id\":1203,\"questionId\":305,\"optionNumber\":2,\"content\":\"A : ② 2分の1\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":\"{\\\"title\\\":\\\"A\\\",\\\"choices\\\":[{\\\"num\\\":1,\\\"text\\\":\\\"4分の1\\\"},{\\\"num\\\":2,\\\"text\\\":\\\"2分の1\\\"}]}\"},{\"id\":1204,\"questionId\":305,\"optionNumber\":3,\"content\":\"B : ① フェード現象\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":\"{\\\"title\\\":\\\"B\\\",\\\"choices\\\":[{\\\"num\\\":1,\\\"text\\\":\\\"フェード現象\\\"},{\\\"num\\\":2,\\\"text\\\":\\\"ベーパー・ロック現象\\\"}]}\"},{\"id\":1205,\"questionId\":305,\"optionNumber\":4,\"content\":\"B : ② ベーパー・ロック現象\",\"isCorrect\":true,\"explanation\":null,\"structuredData\":\"{\\\"title\\\":\\\"B\\\",\\\"choices\\\":[{\\\"num\\\":1,\\\"text\\\":\\\"フェード現象\\\"},{\\\"num\\\":2,\\\"text\\\":\\\"ベーパー・ロック現象\\\"}]}\"},{\"id\":1206,\"questionId\":305,\"optionNumber\":5,\"content\":\"C : ① ウェット・スキッド現象\",\"isCorrect\":true,\"explanation\":null,\"structuredData\":\"{\\\"title\\\":\\\"C\\\",\\\"choices\\\":[{\\\"num\\\":1,\\\"text\\\":\\\"ウェット・スキッド現象\\\"},{\\\"num\\\":2,\\\"text\\\":\\\"クリープ現象\\\"}]}\"},{\"id\":1207,\"questionId\":305,\"optionNumber\":6,\"content\":\"C : ② クリープ現象\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":\"{\\\"title\\\":\\\"C\\\",\\\"choices\\\":[{\\\"num\\\":1,\\\"text\\\":\\\"ウェット・スキッド現象\\\"},{\\\"num\\\":2,\\\"text\\\":\\\"クリープ現象\\\"}]}\"}],\"explanation\":{\"id\":89,\"questionId\":305,\"content\":\"$3a\",\"isDebated\":true},\"correctOptions\":[],\"attempts\":[],\"_count\":{\"attempts\":0},\"isDebated\":false,\"isBookmarked\":false},{\"id\":306,\"year\":\"令和5年 (CBT)\",\"questionNumber\":29,\"field\":\"実務上の知識及び能力\",\"majorField\":null,\"subField\":null,\"content\":\"【実務上の知識及び能力】\\n荷主から貨物自動車運送事業者に対し、往路と復路において、それぞれ荷積みと荷下ろしを行うよう運送の依頼があった。これを受けて運行管理者は下の図に示す運行計画を立てた。この運行に関する次の1～3の記述について、解答しなさい。なお、解答にあたっては、＜運行計画＞及び各選択肢に記載されている事項以外は考慮しないものとする。\\n\\n＜運行計画＞\\nB地点から、重量が5,500 キログラムの荷物を C 地点に運び、その後、戻りの便にて、D地点から 5,250 キログラムの荷物を F 地点に運ぶ行程とする。当該運行は、最大積載量 6,250 キログラムの貨物自動車を使用し、運転者 1人乗務とする。\\n\\n1. 当該運行においてA営業所を7時00分に出庫し、C地点に11時50分に到着するとした場合、B地点とC地点の距離 ア は何キロメートルになるか、次の①～③の中から正しいものを1つ選びなさい。\\n\\n2. 当該運転者は前日の運転時間が8時間40分であり、また、翌日の運転時間を8時間40分とした場合、当日を特定の日とした場合の2日を平均して1日当たりの運転時間が「自動車運転者の労働時間等の改善のための基準」(以下「改善基準告示」という。)に違反しているか否かについて、正しいものを1つ選びなさい。\\n\\n3. 当日の全運行において、連続運転時間は「改善基準告示」に、違反しているか否かについて、正しいものを1つ選びなさい。\",\"imageUrl\":\"https://www.unkan-net.com/kakomon/R05.CBT.pdf\",\"sourceSheet\":null,\"knowledgeTags\":\"#改善基準(拘束・休息)\",\"riskCategory\":null,\"situationCategory\":\"#表・グラフ,#時間計算(改善基準等)\",\"format\":\"MULTI_GROUP\",\"pdfUrl\":null,\"pdfPage\":null,\"options\":[{\"id\":1403,\"questionId\":306,\"optionNumber\":1,\"content\":\"1 : ① 280 キロメートル\",\"isCorrect\":true,\"explanation\":null,\"structuredData\":\"{\\\"title\\\":\\\"1\\\",\\\"choices\\\":[{\\\"num\\\":1,\\\"text\\\":\\\"280 キロメートル\\\"},{\\\"num\\\":2,\\\"text\\\":\\\"294 キロメートル\\\"},{\\\"num\\\":3,\\\"text\\\":\\\"315 キロメートル\\\"}]}\"},{\"id\":1404,\"questionId\":306,\"optionNumber\":2,\"content\":\"1 : ② 294 キロメートル\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":\"{\\\"title\\\":\\\"1\\\",\\\"choices\\\":[{\\\"num\\\":1,\\\"text\\\":\\\"280 キロメートル\\\"},{\\\"num\\\":2,\\\"text\\\":\\\"294 キロメートル\\\"},{\\\"num\\\":3,\\\"text\\\":\\\"315 キロメートル\\\"}]}\"},{\"id\":1405,\"questionId\":306,\"optionNumber\":3,\"content\":\"1 : ② 315 キロメートル\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":\"{\\\"title\\\":\\\"1\\\",\\\"choices\\\":[{\\\"num\\\":1,\\\"text\\\":\\\"280 キロメートル\\\"},{\\\"num\\\":2,\\\"text\\\":\\\"294 キロメートル\\\"},{\\\"num\\\":3,\\\"text\\\":\\\"315 キロメートル\\\"}]}\"},{\"id\":1406,\"questionId\":306,\"optionNumber\":4,\"content\":\"2 : ① 違反していない\",\"isCorrect\":true,\"explanation\":null,\"structuredData\":\"{\\\"title\\\":\\\"2\\\",\\\"choices\\\":[{\\\"num\\\":1,\\\"text\\\":\\\"違反していない\\\"},{\\\"num\\\":2,\\\"text\\\":\\\"違反している\\\"}]}\"},{\"id\":1407,\"questionId\":306,\"optionNumber\":5,\"content\":\"2 : ② 違反している\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":\"{\\\"title\\\":\\\"2\\\",\\\"choices\\\":[{\\\"num\\\":1,\\\"text\\\":\\\"違反していない\\\"},{\\\"num\\\":2,\\\"text\\\":\\\"違反している\\\"}]}\"},{\"id\":1408,\"questionId\":306,\"optionNumber\":6,\"content\":\"3 : ① 違反していない\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":\"{\\\"title\\\":\\\"3\\\",\\\"choices\\\":[{\\\"num\\\":1,\\\"text\\\":\\\"違反していない\\\"},{\\\"num\\\":2,\\\"text\\\":\\\"違反している\\\"}]}\"},{\"id\":1409,\"questionId\":306,\"optionNumber\":7,\"content\":\"3 : ② 違反している\",\"isCorrect\":true,\"explanation\":null,\"structuredData\":\"{\\\"title\\\":\\\"3\\\",\\\"choices\\\":[{\\\"num\\\":1,\\\"text\\\":\\\"違反していない\\\"},{\\\"num\\\":2,\\\"text\\\":\\\"違反している\\\"}]}\"}],\"explanation\":null,\"correctOptions\":[],\"attempts\":[],\"_count\":{\"attempts\":0},\"isDebated\":false,\"isBookmarked\":false},{\"id\":307,\"year\":\"令和5年 (CBT)\",\"questionNumber\":30,\"field\":\"実務上の知識及び能力\",\"majorField\":null,\"subField\":null,\"content\":\"【実務上の知識及び能力】\\n運行管理者が運転者に対し実施する危険予知訓練に関し、下図の交通場面の状況において考えられる＜運転者が予知すべき危険要因＞とそれに対応する＜運行管理者による指導事項＞として、最もふさわしいものを＜選択肢の組み合わせ＞1～8の中から3つ選びなさい。なお、解答にあたっては、【交通場面の状況等】に記載されている事項及び下図の状況以外は考慮しないものとする。\\n\\n【交通場面の状況等】\\n・雨が降り始めた片側1車線の道路を走行している。\\n・対向自動二輪車が右折の合図を出している。\\n・歩行者と自転車が前方に見えている。\\n\\n＜運転者が予知すべき危険要因＞\\n① 右折の合図を出している自動二輪車が右折をしてくると衝突する危険がある。\\n② 左折する時に自転車に気づくのが遅れると衝突する危険がある。\\n③ 道路の左側にいる歩行者が、雨が降り始めたので早く行こうと道路を横断してくるとはねる危険がある。\\n④ 急停止すると後続車に追突される危険がある。\\n⑤ 雨が降り始めたので、道路右側にいる自転車があわてて道路を横断してくると衝突する危険がある。\\n\\n＜運行管理者による指導事項＞\\nア 雨天時は、視界が悪くなり見にくくなるため、ヘッドライトを点灯させること。\\nイ 雨の降り始めは路面が滑りやすく停止距離が長くなるため、速度を落とし、対向車線の他車の動向に注意して走行すること。\\nウ 雨の降り始めは傘を持たない歩行者が、早く行こうとして安全を確認しないまま道路を横断してくることがあるので、いつでも停止できる速度に落として進行すること。\\nエ 歩行者の動きに気をとられることで、自転車を見落とすおそれがあるので、左右の動向に注意して進行すること。\\nオ 雨が降り始めたら速度を落とし、先行車と十分に車間距離をとって進行すること。\",\"imageUrl\":\"https://www.unkan-net.com/kakomon/R05.CBT.pdf\",\"sourceSheet\":null,\"knowledgeTags\":\"#交通事故の要因・防止策\",\"riskCategory\":null,\"situationCategory\":\"#表・グラフ,#悪天候・異常気象\",\"format\":\"SINGLE\",\"pdfUrl\":null,\"pdfPage\":null,\"options\":[{\"id\":1211,\"questionId\":307,\"optionNumber\":1,\"content\":\"①－イ\",\"isCorrect\":true,\"explanation\":null,\"structuredData\":null},{\"id\":1212,\"questionId\":307,\"optionNumber\":2,\"content\":\"②－ウ\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":1213,\"questionId\":307,\"optionNumber\":3,\"content\":\"③－オ\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":1214,\"questionId\":307,\"optionNumber\":4,\"content\":\"④－エ\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":1215,\"questionId\":307,\"optionNumber\":5,\"content\":\"⑤－ア\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":1216,\"questionId\":307,\"optionNumber\":6,\"content\":\"③－ウ\",\"isCorrect\":true,\"explanation\":null,\"structuredData\":null},{\"id\":1217,\"questionId\":307,\"optionNumber\":7,\"content\":\"④－ア\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":1218,\"questionId\":307,\"optionNumber\":8,\"content\":\"⑤－エ\",\"isCorrect\":true,\"explanation\":null,\"structuredData\":null}],\"explanation\":null,\"correctOptions\":[],\"attempts\":[],\"_count\":{\"attempts\":0},\"isDebated\":false,\"isBookmarked\":false},{\"id\":312,\"year\":\"令和4年 (CBT)\",\"questionNumber\":1,\"field\":\"貨物自動車運送事業法\",\"majorField\":null,\"subField\":null,\"content\":\"貨物自動車運送事業に関する次の記述のうち、【正しいものを 2 つ】選びなさい。なお、解答にあたっては、各選択肢に記載されている事項以外は考慮しないものとする。（※法改正により一部改変）\",\"imageUrl\":null,\"sourceSheet\":null,\"knowledgeTags\":null,\"riskCategory\":null,\"situationCategory\":null,\"format\":\"SINGLE\",\"pdfUrl\":\"https://www.unkan-net.com/kakomon/R04.CBT.pdf\",\"pdfPage\":1,\"options\":[{\"id\":1432,\"questionId\":312,\"optionNumber\":1,\"content\":\"一般貨物自動車運送事業者は、「乗務員等の休憩又は睡眠のための施設の位置及び収容能力」に係る事業計画の変更をしようとするときは、国土交通大臣の認可を受けなければならない。\",\"isCorrect\":true,\"explanation\":null,\"structuredData\":null},{\"id\":1433,\"questionId\":312,\"optionNumber\":2,\"content\":\"貨物自動車運送事業とは、一般貨物自動車運送事業、特定貨物自動車運送事業、貨物軽自動車運送事業及び貨物自動車利用運送事業をいう。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":1434,\"questionId\":312,\"optionNumber\":3,\"content\":\"一般貨物自動車運送事業者は、運送約款を定め、又はこれを変更しようとするときは、国土交通大臣の認可を受けなければならない。\",\"isCorrect\":true,\"explanation\":null,\"structuredData\":null},{\"id\":1435,\"questionId\":312,\"optionNumber\":4,\"content\":\"一般貨物自動車運送事業の許可の取消しを受けた者は、その取消しの日から 2 年を経過しなければ、新たに一般貨物自動車運送事業の許可を受けることができない。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null}],\"explanation\":null,\"correctOptions\":[],\"attempts\":[],\"_count\":{\"attempts\":0},\"isDebated\":false,\"isBookmarked\":false},{\"id\":313,\"year\":\"令和4年 (CBT)\",\"questionNumber\":2,\"field\":\"貨物自動車運送事業法\",\"majorField\":null,\"subField\":null,\"content\":\"貨物自動車運送事業法等における運行管理者等の義務及び選任についての次の記述のうち、【誤っているものを 1 つ】選びなさい。なお、解答にあたっては、各選択肢に記載されている事項以外は考慮しないものとする。（※法改正により一部改変）\",\"imageUrl\":null,\"sourceSheet\":null,\"knowledgeTags\":\"#運行管理者の要件・選任\",\"riskCategory\":null,\"situationCategory\":null,\"format\":\"SINGLE\",\"pdfUrl\":\"https://www.unkan-net.com/kakomon/R04.CBT.pdf\",\"pdfPage\":1,\"options\":[{\"id\":1436,\"questionId\":313,\"optionNumber\":1,\"content\":\"一般貨物自動車運送事業者は、一般貨物自動車運送事業の許可を受けた後、速やかに、事業用自動車（被けん引自動車を除く。）の運行を管理する営業所ごとに、当該営業所が運行を管理する事業用自動車の数を 30 で除して得た数（その数に 1 未満の端数があるときは、これを切り捨てるものとする。）に 1 を加算して得た数以上の運行管理者を選任しなければならない。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":1437,\"questionId\":313,\"optionNumber\":2,\"content\":\"一般貨物自動車運送事業者は、運行管理者がその業務として行う助言を尊重しなければならず、事業用自動車の運転者その他の従業員は、運行管理者がその業務として行う指導に従わなければならない。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":1438,\"questionId\":313,\"optionNumber\":3,\"content\":\"一般貨物自動車運送事業者は、運行管理者の業務を補助させるための者（補助者）の選任については、運行管理者の履行補助として業務に支障が生じない場合であっても、同一事業者の他の営業所の補助者を兼務させることはできない。\",\"isCorrect\":true,\"explanation\":null,\"structuredData\":null},{\"id\":1439,\"questionId\":313,\"optionNumber\":4,\"content\":\"一般貨物自動車運送事業者は、運行管理者に対し、法令で定める業務を行うため必要な権限を与えなければならない。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null}],\"explanation\":null,\"correctOptions\":[],\"attempts\":[],\"_count\":{\"attempts\":0},\"isDebated\":false,\"isBookmarked\":false},{\"id\":314,\"year\":\"令和4年 (CBT)\",\"questionNumber\":3,\"field\":\"貨物自動車運送事業法\",\"majorField\":null,\"subField\":null,\"content\":\"次の記述のうち、一般貨物自動車運送事業の運行管理者が行わなければならない業務として、【正しいものを 2 つ】選びなさい。なお、解答にあたっては、各選択肢に記載されている事項以外は考慮しないものとする。（※法改正により一部改変）\",\"imageUrl\":null,\"sourceSheet\":null,\"knowledgeTags\":null,\"riskCategory\":null,\"situationCategory\":null,\"format\":\"SINGLE\",\"pdfUrl\":\"https://www.unkan-net.com/kakomon/R04.CBT.pdf\",\"pdfPage\":2,\"options\":[{\"id\":1440,\"questionId\":314,\"optionNumber\":1,\"content\":\"乗務員等が有効に利用することができるように、休憩に必要な施設を整備し、及び乗務員等に睡眠を与える必要がある場合にあっては睡眠に必要な施設を整備し、並びにこれらの施設を適切に管理し、及び保守すること。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":1441,\"questionId\":314,\"optionNumber\":2,\"content\":\"運行管理規程を定め、かつ、その遵守について運行管理業務を補助させるため選任した者（補助者）及び運転者等に対し指導及び監督を行うこと。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":1442,\"questionId\":314,\"optionNumber\":3,\"content\":\"事業用自動車に備えられた非常信号用具及び消火器の取扱いについて、当該事業用自動車の乗務員等に対する適切な指導を行うこと。\",\"isCorrect\":true,\"explanation\":null,\"structuredData\":null},{\"id\":1443,\"questionId\":314,\"optionNumber\":4,\"content\":\"法令の規定により、運転者等ごとに運転者等台帳を作成し、営業所に備え置くこと。\",\"isCorrect\":true,\"explanation\":null,\"structuredData\":null}],\"explanation\":{\"id\":93,\"questionId\":314,\"content\":\"この問題は、近年の試験における典型的なひっかけ（法改正アップデートの落とし穴）です。\\n\\nかつて、運転者台帳の作成・備え置きは法令上「事業者の義務」とだけ規定されていましたが、その後の法改正により、現在では「運転者等台帳を作成し、営業所に備え置くこと」が明確に『運行管理者の業務』として追加されています。\\n\\n各選択肢の解説は以下の通りです。\\n\\n1：×（事業者の義務）\\n休憩・睡眠施設の「管理」は運行管理者の業務（第20条第1項第2号）ですが、本肢のように「施設を整備し、保守すること」まで含まれると、それは事業者の義務（第11条）になります。\\n\\n2：×（事業者の義務）\\n「運行管理規程を定める」のは事業者の義務です。運行管理者はその規程に基づき指導監督等を行います。\\n\\n3：◯（運行管理者の業務）\\n非常信号用具や消火器の取扱い指導は、運行管理者の業務です（貨物自動車運送事業輸送安全規則 第20条第1項第12号）。\\n\\n4：◯（運行管理者の業務）\\n運転者等台帳の作成・備え置きは、法改正によって運行管理者の業務に追加されています（貨物自動車運送事業輸送安全規則 第20条第1項第13号等 ※年次改正により号数は変動あり、現在は第13号等として規定されています）。\\n\\n昔のテキストの知識や、過去問の古い解説を覚えている人ほど引っかかりやすいため、最新の法規に基づき「事業者」と「運行管理者」の義務の境界線を正確に区別しておくことが重要です。\",\"isDebated\":true},\"correctOptions\":[],\"attempts\":[],\"_count\":{\"attempts\":0},\"isDebated\":false,\"isBookmarked\":false},{\"id\":315,\"year\":\"令和4年 (CBT)\",\"questionNumber\":4,\"field\":\"貨物自動車運送事業法\",\"majorField\":null,\"subField\":null,\"content\":\"貨物自動車運送事業の事業用自動車の運転者に対する点呼についての法令等の定めに関する次の記述のうち、【正しいものをすべて】選びなさい。なお、解答にあたっては、各選択肢に記載されている事項以外は考慮しないものとする。（※法改正により一部改変）\",\"imageUrl\":null,\"sourceSheet\":null,\"knowledgeTags\":\"#点呼・乗務制限(管理者義務)\",\"riskCategory\":null,\"situationCategory\":null,\"format\":\"SINGLE\",\"pdfUrl\":\"https://www.unkan-net.com/kakomon/R04.CBT.pdf\",\"pdfPage\":2,\"options\":[{\"id\":1444,\"questionId\":315,\"optionNumber\":1,\"content\":\"貨物自動車運送事業者は、事業用自動車の運行の業務に従事しようとする運転者に対し、対面等（運行上やむを得ない場合は電話その他の方法）により点呼を行い、次に掲げる事項について報告を求め、及び確認を行い、並びに事業用自動車の運行の安全を確保するために必要な指示を与えなければならない。\\n(1) 酒気帯びの有無\\n(2) 疾病、疲労、睡眠不足その他の理由により安全な運転をすることができないおそれの有無\\n(3) 道路運送車両法第 47 条の 2 第 1 項及び第 2 項の規定による点検の実施又はその確認\",\"isCorrect\":true,\"explanation\":null,\"structuredData\":null},{\"id\":1445,\"questionId\":315,\"optionNumber\":2,\"content\":\"2 日間にわたる運行（営業所から出発し 1 日目を遠隔地で終了、2 日目に営業所に戻るもの。）については、1 日目の業務前の点呼及び 2 日目の業務後の点呼についてはいずれも対面で行うことができることから、業務前の点呼及び業務後の点呼のほかに、当該業務途中において少なくとも 1 回点呼（中間点呼）を行う必要はない。\",\"isCorrect\":true,\"explanation\":null,\"structuredData\":null},{\"id\":1446,\"questionId\":315,\"optionNumber\":3,\"content\":\"同一事業者内の全国貨物自動車運送適正化事業実施機関が認定している安全性優良事業所（Ｇマーク営業所）と当該営業所の車庫間で行うＩＴ点呼の実施は、1 営業日のうち連続する 16 時間以内としなければならない。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":1447,\"questionId\":315,\"optionNumber\":4,\"content\":\"貨物自動車運送事業者は、営業所と当該営業所の車庫が離れている場合は、運行上やむを得ない場合として、電話その他の方法により点呼を行うことができる。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null}],\"explanation\":null,\"correctOptions\":[],\"attempts\":[],\"_count\":{\"attempts\":0},\"isDebated\":false,\"isBookmarked\":false},{\"id\":316,\"year\":\"令和4年 (CBT)\",\"questionNumber\":5,\"field\":\"貨物自動車運送事業法\",\"majorField\":null,\"subField\":null,\"content\":\"次の自動車事故に関する記述のうち、一般貨物自動車運送事業者が自動車事故報告規則に基づき国土交通大臣に【報告を要するものを 2 つ】選びなさい。なお、解答にあたっては、各選択肢に記載されている事項以外は考慮しないものとする。（※法改正により一部改変）\",\"imageUrl\":null,\"sourceSheet\":null,\"knowledgeTags\":null,\"riskCategory\":null,\"situationCategory\":\"#事故対応事例\",\"format\":\"SINGLE\",\"pdfUrl\":\"https://www.unkan-net.com/kakomon/R04.CBT.pdf\",\"pdfPage\":3,\"options\":[{\"id\":1448,\"questionId\":316,\"optionNumber\":1,\"content\":\"事業用自動車が右折の際、一般原動機付自転車と接触し、当該一般原動機付自転車が転倒した。この事故で、一般原動機付自転車の運転者に 30 日間の通院による医師の治療を要する傷害を生じさせた。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":1449,\"questionId\":316,\"optionNumber\":2,\"content\":\"事業用自動車の運転者が運転操作を誤り、当該事業用自動車が道路の側壁に衝突した後、運転者席側を下にして転覆した状態で道路上に停車した。この事故で、当該運転者が 10 日間の医師の治療を要する傷害を負った。\",\"isCorrect\":true,\"explanation\":null,\"structuredData\":null},{\"id\":1450,\"questionId\":316,\"optionNumber\":3,\"content\":\"事業用自動車の運転者がハンドル操作を誤り、当該事業用自動車が道路の側壁に衝突した。その衝撃により積載されていた消防法第 2 条第 7 項に規定する危険物である灯油の一部が道路に漏えいした。\",\"isCorrect\":true,\"explanation\":null,\"structuredData\":null},{\"id\":1451,\"questionId\":316,\"optionNumber\":4,\"content\":\"事業用自動車が交差点に停車していた貨物自動車に気づくのが遅れ、当該事業用自動車がこの貨物自動車に追突し、さらに後続の自家用乗用自動車 3 台が関係する玉突き事故となり、この事故により 8 人が軽傷を負った。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null}],\"explanation\":{\"id\":94,\"questionId\":316,\"content\":\"Gemini との会話\\n解説\\n令和4年 (CBT) 年度 問5 の解説\\n\\n自動車事故報告規則第2条に定める「国土交通大臣への報告を要する重大事故」についての問題です。正解は 2 と 3 です。\\n\\n各選択肢の判定理由と解説は以下の通りです。\\n\\n選択肢1：報告を要しない (✕)\\n理由: 事故による負傷者の発生で報告対象となるのは、「死者」または「重傷者」を生じた場合です。規則における「重傷」の定義は、「14日以上の入院を要し、かつ、30日以上の医師の治療を要する傷害」などとされています。本肢のような「30日間の通院」のみでは基準に満たないため、報告の義務はありません。\\n\\n選択肢2：報告を要する (◯)\\n理由: 自動車が「転覆」した事故は、負傷者の有無や程度に関わらず報告の対象となります。（※転覆の定義：路面上において35度以上傾斜した状態）。「運転者席側を下にして転覆した状態」はこれに該当するため、報告が必要です。\\n\\n選択肢3：報告を要する (◯)\\n理由: 消防法で定める危険物（灯油など）、高圧ガス、毒物・劇物などを積載する自動車が、積載物を「飛散」または「漏えい」させた事故は報告の対象となります。事故の規模に関わらず、危険物が漏れた時点で報告義務が生じます。\\n\\n選択肢4：報告を要しない (✕)\\n理由: 多数の車両や負傷者が絡む事故で報告対象となる基準は、「10人以上の負傷者を生じた事故」または「10台以上の自動車が衝突・接触した事故」です。本肢は関係車両が計5台（事業用1台＋貨物1台＋自家用3台）、負傷者が8人であるため、どちらの基準も満たしていません。\\n\\n【復習ポイント：報告を要する主な重大事故の基準】\\n\\n死傷者の基準: 死者、または重傷者（14日以上入院 ＋ 30日以上治療 など）\\n\\n事故形態の基準: 転覆（35度以上傾斜）、転落（0.5m以上の落差）、火災 など\\n\\n積載物の基準: 危険物などの飛散・漏えい\\n\\n規模の基準: 負傷者10人以上、または関係車両10台以上\\n\",\"isDebated\":true},\"correctOptions\":[],\"attempts\":[],\"_count\":{\"attempts\":0},\"isDebated\":false,\"isBookmarked\":false},{\"id\":317,\"year\":\"令和4年 (CBT)\",\"questionNumber\":6,\"field\":\"貨物自動車運送事業法\",\"majorField\":null,\"subField\":null,\"content\":\"一般貨物自動車運送事業者（以下「事業者」という。）の過労運転等の防止等についての法令の定めに関する次の記述のうち、【誤っているものを 1 つ】選びなさい。なお、解答にあたっては、各選択肢に記載されている事項以外は考慮しないものとする。（※法改正により一部改変）\",\"imageUrl\":null,\"sourceSheet\":null,\"knowledgeTags\":\"#点呼・乗務制限(管理者義務)\",\"riskCategory\":null,\"situationCategory\":null,\"format\":\"SINGLE\",\"pdfUrl\":\"https://www.unkan-net.com/kakomon/R04.CBT.pdf\",\"pdfPage\":3,\"options\":[{\"id\":1452,\"questionId\":317,\"optionNumber\":1,\"content\":\"運転者が一の運行における最初の勤務を開始してから最後の勤務を終了するまでの時間（ただし、「自動車運転者の労働時間等の改善のための基準」（改善基準告示）に定める自動車運転者がフェリーに乗船している時間のうち休息期間とされる時間を除く。）は、168 時間を超えてはならない。\",\"isCorrect\":true,\"explanation\":null,\"structuredData\":null},{\"id\":1453,\"questionId\":317,\"optionNumber\":2,\"content\":\"事業者は、休憩又は睡眠のための時間及び勤務が終了した後の休息のための時間が十分に確保されるように、国土交通大臣が告示で定める基準に従って、運転者の勤務時間及び乗務時間を定め、当該運転者にこれらを遵守させなければならない。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":1454,\"questionId\":317,\"optionNumber\":3,\"content\":\"事業者は、事業計画に従い業務を行うに必要な員数の事業用自動車の運転者（以下「運転者」という。）を常時選任しておかなければならず、この場合、選任する運転者は、日々雇い入れられる者、2 ヵ月以内の期間を定めて使用される者又は試みの使用期間中の者（14 日を超えて引き続き使用されるに至った者を除く。）であってはならない。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":1455,\"questionId\":317,\"optionNumber\":4,\"content\":\"特別積合せ貨物運送を行う事業者は、当該特別積合せ貨物運送に係る運行系統であって起点から終点までの距離が 100 キロメートルを超えるものごとに、所定の事項について事業用自動車の運行の業務に関する基準を定め、かつ、当該基準の遵守について乗務員等に対する適切な指導及び監督を行わなければならない。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null}],\"explanation\":{\"id\":96,\"questionId\":317,\"content\":\"なんでこの数字？「144時間」という数字の理由は、ずばり 「24時間 × 6日間 ＝ 144時間」 だからです。これは、ドライバーが自分の営業所を出発してから、長距離輸送を終えて最高でも6日以内には自分の営業所へ戻ってこなければならないというルール（「貨物自動車運送事業輸送安全規則 第3条」などに基づく規定）からきています。この数字が設定されている主な背景は以下の3点です。144時間（6日間）である理由「週休1日」の確保： 労働基準法では少なくとも「毎週1回の休日」が義務付けられています。1週間（7日間）のうち、最大でも連続で働いていいのは6日間までとなるため、24時間×6日＝144時間が上限となります。過労と事故の防止： 出発してから何日も家に帰れず、長期間連続で運行を続けると、ドライバーの疲労が蓄積し判断力が低下します。大事故のリスクを抑えるためのデッドラインとして設定されています。片道3日の限界： 往復で6日以内ということは、片道最高3日で目的地に到着し、折り返して帰ってこなければなりません。これにより、果てしなく遠くへ行くような無理な運行計画を国が禁止しています。ちなみに、この144時間には「運転時間」だけでなく、途中の「休憩時間」やホテルなどでの「休息期間（睡眠など）」もすべてカウントし続けなければなりません。もしよろしければ、このルールに関連して以下の点についてもご案内できます。2024年4月に改正された最新の「拘束時間」や「休息期間」の変更点2人以上で交代しながら運転する「特例（ツーマン運行）」の場合のルール気になる部分があれば、いつでもお尋ねください。\",\"isDebated\":true},\"correctOptions\":[],\"attempts\":[],\"_count\":{\"attempts\":0},\"isDebated\":false,\"isBookmarked\":false},{\"id\":318,\"year\":\"令和4年 (CBT)\",\"questionNumber\":7,\"field\":\"貨物自動車運送事業法\",\"majorField\":null,\"subField\":null,\"content\":\"一般貨物自動車運送事業者（以下「事業者」という。）の事業用自動車の運行の安全を確保するために、事業者が行う国土交通省告示で定める特定の運転者に対する特別な指導の指針に関する次の文中、Ａ、Ｂ、Ｃに入るべき字句として【いずれか正しいものを 1 つ】選びなさい。\\n1．事業者は、適齢診断（高齢運転者のための適性診断として国土交通大臣が認定したもの。）を運転者が 65 才に達した日以後 1 年以内に 1 回受診させ、その後 Ａ 以内ごとに 1 回受診させること。\\n2．事業者は、初任運転者に対する特別な指導について、当該事業者において初めて事業用自動車に乗務する前に実施すること。ただし、やむを得ない事情がある場合には、乗務を開始した後 Ｂ 以内に実施すること。\\n3．事業者が行う初任運転者に対する特別な指導は、法令に基づき運転者が遵守すべき事項、事業用自動車の運行の安全を確保するために必要な運転に関する事項などについて、15 時間以上実施するとともに、安全運転の実技について、 Ｃ 以上実施すること。\",\"imageUrl\":null,\"sourceSheet\":null,\"knowledgeTags\":null,\"riskCategory\":null,\"situationCategory\":null,\"format\":\"MULTI_GROUP\",\"pdfUrl\":\"https://www.unkan-net.com/kakomon/R04.CBT.pdf\",\"pdfPage\":4,\"options\":[{\"id\":1550,\"questionId\":318,\"optionNumber\":1,\"content\":\"Ａ : 2 年\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":\"{\\\"title\\\":\\\"Ａ\\\",\\\"choices\\\":[{\\\"num\\\":1,\\\"text\\\":\\\"2 年\\\"},{\\\"num\\\":2,\\\"text\\\":\\\"3 年\\\"}]}\"},{\"id\":1551,\"questionId\":318,\"optionNumber\":2,\"content\":\"Ａ : 3 年\",\"isCorrect\":true,\"explanation\":null,\"structuredData\":\"{\\\"title\\\":\\\"Ａ\\\",\\\"choices\\\":[{\\\"num\\\":1,\\\"text\\\":\\\"2 年\\\"},{\\\"num\\\":2,\\\"text\\\":\\\"3 年\\\"}]}\"},{\"id\":1552,\"questionId\":318,\"optionNumber\":3,\"content\":\"Ｂ : 1 ヵ月\",\"isCorrect\":true,\"explanation\":null,\"structuredData\":\"{\\\"title\\\":\\\"Ｂ\\\",\\\"choices\\\":[{\\\"num\\\":1,\\\"text\\\":\\\"1 ヵ月\\\"},{\\\"num\\\":2,\\\"text\\\":\\\"3 ヵ月\\\"}]}\"},{\"id\":1553,\"questionId\":318,\"optionNumber\":4,\"content\":\"Ｂ : 3 ヵ月\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":\"{\\\"title\\\":\\\"Ｂ\\\",\\\"choices\\\":[{\\\"num\\\":1,\\\"text\\\":\\\"1 ヵ月\\\"},{\\\"num\\\":2,\\\"text\\\":\\\"3 ヵ月\\\"}]}\"},{\"id\":1554,\"questionId\":318,\"optionNumber\":5,\"content\":\"Ｃ : 20 時間\",\"isCorrect\":true,\"explanation\":null,\"structuredData\":\"{\\\"title\\\":\\\"Ｃ\\\",\\\"choices\\\":[{\\\"num\\\":1,\\\"text\\\":\\\"20 時間\\\"},{\\\"num\\\":2,\\\"text\\\":\\\"30 時間\\\"}]}\"},{\"id\":1555,\"questionId\":318,\"optionNumber\":6,\"content\":\"Ｃ : 30 時間\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":\"{\\\"title\\\":\\\"Ｃ\\\",\\\"choices\\\":[{\\\"num\\\":1,\\\"text\\\":\\\"20 時間\\\"},{\\\"num\\\":2,\\\"text\\\":\\\"30 時間\\\"}]}\"}],\"explanation\":null,\"correctOptions\":[],\"attempts\":[],\"_count\":{\"attempts\":0},\"isDebated\":false,\"isBookmarked\":false},{\"id\":319,\"year\":\"令和4年 (CBT)\",\"questionNumber\":8,\"field\":\"貨物自動車運送事業法\",\"majorField\":null,\"subField\":null,\"content\":\"一般貨物自動車運送事業者（以下「事業者」という。）の貨物の積載方法等に関する次の記述のうち、【正しいものを 2 つ】選びなさい。なお、解答にあたっては、各選択肢に記載されている事項以外は考慮しないものとする。（※法改正により一部改変）\",\"imageUrl\":null,\"sourceSheet\":null,\"knowledgeTags\":null,\"riskCategory\":null,\"situationCategory\":null,\"format\":\"SINGLE\",\"pdfUrl\":\"https://www.unkan-net.com/kakomon/R04.CBT.pdf\",\"pdfPage\":4,\"options\":[{\"id\":1459,\"questionId\":319,\"optionNumber\":1,\"content\":\"事業者は、危険物を運搬する場合、その運転者に対し、消防法（昭和 23 年法律第 186 号）その他の危険物の規制に関する法令に基づき、運搬する危険物の性状を理解させるとともに、取扱い方法、積載方法及び運搬方法について留意すべき事項を指導しなければならない。また、運搬中に危険物が飛散又は漏えいした場合に安全を確保するためにとるべき方法を指導し、習得させなければならない。\",\"isCorrect\":true,\"explanation\":null,\"structuredData\":null},{\"id\":1460,\"questionId\":319,\"optionNumber\":2,\"content\":\"事業者は、事業用自動車（車両総重量が 8 トン以上又は最大積載量が 5 トン以上のものに限る。）に、貨物を積載するときは、偏荷重が生じないように積載するとともに、運搬中に荷崩れ等により事業用自動車から落下することを防止するため、貨物にロープ又はシートを掛けること等必要な措置を講じなければならない。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":1461,\"questionId\":319,\"optionNumber\":3,\"content\":\"事業者は、道路法第 47 条第 2 項の規定（車両でその幅、重量、高さ、長さ又は最小回転半径が政令で定める最高限度を超えるものは、道路を通行させてはならない。）に違反し、又は政令で定める最高限度を超える車両の通行に関し道路管理者が付した条件（通行経路、通行時間等）に違反して事業用自動車を通行させることを防止するため、運転者等に対する適切な指導及び監督を怠ってはならない。\",\"isCorrect\":true,\"explanation\":null,\"structuredData\":null},{\"id\":1462,\"questionId\":319,\"optionNumber\":4,\"content\":\"車両総重量が 8 トン以上又は最大積載量が 5 トン以上の普通自動車である事業用自動車の運行の業務に従事する運転者等は、当該業務において、法令の規定に基づき作成された運行指示書に「貨物の積載状況」が記録されている場合は、業務の記録に当該事項を記録したものとみなされる。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null}],\"explanation\":null,\"correctOptions\":[],\"attempts\":[],\"_count\":{\"attempts\":0},\"isDebated\":false,\"isBookmarked\":false},{\"id\":320,\"year\":\"令和4年 (CBT)\",\"questionNumber\":9,\"field\":\"道路運送車両法\",\"majorField\":null,\"subField\":null,\"content\":\"自動車の登録等についての次の記述のうち、【誤っているものを 1 つ】選びなさい。なお、解答にあたっては、各選択肢に記載されている事項以外は考慮しないものとする。\",\"imageUrl\":null,\"sourceSheet\":null,\"knowledgeTags\":\"#自動車の登録・車検\",\"riskCategory\":null,\"situationCategory\":null,\"format\":\"SINGLE\",\"pdfUrl\":\"https://www.unkan-net.com/kakomon/R04.CBT.pdf\",\"pdfPage\":5,\"options\":[{\"id\":1463,\"questionId\":320,\"optionNumber\":1,\"content\":\"登録自動車の所有者は、当該自動車の使用者が道路運送車両法の規定により自動車の使用の停止を命ぜられ、同法の規定により自動車検査証を返納したときは、その事由があった日から 30 日以内に、当該自動車登録番号標及び封印を取りはずし、自動車登録番号標について国土交通大臣に届け出なければならない。\",\"isCorrect\":true,\"explanation\":null,\"structuredData\":null},{\"id\":1464,\"questionId\":320,\"optionNumber\":2,\"content\":\"自動車は、自動車登録番号標を国土交通省令で定める位置に、かつ、被覆しないことその他当該自動車登録番号標に記載された自動車登録番号の識別に支障が生じないものとして国土交通省令で定める方法により表示しなければ、運行の用に供してはならない。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":1465,\"questionId\":320,\"optionNumber\":3,\"content\":\"道路運送車両法に規定する自動車の種別は、自動車の大きさ及び構造並びに原動機の種類及び総排気量又は定格出力を基準として定められ、その種別は、普通自動車、小型自動車、軽自動車、大型特殊自動車、小型特殊自動車である。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":1466,\"questionId\":320,\"optionNumber\":4,\"content\":\"登録自動車について所有者の変更があったときは、新所有者は、その事由があった日から 15 日以内に、国土交通大臣の行う移転登録の申請をしなければならない。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null}],\"explanation\":{\"id\":98,\"questionId\":320,\"content\":\"$3b\",\"isDebated\":true},\"correctOptions\":[],\"attempts\":[],\"_count\":{\"attempts\":0},\"isDebated\":false,\"isBookmarked\":false},{\"id\":321,\"year\":\"令和4年 (CBT)\",\"questionNumber\":10,\"field\":\"道路運送車両法\",\"majorField\":null,\"subField\":null,\"content\":\"自動車の検査等についての次の記述のうち、【正しいものを 2 つ】選びなさい。なお、解答にあたっては、各選択肢に記載されている事項以外は考慮しないものとする。（※法改正により一部改変）\",\"imageUrl\":null,\"sourceSheet\":null,\"knowledgeTags\":\"#自動車の登録・車検\",\"riskCategory\":null,\"situationCategory\":null,\"format\":\"SINGLE\",\"pdfUrl\":\"https://www.unkan-net.com/kakomon/R04.CBT.pdf\",\"pdfPage\":5,\"options\":[{\"id\":1467,\"questionId\":321,\"optionNumber\":1,\"content\":\"自動車は、指定自動車整備事業者が継続検査の際に交付した有効な保安基準適合標章を表示している場合であっても、自動車検査証を備え付けなければ、運行の用に供してはならない。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":1468,\"questionId\":321,\"optionNumber\":2,\"content\":\"自動車の使用者は、継続検査を申請する場合において、道路運送車両法第 67 条（自動車検査証記録事項の変更及び構造等変更検査）の規定による自動車検査証の変更記録の申請をすべき事由があるときは、あらかじめ、その申請をしなければならない。\",\"isCorrect\":true,\"explanation\":null,\"structuredData\":null},{\"id\":1469,\"questionId\":321,\"optionNumber\":3,\"content\":\"国土交通大臣は、一定の地域に使用の本拠の位置を有する自動車の使用者が、天災その他やむを得ない事由により、継続検査を受けることができないと認めるときは、当該地域に使用の本拠の位置を有する自動車の自動車検査証の有効期間を、期間を定めて伸長する旨を公示することができる。\",\"isCorrect\":true,\"explanation\":null,\"structuredData\":null},{\"id\":1470,\"questionId\":321,\"optionNumber\":4,\"content\":\"自動車に表示されている検査標章には、当該自動車の自動車検査証の有効期間の起算日が表示されている。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null}],\"explanation\":{\"id\":100,\"questionId\":321,\"content\":\"これは[道路運送車両法](https://kako-mon.com/un-k/2021-0-02-010/)第61条の2第1項に定められている、正しい条文です。天災などのやむを得ない理由で車検（継続検査）が受けられない場合、国土交通大臣（または地方運輸局長等）が有効期間を延ばす措置をとることができます。 [1, 2, 3] \\n## 制度のポイント\\n\\n* 対象地域: 災害などで大きな影響を受けた一定の地域。\\n* 効果: 公示されると、手続きをしなくても車検証の有効期間が自動的に伸長されたとみなされます。\\n* 適用除外: 構造変更などの手続き（同法第67条第1項）は、この有効期間の伸長には適用されません。 [1, 3, 4] \\n\\nお探しの地域での具体的な災害による車検延長情報や、対象期間・対象車両について知りたい場合は、その地域名をお知らせください。\\n\",\"isDebated\":true},\"correctOptions\":[],\"attempts\":[],\"_count\":{\"attempts\":0},\"isDebated\":false,\"isBookmarked\":false},{\"id\":322,\"year\":\"令和4年 (CBT)\",\"questionNumber\":11,\"field\":\"道路運送車両法\",\"majorField\":null,\"subField\":null,\"content\":\"道路運送車両法に定める自動車の点検整備等に関する次の文中、Ａ、Ｂ、Ｃ、Ｄに入るべき字句として【いずれか正しいものを 1 つ】選びなさい。\\n1．初めて自動車検査証の交付を受ける車両総重量 8,990 キログラムの貨物の運送の用に供する自動車については、当該自動車検査証の有効期間は Ａ である。\\n2．車両総重量 Ｂ 以上又は乗車定員 30 人以上の自動車は、日常点検において「ディスク・ホイールの取付状態が不良でないこと。」について点検しなければならない。\\n3．自動車運送事業の用に供する自動車の日常点検の結果に基づく運行可否の決定は、自動車の使用者より与えられた権限に基づき、 Ｃ が行わなければならない。\\n4．事業用自動車の使用者は、点検の結果、当該自動車が保安基準に適合しなくなるおそれがある状態又は適合しない状態にあるときは、保安基準に適合しなくなるおそれをなくするため、又は保安基準に適合させるために当該自動車について必要な Ｄ をしなければならない。\",\"imageUrl\":null,\"sourceSheet\":null,\"knowledgeTags\":\"#保安基準(寸法・重量・灯火),#日常点検・定期点検,#自動車の登録・車検\",\"riskCategory\":null,\"situationCategory\":null,\"format\":\"MULTI_GROUP\",\"pdfUrl\":\"https://www.unkan-net.com/kakomon/R04.CBT.pdf\",\"pdfPage\":6,\"options\":[{\"id\":1556,\"questionId\":322,\"optionNumber\":1,\"content\":\"Ａ : 1 年\",\"isCorrect\":true,\"explanation\":null,\"structuredData\":\"{\\\"title\\\":\\\"Ａ\\\",\\\"choices\\\":[{\\\"num\\\":1,\\\"text\\\":\\\"1 年\\\"},{\\\"num\\\":2,\\\"text\\\":\\\"2 年\\\"}]}\"},{\"id\":1557,\"questionId\":322,\"optionNumber\":2,\"content\":\"Ａ : 2 年\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":\"{\\\"title\\\":\\\"Ａ\\\",\\\"choices\\\":[{\\\"num\\\":1,\\\"text\\\":\\\"1 年\\\"},{\\\"num\\\":2,\\\"text\\\":\\\"2 年\\\"}]}\"},{\"id\":1558,\"questionId\":322,\"optionNumber\":3,\"content\":\"Ｂ : 7 トン\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":\"{\\\"title\\\":\\\"Ｂ\\\",\\\"choices\\\":[{\\\"num\\\":1,\\\"text\\\":\\\"7 トン\\\"},{\\\"num\\\":2,\\\"text\\\":\\\"8 トン\\\"}]}\"},{\"id\":1559,\"questionId\":322,\"optionNumber\":4,\"content\":\"Ｂ : 8 トン\",\"isCorrect\":true,\"explanation\":null,\"structuredData\":\"{\\\"title\\\":\\\"Ｂ\\\",\\\"choices\\\":[{\\\"num\\\":1,\\\"text\\\":\\\"7 トン\\\"},{\\\"num\\\":2,\\\"text\\\":\\\"8 トン\\\"}]}\"},{\"id\":1560,\"questionId\":322,\"optionNumber\":5,\"content\":\"Ｃ : 運行管理者\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":\"{\\\"title\\\":\\\"Ｃ\\\",\\\"choices\\\":[{\\\"num\\\":1,\\\"text\\\":\\\"運行管理者\\\"},{\\\"num\\\":2,\\\"text\\\":\\\"整備管理者\\\"}]}\"},{\"id\":1561,\"questionId\":322,\"optionNumber\":6,\"content\":\"Ｃ : 整備管理者\",\"isCorrect\":true,\"explanation\":null,\"structuredData\":\"{\\\"title\\\":\\\"Ｃ\\\",\\\"choices\\\":[{\\\"num\\\":1,\\\"text\\\":\\\"運行管理者\\\"},{\\\"num\\\":2,\\\"text\\\":\\\"整備管理者\\\"}]}\"},{\"id\":1562,\"questionId\":322,\"optionNumber\":7,\"content\":\"Ｄ : 検査\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":\"{\\\"title\\\":\\\"Ｄ\\\",\\\"choices\\\":[{\\\"num\\\":1,\\\"text\\\":\\\"検査\\\"},{\\\"num\\\":2,\\\"text\\\":\\\"整備\\\"}]}\"},{\"id\":1563,\"questionId\":322,\"optionNumber\":8,\"content\":\"Ｄ : 整備\",\"isCorrect\":true,\"explanation\":null,\"structuredData\":\"{\\\"title\\\":\\\"Ｄ\\\",\\\"choices\\\":[{\\\"num\\\":1,\\\"text\\\":\\\"検査\\\"},{\\\"num\\\":2,\\\"text\\\":\\\"整備\\\"}]}\"}],\"explanation\":{\"id\":102,\"questionId\":322,\"content\":\"$3c\",\"isDebated\":true},\"correctOptions\":[],\"attempts\":[],\"_count\":{\"attempts\":0},\"isDebated\":false,\"isBookmarked\":false},{\"id\":323,\"year\":\"令和4年 (CBT)\",\"questionNumber\":12,\"field\":\"道路運送車両法\",\"majorField\":null,\"subField\":null,\"content\":\"道路運送車両の保安基準及びその細目を定める告示についての次の記述のうち、【誤っているものを 1 つ】選びなさい。なお、解答にあたっては、各選択肢に記載されている事項以外は考慮しないものとする。\",\"imageUrl\":null,\"sourceSheet\":null,\"knowledgeTags\":\"#保安基準(寸法・重量・灯火)\",\"riskCategory\":null,\"situationCategory\":null,\"format\":\"SINGLE\",\"pdfUrl\":\"https://www.unkan-net.com/kakomon/R04.CBT.pdf\",\"pdfPage\":6,\"options\":[{\"id\":1475,\"questionId\":323,\"optionNumber\":1,\"content\":\"路線を定めて定期に運行する一般乗合旅客自動車運送事業用自動車に備える旅客が乗降中であることを後方に表示する電光表示器には、点滅する灯火又は光度が増減する灯火を備えることができる。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":1476,\"questionId\":323,\"optionNumber\":2,\"content\":\"自動車に備えなければならない後写鏡は、取付部付近の自動車の最外側より突出している部分の最下部が地上 2.0 メートル以下のものは、当該部分が歩行者等に接触した場合に衝撃を緩衝できる構造でなければならない。\",\"isCorrect\":true,\"explanation\":null,\"structuredData\":null},{\"id\":1477,\"questionId\":323,\"optionNumber\":3,\"content\":\"自動車に備えなければならない非常信号用具は、夜間 200 メートルの距離から確認できる赤色の灯光を発するものでなければならない。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":1478,\"questionId\":323,\"optionNumber\":4,\"content\":\"自動車（大型特殊自動車、小型特殊自動車を除く。）の車体の外形その他自動車の形状については、鋭い突起がないこと、回転部分が突出していないこと等他の交通の安全を妨げるおそれがないものとして、告示で定める基準に適合するものでなければならない。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null}],\"explanation\":{\"id\":104,\"questionId\":323,\"content\":\"その記述は誤りです。正しくは、最下部が地上「1.8メートル以下」のものが衝撃を緩衝できる構造でなければなりません。高さの基準は2.0メートルではなく1.8メートルです。後写鏡の衝撃緩和構造の基準対象：取付部付近の自動車の最外側より突出している部分高度基準：最下部が地上 1.8メートル以下 のもの構造要件：歩行者等に接触した場合に 衝撃を緩衝できる 構造であることさらに詳しく知りたい箇所や、関連する他の保安基準（視界や面積の基準など）について確認したい項目があればお知らせください。\",\"isDebated\":true},\"correctOptions\":[],\"attempts\":[],\"_count\":{\"attempts\":0},\"isDebated\":false,\"isBookmarked\":false},{\"id\":324,\"year\":\"令和4年 (CBT)\",\"questionNumber\":13,\"field\":\"道路交通法\",\"majorField\":null,\"subField\":null,\"content\":\"道路交通法に定める用語の定義等についての次の記述のうち、【誤っているものを 1 つ】選びなさい。なお、解答にあたっては、各選択肢に記載されている事項以外は考慮しないものとする。（※法改正により一部改変）\",\"imageUrl\":null,\"sourceSheet\":null,\"knowledgeTags\":null,\"riskCategory\":null,\"situationCategory\":null,\"format\":\"SINGLE\",\"pdfUrl\":\"https://www.unkan-net.com/kakomon/R04.CBT.pdf\",\"pdfPage\":7,\"options\":[{\"id\":1479,\"questionId\":324,\"optionNumber\":1,\"content\":\"路側帯とは、歩行者及び自転車の通行の用に供するため、歩道の設けられていない道路又は道路の歩道の設けられていない側の路端寄りに設けられた帯状の道路の部分で、道路標示によって区画されたものをいう。\",\"isCorrect\":true,\"explanation\":null,\"structuredData\":null},{\"id\":1480,\"questionId\":324,\"optionNumber\":2,\"content\":\"安全地帯とは、路面電車に乗降する者若しくは横断している歩行者の安全を図るため道路に設けられた島状の施設又は道路標識及び道路標示により安全地帯であることが示されている道路の部分をいう。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":1481,\"questionId\":324,\"optionNumber\":3,\"content\":\"車両とは、自動車、原動機付自転車、軽車両及びトロリーバスをいう。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":1482,\"questionId\":324,\"optionNumber\":4,\"content\":\"自動車とは、原動機を用い、かつ、レール又は架線によらないで運転する車又は特定自動運行を行う車であって、原動機付自転車、軽車両、移動用小型車、身体障害者用の車及び遠隔操作型小型車並びに歩行補助車、乳母車その他の歩きながら用いる小型の車で道路交通法施行令で定めるもの以外のものをいう。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null}],\"explanation\":null,\"correctOptions\":[],\"attempts\":[],\"_count\":{\"attempts\":0},\"isDebated\":false,\"isBookmarked\":false},{\"id\":325,\"year\":\"令和4年 (CBT)\",\"questionNumber\":14,\"field\":\"道路交通法\",\"majorField\":null,\"subField\":null,\"content\":\"道路交通法に定める灯火及び合図等についての次の記述のうち、【正しいものを 2 つ】選びなさい。なお、解答にあたっては、各選択肢に記載されている事項以外は考慮しないものとする。\",\"imageUrl\":null,\"sourceSheet\":null,\"knowledgeTags\":null,\"riskCategory\":null,\"situationCategory\":null,\"format\":\"SINGLE\",\"pdfUrl\":\"https://www.unkan-net.com/kakomon/R04.CBT.pdf\",\"pdfPage\":7,\"options\":[{\"id\":1483,\"questionId\":325,\"optionNumber\":1,\"content\":\"車両等は、夜間（日没時から日出時までの時間をいう。）、道路にあるときは、道路交通法施行令で定めるところにより、前照灯、車幅灯、尾灯その他の灯火をつけなければならない。ただし、高速自動車国道及び自動車専用道路においては前方 200 メートル、その他の道路においては前方 50 メートルまで明りょうに見える程度に照明が行われているトンネルを通行する場合は、この限りではない。\",\"isCorrect\":true,\"explanation\":null,\"structuredData\":null},{\"id\":1484,\"questionId\":325,\"optionNumber\":2,\"content\":\"停留所において乗客の乗降のため停車していた乗合自動車が発進するため進路を変更しようとして手又は方向指示器により合図をした場合においては、その後方にある車両は、その速度を急に変更しなければならないこととなる場合にあっても、当該合図をした乗合自動車の進路の変更を妨げてはならない。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":1485,\"questionId\":325,\"optionNumber\":3,\"content\":\"車両等の運転者は、山地部の道路その他曲折が多い道路について道路標識等により指定された区間以外であっても、見とおしのきかない道路のまがりかど又は見とおしのきかない上り坂の頂上を通行しようとするときは、必ず警音器を鳴らさなければならない。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":1486,\"questionId\":325,\"optionNumber\":4,\"content\":\"車両の運転者が同一方向に進行しながら進路を左方又は右方に変えるときの合図を行う時期は、その行為をしようとする時の 3 秒前のときである。\",\"isCorrect\":true,\"explanation\":null,\"structuredData\":null}],\"explanation\":{\"id\":106,\"questionId\":325,\"content\":\"$3d\",\"isDebated\":true},\"correctOptions\":[],\"attempts\":[],\"_count\":{\"attempts\":0},\"isDebated\":false,\"isBookmarked\":false},{\"id\":326,\"year\":\"令和4年 (CBT)\",\"questionNumber\":15,\"field\":\"道路交通法\",\"majorField\":null,\"subField\":null,\"content\":\"道路交通法及び道路交通法施行令に定める酒気帯び運転等の禁止等に関する次の文中、Ａ、Ｂ、Ｃに入るべき字句として【いずれか正しいものを 1 つ】選びなさい。\\n（※法改正により一部改変）\\n(1) 何人も、酒気を帯びて車両等を運転してはならない。\\n(2) 何人も、酒気を帯びている者で、(1)の規定に違反して車両等を運転することとなるおそれがあるものに対し、 Ａ してはならない。\\n(3) 何人も、(1)の規定に違反して車両等を運転することとなるおそれがある者に対し、酒類を提供し、又は飲酒をすすめてはならない。\\n(4) 何人も、車両（トロリーバス及び旅客自動車運送事業の用に供する自動車で当該業務に従事中のものその他の政令で定める自動車を除く。）の運転者が酒気を帯びていることを知りながら、当該運転者に対し、当該車両を運転して自己を運送することを要求し、又は依頼して、当該運転者が(1)の規定に違反して運転する Ｂ してはならない。\\n(5) (1)の規定に違反して車両等（自転車以外の軽車両を除く。）を運転した者で、その運転をした場合において身体に血液 1 ミリリットルにつき 0.3 ミリグラム又は呼気 1 リットルにつき Ｃ ミリグラム以上にアルコールを保有する状態にあったものは、3 年以下の拘禁刑又は 50 万円以下の罰金に処する。\",\"imageUrl\":null,\"sourceSheet\":null,\"knowledgeTags\":\"#過労・酒気・過積載(禁止行為)\",\"riskCategory\":null,\"situationCategory\":null,\"format\":\"MULTI_GROUP\",\"pdfUrl\":\"https://www.unkan-net.com/kakomon/R04.CBT.pdf\",\"pdfPage\":8,\"options\":[{\"id\":1564,\"questionId\":326,\"optionNumber\":1,\"content\":\"Ａ : 運転を指示\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":\"{\\\"title\\\":\\\"Ａ\\\",\\\"choices\\\":[{\\\"num\\\":1,\\\"text\\\":\\\"運転を指示\\\"},{\\\"num\\\":2,\\\"text\\\":\\\"車両等を提供\\\"}]}\"},{\"id\":1565,\"questionId\":326,\"optionNumber\":2,\"content\":\"Ａ : 車両等を提供\",\"isCorrect\":true,\"explanation\":null,\"structuredData\":\"{\\\"title\\\":\\\"Ａ\\\",\\\"choices\\\":[{\\\"num\\\":1,\\\"text\\\":\\\"運転を指示\\\"},{\\\"num\\\":2,\\\"text\\\":\\\"車両等を提供\\\"}]}\"},{\"id\":1566,\"questionId\":326,\"optionNumber\":3,\"content\":\"Ｂ : 車両に同乗\",\"isCorrect\":true,\"explanation\":null,\"structuredData\":\"{\\\"title\\\":\\\"Ｂ\\\",\\\"choices\\\":[{\\\"num\\\":1,\\\"text\\\":\\\"車両に同乗\\\"},{\\\"num\\\":2,\\\"text\\\":\\\"機会を提供\\\"}]}\"},{\"id\":1567,\"questionId\":326,\"optionNumber\":4,\"content\":\"Ｂ : 機会を提供\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":\"{\\\"title\\\":\\\"Ｂ\\\",\\\"choices\\\":[{\\\"num\\\":1,\\\"text\\\":\\\"車両に同乗\\\"},{\\\"num\\\":2,\\\"text\\\":\\\"機会を提供\\\"}]}\"},{\"id\":1568,\"questionId\":326,\"optionNumber\":5,\"content\":\"Ｃ : 0.15\",\"isCorrect\":true,\"explanation\":null,\"structuredData\":\"{\\\"title\\\":\\\"Ｃ\\\",\\\"choices\\\":[{\\\"num\\\":1,\\\"text\\\":\\\"0.15\\\"},{\\\"num\\\":2,\\\"text\\\":\\\"0.25\\\"}]}\"},{\"id\":1569,\"questionId\":326,\"optionNumber\":6,\"content\":\"Ｃ : 0.25\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":\"{\\\"title\\\":\\\"Ｃ\\\",\\\"choices\\\":[{\\\"num\\\":1,\\\"text\\\":\\\"0.15\\\"},{\\\"num\\\":2,\\\"text\\\":\\\"0.25\\\"}]}\"}],\"explanation\":{\"id\":108,\"questionId\":326,\"content\":\"$3e\",\"isDebated\":true},\"correctOptions\":[],\"attempts\":[],\"_count\":{\"attempts\":0},\"isDebated\":false,\"isBookmarked\":false},{\"id\":327,\"year\":\"令和4年 (CBT)\",\"questionNumber\":16,\"field\":\"道路交通法\",\"majorField\":null,\"subField\":null,\"content\":\"道路交通法に定める法定速度についての次の記述のうち、【誤っているものを 1 つ】選びなさい。なお、解答にあたっては、各選択肢に記載されている事項以外は考慮しないものとする。（※法改正により一部改変）\",\"imageUrl\":null,\"sourceSheet\":null,\"knowledgeTags\":\"#法定速度\",\"riskCategory\":null,\"situationCategory\":null,\"format\":\"SINGLE\",\"pdfUrl\":\"https://www.unkan-net.com/kakomon/R04.CBT.pdf\",\"pdfPage\":8,\"options\":[{\"id\":1490,\"questionId\":327,\"optionNumber\":1,\"content\":\"自動車は、道路標識等によりその最高速度が指定されている道路においてはその最高速度を、高速自動車国道の本線車道（往復の方向にする通行が行われている本線車道で、本線車線が道路の構造上往復の方向別に分離されていないものを除く。）並びにこれに接する加速車線及び減速車線以外の道路においては 60 キロメートル毎時をこえる速度で進行してはならない。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":1491,\"questionId\":327,\"optionNumber\":2,\"content\":\"貨物自動車（車両総重量 12,000 キログラム、最大積載量 8,000 キログラムであって乗車定員 3 名のトラック）の最高速度は、道路標識等により最高速度が指定されていない高速自動車国道の本線車道（政令で定めるものを除く。）においては、100 キロメートル毎時である。\",\"isCorrect\":true,\"explanation\":null,\"structuredData\":null},{\"id\":1492,\"questionId\":327,\"optionNumber\":3,\"content\":\"貨物自動車運送事業の用に供する車両総重量が 4,995 キログラムの自動車が､故障した車両総重量 1,500 キログラムの普通自動車をロープでけん引する場合の最高速度は、道路標識等により最高速度が指定されていない一般道路においては、40 キロメートル毎時である。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":1493,\"questionId\":327,\"optionNumber\":4,\"content\":\"貨物自動車は、高速自動車国道の往復の方向にする通行が行われている本線車道で、道路の構造上往復の方向別に分離されている本線車道においては、道路標識等により自動車の最低速度が指定されている区間にあってはその最低速度に、その他の区間にあっては、50 キロメートル毎時の最低速度に達しない速度で進行してはならない。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null}],\"explanation\":{\"id\":110,\"questionId\":327,\"content\":\"$3f\",\"isDebated\":true},\"correctOptions\":[],\"attempts\":[],\"_count\":{\"attempts\":0},\"isDebated\":false,\"isBookmarked\":false},{\"id\":328,\"year\":\"令和4年 (CBT)\",\"questionNumber\":17,\"field\":\"道路交通法\",\"majorField\":null,\"subField\":null,\"content\":\"道路交通法に定める運転者の遵守事項等についての次の記述のうち、【誤っているものを 1 つ】選びなさい。なお、解答にあたっては、各選択肢に記載されている事項以外は考慮しないものとする。\",\"imageUrl\":null,\"sourceSheet\":null,\"knowledgeTags\":null,\"riskCategory\":null,\"situationCategory\":null,\"format\":\"SINGLE\",\"pdfUrl\":\"https://www.unkan-net.com/kakomon/R04.CBT.pdf\",\"pdfPage\":9,\"options\":[{\"id\":1494,\"questionId\":328,\"optionNumber\":1,\"content\":\"車両等の運転者は、監護者が付き添わない児童若しくは幼児が歩行しているときのほか、高齢の歩行者、身体の障害のある歩行者その他の歩行者でその通行に支障のあるものが通行しているときは、一時停止し、又は徐行して、その通行又は歩行を妨げないようにしなければならない。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":1495,\"questionId\":328,\"optionNumber\":2,\"content\":\"車両等の運転者は、自動車を運転する場合において、道路交通法に規定する初心運転者の標識を付けた者が普通自動車（以下「表示自動車」という。）を運転しているときは、危険防止のためやむを得ない場合を除き、当該自動車が進路を変更した場合にその変更した後の進路と同一の進路を後方から進行してくる表示自動車が当該自動車との間に同法に規定する必要な距離を保つことができないこととなるときは進路を変更してはならない。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":1496,\"questionId\":328,\"optionNumber\":3,\"content\":\"車両等は、交差点又はその直近で横断歩道の設けられていない場所において歩行者が道路を横断しているときは、必ず一時停止し、その歩行者の通行を妨げないように努めなければならない。\",\"isCorrect\":true,\"explanation\":null,\"structuredData\":null},{\"id\":1497,\"questionId\":328,\"optionNumber\":4,\"content\":\"車両等の運転者は、児童、幼児等の乗降のため、道路運送車両の保安基準に関する規定に定める非常点滅表示灯をつけて停車している通学通園バス（専ら小学校、幼稚園等に通う児童、幼児等を運送するために使用する自動車で政令で定めるものをいう。）の側方を通過するときは、徐行して安全を確認しなければならない。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null}],\"explanation\":null,\"correctOptions\":[],\"attempts\":[],\"_count\":{\"attempts\":0},\"isDebated\":false,\"isBookmarked\":false},{\"id\":329,\"year\":\"令和4年 (CBT)\",\"questionNumber\":18,\"field\":\"労働基準法\",\"majorField\":null,\"subField\":null,\"content\":\"労働基準法（以下「法」という。）に定める労働契約等についての次の記述のうち、【正しいものを 2 つ】選びなさい。なお、解答にあたっては、各選択肢に記載されている事項以外は考慮しないものとする。\",\"imageUrl\":null,\"sourceSheet\":null,\"knowledgeTags\":\"#労働契約・休日\",\"riskCategory\":null,\"situationCategory\":null,\"format\":\"SINGLE\",\"pdfUrl\":\"https://www.unkan-net.com/kakomon/R04.CBT.pdf\",\"pdfPage\":9,\"options\":[{\"id\":1498,\"questionId\":329,\"optionNumber\":1,\"content\":\"使用者は、労働者の同意が得られた場合においては、労働契約の不履行について違約金を定め、又は損害賠償額を予定する契約をすることができる。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":1499,\"questionId\":329,\"optionNumber\":2,\"content\":\"使用者は、労働者が出産、疾病、災害その他厚生労働省令で定める非常の場合の費用に充てるために請求する場合においては、支払期日前であっても、既往の労働に対する賃金を支払わなければならない。\",\"isCorrect\":true,\"explanation\":null,\"structuredData\":null},{\"id\":1500,\"questionId\":329,\"optionNumber\":3,\"content\":\"使用者は、労働者の国籍、信条又は社会的身分を理由として、賃金、労働時間その他の労働条件について、差別的取扱をしてはならない。\",\"isCorrect\":true,\"explanation\":null,\"structuredData\":null},{\"id\":1501,\"questionId\":329,\"optionNumber\":4,\"content\":\"法第 20 条（解雇の予告）の規定は、法に定める期間を超えない限りにおいて、「日日雇い入れられる者」、「3 ヵ月以内の期間を定めて使用される者」、「季節的業務に 6 ヵ月以内の期間を定めて使用される者」又は「試の使用期間中の者」のいずれかに該当する労働者については適用しない。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null}],\"explanation\":null,\"correctOptions\":[],\"attempts\":[],\"_count\":{\"attempts\":0},\"isDebated\":false,\"isBookmarked\":false},{\"id\":330,\"year\":\"令和4年 (CBT)\",\"questionNumber\":19,\"field\":\"労働基準法\",\"majorField\":null,\"subField\":null,\"content\":\"労働基準法（以下「法」という。）に定める労働時間及び休日等に関する次の記述のうち、【誤っているものを 1 つ】選びなさい。なお、解答にあたっては、各選択肢に記載されている事項以外は考慮しないものとする。\",\"imageUrl\":null,\"sourceSheet\":null,\"knowledgeTags\":\"#労働契約・休日\",\"riskCategory\":null,\"situationCategory\":null,\"format\":\"SINGLE\",\"pdfUrl\":\"https://www.unkan-net.com/kakomon/R04.CBT.pdf\",\"pdfPage\":10,\"options\":[{\"id\":1502,\"questionId\":330,\"optionNumber\":1,\"content\":\"使用者は、災害その他避けることのできない事由によって、臨時の必要がある場合においては、行政官庁の許可を受けて、その必要の限度において法に定める労働時間を延長し、又は休日に労働させることができる。ただし、事態急迫のために行政官庁の許可を受ける暇がない場合においては、事後に遅滞なく届け出なければならない。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":1503,\"questionId\":330,\"optionNumber\":2,\"content\":\"使用者は、労働時間が 6 時間を超える場合においては少くとも 35 分、8 時間を超える場合においては少くとも 45 分の休憩時間を労働時間の途中に与えなければならない。\",\"isCorrect\":true,\"explanation\":null,\"structuredData\":null},{\"id\":1504,\"questionId\":330,\"optionNumber\":3,\"content\":\"使用者は、労働者に対して、毎週少くとも 1 回の休日を与えなければならない。ただし、この規定は、4 週間を通じ 4 日以上の休日を与える使用者については適用しない。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":1505,\"questionId\":330,\"optionNumber\":4,\"content\":\"使用者は、当該事業場に、労働者の過半数で組織する労働組合がある場合においてはその労働組合、労働者の過半数で組織する労働組合がない場合においては労働者の過半数を代表する者との書面による協定をし、これを行政官庁に届け出た場合においては、法定労働時間又は法定休日に関する規定にかかわらず、その協定で定めるところによって労働時間を延長し、又は休日に労働させることができる。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null}],\"explanation\":null,\"correctOptions\":[],\"attempts\":[],\"_count\":{\"attempts\":0},\"isDebated\":false,\"isBookmarked\":false},{\"id\":331,\"year\":\"令和4年 (CBT)\",\"questionNumber\":20,\"field\":\"労働基準法\",\"majorField\":null,\"subField\":null,\"content\":\"「自動車運転者の労働時間等の改善のための基準」に定める貨物自動車運送事業に従事する自動車運転者の拘束時間等に関する次の文中、Ａ、Ｂ、Ｃ、Ｄに入るべき字句として【いずれか正しいものを 1 つ】選びなさい。（※法改正により一部改変）\\n1．拘束時間は、1 ヵ月について Ａ を超えず、かつ、1 年について 3,300 時間を超えないものとすること。ただし、労使協定により、1 年について 6 ヵ月までは、1 ヵ月について Ｂ まで延長することができ、かつ、1 年について Ｃ まで延長することができる。\\n2．1 日（始業時刻から起算して 24 時間をいう。）についての拘束時間は、13 時間を超えないものとし、当該拘束時間を延長する場合であっても、最大拘束時間は Ｄ とすること。ただし、1 週間における運行が全て法令に定める長距離貨物運送であり、かつ、一の運行における休息期間が、運転者の住所地以外の場所におけるものである場合においては、当該 1 週間について 2 回に限り最大拘束時間を 16 時間とすることができる。\",\"imageUrl\":null,\"sourceSheet\":null,\"knowledgeTags\":\"#改善基準(拘束・休息)\",\"riskCategory\":null,\"situationCategory\":null,\"format\":\"MULTI_GROUP\",\"pdfUrl\":\"https://www.unkan-net.com/kakomon/R04.CBT.pdf\",\"pdfPage\":10,\"options\":[{\"id\":1570,\"questionId\":331,\"optionNumber\":1,\"content\":\"Ａ : 284 時間\",\"isCorrect\":true,\"explanation\":null,\"structuredData\":\"{\\\"title\\\":\\\"Ａ\\\",\\\"choices\\\":[{\\\"num\\\":1,\\\"text\\\":\\\"284 時間\\\"},{\\\"num\\\":2,\\\"text\\\":\\\"287 時間\\\"}]}\"},{\"id\":1571,\"questionId\":331,\"optionNumber\":2,\"content\":\"Ａ : 287 時間\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":\"{\\\"title\\\":\\\"Ａ\\\",\\\"choices\\\":[{\\\"num\\\":1,\\\"text\\\":\\\"284 時間\\\"},{\\\"num\\\":2,\\\"text\\\":\\\"287 時間\\\"}]}\"},{\"id\":1572,\"questionId\":331,\"optionNumber\":3,\"content\":\"Ｂ : 310 時間\",\"isCorrect\":true,\"explanation\":null,\"structuredData\":\"{\\\"title\\\":\\\"Ｂ\\\",\\\"choices\\\":[{\\\"num\\\":1,\\\"text\\\":\\\"310 時間\\\"},{\\\"num\\\":2,\\\"text\\\":\\\"315 時間\\\"}]}\"},{\"id\":1573,\"questionId\":331,\"optionNumber\":4,\"content\":\"Ｂ : 315 時間\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":\"{\\\"title\\\":\\\"Ｂ\\\",\\\"choices\\\":[{\\\"num\\\":1,\\\"text\\\":\\\"310 時間\\\"},{\\\"num\\\":2,\\\"text\\\":\\\"315 時間\\\"}]}\"},{\"id\":1574,\"questionId\":331,\"optionNumber\":5,\"content\":\"Ｃ : 3,340 時間\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":\"{\\\"title\\\":\\\"Ｃ\\\",\\\"choices\\\":[{\\\"num\\\":1,\\\"text\\\":\\\"3,340 時間\\\"},{\\\"num\\\":2,\\\"text\\\":\\\"3,400 時間\\\"}]}\"},{\"id\":1575,\"questionId\":331,\"optionNumber\":6,\"content\":\"Ｃ : 3,400 時間\",\"isCorrect\":true,\"explanation\":null,\"structuredData\":\"{\\\"title\\\":\\\"Ｃ\\\",\\\"choices\\\":[{\\\"num\\\":1,\\\"text\\\":\\\"3,340 時間\\\"},{\\\"num\\\":2,\\\"text\\\":\\\"3,400 時間\\\"}]}\"},{\"id\":1576,\"questionId\":331,\"optionNumber\":7,\"content\":\"Ｄ : 14 時間\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":\"{\\\"title\\\":\\\"Ｄ\\\",\\\"choices\\\":[{\\\"num\\\":1,\\\"text\\\":\\\"14 時間\\\"},{\\\"num\\\":2,\\\"text\\\":\\\"15 時間\\\"}]}\"},{\"id\":1577,\"questionId\":331,\"optionNumber\":8,\"content\":\"Ｄ : 15 時間\",\"isCorrect\":true,\"explanation\":null,\"structuredData\":\"{\\\"title\\\":\\\"Ｄ\\\",\\\"choices\\\":[{\\\"num\\\":1,\\\"text\\\":\\\"14 時間\\\"},{\\\"num\\\":2,\\\"text\\\":\\\"15 時間\\\"}]}\"}],\"explanation\":null,\"correctOptions\":[],\"attempts\":[],\"_count\":{\"attempts\":0},\"isDebated\":false,\"isBookmarked\":false},{\"id\":332,\"year\":\"令和4年 (CBT)\",\"questionNumber\":21,\"field\":\"労働基準法\",\"majorField\":null,\"subField\":null,\"content\":\"「自動車運転者の労働時間等の改善のための基準」（以下「改善基準告示」という。）において定める貨物自動車運送事業に従事する自動車運転者（以下「トラック運転者」という。）の拘束時間等の規定に関する次の記述のうち、【正しいものを 2つ】選びなさい。なお、解答にあたっては、各選択肢に記載されている事項以外は考慮しないものとする。（※法改正により一部改変）\",\"imageUrl\":null,\"sourceSheet\":null,\"knowledgeTags\":\"#改善基準(拘束・休息)\",\"riskCategory\":null,\"situationCategory\":null,\"format\":\"SINGLE\",\"pdfUrl\":\"https://www.unkan-net.com/kakomon/R04.CBT.pdf\",\"pdfPage\":11,\"options\":[{\"id\":1510,\"questionId\":332,\"optionNumber\":1,\"content\":\"使用者は、トラック運転者の休息期間については、当該トラック運転者の住所地における休息期間がそれ以外の場所における休息期間より長くなるように努めるものとする。\",\"isCorrect\":true,\"explanation\":null,\"structuredData\":null},{\"id\":1511,\"questionId\":332,\"optionNumber\":2,\"content\":\"使用者は、業務の必要上やむを得ない場合には、当分の間、2 暦日についての拘束時間が 22 時間を超えず、かつ、勤務終了後、継続 20 時間以上の休息期間を与える場合に限り、トラック運転者を隔日勤務に就かせることができる。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":1512,\"questionId\":332,\"optionNumber\":3,\"content\":\"改善基準告示に定める 1 日についての拘束時間、2 日を平均した 1 日当たりの運転時間及び連続運転時間の規定の適用に当たっては、予期し得ない事象への対応時間を当該拘束時間、運転時間及び連続運転時間から除くことができる。この場合、勤務終了後、改善基準告示に定める継続した休息期間を与えること。\",\"isCorrect\":true,\"explanation\":null,\"structuredData\":null},{\"id\":1513,\"questionId\":332,\"optionNumber\":4,\"content\":\"トラック運転者がフェリーに乗船している時間は、原則として、2 時間（フェリー乗船時間が 2 時間未満の場合には、その時間）については拘束時間として取り扱い、その他の時間については休息期間として取り扱うものとする。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null}],\"explanation\":{\"id\":112,\"questionId\":332,\"content\":\"改善基準告示（自動車運転者の労働時間等の改善のための基準）において、事故や通行止めなどの予期し得ない事象に遭遇した際、その対応時間は1日の拘束時間・2日平均の運転時間・連続運転時間から控除できます。この特例を適用した勤務の終了後は、通常必要な継続した休息期間（原則11時間以上、下限9時間以上など）を確実に与えなければなりません。対象となる項目と要件除外できる時間：事故、車両故障、災害、異常気象などによる運行遅延や対応に要した時間対象外となるもの：1か月や1年といった長期の拘束時間からこの対応時間を除くことはできません。客観的な記録：運転日報のほか、道路管理者や公的機関の情報など、事象を証明する客観的な記録の保存が必要です。勤務終了後の休息期間1日の勤務の場合：継続11時間以上（状況により継続9時間を下回らない範囲）の休息期間2暦日にまたがる勤務の場合：継続24時間以上の休息期間\",\"isDebated\":true},\"correctOptions\":[],\"attempts\":[],\"_count\":{\"attempts\":0},\"isDebated\":false,\"isBookmarked\":false},{\"id\":333,\"year\":\"令和4年 (CBT)\",\"questionNumber\":22,\"field\":\"労働基準法\",\"majorField\":null,\"subField\":null,\"content\":\"下表の 1～4 は、貨物自動車運送事業に従事する自動車運転者の 4 日間の運転時間及び休憩等の勤務状況の例を示したものである。「自動車運転者の労働時間等の改善のための基準」（以下「改善基準告示」という。）に定める連続運転の中断方法及び 2 日（始業時刻から起算して 48 時間をいう。以下同じ。）を平均して 1 日当たりの運転時間に関する次の記述のうち、【正しいものを 2 つ】選びなさい。（※法改正により一部改変）\\n（注 1）2 日を平均した 1 日当たりの運転時間は、当該 4 日間のすべての日を特定日とする。\\n（注 2）「高速自動車国道のサービスエリア等に駐車又は停車できないため、やむを得ず連続運転時間を延長できる場合」には該当しないものとする。\",\"imageUrl\":\"https://www.unkan-net.com/kakomon/R04.CBT.pdf\",\"sourceSheet\":null,\"knowledgeTags\":\"#駐停車禁止ルール,#改善基準(拘束・休息)\",\"riskCategory\":null,\"situationCategory\":\"#表・グラフ,#時間計算(改善基準等)\",\"format\":\"SINGLE\",\"pdfUrl\":\"https://www.unkan-net.com/kakomon/R04.CBT.pdf\",\"pdfPage\":12,\"options\":[{\"id\":1514,\"questionId\":333,\"optionNumber\":1,\"content\":\"連続運転の中断方法が改善基準告示に違反している勤務日は、2 日目及び 4 日目であり、1 日目及び 3 日目は違反していない。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":1515,\"questionId\":333,\"optionNumber\":2,\"content\":\"連続運転の中断方法が改善基準告示に違反している勤務日は、1 日目及び 4 日目であり、2 日目及び 3 日目は違反していない。\",\"isCorrect\":true,\"explanation\":null,\"structuredData\":null},{\"id\":1516,\"questionId\":333,\"optionNumber\":3,\"content\":\"2 日を平均し 1 日当たりの運転時間は、改善基準告示に違反していない。\",\"isCorrect\":false,\"explanation\
