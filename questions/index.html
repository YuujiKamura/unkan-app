ず、自動車（三輪以上の軽自動車及び二輪の自動車を除く。）を使用して貨物を運送する事業であって、特定貨物自動車運送事業以外のものをいう。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":980,\"questionId\":248,\"optionNumber\":4,\"content\":\"特定貨物自動車運送事業とは、特定の者の需要に応じ、有償で、自動車（三輪以上の軽自動車及び二輪の自動車を除く。）を使用して貨物を運送する事業をいう。\",\"isCorrect\":true,\"explanation\":null,\"structuredData\":null}],\"explanation\":null,\"correctOptions\":[],\"attempts\":[],\"_count\":{\"attempts\":0},\"isDebated\":false,\"isBookmarked\":false},{\"id\":249,\"year\":\"令和6年 (CBT)\",\"questionNumber\":2,\"field\":\"貨物自動車運送事業法\",\"majorField\":null,\"subField\":null,\"content\":\"【貨物自動車運送事業法関係】\\n\\n一般貨物自動車運送事業者（以下「事業者」という。）の安全管理規程等及び輸送の安全に係る情報の公表についての次の文中、A、B、Cに入るべき字句として、いずれか正しいものを１つ選びなさい。\\n\\n1. 事業者は、貨物自動車運送事業法第 23 条（輸送の安全確保の命令）、第 26 条（事業改善の命令）又は第 33 条（許可の取消し等）の規定による処分（輸送の安全に係るものに限る。）を受けたときは、[ A ]、当該処分の内容並びに当該処分に基づき講じた措置及び講じようとする措置の内容をインターネットの利用その他の適切な方法により公表しなければならない。\\n\\n2. 事業者は、毎事業年度の経過後[ B ]、輸送の安全に関する基本的な方針その他の輸送の安全に係る情報であって国土交通大臣が告示で定める①輸送の安全に関する基本的な方針、②輸送の安全に関する目標及びその達成状況、③自動車事故報告規則第 2 条に規定する事故に関する統計について、インターネットの利用その他の適切な方法により公表しなければならない。\\n\\n3. 事業用自動車（被けん引自動車を除く。）の保有車両数が[ C ]以上の事業者は、安全管理規程を定めて国土交通大臣に届け出なければならない。これを変更しようとするときも、同様とする。\",\"imageUrl\":null,\"sourceSheet\":null,\"knowledgeTags\":\"#許可・届出ルール\",\"riskCategory\":null,\"situationCategory\":\"#事故対応事例\",\"format\":\"MULTI_GROUP\",\"pdfUrl\":null,\"pdfPage\":null,\"options\":[{\"id\":981,\"questionId\":249,\"optionNumber\":1,\"content\":\"A : ① 遅滞なく\",\"isCorrect\":true,\"explanation\":null,\"structuredData\":\"{\\\"title\\\":\\\"A\\\",\\\"choices\\\":[{\\\"num\\\":1,\\\"text\\\":\\\"遅滞なく\\\"},{\\\"num\\\":2,\\\"text\\\":\\\"３０日以内に\\\"}]}\"},{\"id\":982,\"questionId\":249,\"optionNumber\":2,\"content\":\"A : ② ３０日以内に\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":\"{\\\"title\\\":\\\"A\\\",\\\"choices\\\":[{\\\"num\\\":1,\\\"text\\\":\\\"遅滞なく\\\"},{\\\"num\\\":2,\\\"text\\\":\\\"３０日以内に\\\"}]}\"},{\"id\":983,\"questionId\":249,\"optionNumber\":3,\"content\":\"B : ① ３０日以内に\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":\"{\\\"title\\\":\\\"B\\\",\\\"choices\\\":[{\\\"num\\\":1,\\\"text\\\":\\\"３０日以内に\\\"},{\\\"num\\\":2,\\\"text\\\":\\\"１００日以内に\\\"}]}\"},{\"id\":984,\"questionId\":249,\"optionNumber\":4,\"content\":\"B : ② １００日以内に\",\"isCorrect\":true,\"explanation\":null,\"structuredData\":\"{\\\"title\\\":\\\"B\\\",\\\"choices\\\":[{\\\"num\\\":1,\\\"text\\\":\\\"３０日以内に\\\"},{\\\"num\\\":2,\\\"text\\\":\\\"１００日以内に\\\"}]}\"},{\"id\":985,\"questionId\":249,\"optionNumber\":5,\"content\":\"C : ① ２００両\",\"isCorrect\":true,\"explanation\":null,\"structuredData\":\"{\\\"title\\\":\\\"C\\\",\\\"choices\\\":[{\\\"num\\\":1,\\\"text\\\":\\\"２００両\\\"},{\\\"num\\\":2,\\\"text\\\":\\\"１００両\\\"}]}\"},{\"id\":986,\"questionId\":249,\"optionNumber\":6,\"content\":\"C : ② １００両\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":\"{\\\"title\\\":\\\"C\\\",\\\"choices\\\":[{\\\"num\\\":1,\\\"text\\\":\\\"２００両\\\"},{\\\"num\\\":2,\\\"text\\\":\\\"１００両\\\"}]}\"}],\"explanation\":null,\"correctOptions\":[],\"attempts\":[],\"_count\":{\"attempts\":0},\"isDebated\":false,\"isBookmarked\":false},{\"id\":250,\"year\":\"令和6年 (CBT)\",\"questionNumber\":3,\"field\":\"貨物自動車運送事業法\",\"majorField\":null,\"subField\":null,\"content\":\"次の記述のうち、一般貨物自動車運送事業の運行管理者が行わなければならない業務として、正しいものをすべて選びなさい。なお、解答にあたっては、各選択肢に記載されている事項以外は考慮しないものとする。\",\"imageUrl\":null,\"sourceSheet\":null,\"knowledgeTags\":null,\"riskCategory\":null,\"situationCategory\":null,\"format\":\"SINGLE\",\"pdfUrl\":null,\"pdfPage\":null,\"options\":[{\"id\":987,\"questionId\":250,\"optionNumber\":1,\"content\":\"法令の規定により、事業用自動車の運転者等に対して点呼を行い、報告を求め、確認を行い、及び指示を与え、並びに記録し、及びその記録を保存し、並びに運転者に対して使用する国土交通大臣が告示で定めるアルコール検知器を備え置くこと。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":988,\"questionId\":250,\"optionNumber\":2,\"content\":\"法令に規定する「運行記録計」を管理し、及びその記録を保存すること。\",\"isCorrect\":true,\"explanation\":null,\"structuredData\":null},{\"id\":989,\"questionId\":250,\"optionNumber\":3,\"content\":\"事業用自動車に係る事故が発生した場合には、法令の規定により「事故の発生日時」等の所定の事項を記録し、及びその記録を保存すること。\",\"isCorrect\":true,\"explanation\":null,\"structuredData\":null},{\"id\":990,\"questionId\":250,\"optionNumber\":4,\"content\":\"運行管理規程を定め、かつ、その遵守について運行管理業務を補助させるため選任した者（補助者）に対し指導及び監督を行うこと。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null}],\"explanation\":null,\"correctOptions\":[],\"attempts\":[],\"_count\":{\"attempts\":0},\"isDebated\":false,\"isBookmarked\":false},{\"id\":251,\"year\":\"令和6年 (CBT)\",\"questionNumber\":4,\"field\":\"貨物自動車運送事業法\",\"majorField\":null,\"subField\":null,\"content\":\"貨物自動車運送事業の事業用自動車の運転者に対する点呼についての法令等の定めに関する次の記述のうち、正しいものをすべて選びなさい。なお、解答にあたっては、各選択肢に記載されている事項以外は考慮しないものとする。\",\"imageUrl\":null,\"sourceSheet\":null,\"knowledgeTags\":\"#点呼・乗務制限(管理者義務)\",\"riskCategory\":null,\"situationCategory\":null,\"format\":\"SINGLE\",\"pdfUrl\":null,\"pdfPage\":null,\"options\":[{\"id\":991,\"questionId\":251,\"optionNumber\":1,\"content\":\"同一事業者内の全国貨物自動車運送適正化事業実施機関が認定している安全性優良事業所（Ｇマーク営業所）である営業所間で行うＩＴ点呼の実施は、１営業日のうち連続する１６時間以内とする。\",\"isCorrect\":true,\"explanation\":null,\"structuredData\":null},{\"id\":992,\"questionId\":251,\"optionNumber\":2,\"content\":\"業務前の点呼においては、法令等の規定により酒気帯びの有無について、運転者の顔色、呼気の臭い、応答の声の調子等を目視等により確認するほか、当該営業所に備えられたアルコール検知器を用いて確認を行わなければならない。\",\"isCorrect\":true,\"explanation\":null,\"structuredData\":null},{\"id\":993,\"questionId\":251,\"optionNumber\":3,\"content\":\"２日間にわたる運行（営業所から出発し１日目を遠隔地で終了、２日目に営業所に戻るもの。）については、１日目の業務後の点呼及び２日目の業務前の点呼のいずれも対面で行うことができないことから、２日目については、業務前の点呼及び業務後の点呼のほか、当該業務の途中において少なくとも１回点呼を行わなければならない。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":994,\"questionId\":251,\"optionNumber\":4,\"content\":\"業務後の点呼においては、「道路運送車両法第４７条の２第１項及び第２項の規定による点検（日常点検）の実施又はその確認」について報告を求め、及び確認を行い、並びに事業用自動車の運行の安全を確保するために必要な指示を与えなければならない。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null}],\"explanation\":{\"id\":1,\"questionId\":251,\"content\":\"$1b\",\"isDebated\":true},\"correctOptions\":[],\"attempts\":[],\"_count\":{\"attempts\":0},\"isDebated\":false,\"isBookmarked\":false},{\"id\":252,\"year\":\"令和6年 (CBT)\",\"questionNumber\":5,\"field\":\"貨物自動車運送事業法\",\"majorField\":null,\"subField\":null,\"content\":\"次の自動車事故に関する記述のうち、一般貨物自動車運送事業者が自動車事故報告規則に基づき運輸支局長等に速報を必要としないものを１つ選びなさい。なお、解答にあたっては、各選択肢に記載されている事項以外は考慮しないものとする。\",\"imageUrl\":null,\"sourceSheet\":null,\"knowledgeTags\":null,\"riskCategory\":null,\"situationCategory\":\"#事故対応事例\",\"format\":\"SINGLE\",\"pdfUrl\":null,\"pdfPage\":null,\"options\":[{\"id\":995,\"questionId\":252,\"optionNumber\":1,\"content\":\"事業用自動車の運転者が、ハンドル操作を誤り道路のガードレールに接触する事故を起こし、軽傷を負った。事故処理を担当した警察官が当該運転者への事情聴取中に酒臭さを感じたため呼気検査を実施したところ、道路交通法の規定に違反する酒気帯び運転をしていたことが発覚した。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":996,\"questionId\":252,\"optionNumber\":2,\"content\":\"事業用の連結自動車(けん引車と被けん引自動車を連結した自動車)が、高速自動車国道法に規定する高速自動車国道を走行中、当該自動車のけん引装置の故障により被けん引自動車が分離し、後続の自動車が止まりきれずに当該被けん引自動車に衝突する事故が発生した。この事故で被けん引自動車に衝突した自動車の運転者１名が軽傷を負った。\",\"isCorrect\":true,\"explanation\":null,\"structuredData\":null},{\"id\":997,\"questionId\":252,\"optionNumber\":3,\"content\":\"事業用自動車の運転者が高速自動車国道法に規定する高速自動車国道を走行中、ハンドル操作を誤り、道路の中央分離帯に衝突したことにより、当該事業用自動車に積載していた消防法に規定する危険物の灯油が一部漏えいした。この事故により当該事業用自動車の運転者が軽傷を負った。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":998,\"questionId\":252,\"optionNumber\":4,\"content\":\"事業用自動車が高速自動車国道法に定める高速自動車国道において、路肩に停車中の車両に追突したため、後続車６台が衝突する多重事故が発生し、この事故により６人が重傷、４人が軽傷を負った。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null}],\"explanation\":{\"id\":3,\"questionId\":252,\"content\":\"Gemini との会話\\n解説\\n令和6年（CBT）問 5 の解説\\n\\n正解は 2（速報を必要としないもの）です。\\n\\n💡 結論とポイント\\n自動車事故報告規則における「速報（24時間以内）」の対象事故かどうかが問われています。\\n\\n速報が必要な事故（代表例）：\\n\\n酒気帯び運転、無免許運転等の重大な悪質違反が発覚した事故（1）\\n\\n消防法に規定する危険物等が漏えい・飛散した事故（3）\\n\\n死者または重傷者（1名以上）が発生した事故（4）\\n\\n速報が不要な事故（報告書 제출のみでよい場合）：\\n\\n車両故障等による軽傷者のみの事故など（2）\\n\\n🔍 各選択肢の個別解説\\n1 . 酒気帯び運転が発覚した事故 ➔ 【速報が必要】\\n理由: 運転者が酒気帯び運転、無免許運転、麻薬等使用などの悪質な状態で起こした事故については、重大度にかかわらず24時間以内の速報が必要です（事故報告書の提出も必要）。\\n\\n2 . けん引装置の故障による被けん引車の分離・追突事故（軽傷1名） ➔ 【速報は不要（正解）】\\n理由: 装置の故障による分離・衝突事故で軽傷者のみの場合は、事故報告書（30日以内）の提出義務対象にはなりますが、24時間以内の「速報」までは義務付けられていません。\\n\\n(補足) 死者や重傷者が発生している場合は速報が必要になります。\\n\\n3 . 危険物（灯油）の漏えいを伴う事故 ➔ 【速報が必要】\\n理由: 消防法で定める危険物（灯油など）や高圧ガス等の物品が漏えい、流出、飛散、破損した事故は、速報が必要な事故として規定されています。\\n\\n4 . 多重追突事故（重傷6名・軽傷4名） ➔ 【速報が必要】\\n理由: 死者または重傷者が1名以上発生した事故は速報の対象です。本問では重傷者が6名出ており、文句なしで速報が必要です（さらに「14人以上の負傷者」等にも該当する重大事故規模です）。\\n\\n📝 暗記のツボ\\n「酒・薬物」「危険物漏れ」「死者・重傷者」「車両脱落（死傷者多数等）」 は速報必須！\\n軽傷のみの車両故障事故は「報告書（30日以内）のみ」でOKと覚えましょう。\",\"isDebated\":true},\"correctOptions\":[],\"attempts\":[],\"_count\":{\"attempts\":0},\"isDebated\":false,\"isBookmarked\":false},{\"id\":253,\"year\":\"令和6年 (CBT)\",\"questionNumber\":6,\"field\":\"貨物自動車運送事業法\",\"majorField\":null,\"subField\":null,\"content\":\"一般貨物自動車運送事業者（以下「事業者」という。）の過労運転の防止等についての法令等の定めに関する次の記述のうち、正しいものを２つ選びなさい。なお、解答にあたっては、各選択肢に記載されている事項以外は考慮しないものとする。\",\"imageUrl\":null,\"sourceSheet\":null,\"knowledgeTags\":\"#点呼・乗務制限(管理者義務)\",\"riskCategory\":null,\"situationCategory\":null,\"format\":\"SINGLE\",\"pdfUrl\":null,\"pdfPage\":null,\"options\":[{\"id\":999,\"questionId\":253,\"optionNumber\":1,\"content\":\"運転者が一の運行における最初の勤務を開始してから最後の勤務を終了するまでの時間（ただし、「自動車運転者の労働時間等の改善のための基準」（改善基準告示）第４条第４項第４号に定める自動車運転者がフェリーに乗船している時間のうち休息期間とされる時間を除く。）は、１４４時間を超えてはならない。\",\"isCorrect\":true,\"explanation\":null,\"structuredData\":null},{\"id\":1000,\"questionId\":253,\"optionNumber\":2,\"content\":\"運転者等の業務について、事業用自動車の瞬間速度、運行距離及び運行時間を運行記録計により記録しなければならない車両は、車両総重量が８トン以上又は最大積載量が５トン以上の普通自動車である。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":1001,\"questionId\":253,\"optionNumber\":3,\"content\":\"事業者は、事業計画に従い業務を行うに必要な員数の事業用自動車の運転者(以下「運転者」という。)を常時選任しておかなければならず、この場合、選任する運転者は、日々雇い入れられる者、３ヵ月以内の期間を定めて使用される者又は試みの使用期間中の者（１４日を超えて引き続き使用されるに至った者を除く。）であってはならない。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":1002,\"questionId\":253,\"optionNumber\":4,\"content\":\"事業者は、運行指示書の作成を要する運行の途中において、運行の開始及び終了の地点及び日時に変更が生じた場合には、運行指示書の写しに当該変更の内容を記載し、これにより運転者等に対し電話その他の方法により、当該変更の内容について適切な指示を行わなければならない。\",\"isCorrect\":true,\"explanation\":null,\"structuredData\":null}],\"explanation\":{\"id\":5,\"questionId\":253,\"content\":\"$1c\",\"isDebated\":true},\"correctOptions\":[],\"attempts\":[],\"_count\":{\"attempts\":0},\"isDebated\":false,\"isBookmarked\":false},{\"id\":254,\"year\":\"令和6年 (CBT)\",\"questionNumber\":7,\"field\":\"貨物自動車運送事業法\",\"majorField\":null,\"subField\":null,\"content\":\"一般貨物自動車運送事業者（以下「事業者」という。）の事業用自動車の運行の安全を確保するために、事業者が法令等に基づき運転者に対して行わなければならない指導監督及び特定の運転者に対して行わなければならない特別な指導に関する次の記述のうち、正しいものを２つ選びなさい。なお、解答にあたっては、各選択肢に記載されている事項以外は考慮しないものとする。\",\"imageUrl\":null,\"sourceSheet\":null,\"knowledgeTags\":null,\"riskCategory\":null,\"situationCategory\":null,\"format\":\"SINGLE\",\"pdfUrl\":null,\"pdfPage\":null,\"options\":[{\"id\":1003,\"questionId\":254,\"optionNumber\":1,\"content\":\"事業者は、軽傷者(法令で定める傷害を受けた者)を生じた交通事故を引き起こし、かつ、当該事故前の１年間に交通事故を引き起こしたことがある運転者（事故惹起運転者）に対して、特別な指導を行わなければならない。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":1004,\"questionId\":254,\"optionNumber\":2,\"content\":\"事業者は、運転者として常時選任するために新たに雇い入れた者(当該事業者において初めて事業用自動車に乗務する前３年間に他の一般貨物自動車運送事業者等によって運転者として常時選任されたことがある者を除く。)に対して、特別な指導を行わなければならない。\",\"isCorrect\":true,\"explanation\":null,\"structuredData\":null},{\"id\":1005,\"questionId\":254,\"optionNumber\":3,\"content\":\"事業者は、法令に基づき事業用自動車の運転者を常時選任するために新たに雇い入れた場合には、当該運転者について、自動車安全運転センターが交付する無事故・無違反証明書又は運転記録証明書等により、雇い入れる前の事故歴を把握し、事故惹起運転者に該当するか否かを確認する。\",\"isCorrect\":true,\"explanation\":null,\"structuredData\":null},{\"id\":1006,\"questionId\":254,\"optionNumber\":4,\"content\":\"事業者は、運転者が他の運転者と交替して乗務を開始しようとするときは、当該他の運転者から所定の通告を受け、事業用自動車の制動装置、走行装置その他の重要な装置の機能について、運行の状況に応じて必要な点検を実施するよう、運転者に対し指導及び監督をする。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null}],\"explanation\":{\"id\":7,\"questionId\":254,\"content\":\"$1d\",\"isDebated\":true},\"correctOptions\":[],\"attempts\":[],\"_count\":{\"attempts\":0},\"isDebated\":false,\"isBookmarked\":false},{\"id\":255,\"year\":\"令和6年 (CBT)\",\"questionNumber\":8,\"field\":\"貨物自動車運送事業法\",\"majorField\":null,\"subField\":null,\"content\":\"一般貨物自動車運送事業者（以下「事業者」という。）の貨物の積載方法等に関する次の記述のうち、正しいものを２つ選びなさい。なお、解答にあたっては、各選択肢に記載されている事項以外は考慮しないものとする。\",\"imageUrl\":null,\"sourceSheet\":null,\"knowledgeTags\":null,\"riskCategory\":null,\"situationCategory\":null,\"format\":\"SINGLE\",\"pdfUrl\":null,\"pdfPage\":null,\"options\":[{\"id\":1007,\"questionId\":255,\"optionNumber\":1,\"content\":\"事業者は、危険物を運搬する場合、その運転者に対し、消防法その他の危険物の規制に関する法令に基づき、運搬する危険物の性状を理解させるとともに、取扱い方法、積載方法及び運搬方法について留意すべき事項を指導しなければならない。また、運搬中に危険物が飛散又は漏えいした場合に安全を確保するためにとるべき方法を指導し、習得させなければならない。\",\"isCorrect\":true,\"explanation\":null,\"structuredData\":null},{\"id\":1008,\"questionId\":255,\"optionNumber\":2,\"content\":\"事業者は、事業用自動車（車両総重量が８トン以上又は最大積載量が５トン以上のものに限る。）に、貨物を積載するときは、偏荷重が生じないように積載するとともに、運搬中に荷崩れ等により事業用自動車から落下することを防止するため、貨物にロープ又はシートを掛けること等必要な措置を講じなければならない。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":1009,\"questionId\":255,\"optionNumber\":3,\"content\":\"事業者は、道路法第４７条第２項の規定（車両でその幅、重量、高さ、長さ又は最小回転半径が政令で定める最高限度を超えるものは、道路を通行させてはならない。）に違反し、又は政令で定める最高限度を超える車両の通行に関し道路管理者が付した条件（通行経路、通行時間等）に違反して事業用自動車を通行させることを防止するため、運転者等に対する適切な指導及び監督を怠ってはならない。\",\"isCorrect\":true,\"explanation\":null,\"structuredData\":null},{\"id\":1010,\"questionId\":255,\"optionNumber\":4,\"content\":\"車両総重量が８トン以上又は最大積載量が５トン以上の普通自動車である事業用自動車の運行の業務に従事する運転者は、当該業務において、法令の規定に基づき作成された運行指示書に「貨物の積載状況」が記録されている場合は、業務の記録に当該事項を記録したものとみなされる。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null}],\"explanation\":null,\"correctOptions\":[],\"attempts\":[],\"_count\":{\"attempts\":0},\"isDebated\":false,\"isBookmarked\":false},{\"id\":256,\"year\":\"令和6年 (CBT)\",\"questionNumber\":9,\"field\":\"道路運送車両法\",\"majorField\":null,\"subField\":null,\"content\":\"【道路運送車両法関係】\\n\\n自動車の登録等についての次の記述のうち、誤っているものを１つ選びなさい。なお、解答にあたっては、各選択肢に記載されている事項以外は考慮しないものとする。\",\"imageUrl\":null,\"sourceSheet\":null,\"knowledgeTags\":\"#自動車の登録・車検\",\"riskCategory\":null,\"situationCategory\":null,\"format\":\"SINGLE\",\"pdfUrl\":null,\"pdfPage\":null,\"options\":[{\"id\":1011,\"questionId\":256,\"optionNumber\":1,\"content\":\"臨時運行の許可を受けた者は、臨時運行許可証の有効期間が満了したときは、その日から５日以内に、臨時運行許可証及び臨時運行許可番号標を許可に係る行政庁に返納しなければならない。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":1012,\"questionId\":256,\"optionNumber\":2,\"content\":\"登録自動車の所有者は、当該自動車の使用の本拠の位置に変更があったときは、道路運送車両法で定める場合を除き、その事由があった日から 30 日以内に、国土交通大臣の行う変更登録の申請をしなければならない。\",\"isCorrect\":true,\"explanation\":null,\"structuredData\":null},{\"id\":1013,\"questionId\":256,\"optionNumber\":3,\"content\":\"何人も、国土交通大臣の許可を受けたときなどを除き、自動車の車台番号又は原動機の型式の打刻を塗まつし、その他車台番号又は原動機の型式の識別を困難にするような行為をしてはならない。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":1014,\"questionId\":256,\"optionNumber\":4,\"content\":\"登録自動車の所有者は、当該自動車の使用者が道路運送車両法の規定により自動車の使用の停止を命ぜられ自動車検査証を返納したときは、同法の規定により、遅滞なく、当該自動車登録番号標及び封印を取りはずし、自動車登録番号標について国土交通大臣の領置を受けなければならない。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null}],\"explanation\":{\"id\":9,\"questionId\":256,\"content\":\"$1e\",\"isDebated\":true},\"correctOptions\":[],\"attempts\":[],\"_count\":{\"attempts\":0},\"isDebated\":false,\"isBookmarked\":false},{\"id\":257,\"year\":\"令和6年 (CBT)\",\"questionNumber\":10,\"field\":\"道路運送車両法\",\"majorField\":null,\"subField\":null,\"content\":\"【道路運送車両法関係】\\n\\n自動車の検査等についての次の記述のうち、正しいものを２つ選びなさい。なお、解答にあたっては、各選択肢に記載されている事項以外は考慮しないものとする。\",\"imageUrl\":null,\"sourceSheet\":null,\"knowledgeTags\":\"#自動車の登録・車検\",\"riskCategory\":null,\"situationCategory\":null,\"format\":\"SINGLE\",\"pdfUrl\":null,\"pdfPage\":null,\"options\":[{\"id\":1015,\"questionId\":257,\"optionNumber\":1,\"content\":\"自動車に表示されている検査標章には、当該自動車の自動車検査証の有効期間の満了する時期が表示されている。\",\"isCorrect\":true,\"explanation\":null,\"structuredData\":null},{\"id\":1016,\"questionId\":257,\"optionNumber\":2,\"content\":\"初めて自動車検査証の交付を受ける車両総重量 7,990 キログラムの貨物の運送の用に供する自動車については、当該自動車検査証の有効期間は２年である。\",\"isCorrect\":true,\"explanation\":null,\"structuredData\":null},{\"id\":1017,\"questionId\":257,\"optionNumber\":3,\"content\":\"自動車検査証の有効期間の起算日は、自動車検査証の有効期間が満了する日の３ヵ月前（離島に使用の本拠の位置を有する自動車を除く。）から当該期間が満了する日までの間に継続検査を行い、当該自動車検査証に係る有効期間を法令の規定により記録する場合は、当該自動車検査証の有効期間が満了する日の翌日とする。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":1018,\"questionId\":257,\"optionNumber\":4,\"content\":\"自動車運送事業の用に供する自動車は、自動車検査証を当該自動車又は当該自動車の所属する営業所に備え付けなければ、運行の用に供してはならない。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null}],\"explanation\":{\"id\":11,\"questionId\":257,\"content\":\"Gemini との会話\\n解説\\n表示されている問題（令和6年 CBT 問10）の解説です。\\n\\n正しい肢は 1 と 2 です。\\n\\n選択肢の解説\\n1. 正しい\\n法文・解説: 自動車の前面ガラス等に貼り付ける検査標章には、自動車検査証の有効期間が満了する時期が表示されます（道路運送車両法 第66条第1項）。\\n\\n2. 正しい\\n法文・解説: 初めて自動車検査証の交付（初回車検）を受ける車両総重量 8トン未満（7,990 kg）の貨物自動車の有効期間は2年です（道路運送車両法 第61条第1項、施行規則）。\\n\\n補足: 車両総重量 8トン以上になると、初回から1年となります。今回は 7,990 kg（8t未満）のため、2年で正しい記述です。\\n\\n3. 誤り\\n法文・解説: 継続検査の受検可能時期と起算日についての記述です。\\n\\n継続検査を有効期間満了前「2ヵ月前」（※指定整備工場などの特例や離島特例等を除く一般的な期間拡大ルール）から満了する日までの間に行う場合、起算日は「満了する日の翌日」となります。\\n\\n設問にある「3ヵ月前」という規定は誤りです（令和5年7月の法改正等により拡大されましたが、起算日特例の基本期間は2ヵ月前です）。\\n\\n4. 誤り\\n法文・解説: 自動車検査証は、当該自動車に備え付けなければ運行の用に供してはなりません（道路運送車両法 第66条第1項）。\\n\\n営業所に置いておく（備え付ける）だけでは不可で、必ず車内に備え付ける必要があります。\\n\",\"isDebated\":true},\"correctOptions\":[],\"attempts\":[],\"_count\":{\"attempts\":0},\"isDebated\":false,\"isBookmarked\":false},{\"id\":258,\"year\":\"令和6年 (CBT)\",\"questionNumber\":11,\"field\":\"道路運送車両法\",\"majorField\":null,\"subField\":null,\"content\":\"【道路運送車両法関係】\\n\\n道路運送車両法に定める自動車の点検整備等に関する次の文中、A、B、C、D に入るべき字句としていずれか正しいものを１つ選びなさい。\\n\\n1．自動車運送事業の用に供する自動車の使用者は、[ A ]ごとに国土交通省令で定める技術上の基準により、自動車を点検しなければならない。\\n\\n2．自動車運送事業の用に供する自動車の日常点検の結果に基づく運行可否の決定は、自動車の使用者のより与えられた権限に基づき、[ B ]が行わなければならない。\\n\\n3．地方運輸局長は、保安基準に適合しない状態にある自動車の使用者のに対し、当該自動車が保安基準に適合するに至るまでの間の運行に関し、当該自動車の使用の方法又は経路の制限その他の保安上又は[ C ]その他の環境保全上必要な指示をすることができる。\\n\\n4．地方運輸局長は、自動車の[ D ]が道路運送車両法第 54 条（整備命令等）の規定による命令又は指示に従わない場合において、当該自動車が保安基準に適合しない状態にあるときは、当該自動車の使用を停止することができる。\",\"imageUrl\":null,\"sourceSheet\":null,\"knowledgeTags\":\"#保安基準(寸法・重量・灯火),#日常点検・定期点検\",\"riskCategory\":null,\"situationCategory\":null,\"format\":\"MULTI_GROUP\",\"pdfUrl\":null,\"pdfPage\":null,\"options\":[{\"id\":1369,\"questionId\":258,\"optionNumber\":1,\"content\":\"A : ① ３ヵ月\",\"isCorrect\":true,\"explanation\":null,\"structuredData\":\"{\\\"title\\\":\\\"A\\\",\\\"choices\\\":[{\\\"num\\\":1,\\\"text\\\":\\\"３ヵ月\\\"},{\\\"num\\\":2,\\\"text\\\":\\\"６ヵ月\\\"}]}\"},{\"id\":1370,\"questionId\":258,\"optionNumber\":2,\"content\":\"A : ② ６ヵ月\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":\"{\\\"title\\\":\\\"A\\\",\\\"choices\\\":[{\\\"num\\\":1,\\\"text\\\":\\\"３ヵ月\\\"},{\\\"num\\\":2,\\\"text\\\":\\\"６ヵ月\\\"}]}\"},{\"id\":1371,\"questionId\":258,\"optionNumber\":3,\"content\":\"B : ① 運行管理者\",\"isCorrect\":true,\"explanation\":null,\"structuredData\":\"{\\\"title\\\":\\\"B\\\",\\\"choices\\\":[{\\\"num\\\":1,\\\"text\\\":\\\"運行管理者\\\"},{\\\"num\\\":2,\\\"text\\\":\\\"整備管理者\\\"}]}\"},{\"id\":1372,\"questionId\":258,\"optionNumber\":4,\"content\":\"B : ② 整備管理者\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":\"{\\\"title\\\":\\\"B\\\",\\\"choices\\\":[{\\\"num\\\":1,\\\"text\\\":\\\"運行管理者\\\"},{\\\"num\\\":2,\\\"text\\\":\\\"整備管理者\\\"}]}\"},{\"id\":1373,\"questionId\":258,\"optionNumber\":5,\"content\":\"C : ① 事故防止\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":\"{\\\"title\\\":\\\"C\\\",\\\"choices\\\":[{\\\"num\\\":1,\\\"text\\\":\\\"事故防止\\\"},{\\\"num\\\":2,\\\"text\\\":\\\"公害防止\\\"}]}\"},{\"id\":1374,\"questionId\":258,\"optionNumber\":6,\"content\":\"C : ② 公害防止\",\"isCorrect\":true,\"explanation\":null,\"structuredData\":\"{\\\"title\\\":\\\"C\\\",\\\"choices\\\":[{\\\"num\\\":1,\\\"text\\\":\\\"事故防止\\\"},{\\\"num\\\":2,\\\"text\\\":\\\"公害防止\\\"}]}\"},{\"id\":1375,\"questionId\":258,\"optionNumber\":7,\"content\":\"D : ① 所有者\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":\"{\\\"title\\\":\\\"D\\\",\\\"choices\\\":[{\\\"num\\\":1,\\\"text\\\":\\\"所有者\\\"},{\\\"num\\\":2,\\\"text\\\":\\\"使用者\\\"}]}\"},{\"id\":1376,\"questionId\":258,\"optionNumber\":8,\"content\":\"D : ② 使用者\",\"isCorrect\":true,\"explanation\":null,\"structuredData\":\"{\\\"title\\\":\\\"D\\\",\\\"choices\\\":[{\\\"num\\\":1,\\\"text\\\":\\\"所有者\\\"},{\\\"num\\\":2,\\\"text\\\":\\\"使用者\\\"}]}\"}],\"explanation\":null,\"correctOptions\":[],\"attempts\":[],\"_count\":{\"attempts\":0},\"isDebated\":false,\"isBookmarked\":false},{\"id\":259,\"year\":\"令和6年 (CBT)\",\"questionNumber\":12,\"field\":\"道路運送車両法\",\"majorField\":null,\"subField\":null,\"content\":\"【道路運送車両法関係】\\n\\n道路運送車両の保安基準及びその細目を定める告示についての次の記述のうち、誤っているものを１つ選びなさい。なお、解答にあたっては、各選択肢に記載されている事項以外は考慮しないものとする。\",\"imageUrl\":null,\"sourceSheet\":null,\"knowledgeTags\":\"#保安基準(寸法・重量・灯火)\",\"riskCategory\":null,\"situationCategory\":null,\"format\":\"SINGLE\",\"pdfUrl\":null,\"pdfPage\":null,\"options\":[{\"id\":1023,\"questionId\":259,\"optionNumber\":1,\"content\":\"火薬類（保安基準に掲げる数量以下のものを除く。）を運送する自動車、指定重量以上の高圧ガス（可燃性ガス及び酸素に限る。）を運送する自動車及び危険物の規制に関する政令に掲げる指定数量以上の危険物を運送する自動車には、消火器を備えなければならない（被けん引自動車を除く。）。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":1024,\"questionId\":259,\"optionNumber\":2,\"content\":\"自動車（二輪自動車等を除く。）の空気入ゴムタイヤの接地部は滑り止めを施したものであり、滑り止めの溝は、空気入ゴムタイヤの接地部の全幅にわたり滑り止めのために施されている凹部（サイピング、プラットフォーム及びウエア・インジケータの部分を除く。）のいずれの部分においても 1.6 ミリメートル以上の深さを有すること。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":1025,\"questionId\":259,\"optionNumber\":3,\"content\":\"自動車の後面には、夜間にその後方 200 メートルの距離から走行用前照灯で照射した場合にその反射光を照射位置から確認できる赤色の後部反射器を備えなければならない。\",\"isCorrect\":true,\"explanation\":null,\"structuredData\":null},{\"id\":1026,\"questionId\":259,\"optionNumber\":4,\"content\":\"貨物の運送の用に供する普通自動車であって、車両総重量が 8 トン以上又は最大積載量が 5 トン以上のものの原動機には、自動車が 90 キロメートル毎時を超えて走行しないよう燃料の供給を調整し、かつ、自動車の速度の制御を円滑に行うことができるものとして、告示で定める基準に適合する速度抑制装置を備えなければならない。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null}],\"explanation\":{\"id\":13,\"questionId\":259,\"content\":\"$1f\",\"isDebated\":true},\"correctOptions\":[],\"attempts\":[],\"_count\":{\"attempts\":0},\"isDebated\":false,\"isBookmarked\":false},{\"id\":260,\"year\":\"令和6年 (CBT)\",\"questionNumber\":13,\"field\":\"道路交通法\",\"majorField\":null,\"subField\":null,\"content\":\"【道路交通法関係】\\n\\n道路交通法に定める自動車の種類についての次の記述のうち、誤っているものを１つ選びなさい。なお、解答にあたっては、各選択肢に記載されている事項以外は考慮しないものとする。\",\"imageUrl\":null,\"sourceSheet\":null,\"knowledgeTags\":null,\"riskCategory\":null,\"situationCategory\":null,\"format\":\"SINGLE\",\"pdfUrl\":null,\"pdfPage\":null,\"options\":[{\"id\":1027,\"questionId\":260,\"optionNumber\":1,\"content\":\"乗車定員が２人、最大積載量が 11,000 キログラム、及び車両総重量 19,910 キログラムの貨物自動車の種類は、大型自動車である。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":1028,\"questionId\":260,\"optionNumber\":2,\"content\":\"乗車定員が２人、最大積載量が 4,750 キログラム、及び車両総重量 8,160 キログラムの貨物自動車の種類は、中型自動車である。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":1029,\"questionId\":260,\"optionNumber\":3,\"content\":\"乗車定員が３人、最大積載量が 3,000 キログラム、及び車両総重量 5,955 キログラムの貨物自動車の種類は、準中型自動車である。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":1030,\"questionId\":260,\"optionNumber\":4,\"content\":\"乗車定員が３人、最大積載量が 1,250 キログラム、及び車両総重量 3,515 キログラムの貨物自動車の種類は、普通自動車である。\",\"isCorrect\":true,\"explanation\":null,\"structuredData\":null}],\"explanation\":{\"id\":15,\"questionId\":260,\"content\":\"$20\",\"isDebated\":true},\"correctOptions\":[],\"attempts\":[],\"_count\":{\"attempts\":0},\"isDebated\":false,\"isBookmarked\":false},{\"id\":261,\"year\":\"令和6年 (CBT)\",\"questionNumber\":14,\"field\":\"道路交通法\",\"majorField\":null,\"subField\":null,\"content\":\"【道路交通法関係】\\n\\n道路交通法に定める徐行及び一時停止についての次の記述のうち、誤っているものを１つ選びなさい。なお、解答にあたっては、各選択肢に記載されている事項以外は考慮しないものとする。\",\"imageUrl\":null,\"sourceSheet\":null,\"knowledgeTags\":null,\"riskCategory\":null,\"situationCategory\":null,\"format\":\"SINGLE\",\"pdfUrl\":null,\"pdfPage\":null,\"options\":[{\"id\":1031,\"questionId\":261,\"optionNumber\":1,\"content\":\"車両等は、環状交差点に入ろうとするときは、徐行しなければならない。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":1032,\"questionId\":261,\"optionNumber\":2,\"content\":\"車両等は、横断歩道等に接近する場合には、当該横断歩道等を通過する際に当該横断歩道等によりその進路の前方を横断しようとする歩行者等がないことが明らかな場合を除き、当該横断歩道等の直前で停止することができるような速度で進行しなければならない。この場合において、横断歩道等によりその進路の前方を横断し、又は横断しようとする歩行者等があるときは、当該横断歩道等を徐行して通過しなければならない。\",\"isCorrect\":true,\"explanation\":null,\"structuredData\":null},{\"id\":1033,\"questionId\":261,\"optionNumber\":3,\"content\":\"交差点又はその付近において、緊急自動車が接近してきたときは、車両（緊急自動車を除く。）は交差点を避け、かつ、道路の左側（一方通行となっている道路においてその左側に寄ることが緊急自動車の通行を妨げることとなる場合にあっては、道路の右側）に寄って一時停止しなければならない。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":1034,\"questionId\":261,\"optionNumber\":4,\"content\":\"車両等は、道路のまがりかど付近、上り坂の頂上付近又は勾配の急な下り坂を通行するときは、徐行しなければならない。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null}],\"explanation\":null,\"correctOptions\":[],\"attempts\":[],\"_count\":{\"attempts\":0},\"isDebated\":false,\"isBookmarked\":false},{\"id\":262,\"year\":\"令和6年 (CBT)\",\"questionNumber\":15,\"field\":\"道路交通法\",\"majorField\":null,\"subField\":null,\"content\":\"【道路交通関係】\\n\\n道路交通法に定める追越しの方法等についての次の記述のうち、誤っているものを１つ選びなさい。なお、解答にあたっては、各選択肢に記載されている事項以外は考慮しないものとする。\",\"imageUrl\":null,\"sourceSheet\":null,\"knowledgeTags\":\"#追い越し・交差点\",\"riskCategory\":null,\"situationCategory\":null,\"format\":\"SINGLE\",\"pdfUrl\":null,\"pdfPage\":null,\"options\":[{\"id\":1035,\"questionId\":262,\"optionNumber\":1,\"content\":\"車両は、道路の中央から左の部分の幅員が６メートルに満たない道路において、他の車両を追い越そうとするとき（道路の中央から右の部分（以下「右側部分」という。）を見とおすことができ、かつ、反対の方向からの交通を妨げるおそれがない場合に限るものとし、道路標識等により追越しのため右側部分にはみ出して通行することが禁止されている場合を除く。）は、法令の規定にかかわらず右側部分にその全部又は一部をはみ出して通行することができる。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":1036,\"questionId\":262,\"optionNumber\":2,\"content\":\"車両は、他の車両を追い越そうとするときは、その追い越されようとする車両（以下「前車」という。）の右側を通行しなければならない。ただし、前車が法令の規定により右折をするため道路の中央又は右側端に寄って通行しているときは、前車を追い越してはならない。\",\"isCorrect\":true,\"explanation\":null,\"structuredData\":null},{\"id\":1037,\"questionId\":262,\"optionNumber\":3,\"content\":\"車両は、トンネル内の車両通行帯が設けられている道路の部分（道路標識等により追越しが禁止されているものを除く。）においては、他の車両を追い越すことができる。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":1038,\"questionId\":262,\"optionNumber\":4,\"content\":\"車両は、法令に規定する優先道路を通行している場合における当該優先道路にある交差点を除き、交差点の手前の側端から前に３０メートル以内の部分においては、他の車両（特定小型原動機付自転車等を除く。）を追い越すため、進路を変更し、又は前車の側方を通過してはならない。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null}],\"explanation\":{\"id\":17,\"questionId\":262,\"content\":\"$21\",\"isDebated\":true},\"correctOptions\":[],\"attempts\":[],\"_count\":{\"attempts\":0},\"isDebated\":false,\"isBookmarked\":false},{\"id\":263,\"year\":\"令和6年 (CBT)\",\"questionNumber\":16,\"field\":\"道路交通法\",\"majorField\":null,\"subField\":null,\"content\":\"【道路交通関係】\\n\\n道路交通法に定める過労運転に係る車両の使用者に対する指示についての文中の、Ａ、Ｂ、Ｃに入るべき字句としていずれか正しいものを１つ選びなさい。\\n\\n車両の運転者が道路交通法第６６条（過労運転等の禁止）の規定に違反して過労により［ Ａ ］ができないおそれがある状態で車両を運転する行為（以下「過労運転」という。）を当該車両の使用者（当該車両の運転者であるものを除く。以下同じ。）の業務に関してした場合において、当該過労運転に係る［ Ｂ ］が当該車両につき過労運転を防止するため必要な［ Ｃ ］を行っていると認められないときは、当該車両の使用の本拠の位置を管轄する都道府県公安委員会は、当該車両の使用者に対し、過労運転が行われることのないよう運転者に指導し又は助言することその他過労運転を防止するため必要な措置をとることを指示することができる。\",\"imageUrl\":null,\"sourceSheet\":null,\"knowledgeTags\":\"#過労・酒気・過積載(禁止行為)\",\"riskCategory\":null,\"situationCategory\":null,\"format\":\"MULTI_GROUP\",\"pdfUrl\":null,\"pdfPage\":null,\"options\":[{\"id\":1377,\"questionId\":263,\"optionNumber\":1,\"content\":\"Ａ : ① 運転の維持、継続\",\"isCorrect\":true,\"explanation\":null,\"structuredData\":\"{\\\"title\\\":\\\"Ａ\\\",\\\"choices\\\":[{\\\"num\\\":1,\\\"text\\\":\\\"運転の維持、継続\\\"},{\\\"num\\\":2,\\\"text\\\":\\\"正常な運転\\\"}]}\"},{\"id\":1378,\"questionId\":263,\"optionNumber\":2,\"content\":\"Ａ : ② 正常な運転\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":\"{\\\"title\\\":\\\"Ａ\\\",\\\"choices\\\":[{\\\"num\\\":1,\\\"text\\\":\\\"運転の維持、継続\\\"},{\\\"num\\\":2,\\\"text\\\":\\\"正常な運転\\\"}]}\"},{\"id\":1379,\"questionId\":263,\"optionNumber\":3,\"content\":\"Ｂ : ① 車両の使用者\",\"isCorrect\":true,\"explanation\":null,\"structuredData\":\"{\\\"title\\\":\\\"Ｂ\\\",\\\"choices\\\":[{\\\"num\\\":1,\\\"text\\\":\\\"車両の使用者\\\"},{\\\"num\\\":2,\\\"text\\\":\\\"車両の所有者\\\"}]}\"},{\"id\":1380,\"questionId\":263,\"optionNumber\":4,\"content\":\"Ｂ : ② 車両の所有者\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":\"{\\\"title\\\":\\\"Ｂ\\\",\\\"choices\\\":[{\\\"num\\\":1,\\\"text\\\":\\\"車両の使用者\\\"},{\\\"num\\\":2,\\\"text\\\":\\\"車両の所有者\\\"}]}\"},{\"id\":1381,\"questionId\":263,\"optionNumber\":5,\"content\":\"Ｃ : ① 運行の管理\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":\"{\\\"title\\\":\\\"Ｃ\\\",\\\"choices\\\":[{\\\"num\\\":1,\\\"text\\\":\\\"運行の管理\\\"},{\\\"num\\\":2,\\\"text\\\":\\\"労務の管理\\\"}]}\"},{\"id\":1382,\"questionId\":263,\"optionNumber\":6,\"content\":\"Ｃ : ② 労務の管理\",\"isCorrect\":true,\"explanation\":null,\"structuredData\":\"{\\\"title\\\":\\\"Ｃ\\\",\\\"choices\\\":[{\\\"num\\\":1,\\\"text\\\":\\\"運行の管理\\\"},{\\\"num\\\":2,\\\"text\\\":\\\"労務の管理\\\"}]}\"}],\"explanation\":null,\"correctOptions\":[],\"attempts\":[],\"_count\":{\"attempts\":0},\"isDebated\":false,\"isBookmarked\":false},{\"id\":264,\"year\":\"令和6年 (CBT)\",\"questionNumber\":17,\"field\":\"道路交通法\",\"majorField\":null,\"subField\":null,\"content\":\"【道路交通関係】\\n\\n道路交通法に定める自動車の運転者の遵守事項及び故障等の場合の措置についての次の記述のうち、正しいものを２つ選びなさい。なお、解答にあたっては、各選択肢に記載されている事項以外は考慮しないものとする。\",\"imageUrl\":null,\"sourceSheet\":null,\"knowledgeTags\":null,\"riskCategory\":null,\"situationCategory\":null,\"format\":\"SINGLE\",\"pdfUrl\":null,\"pdfPage\":null,\"options\":[{\"id\":1042,\"questionId\":264,\"optionNumber\":1,\"content\":\"停留所において乗客の乗降のため停車していた乗合自動車が発進するため進路を変更しようとして手又は方向指示器により合図をした場合においては、その後方にある車両は、その速度を急に変更しなければならないこととなる場合にあっても、当該合図をした乗合自動車の進路の変更を妨げてはならない。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":1043,\"questionId\":264,\"optionNumber\":2,\"content\":\"車両等の運転者は、児童、幼児等の乗降のため、道路運送車両の保安基準に関する規定に定める非常点滅表示灯をつけて停車している通学通園バス（専ら小学校、幼稚園等に通う児童、幼児等を運送するために使用する自動車で政令で定めるものをいう。）の側方を通過するときは、できる限り安全な速度で進行しなければならない。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":1044,\"questionId\":264,\"optionNumber\":3,\"content\":\"運転免許（仮運転免許を除く。）を受けた者が自動車等の運転に関し、当該自動車等の交通による人の死傷があった場合において、道路交通法第７２条第１項前段の規定（交通事故があったときは、直ちに車両等の運転を停止して、負傷者を救護し、道路における危険を防止する等必要な措置を講じなければならない。）に違反したときは、その者が当該違反をしたときにおけるその者の住所地を管轄する都道府県公安委員会は、その者の運転免許を取り消すことができる。\",\"isCorrect\":true,\"explanation\":null,\"structuredData\":null},{\"id\":1045,\"questionId\":264,\"optionNumber\":4,\"content\":\"自動車の運転者は、故障その他の理由により高速自動車国道等の本線車道若しくはこれに接する加速車線、減速車線若しくは登坂車線又はこれらに接する路肩若しくは路側帯において当該自動車を運転することができなくなったときは、政令で定めるところにより、停止表示器材を後方から進行してくる自動車の運転者が見やすい位置に置いて、当該自動車が故障その他の理由により停止しているものであることを表示しなければならない。\",\"isCorrect\":true,\"explanation\":null,\"structuredData\":null}],\"explanation\":{\"id\":19,\"questionId\":264,\"content\":\"Gemini との会話\\n解説\\n現在表示されている令和6年（CBT）問17の解説です。\\n\\n正解は 3 と 4 です。それぞれの選択肢の正誤と根拠を解説します。\\n\\n各肢の解説\\n1. 誤り（×）\\n法律の規定（道交法第31条の2）\\n乗合自動車（路線バス等）が発進の合図をした場合、後方の車両はその進路変更を妨げてはなりません。ただし、「急ブレーキや急ハンドルで避けなければならないような場合（急変更を強いられる場合）」は、進路を譲る必要はありません。\\n\\nポイント\\n設問では「急に変更しなければならないこととなる場合にあっても…妨げてはならない」となっているため誤りです。安全が確保できない急制動を強いてまで譲る義務はありません。\\n\\n2. 誤り（×）\\n法律の規定（道交法第71条第2号の3）\\nハザードランプ（非常点滅表示灯）をつけて停車中の通学通園バスの側方を通過するときは、「できる限り安全な速度」ではなく、「徐行」して進行しなければなりません。\\n\\nポイント\\n「できる限り安全な速度」という曖昧な表現ではなく、法律上明確に「徐行」が義務付けられているため誤りです。\\n\\n3. 正しい（◯）\\n法律の規定（道交法第103条第1項第8号、第72条第1項）\\n人身事故を起こしたにもかかわらず、直ちに運転を停止して救護措置等を行わなかった場合（いわゆるひ逃げ・救護義務違反）は、免許取り消し処分（必要手続等を経て）の対象となります。\\n\\nポイント\\n管轄する都道府県公安委員会が運転免許を取り消すことができるため、記述の通り正しいです。\\n\\n4. 正しい（◯）\\n法律の規定（道交法第75条の11第1項）\\n高速自動車国道等において、故障などの理由で本線車道や加速・減速車線、路肩・路側帯に停止するときは、停止表示器材（三角表示板など）を後方から進行してくる車に見やすい位置に設置・表示しなければなりません。\\n\\nポイント\\n高速道路等での停車時の義務として規定されている通りであり、正しいです。\\n\\nまとめ\\n選択肢\\t正誤\\t誤りのポイント\\n1\\t×\\t急ブレーキが必要な場合まで進路を譲る必要はない\\n2\\t×\\t「できる限り安全な速度」ではなく**「徐行」**が必要\\n3\\t◯\\t救護義務違反（ひ逃げ）による免許取消処分\\n4\\t◯\\t高速道路等での故障停止時の停止表示器材設置義務\\n\",\"isDebated\":true},\"correctOptions\":[],\"attempts\":[],\"_count\":{\"attempts\":0},\"isDebated\":false,\"isBookmarked\":false},{\"id\":265,\"year\":\"令和6年 (CBT)\",\"questionNumber\":18,\"field\":\"労働基準法\",\"majorField\":null,\"subField\":null,\"content\":\"【労働基準法関係】\\n\\n労働基準法（以下「法」という。）の定めに関する次の記述のうち、正しいものを２つ選びなさい。なお、解答にあたっては、各選択肢に記載されている事項以外は考慮しないものとする。\",\"imageUrl\":null,\"sourceSheet\":null,\"knowledgeTags\":null,\"riskCategory\":null,\"situationCategory\":null,\"format\":\"SINGLE\",\"pdfUrl\":null,\"pdfPage\":null,\"options\":[{\"id\":1046,\"questionId\":265,\"optionNumber\":1,\"content\":\"法で定める労働条件の基準は最低のものであるから、労働関係の当事者は、この基準を理由として労働条件を低下させてはならないことはもとより、その向上を図るように努めなければならない。\",\"isCorrect\":true,\"explanation\":null,\"structuredData\":null},{\"id\":1047,\"questionId\":265,\"optionNumber\":2,\"content\":\"「平均賃金」とは、これを算定すべき事由の発生した日以前３ヵ月間にその労働者に対し支払われた賃金の総額を、その期間の所定労働日数で除した金額をいう。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":1048,\"questionId\":265,\"optionNumber\":3,\"content\":\"使用者は、労働契約の不履行について違約金を定め、又は損害賠償額を予定する契約をしてはならない。\",\"isCorrect\":true,\"explanation\":null,\"structuredData\":null},{\"id\":1049,\"questionId\":265,\"optionNumber\":4,\"content\":\"使用者は、労働者の死亡又は退職の場合において、権利者の請求があった場合においては、３０日以内に賃金を支払い、積立金、保証金、貯蓄金その他名称の如何を問わず、労働者の権利に属する金品を返還しなければならない。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null}],\"explanation\":{\"id\":21,\"questionId\":265,\"content\":\"$22\",\"isDebated\":true},\"correctOptions\":[],\"attempts\":[],\"_count\":{\"attempts\":0},\"isDebated\":false,\"isBookmarked\":false},{\"id\":266,\"year\":\"令和6年 (CBT)\",\"questionNumber\":19,\"field\":\"労働基準法\",\"majorField\":null,\"subField\":null,\"content\":\"【労働基準法関係】\\n\\n労働基準法（以下「法」という。）の定めに関する次の記述のうち、正しいものを２つ選びなさい。なお、解答にあたっては、各選択肢に記載されている事項以外は考慮しないものとする。\",\"imageUrl\":null,\"sourceSheet\":null,\"knowledgeTags\":null,\"riskCategory\":null,\"situationCategory\":null,\"format\":\"SINGLE\",\"pdfUrl\":null,\"pdfPage\":null,\"options\":[{\"id\":1050,\"questionId\":266,\"optionNumber\":1,\"content\":\"使用者は、災害その他避けることのできない事由によって、臨時の必要がある場合においては、行政官庁の許可を受けて、その必要の限度において法に定める労働時間を延長し、又は休日に労働させることができる。ただし、事態急迫のために行政官庁の許可を受ける暇がない場合においては、事後に遅滞なく届け出なければならない。\",\"isCorrect\":true,\"explanation\":null,\"structuredData\":null},{\"id\":1051,\"questionId\":266,\"optionNumber\":2,\"content\":\"使用者は、労働時間が６時間を超える場合においては少なくとも４５分、８時間を超える場合においては少なくとも１時間の休憩時間を労働時間の途中に与えなければならない。\",\"isCorrect\":true,\"explanation\":null,\"structuredData\":null},{\"id\":1052,\"questionId\":266,\"optionNumber\":3,\"content\":\"使用者が、法の規定により労働時間を延長し、又は休日に労働させた場合においては、その時間又はその日の労働については、通常の労働時間又は労働日の賃金の計算額の３割以上６割以下の範囲内でそれぞれ政令で定める率以上の率で計算した割増賃金を支払わなければならない。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":1053,\"questionId\":266,\"optionNumber\":4,\"content\":\"使用者は、その雇入れの日から起算して６ヵ月間継続勤務し全労働日の７割以上出勤した労働者に対して、継続し、又は分割した１０労働日の有給休暇を与えなければならない。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null}],\"explanation\":{\"id\":23,\"questionId\":266,\"content\":\"Gemini との会話\\n解説\\n画面の問題（令和6年 CBT 運行管理者試験 貨物・問19）の解説です。\\n\\n正解は 1 と 2 です。各選択肢の誤り・正しいポイントは以下の通りです。\\n\\n選択肢の解説\\n1. 正しい\\n根拠：労働基準法 第33条第1項（災害等による臨時の改定）\\n\\n災害その他避けることのできない事由によって臨時の必要がある場合は、行政官庁の許可（事態急迫の場合は事後の遅滞ない届出）を受けることで、労働時間の延長や休日労働をさせることができます。\\n\\n2. 正しい\\n根拠：労働基準法 第34条第1項（休憩）\\n\\n労働時間が6時間を超える場合は「少なくとも45分」、8時間を超える場合は「少なくとも1時間」の休憩時間を労働時間の途中に与えなければならないと定められています。\\n\\n3. 誤り\\n根拠：労働基準法 第37条第1項（時間外、休日及び深夜の割増賃金）\\n\\n誤りのポイント：割増率の記載範囲\\n\\n時間外労働および深夜労働の割増賃金率は、「2割5分以上5割以下」の範囲内で政令で定められます（休日は3割5分以上）。記述にある「3割以上6割以下」は誤りです。\\n\\n4. 誤り\\n根拠：労働基準法 第39条第1項（年次有給休暇）\\n\\n誤りのポイント：出勤率の要件\\n\\n有給休暇が付与される要件は、全労働日の「8割以上」出勤した場合です。選択肢の「7割以上」は誤りです。\\n\\n💡 覚えるポイントまとめ\\n災害臨時の時間外： 原則「行政官庁の許可」、緊急時は「事後遅滞なく届出」\\n\\n休憩時間： 6時間超 → 45分以上 / 8時間超 → 1時間以上\\n\\n時間外割増率： 25%以上50%以下の範囲（2割5分以上5割以下）\\n\\n有休要件： 6ヶ月継続勤務 ＋ 8割以上出勤 → 10日与える\",\"isDebated\":true},\"correctOptions\":[],\"attempts\":[],\"_count\":{\"attempts\":0},\"isDebated\":false,\"isBookmarked\":false},{\"id\":267,\"year\":\"令和6年 (CBT)\",\"questionNumber\":20,\"field\":\"労働基準法\",\"majorField\":null,\"subField\":null,\"content\":\"【労働基準法関係】\\n\\n「自動車運転者の労働時間等の改善のための基準」に定める同基準の目的等に関する次の文中、Ａ、Ｂ、Ｃ、Ｄに入るべき字句として、いずれか正しいものを１つ選びなさい。\\n\\n1．この基準は、自動車運転者（労働基準法第９条に規定する労働者であって、［ Ａ ］の運転の業務（厚生労働省労働基準局長が定めるものを除く。）に主として従事する者をいう。以下同じ。）の労働時間等の改善のための基準を定めることにより、自動車運転者の［ Ｂ ］を図ることを目的とする。\\n\\n2．労働関係の当事者は、この基準を理由として自動車運転者の［ Ｃ ］させてはならないことはもとより、その［ Ｄ ］に努めなければならない。\",\"imageUrl\":null,\"sourceSheet\":null,\"knowledgeTags\":\"#改善基準(拘束・休息)\",\"riskCategory\":null,\"situationCategory\":null,\"format\":\"MULTI_GROUP\",\"pdfUrl\":null,\"pdfPage\":null,\"options\":[{\"id\":1383,\"questionId\":267,\"optionNumber\":1,\"content\":\"Ａ : ① 二輪以上の自動車\",\"isCorrect\":true,\"explanation\":null,\"structuredData\":\"{\\\"title\\\":\\\"Ａ\\\",\\\"choices\\\":[{\\\"num\\\":1,\\\"text\\\":\\\"二輪以上の自動車\\\"},{\\\"num\\\":2,\\\"text\\\":\\\"四輪以上の自動車\\\"}]}\"},{\"id\":1384,\"questionId\":267,\"optionNumber\":2,\"content\":\"Ａ : ② 四輪以上の自動車\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":\"{\\\"title\\\":\\\"Ａ\\\",\\\"choices\\\":[{\\\"num\\\":1,\\\"text\\\":\\\"二輪以上の自動車\\\"},{\\\"num\\\":2,\\\"text\\\":\\\"四輪以上の自動車\\\"}]}\"},{\"id\":1385,\"questionId\":267,\"optionNumber\":3,\"content\":\"Ｂ : ① 労働条件の向上\",\"isCorrect\":true,\"explanation\":null,\"structuredData\":\"{\\\"title\\\":\\\"Ｂ\\\",\\\"choices\\\":[{\\\"num\\\":1,\\\"text\\\":\\\"労働条件の向上\\\"},{\\\"num\\\":2,\\\"text\\\":\\\"労働契約の遵守\\\"}]}\"},{\"id\":1386,\"questionId\":267,\"optionNumber\":4,\"content\":\"Ｂ : ② 労働契約の遵守\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":\"{\\\"title\\\":\\\"Ｂ\\\",\\\"choices\\\":[{\\\"num\\\":1,\\\"text\\\":\\\"労働条件の向上\\\"},{\\\"num\\\":2,\\\"text\\\":\\\"労働契約の遵守\\\"}]}\"},{\"id\":1387,\"questionId\":267,\"optionNumber\":5,\"content\":\"Ｃ : ① 生活環境を悪化\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":\"{\\\"title\\\":\\\"Ｃ\\\",\\\"choices\\\":[{\\\"num\\\":1,\\\"text\\\":\\\"生活環境を悪化\\\"},{\\\"num\\\":2,\\\"text\\\":\\\"労働条件を低下\\\"}]}\"},{\"id\":1388,\"questionId\":267,\"optionNumber\":6,\"content\":\"Ｃ : ② 労働条件を低下\",\"isCorrect\":true,\"explanation\":null,\"structuredData\":\"{\\\"title\\\":\\\"Ｃ\\\",\\\"choices\\\":[{\\\"num\\\":1,\\\"text\\\":\\\"生活環境を悪化\\\"},{\\\"num\\\":2,\\\"text\\\":\\\"労働条件を低下\\\"}]}\"},{\"id\":1389,\"questionId\":267,\"optionNumber\":7,\"content\":\"Ｄ : ① 向上\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":\"{\\\"title\\\":\\\"Ｄ\\\",\\\"choices\\\":[{\\\"num\\\":1,\\\"text\\\":\\\"向上\\\"},{\\\"num\\\":2,\\\"text\\\":\\\"維持\\\"}]}\"},{\"id\":1390,\"questionId\":267,\"optionNumber\":8,\"content\":\"Ｄ : ② 維持\",\"isCorrect\":true,\"explanation\":null,\"structuredData\":\"{\\\"title\\\":\\\"Ｄ\\\",\\\"choices\\\":[{\\\"num\\\":1,\\\"text\\\":\\\"向上\\\"},{\\\"num\\\":2,\\\"text\\\":\\\"維持\\\"}]}\"}],\"explanation\":null,\"correctOptions\":[],\"attempts\":[],\"_count\":{\"attempts\":0},\"isDebated\":false,\"isBookmarked\":false},{\"id\":268,\"year\":\"令和6年 (CBT)\",\"questionNumber\":21,\"field\":\"労働基準法\",\"majorField\":null,\"subField\":null,\"content\":\"【労働基準法関係】\\n\\n「自動車運転者の労働時間等の改善のための基準」に定める貨物自動車運送事業に従事する自動車運転者（以下「トラック運転者」という。）の拘束時間等の規定に関する次の記述のうち、正しいものを２つ選びなさい。なお、解答にあたっては、各選択肢に記載されている事項以外は考慮しないものとする。\",\"imageUrl\":null,\"sourceSheet\":null,\"knowledgeTags\":\"#改善基準(拘束・休息)\",\"riskCategory\":null,\"situationCategory\":null,\"format\":\"SINGLE\",\"pdfUrl\":null,\"pdfPage\":null,\"options\":[{\"id\":1058,\"questionId\":268,\"optionNumber\":1,\"content\":\"使用者は、トラック運転者を使用する場合は、その拘束時間について、労使協定により延長する場合を除き、1ヵ月について 295 時間を超えず、かつ、1 年について 3,500 時間を超えないものとすること。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":1059,\"questionId\":268,\"optionNumber\":2,\"content\":\"使用者は、トラック運転者（1 人乗務で、隔日勤務に就く運転者以外のもの。）を使用する場合は、1 日についての拘束時間は、13 時間を超えないものとし、当該拘束時間を延長する場合であっても、最大拘束時間は 15 時間とすること。ただし、1 週間における運行が全て長距離貨物運送（一の運行（運転者が所属する事業場を出発してから当該事業場に帰着するまで）の走行距離が 450 キロメートル以上の貨物運送）であり、かつ、一の運行における休息期間が住所地以外の場所におけるものである場合においては、当該 1 週間について 2 回に限り最大拘束時間を 16 時間とすることができる。\",\"isCorrect\":true,\"explanation\":null,\"structuredData\":null},{\"id\":1060,\"questionId\":268,\"optionNumber\":3,\"content\":\"使用者は、トラック運転者を使用する場合は、その運転時間について、2 日を平均し 1 日当たり 9 時間、2 週間を平均し 1 週間当たり 48 時間を超えないものとすること。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":1061,\"questionId\":268,\"optionNumber\":4,\"content\":\"使用者は、トラック運転者の連続運転時間（1 回がおおむね連続 10 分以上で、かつ、合計が 30 分以上の運転の中断をすることなく連続して運転する時間をいう。）については、4 時間を超えないものとすること。ただし、高速道路等のサービスエリア又はパーキングエリア等に駐車又は停車できないため、やむを得ず連続運転時間が 4 時間を超える場合には、連続運転時間を 4 時間 30 分まで延長することができるものとする。\",\"isCorrect\":true,\"explanation\":null,\"structuredData\":null}],\"explanation\":{\"id\":25,\"questionId\":268,\"content\":\"Gemini との会話\\n解説\\n表示されている問題（令和6年 CBT 問21）の各選択肢について、正誤のポイントを解説します。\\n\\n2024年（令和6年）4月1日施行の新・改善基準告示に基づく知識が問われている問題です。\\n\\n正解：2, 4\\n各選択肢の解説\\n❌ 1. 誤り（数字が旧基準）\\n問題文の要点: 拘束時間を「1ヶ月 295時間以内」「1年 3,500時間以内」とする。\\n\\n解説:\\n\\n新基準では、原則として1ヶ月 284時間以内、1年 3,300時間以内です。\\n\\n（※労使協定による延長がある場合でも、最大で1ヶ月294時間、1年3,400時間までとなります。）\\n\\n設問にある「295時間」「3,500時間」は旧基準（2024年3月以前）の数値であるため誤りです。\\n\\n◯ 2. 正しい（長距離貨物の例外規定）\\n問題文の要点: 1日の拘束時間は原則13時間以内、最大15時間。ただし、1週間の運行がすべて長距離貨物（1運行450km以上）かつ宿泊を伴う（住所地以外での休息）場合、週2回まで最大16時間とすることができる。\\n\\n解説:\\n\\n1日の拘束時間（原則13時間・最大15時間）の基本ルールに加え、新基準で新設された長距離貨物運送の特例の規定通りです。\\n\\n❌ 3. 誤り（2週間の規定が存在しない）\\n問題文の要点: 運転時間について「2日平均 1日あたり9時間」「2週間平均 1週間あたり48時間」を超えないこと。\\n\\n解説:\\n\\n運転時間の制限は「2日平均で1日当たり9時間」および「2週間平均で1週間当たり44時間」（特定の特例では44時間）です。\\n\\n「2週間平均で48時間」という規定自体が誤りです。\\n\\n◯ 4. 正しい（連続運転時間とパーキング満車特例）\\n問題文の要点: 連続運転は4時間以内（30分以上の中断）。ただし SA・PA 等に駐車・停車できず、やむを得ず4時間を超える場合は4時間30分まで延長できる。\\n\\n解説:\\n\\n新基準で明確化された、SA・PA等の満車対策として導入された特例ルールです。規定通りの内容のため正しいです。\\n\",\"isDebated\":true},\"correctOptions\":[],\"attempts\":[],\"_count\":{\"attempts\":0},\"isDebated\":false,\"isBookmarked\":false},{\"id\":269,\"year\":\"令和6年 (CBT)\",\"questionNumber\":22,\"field\":\"労働基準法\",\"majorField\":null,\"subField\":null,\"content\":\"【労働基準法関係】\\n\\n下表の１〜４は、貨物自動車運送事業に従事する自動車運転者の５日間の運転時間の例を示したものであるが、このうち、５日間すべての日を特定日とした２日を平均し１日当たりの運転時間が「自動車運転者の労働時間等の改善のための基準」に違反しているものをすべて選びなさい。なお、解答にあたっては、下表に示された内容以外は考慮しないものとする。\",\"imageUrl\":null,\"sourceSheet\":null,\"knowledgeTags\":\"#改善基準(拘束・休息)\",\"riskCategory\":null,\"situationCategory\":\"#表・グラフ,#時間計算(改善基準等)\",\"format\":\"SINGLE\",\"pdfUrl\":null,\"pdfPage\":null,\"options\":[{\"id\":1062,\"questionId\":269,\"optionNumber\":1,\"content\":\"| | 休日 | １日目 | ２日目 | ３日目 | ４日目 | ５日目 | 休日 |\\n| 運転時間 | － | 9時間 | 8時間 | 11時間 | 9時間 | 7時間 | － |\",\"isCorrect\":true,\"explanation\":null,\"structuredData\":null},{\"id\":1063,\"questionId\":269,\"optionNumber\":2,\"content\":\"| | 休日 | １日目 | ２日目 | ３日目 | ４日目 | ５日目 | 休日 |\\n| 運転時間 | － | 7時間 | 8時間 | 10時間 | 11時間 | 7時間 | － |\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":1064,\"questionId\":269,\"optionNumber\":3,\"content\":\"| | 休日 | １日目 | ２日目 | ３日目 | ４日目 | ５日目 | 休日 |\\n| 運転時間 | － | 10時間 | 9時間 | 8時間 | 11時間 | 8時間 | － |\",\"isCorrect\":true,\"explanation\":null,\"structuredData\":null},{\"id\":1065,\"questionId\":269,\"optionNumber\":4,\"content\":\"| | 休日 | １日目 | ２日目 | ３日目 | ４日目 | ５日目 | 休日 |\\n| 運転時間 | － | 8時間 | 7時間 | 11時間 | 10時間 | 7時間 | － |\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null}],\"explanation\":{\"id\":27,\"questionId\":269,\"content\":\"$23\",\"isDebated\":true},\"correctOptions\":[],\"attempts\":[],\"_count\":{\"attempts\":0},\"isDebated\":false,\"isBookmarked\":false},{\"id\":270,\"year\":\"令和6年 (CBT)\",\"questionNumber\":23,\"field\":\"労働基準法\",\"majorField\":null,\"subField\":null,\"content\":\"【労働基準法関係】\\n\\n下表の１〜４は、貨物自動車運送事業に従事する自動車運転者の運転時間及び休憩時間の例を示したものであるが、このうち、連続運転の中断方法として「自動車運転者の労働時間等の改善のための基準」に適合しているものを２つ選びなさい。なお、解答にあたっては、下表に示された内容以外は考慮しないものとする。\",\"imageUrl\":null,\"sourceSheet\":null,\" 呼を実施しなければならないが、遠隔地で業務を開始又は終了する場合は「運行上やむを得ない場合」に該当するため、「電話その他の方法」により点呼を実施することができる。この場合、運転者と直接対話ができる携帯電話も「電話その他の方法」に該当するため点呼の実施に使用することができる。\",\"isCorrect\":true,\"explanation\":null,\"structuredData\":null},{\"id\":1071,\"questionId\":271,\"optionNumber\":2,\"content\":\"運行管理者は、点呼に用いるアルコール検知器を常時有効に保持するため、確実に酒気を帯びていない者が当該アルコール検知器を使用した場合に、アルコールを検知しないことを1ヵ月に1回確認している。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":1072,\"questionId\":271,\"optionNumber\":3,\"content\":\"運行管理者は、業務後の点呼において、業務を終了した運転者からの当該業務に係る事業用自動車、道路及び運行の状況についての報告は、特に異常がない場合には運転者から求めないこととしており、点呼記録簿に「異常なし」と記録している。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":1073,\"questionId\":271,\"optionNumber\":4,\"content\":\"運行管理者は、業務後の点呼において酒気帯びの有無を確認する場合、運転者の状態を目視等で確認するほか、アルコール検知器を使用し、道路交通法施行令で定める呼気中のアルコール濃度 1 リットル当たり 0.15 ミリグラム以上であるか否かを確認している。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null}],\"explanation\":{\"id\":31,\"questionId\":271,\"content\":\"$25\",\"isDebated\":true},\"correctOptions\":[],\"attempts\":[],\"_count\":{\"attempts\":0},\"isDebated\":false,\"isBookmarked\":false},{\"id\":272,\"year\":\"令和6年 (CBT)\",\"questionNumber\":25,\"field\":\"実務上の知識及び能力\",\"majorField\":null,\"subField\":null,\"content\":\"【実務上の知識及び能力関係】\\n\\n一般貨物自動車運送事業者が事業用自動車の運転者に対して行う指導・監督に関する次の記述のうち、適切なものをすべて選びなさい。なお、解答にあたっては、各選択肢に記載されている事項以外は考慮しないものとする。\",\"imageUrl\":null,\"sourceSheet\":null,\"knowledgeTags\":null,\"riskCategory\":null,\"situationCategory\":null,\"format\":\"SINGLE\",\"pdfUrl\":null,\"pdfPage\":null,\"options\":[{\"id\":1074,\"questionId\":272,\"optionNumber\":1,\"content\":\"自動車が追越しをするときは、前の自動車の走行速度に応じた追越し距離、追越し時間が必要になる。前の自動車と追越しをする自動車の速度差が小さい場合には追越しに長い時間と距離が必要になることから、無理な追越しをしないよう運転者に対し指導する必要がある。\",\"isCorrect\":true,\"explanation\":null,\"structuredData\":null},{\"id\":1075,\"questionId\":272,\"optionNumber\":2,\"content\":\"運転者は、積載物の転落防止や、転落させたときに危険を防止するために必要な措置をとることが遵守事項として法令で定められている。出発前に、スペアタイヤや車両に備えられている工具箱等も含め、車両に積載されているものが転落のおそれがないことを確認しなければならないことを指導している。\",\"isCorrect\":true,\"explanation\":null,\"structuredData\":null},{\"id\":1076,\"questionId\":272,\"optionNumber\":3,\"content\":\"飲酒は、速度感覚の麻痺、視力の低下、反応時間の遅れ、眠気が生じるなど自動車の運転に極めて深刻な影響を及ぼす。飲酒により摂取されたアルコールを体内で分解処理するために必要な時間は、個人差はあるが、例えば日本酒（アルコール 15%）を 2 合（360mℓ）飲んだ時には、男性の場合で概ね 4 時間、女性の場合で概ね 5 時間が目安とされていることから、乗務前日の飲酒・酒量については、運転に影響のないよう十分気をつけることを運転者に指導している。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":1077,\"questionId\":272,\"optionNumber\":4,\"content\":\"国土交通大臣が認定する適性診断（以下「適性診断」という。）を受診した運転者の診断結果において、「感情の安定性」の項目で、「すぐかっとするなどの衝動的な傾向」との判定が出た。適性診断は、性格等を客観的に把握し、運転の適性を判定することにより、運転業務に適さない者を選任しないようにするためのものであるため、運行管理者は、当該運転者は運転業務に適さないと判断し、他の業務へ配置替えを行った。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null}],\"explanation\":{\"id\":33,\"questionId\":272,\"content\":\"Gemini との会話\\n解説\\n表示されている問題（令和6年 CBT 貨物・問25）の各肢に関する解説です。\\n\\n適切なものは 1 と 2 です。\\n\\n各肢の解説\\n1. 追越し時の安全指導【適切】\\n解説: 速度差が小さい車両を追い越す場合、平行して走る距離と時間が長くなるため危険が高まります。無茶な追越しを避けるよう指導するのは適切な運用です。\\n\\n2. 積載物の転落防止と事前確認【適切】\\n解説: 道路交通法および運行安全規程において、荷物だけでなくスペアタイヤや工具箱等も含めた積載物全般の転落防止・事前確認が義務付けられています。\\n\\n3. アルコールの分解時間【不適切】\\n誤りの箇所: アルコール分解時間の数値が誤っています。\\n\\n正しい知識:\\n\\n日本酒2合（360ml / アルコール量 約40g〜44g相当）を分解するのに必要な時間の目安は、男性で約8時間、女性で約10時間（1時間に約4g〜5g処理できる計算）です。\\n\\n記述にある「男性4時間・女性5時間」は、日本酒1合（180ml）の分解時間の目安です。\\n\\n4. 適性診断結果の扱い【不適切】\\n誤りの箇所: 診断結果のみを理由に即座に配置換えを行った点。\\n\\n正しい知識:\\n\\n国土交通省の適性診断は、運転者を選別・排除するためのものではなく、個人のクセや傾向を把握して安全指導・アドバイスに活かすためのものです。\\n\\n「感情の安定性」に課題が出た場合は、その特性を自覚させ、感情をコントロールして運転できるよう助言・指導を行うのが本来の目的です。\\n\",\"isDebated\":true},\"correctOptions\":[],\"attempts\":[],\"_count\":{\"attempts\":0},\"isDebated\":false,\"isBookmarked\":false},{\"id\":273,\"year\":\"令和6年 (CBT)\",\"questionNumber\":26,\"field\":\"実務上の知識及び能力\",\"majorField\":null,\"subField\":null,\"content\":\"【実務上の知識及び能力関係】\\n\\n一般貨物自動車運送事業者（以下「事業者」という。）が行う事業用自動車の運転者の健康管理に関する次の記述のうち、適切なものをすべて選びなさい。なお、解答にあたっては、各選択肢に記載されている事項以外は考慮しないものとする。\",\"imageUrl\":null,\"sourceSheet\":null,\"knowledgeTags\":null,\"riskCategory\":null,\"situationCategory\":null,\"format\":\"SINGLE\",\"pdfUrl\":null,\"pdfPage\":null,\"options\":[{\"id\":1078,\"questionId\":273,\"optionNumber\":1,\"content\":\"健康起因事故の防止には心臓疾患や大血管疾患の予防や早期発見が重要となる。事業者は、重篤な心臓疾患、大血管疾患を見逃さないためには、その前兆や自覚症状のうち 4 大症状といわれている胸痛、めまい・失神、動悸、呼吸困難の有無について、日頃から点呼等で運転者に確認し、早めに把握することが重要である。\",\"isCorrect\":true,\"explanation\":null,\"structuredData\":null},{\"id\":1079,\"questionId\":273,\"optionNumber\":2,\"content\":\"事業者は、法令により定められた健康診断を実施することが義務づけられているが、運転者が自ら受けた健康診断（人間ドックなど）において、法令で必要な定期健康診断の項目を充足している場合であっても、法定健診として代用することができない。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":1080,\"questionId\":273,\"optionNumber\":3,\"content\":\"運転者が脳検診において、異常所見の疑いが認められたため、当該運転者に脳検診を再受診させたところ、医師から診断結果に基づき、乗務時間を減らすなど、乗務の際の配慮が必要であるとの意見があった。このため、事業者は、医師からの意見等を勘案し、当該運転者について、乗務時間の短縮、夜間乗務の回数の削減等の就業上の措置を決定している。\",\"isCorrect\":true,\"explanation\":null,\"structuredData\":null},{\"id\":1081,\"questionId\":273,\"optionNumber\":4,\"content\":\"事業者は、深夜業（22 時〜 5 時）を含む業務に常時従事する運転者に対し、法令に定める定期健康診断を 6 ヵ月以内ごとに 1 回、必ず、定期的に受診させるようにしている。\",\"isCorrect\":true,\"explanation\":null,\"structuredData\":null}],\"explanation\":{\"id\":35,\"questionId\":273,\"content\":\"Gemini との会話\\n解説\\n令和6年 (CBT) 問26 解説\\n正解：1、3、4 （適切なもの）\\n\\n各選択肢の解説\\n1. 適切な記述 ◯\\n解説: 心臓疾患や大血管疾患の予防・早期発見には、日常的な状態把握が不可欠です。胸痛、めまい・失神、動悸、呼吸困難の4大症状について、日頃の点呼等で確認・把握に努めることは事故防止のために適切です。\\n\\n2. 不適切な記述 ✕\\n解説: 労働安全衛生法第66条第5項において、労働者は事業者が行う健康診断を受診しなければなりませんが、自ら医師による健康診断（人間ドック等）を受け、その結果を証する書面を事業者に提出した場合は、法定健診を受診したとみなすことができます（代用可能）。 したがって「代用することができない」とする本選択肢は誤りです。\\n\\n3. 適切な記述 ◯\\n解説: 脳検診等の結果において異常所見の疑いがあり、医師から乗務配慮の意見が出された場合、事業者はその意見を勘案し、乗務時間の短縮や夜間乗務の削減等の適切な就業上の措置を講じる必要があります。\\n\\n4. 適切な記述 ◯\\n解説: 深夜業（22時〜5時） を含む業務に常時従事する労働者（特定業務従事者）に対しては、労働安全衛生規則第45条に基づき、6ヶ月以内ごとに1回、定期的に健康診断を実施しなければなりません。\\n\\n💡 ポイントまとめ\\n自選健診（人間ドック等）の代用: 必要項目を満たして書面提出すれば代用OK。\\n\\n特定業務従事者（深夜業含む）の健診: 原則「1年ごと」ではなく「6ヶ月ごと」。\\n\",\"isDebated\":true},\"correctOptions\":[],\"attempts\":[],\"_count\":{\"attempts\":0},\"isDebated\":false,\"isBookmarked\":false},{\"id\":274,\"year\":\"令和6年 (CBT)\",\"questionNumber\":27,\"field\":\"実務上の知識及び能力\",\"majorField\":null,\"subField\":null,\"content\":\"【実務上の知識及び能力関係】\\n\\n交通事故防止対策に関する次の記述のうち、適切なものをすべて選びなさい。なお、解答にあたっては、各選択肢に記載されている事項以外は考慮しないものとする。\",\"imageUrl\":null,\"sourceSheet\":null,\"knowledgeTags\":null,\"riskCategory\":null,\"situationCategory\":null,\"format\":\"SINGLE\",\"pdfUrl\":null,\"pdfPage\":null,\"options\":[{\"id\":1082,\"questionId\":274,\"optionNumber\":1,\"content\":\"自動車のハンドルを左に切り旋回した場合、左側の後輪が左側の前輪の軌跡に対し外側を通ることとなり、この前後輪の軌跡の差を内輪差という。大型車などホイールベースが長いほど内輪差が小さくなることから、運転者に対し、交差点での左折時には、内輪差による歩行者や自転車等との接触、巻き込み事故に注意するよう指導する必要がある。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":1083,\"questionId\":274,\"optionNumber\":2,\"content\":\"輸送の安全に関する教育及び研修については、知識を普及させることに重点を置く手法に加えて、問題を解決することに重点を置く手法を取り入れるとともに、グループ討議や参加体験型研修等、運転者が参加する手法を取り入れることも交通事故防止対策の有効な手段となっている。\",\"isCorrect\":true,\"explanation\":null,\"structuredData\":null},{\"id\":1084,\"questionId\":274,\"optionNumber\":3,\"content\":\"アンチロック・ブレーキシステム（ABS）は、急ブレーキをかけた時などにタイヤがロック（回転が止まること）するのを防ぐことにより、車両の進行方向の安定性を保ち、また、ハンドル操作で障害物を回避できる可能性を高める装置である。ABS を効果的に作動させるためには、運転者はポンピングブレーキ操作（ブレーキペダルを踏み込んだり緩めたりを繰り返す操作）を行うことが必要であり、この点を運転者に指導する必要がある。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":1085,\"questionId\":274,\"optionNumber\":4,\"content\":\"トラックは視点が高いことから、手前の路面もよく見え、先行車両との車間距離が長く感じられるため、車間距離を短くとりがちになり、追突事故の要因ともなる。そのため、走行中は安全な速度と十分な車間距離を保つことが重要であることを、運転者に指導する必要がある。\",\"isCorrect\":true,\"explanation\":null,\"structuredData\":null}],\"explanation\":{\"id\":37,\"questionId\":274,\"content\":\"$26\",\"isDebated\":true},\"correctOptions\":[],\"attempts\":[],\"_count\":{\"attempts\":0},\"isDebated\":false,\"isBookmarked\":false},{\"id\":275,\"year\":\"令和6年 (CBT)\",\"questionNumber\":28,\"field\":\"実務上の知識及び能力\",\"majorField\":null,\"subField\":null,\"content\":\"【実務上の知識及び能力関係】\\n\\n自動車の運転等に関する次の記述のうち、適切なものを２つ選びなさい。なお、解答にあたっては、各選択肢に記載されている事項以外は考慮しないものとする。\",\"imageUrl\":null,\"sourceSheet\":null,\"knowledgeTags\":null,\"riskCategory\":null,\"situationCategory\":null,\"format\":\"SINGLE\",\"pdfUrl\":null,\"pdfPage\":null,\"options\":[{\"id\":1086,\"questionId\":275,\"optionNumber\":1,\"content\":\"連結車両（トラクタとトレーラを連結した車両）が、滑りやすい路面で急ハンドルや急ブレーキなどの急激な運転操作を行ったりすると、車輪がロックしてタイヤが滑り、トラクタとトレーラが連結部で折れ曲がり、「くの字」になることを「ジャックナイフ現象」という。\",\"isCorrect\":true,\"explanation\":null,\"structuredData\":null},{\"id\":1087,\"questionId\":275,\"optionNumber\":2,\"content\":\"フット・ブレーキを使い過ぎると、ブレーキ・ドラムやブレーキ・ライニングなどが摩擦のため過熱してその熱がブレーキ液に伝わり、液内に気泡が発生することによりブレーキが正常に作用しなくなり制動力が低下することを「ベーパー・ロック現象」という。\",\"isCorrect\":true,\"explanation\":null,\"structuredData\":null},{\"id\":1088,\"questionId\":275,\"optionNumber\":3,\"content\":\"自動車の夜間の走行時において、自車のライトと対向車のライトで、お互いの光が重なり合い、その間にいる歩行者や自転車が見えなくなることを「クリープ現象」という。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":1089,\"questionId\":275,\"optionNumber\":4,\"content\":\"自動車がカーブを走行するときに自動車に対しカーブの外側へ向かう力が働く。この力を「遠心力」といい、自動車の走行速度に比例し変化する。例えば、自動車の重量及びカーブの半径が同じ条件の場合、自動車の走行速度が 2 倍になると、遠心力の大きさも 2 倍になる。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null}],\"explanation\":{\"id\":39,\"questionId\":275,\"content\":\"Gemini との会話\\n解説\\n画面の問題（令和6年 CBT 問28）の解説です。\\n\\n正解は 1 と 2（適切なもの）です。\\n\\n選択肢の解説\\n⭕ 1. ジャックナイフ現象（適切）\\n解説: 連結車両（トラクタ＆トレーラ）が滑りやすい路面で急ハンドルや急ブレーキ操作を行った際、車輪がロックして「くの字」に折れ曲がる現象を ジャックナイフ現象 と呼びます。記述の通り正解です。\\n\\n⭕ 2. ベーパー・ロック現象（適切）\\n解説: フット・ブレーキの多用により摩擦熱がブレーキ液に伝わり、液内に気泡（気体）が生じることで油圧が伝わらなくなり、ブレーキが効かなくなる現象を ベーパー・ロック現象 と呼びます。記述の通り正解です。\\n\\n❌ 3. クリープ現象 ではなく「蒸発現象（フェードアウト）」\\n誤りの理由: 夜間に自車と対向車のライトの光が交差し、その間にいる歩行者が見えなくなる現象は 「蒸発現象（グレア現象）」 です。\\n\\n補足: 「クリープ現象」は、AT車でチェンジレバーがP・N以外に入っている際、アクセルを踏まなくても車がじわじわと動き出す現象のことです。\\n\\n❌ 4. 遠心力は速度の「2乗」に比例する\\n誤りの理由: 遠心力の大きさは、速度の2乗に比例します。そのため、走行速度が 2倍 になると、遠心力は 4倍（2 \\n2\\n =4）になります。記述のように「2倍になる」というのは誤りです。\\n\\nポイントまとめ\\n蒸発現象: 夜間のライト交差点で見えなくなる現象\\n\\nクリープ現象: AT車が勝手に進む現象\\n\\n遠心力: 速度の 2乗 に比例（速度2倍 → 遠心力4倍）\\n\",\"isDebated\":true},\"correctOptions\":[],\"attempts\":[],\"_count\":{\"attempts\":0},\"isDebated\":false,\"isBookmarked\":false},{\"id\":276,\"year\":\"令和6年 (CBT)\",\"questionNumber\":29,\"field\":\"実務上の知識及び能力\",\"majorField\":null,\"subField\":null,\"content\":\"【実務上の知識及び能力関係】\\n\\n自動車の追越しに関する次の 1～2 の記述について、解答しなさい。\\nなお、この場合の「追越し」とは、A 車が前走する B 車の後方 40 メートル（ア）の位置から始まり、B 車を追い越して B 車との車間距離が 40 メートル（イ）の位置に達するまでのすべての行程をいう。\\n\\n追越距離 : D = 〔((c1+b)+(c2+a))×(追越速度)〕 / (速度差)\\n(単位) 速度 : km/h\\n距離と車長 : m\\n\\n(注1) 追越車両の左右の移動量は、考慮しないものとする。\\n(注2) 各々の車両は、一定速度で走行しているものとする。\\n\\n1. 一般道を車両の長さ 10 メートルの A 車が時速 60 キロメートルで走行中、上図のとおり、時速 40 キロメートルで前方を走行中の車両の長さが 10 メートルの B 車を追い越すために要する追越距離を次の①～②の中から正しいものを１つ選びなさい。\\n\\n2. 「1」の場合において追越しに要する時間を次の①～②の中から正しいものを１つ選びなさい。\",\"imageUrl\":null,\"sourceSheet\":null,\"knowledgeTags\":\"#追い越し・交差点\",\"riskCategory\":null,\"situationCategory\":null,\"format\":\"MULTI_GROUP\",\"pdfUrl\":null,\"pdfPage\":null,\"options\":[{\"id\":1391,\"questionId\":276,\"optionNumber\":1,\"content\":\"1 : ① 200 メートル\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":\"{\\\"title\\\":\\\"1\\\",\\\"choices\\\":[{\\\"num\\\":1,\\\"text\\\":\\\"200 メートル\\\"},{\\\"num\\\":2,\\\"text\\\":\\\"300 メートル\\\"}]}\"},{\"id\":1392,\"questionId\":276,\"optionNumber\":2,\"content\":\"1 : ② 300 メートル\",\"isCorrect\":true,\"explanation\":null,\"structuredData\":\"{\\\"title\\\":\\\"1\\\",\\\"choices\\\":[{\\\"num\\\":1,\\\"text\\\":\\\"200 メートル\\\"},{\\\"num\\\":2,\\\"text\\\":\\\"300 メートル\\\"}]}\"},{\"id\":1393,\"questionId\":276,\"optionNumber\":3,\"content\":\"2 : ① 12 秒\",\"isCorrect\":true,\"explanation\":null,\"structuredData\":\"{\\\"title\\\":\\\"2\\\",\\\"choices\\\":[{\\\"num\\\":1,\\\"text\\\":\\\"12 秒\\\"},{\\\"num\\\":2,\\\"text\\\":\\\"18 秒\\\"}]}\"},{\"id\":1394,\"questionId\":276,\"optionNumber\":4,\"content\":\"2 : ② 18 秒\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":\"{\\\"title\\\":\\\"2\\\",\\\"choices\\\":[{\\\"num\\\":1,\\\"text\\\":\\\"12 秒\\\"},{\\\"num\\\":2,\\\"text\\\":\\\"18 秒\\\"}]}\"}],\"explanation\":{\"id\":41,\"questionId\":276,\"content\":\"$27\",\"isDebated\":true},\"correctOptions\":[],\"attempts\":[],\"_count\":{\"attempts\":0},\"isDebated\":false,\"isBookmarked\":false},{\"id\":277,\"year\":\"令和6年 (CBT)\",\"questionNumber\":30,\"field\":\"実務上の知識及び能力\",\"majorField\":null,\"subField\":null,\"content\":\"$28\",\"imageUrl\":null,\"sourceSheet\":null,\"knowledgeTags\":\"#点呼・乗務制限(管理者義務),#運行管理者の要件・選任,#自動車の登録・車検,#追い越し・交差点,#交通事故の要因・防止策,#健康管理・疾病\",\"riskCategory\":null,\"situationCategory\":\"#事故対応事例\",\"format\":\"SINGLE\",\"pdfUrl\":null,\"pdfPage\":null,\"options\":[{\"id\":1092,\"questionId\":277,\"optionNumber\":1,\"content\":\"ア イ エ\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":1093,\"questionId\":277,\"optionNumber\":2,\"content\":\"ア ウ オ\",\"isCorrect\":true,\"explanation\":null,\"structuredData\":null},{\"id\":1094,\"questionId\":277,\"optionNumber\":3,\"content\":\"ア エ カ\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":1095,\"questionId\":277,\"optionNumber\":4,\"content\":\"イ ウ エ\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":1096,\"questionId\":277,\"optionNumber\":5,\"content\":\"イ オ カ\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":1097,\"questionId\":277,\"optionNumber\":6,\"content\":\"ウ エ カ\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null}],\"explanation\":{\"id\":43,\"questionId\":277,\"content\":\"$29\",\"isDebated\":true},\"correctOptions\":[],\"attempts\":[],\"_count\":{\"attempts\":0},\"isDebated\":false,\"isBookmarked\":false},{\"id\":278,\"year\":\"令和5年 (CBT)\",\"questionNumber\":1,\"field\":\"貨物自動車運送事業法\",\"majorField\":null,\"subField\":null,\"content\":\"【貨物自動車運送事業法関係】\\n\\n貨物自動車運送事業に関する次の記述のうち、正しいものをすべて選びなさい。なお、解答にあたっては、各選択肢に記載されている事項以外は考慮しないものとする。\",\"imageUrl\":null,\"sourceSheet\":null,\"knowledgeTags\":null,\"riskCategory\":null,\"situationCategory\":null,\"format\":\"SINGLE\",\"pdfUrl\":null,\"pdfPage\":null,\"options\":[{\"id\":1098,\"questionId\":278,\"optionNumber\":1,\"content\":\"一般貨物自動車運送事業とは、他人の需要に応じ、有償、無償に関わらず、自動車（三輪以上の軽自動車及び二輪の自動車を除く。）を使用して貨物を運送する事業であって、特定貨物自動車運送事業以外のものをいう。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":1099,\"questionId\":278,\"optionNumber\":2,\"content\":\"特定貨物自動車運送事業とは、特定の者の需要に応じ、有償で、自動車を使用して貨物を運送する事業をいう。\",\"isCorrect\":true,\"explanation\":null,\"structuredData\":null},{\"id\":1100,\"questionId\":278,\"optionNumber\":3,\"content\":\"貨物自動車運送事業法は、貨物自動車運送事業の運営を適正かつ合理的なものとするとともに、貨物自動車運送に関するこの法律及びこの法律に基づく措置の遵守等を図るための民間団体等による自主的な活動を促進することにより、輸送の安全を確保するとともに、貨物自動車運送事業の健全な発達を図り、もって公共の福祉の増進に資することを目的とする。\",\"isCorrect\":true,\"explanation\":null,\"structuredData\":null},{\"id\":1101,\"questionId\":278,\"optionNumber\":4,\"content\":\"一般貨物自動車運送事業又は特定貨物自動車運送事業の許可の取消しを受けた者は、その取消しの日から2年を経過しなければ、新たに一般貨物自動車運送事業の許可を受けることができない。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null}],\"explanation\":{\"id\":48,\"questionId\":278,\"content\":\"Gemini との会話\\n解説\\n表示されている令和5年 (CBT) 問1【貨物自動車運送事業法関係】についての解説を作成しました。ダッシュボードの解説メモ等にご活用ください。\\n\\nこの問題において、正しい記述は 3 のみです。\\n\\n各選択肢の解説\\n選択肢 1：誤り (×)\\n\\n誤りの箇所: 「有償、無償に関わらず」\\n\\n解説: 一般貨物自動車運送事業は、他人の需要に応じ、「有償で」自動車を使用して貨物を運送する事業を指します（貨物自動車運送事業法 第2条第2項）。無償（タダ）で運送する場合は運送事業に該当しません。\\n\\n選択肢 2：誤り (×)\\n\\n誤りの箇所: 「自動車を使用して」の直後に続くべき例外規定が抜けている。\\n\\n解説: 法令上の定義では「特定の者の需要に応じ、有償で、自動車（三輪以上の軽自動車及び二輪の自動車を除く。）を使用して貨物を運送する事業」と規定されています（同法 第2条第3項）。貨物軽自動車等を除外するカッコ書きの記述が抜け落ちているため、厳密な定義としては誤りとなります。\\n\\n選択肢 3：正しい (◯)\\n\\n解説: 記述の通りです。貨物自動車運送事業法 第1条（目的）の条文そのままの内容です。輸送の安全確保と事業の健全な発達を図り、もって公共の福祉の増進に資することが目的とされています。\\n\\n選択肢 4：誤り (×)\\n\\n誤りの箇所: 「2年を経過しなければ」\\n\\n解説: 許可の取消しを受けてから新たに許可を受けられない期間（欠格期間）は、正しくは「5年」です（同法 第5条）。取消しの日から5年を経過しなければ、新たに一般貨物自動車運送事業の許可を受けることはできません。\\n\\n💡 学習のポイント\\n試験において、第1条の「目的」や第2条の「定義」に関する問題は頻出です。以下のポイントはひっかけとして非常によく狙われるため、確実におさえておくことをおすすめします。\\n\\n事業の定義における「有償」の条件\\n\\n自動車の定義における「（三輪以上の軽自動車及び二輪の自動車を除く。）」という除外規定の有無\\n\\n許可の取消し等の欠格事由における「年数（5年）」\\n\",\"isDebated\":true},\"correctOptions\":[],\"attempts\":[],\"_count\":{\"attempts\":0},\"isDebated\":false,\"isBookmarked\":false},{\"id\":279,\"year\":\"令和5年 (CBT)\",\"questionNumber\":2,\"field\":\"貨物自動車運送事業法\",\"majorField\":null,\"subField\":null,\"content\":\"【貨物自動車運送事業法関係】\\n\\n貨物自動車運送事業法等に規定する運行管理者等の義務及び選任についての次の文中、A、B、C、Dに入るべき字句としていずれか正しいものを1つ選びなさい。\\n\\n1．運行管理者は、誠実にその業務を行わなければならない。\\n\\n2．一般貨物自動車運送事業者は、運行管理者に対し、法令で定める業務を行うため必要な[ A ]を与えなければならない。\\n\\n3．一般貨物自動車運送事業者は、運行管理者がその業務として行う助言を尊重しなければならず、事業用自動車の運転者その他の従業員は、運行管理者がその業務として行う[ B ]に従わなければならない。\\n\\n4．一般貨物自動車運送事業者等は、事業用自動車（被けん引自動車を除く。）の運行を管理する営業所ごとに、当該営業所が運行を管理する事業用自動車の数を[ C ]で除して得た数（その数に1未満の端数があるときは、これを切り捨てるものとする。）に1を加算して得た数以上の運行管理者を選任しなければならない。\\n\\n5．一の営業所において複数の運行管理者を選任する一般貨物自動車運送事業者等は、それらの業務を統括する[ D ]を選任しなければならない。\",\"imageUrl\":null,\"sourceSheet\":null,\"knowledgeTags\":\"#運行管理者の要件・選任\",\"riskCategory\":null,\"situationCategory\":null,\"format\":\"MULTI_GROUP\",\"pdfUrl\":null,\"pdfPage\":null,\"options\":[{\"id\":1395,\"questionId\":279,\"optionNumber\":1,\"content\":\"A : ① 権限\",\"isCorrect\":true,\"explanation\":null,\"structuredData\":\"{\\\"title\\\":\\\"A\\\",\\\"choices\\\":[{\\\"num\\\":1,\\\"text\\\":\\\"権限\\\"},{\\\"num\\\":2,\\\"text\\\":\\\"地位\\\"}]}\"},{\"id\":1396,\"questionId\":279,\"optionNumber\":2,\"content\":\"A : ② 地位\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":\"{\\\"title\\\":\\\"A\\\",\\\"choices\\\":[{\\\"num\\\":1,\\\"text\\\":\\\"権限\\\"},{\\\"num\\\":2,\\\"text\\\":\\\"地位\\\"}]}\"},{\"id\":1397,\"questionId\":279,\"optionNumber\":3,\"content\":\"B : ① 勧告\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":\"{\\\"title\\\":\\\"B\\\",\\\"choices\\\":[{\\\"num\\\":1,\\\"text\\\":\\\"勧告\\\"},{\\\"num\\\":2,\\\"text\\\":\\\"指導\\\"}]}\"},{\"id\":1398,\"questionId\":279,\"optionNumber\":4,\"content\":\"B : ② 指導\",\"isCorrect\":true,\"explanation\":null,\"structuredData\":\"{\\\"title\\\":\\\"B\\\",\\\"choices\\\":[{\\\"num\\\":1,\\\"text\\\":\\\"勧告\\\"},{\\\"num\\\":2,\\\"text\\\":\\\"指導\\\"}]}\"},{\"id\":1399,\"questionId\":279,\"optionNumber\":5,\"content\":\"C : ① 20\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":\"{\\\"title\\\":\\\"C\\\",\\\"choices\\\":[{\\\"num\\\":1,\\\"text\\\":\\\"20\\\"},{\\\"num\\\":2,\\\"text\\\":\\\"30\\\"}]}\"},{\"id\":1400,\"questionId\":279,\"optionNumber\":6,\"content\":\"C : ② 30\",\"isCorrect\":true,\"explanation\":null,\"structuredData\":\"{\\\"title\\\":\\\"C\\\",\\\"choices\\\":[{\\\"num\\\":1,\\\"text\\\":\\\"20\\\"},{\\\"num\\\":2,\\\"text\\\":\\\"30\\\"}]}\"},{\"id\":1401,\"questionId\":279,\"optionNumber\":7,\"content\":\"D : ① 安全管理者\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":\"{\\\"title\\\":\\\"D\\\",\\\"choices\\\":[{\\\"num\\\":1,\\\"text\\\":\\\"安全管理者\\\"},{\\\"num\\\":2,\\\"text\\\":\\\"運行管理者\\\"}]}\"},{\"id\":1402,\"questionId\":279,\"optionNumber\":8,\"content\":\"D : ② 運行管理者\",\"isCorrect\":true,\"explanation\":null,\"structuredData\":\"{\\\"title\\\":\\\"D\\\",\\\"choices\\\":[{\\\"num\\\":1,\\\"text\\\":\\\"安全管理者\\\"},{\\\"num\\\":2,\\\"text\\\":\\\"運行管理者\\\"}]}\"}],\"explanation\":null,\"correctOptions\":[],\"attempts\":[],\"_count\":{\"attempts\":0},\"isDebated\":false,\"isBookmarked\":false},{\"id\":280,\"year\":\"令和5年 (CBT)\",\"questionNumber\":3,\"field\":\"貨物自動車運送事業法\",\"majorField\":null,\"subField\":null,\"content\":\"【貨物自動車運送事業法関係】\\n\\n次の記述のうち、一般貨物自動車運送事業の運行管理者が行わなければならない業務として、誤っているものを1つ選びなさい。なお、解答にあたっては、各選択肢に記載されている事項以外は考慮しないものとする。\",\"imageUrl\":null,\"sourceSheet\":null,\"knowledgeTags\":null,\"riskCategory\":null,\"situationCategory\":null,\"format\":\"SINGLE\",\"pdfUrl\":null,\"pdfPage\":null,\"options\":[{\"id\":1106,\"questionId\":280,\"optionNumber\":1,\"content\":\"乗務員等が有効に利用することができるように、休憩に必要な施設を整備し、及び乗務員等に睡眠を与える必要がある場合にあっては睡眠に必要な施設を整備し、並びにこれらの施設を適切に管理し、及び保守すること。\",\"isCorrect\":true,\"explanation\":null,\"structuredData\":null},{\"id\":1107,\"questionId\":280,\"optionNumber\":2,\"content\":\"一般貨物自動車運送事業者により運転者として選任された者以外の者を事業用自動車の運行の業務に従事させないこと。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":1108,\"questionId\":280,\"optionNumber\":3,\"content\":\"事業用自動車に備えられた非常信号用具及び消火器の取扱いについて、当該事業用自動車の乗務員等に対する適切な指導を行うこと。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":1109,\"questionId\":280,\"optionNumber\":4,\"content\":\"法令の規定により、運転者等ごとに運転者等台帳を作成し、営業所に備え置くこと。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null}],\"explanation\":null,\"correctOptions\":[],\"attempts\":[],\"_count\":{\"attempts\":0},\"isDebated\":false,\"isBookmarked\":false},{\"id\":281,\"year\":\"令和5年 (CBT)\",\"questionNumber\":4,\"field\":\"貨物自動車運送事業法\",\"majorField\":null,\"subField\":null,\"content\":\"【貨物自動車運送事業法関係】\\n\\n貨物自動車運送事業の事業用自動車の運転者に対する点呼についての法令等の定めに関する次の記述のうち、正しいものをすべて選びなさい。なお、解答にあたっては、各選択肢に記載されている事項以外は考慮しないものとする。\",\"imageUrl\":null,\"sourceSheet\":null,\"knowledgeTags\":\"#点呼・乗務制限(管理者義務)\",\"riskCategory\":null,\"situationCategory\":null,\"format\":\"SINGLE\",\"pdfUrl\":null,\"pdfPage\":null,\"options\":[{\"id\":1110,\"questionId\":281,\"optionNumber\":1,\"content\":\"貨物自動車運送事業者は、点呼に用いるアルコール検知器を常時有効に保持しなければならない。このため、確実に酒気を帯びていない者が当該アルコール検知器を使用した場合に、アルコールを検知しないこと及び洗口液等アルコールを含有する液体又はこれを希釈したものをスプレー等により口内に噴霧した上で、当該アルコール検知器を使用した場合にアルコールを検知すること等により、定期的に故障の有無を確認しなければならない。\",\"isCorrect\":true,\"explanation\":null,\"structuredData\":null},{\"id\":1111,\"questionId\":281,\"optionNumber\":2,\"content\":\"運行管理者の業務を補助させるための者（補助者）を選任し、点呼の一部を行わせる場合であっても、当該営業所において選任されている運行管理者が行う点呼は、点呼を行うべき総回数の少なくとも2分の1以上でなければならない。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":1112,\"questionId\":281,\"optionNumber\":3,\"content\":\"業務前の点呼においては、営業所に備えるアルコール検知器を用いて酒気帯びの有無を確認できる場合であっても、運転者の状態を目視等で確認しなければならない。\",\"isCorrect\":true,\"explanation\":null,\"structuredData\":null},{\"id\":1113,\"questionId\":281,\"optionNumber\":4,\"content\":\"運転者に対して点呼を行い、報告を求め、確認を行い、及び指示をしたときは、運転者ごとに点呼を行った旨、報告、確認及び指示の内容並びに法令に掲げる事項を記録し、かつ、その記録を1年間保存すること。\",\"isCorrect\":true,\"explanation\":null,\"structuredData\":null}],\"explanation\":null,\"correctOptions\":[],\"attempts\":[],\"_count\":{\"attempts\":0},\"isDebated\":false,\"isBookmarked\":false},{\"id\":282,\"year\":\"令和5年 (CBT)\",\"questionNumber\":5,\"field\":\"貨物自動車運送事業法\",\"majorField\":null,\"subField\":null,\"content\":\"【貨物自動車運送事業法関係】\\n\\n次の自動車事故に関する記述のうち、一般貨物自動車運送事業者が自動車事故報告規則に基づき運輸支局長等に速報を要するものをすべて選びなさい。なお、解答にあたっては、各選択肢に記載されている事項以外は考慮しないものとする。\",\"imageUrl\":null,\"sourceSheet\":null,\"knowledgeTags\":null,\"riskCategory\":null,\"situationCategory\":\"#事故対応事例\",\"format\":\"SINGLE\",\"pdfUrl\":null,\"pdfPage\":null,\"options\":[{\"id\":1114,\"questionId\":282,\"optionNumber\":1,\"content\":\"事業用自動車が交差点に停車していた自家用貨物自動車に気づくのが遅れ、当該事業用自動車がこの自家用貨物自動車に追突し、さらに後続の自家用乗用自動車が当該事業用自動車に追突する事故となり、この事故により当該事業用自動車の運転者1人が重傷、追突された自家用貨物自動車の運転者1人及び後続の自家用乗用自動車に乗車していた4人が軽傷を負った。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":1115,\"questionId\":282,\"optionNumber\":2,\"content\":\"事業用自動車が高速自動車国道法に定める高速自動車国道において、路肩に停車中の車両に追突したため、後続車6台が衝突する多重事故が発生し、この事故により6人が重傷、4人が軽傷を負った。\",\"isCorrect\":true,\"explanation\":null,\"structuredData\":null},{\"id\":1116,\"questionId\":282,\"optionNumber\":3,\"content\":\"事業用自動車の運転者が、ハンドル操作を誤り道路のガードレールに接触する事故を起こし、軽傷を負った。事故処理を担当した警察官が当該運転者への事情聴取中に酒臭さを感じたため呼気検査を実施したところ、道路交通法の規定に違反する酒気帯び運転をしていたことが発覚した。\",\"isCorrect\":true,\"explanation\":null,\"structuredData\":null},{\"id\":1117,\"questionId\":282,\"optionNumber\":4,\"content\":\"事業用自動車が走行中、鉄道施設である高架橋の下を通過しようとしたところ、積載していた建設用機械の側部が橋脚に衝突し、当該橋脚を損傷させた。鉄道施設の安全確認作業の影響で、3時間にわたり本線において鉄道車両の運転を休止させた。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null}],\"explanation\":null,\"correctOptions\":[],\"attempts\":[],\"_count\":{\"attempts\":0},\"isDebated\":false,\"isBookmarked\":false},{\"id\":283,\"year\":\"令和5年 (CBT)\",\"questionNumber\":6,\"field\":\"貨物自動車運送事業法\",\"majorField\":null,\"subField\":null,\"content\":\"【貨物自動車運送事業法関係】\\n\\n一般貨物自動車運送事業者（以下「事業者」という。）の過労運転の防止等についての法令等の定めに関する次の記述のうち、誤っているものを1つ選びなさい。なお、解答にあたっては、各選択肢に記載されている事項以外は考慮しないものとする。\",\"imageUrl\":null,\"sourceSheet\":null,\"knowledgeTags\":\"#点呼・乗務制限(管理者義務)\",\"riskCategory\":null,\"situationCategory\":null,\"format\":\"SINGLE\",\"pdfUrl\":null,\"pdfPage\":null,\"options\":[{\"id\":1118,\"questionId\":283,\"optionNumber\":1,\"content\":\"事業者は、乗務員等が有効に利用することができるように、休憩に必要な施設を整備し、及び乗務員等に睡眠を与える必要がある場合にあっては睡眠に必要な施設を整備しなければならない。ただし、休憩・睡眠施設が設けられている場合であっても、施設・寝具等が、不潔な状態にある施設は、有効に利用することができる施設には該当しない。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":1119,\"questionId\":283,\"optionNumber\":2,\"content\":\"事業者は、乗務員等の生活状況を把握し、疾病、疲労、睡眠不足その他の理由により安全に運行の業務を遂行し、又はその補助をすることができないおそれがある乗務員等を事業用自動車の運行の業務に従事させてはならない。\",\"isCorrect\":true,\"explanation\":null,\"structuredData\":null},{\"id\":1120,\"questionId\":283,\"optionNumber\":3,\"content\":\"運転者が一の運行における最初の勤務を開始してから最後の勤務を終了するまでの時間（ただし、「自動車運転者の労働時間等の改善のための基準」（改善基準告示）の規定において厚生労働省労働基準局長が定めることとされている自動車運転者がフェリーに乗船する場合における休息期間を除く。）は、144時間を超えてはならない。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":1121,\"questionId\":283,\"optionNumber\":4,\"content\":\"事業者は、休憩又は睡眠のための時間及び勤務が終了した後の休息のための時間が十分に確保されるように、国土交通大臣が告示で定める基準に従って、運転者の勤務時間及び乗務時間を定め、当該運転者にこれらを遵守させなければならない。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null}],\"explanation\":null,\"correctOptions\":[],\"attempts\":[],\"_count\":{\"attempts\":0},\"isDebated\":false,\"isBookmarked\":false},{\"id\":284,\"year\":\"令和5年 (CBT)\",\"questionNumber\":7,\"field\":\"貨物自動車運送事業法\",\"majorField\":null,\"subField\":null,\"content\":\"【貨物自動車運送事業法関係】\\n\\n一般貨物自動車運送事業者（以下「事業者」という。）の事業用自動車の運行の安全を確保するために、事業者が国土交通省告示等に基づき運転者に対して行わなければならない指導監督及び特定の運転者に対して行わなければならない特別な指導に関する次の記述のうち、正しいものを2つ選びなさい。なお、解答にあたっては、各選択肢に記載されている事項以外は考慮しないものとする。\",\"imageUrl\":null,\"sourceSheet\":null,\"knowledgeTags\":null,\"riskCategory\":null,\"situationCategory\":null,\"format\":\"SINGLE\",\"pdfUrl\":null,\"pdfPage\":null,\"options\":[{\"id\":1122,\"questionId\":284,\"optionNumber\":1,\"content\":\"事業者が行う事故惹起運転者に対する特別な指導については、当該交通事故を引き起こした後再度事業用自動車に乗務する前に実施する。ただし、やむを得ない事情がある場合には、再度乗務を開始した後1ヵ月以内に実施する。なお、外部の専門的機関における指導講習を受講する予定である場合は、この限りでない。\",\"isCorrect\":true,\"explanation\":null,\"structuredData\":null},{\"id\":1123,\"questionId\":284,\"optionNumber\":2,\"content\":\"事業者は、事業用自動車の運転者として常時選任するために新たに雇い入れた者であって、当該事業者において初めて事業用自動車に乗務する前3年間に他の事業者によって運転者として常時選任されたことがない者には、初任運転者を対象とする特別な指導について、初めて事業用自動車に乗務する前に実施する。ただし、やむを得ない事情がある場合には、乗務を開始した後3ヵ月以内に実施する。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":1124,\"questionId\":284,\"optionNumber\":3,\"content\":\"事業者は、軽傷者（法令で定める傷害を受けた者）を生じた交通事故を引き起こし、かつ、当該事故前の1年間に交通事故を引き起こした運転者に対し、国土交通大臣が告示で定める適性診断であって国土交通大臣の認定を受けたものを受診させること。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":1125,\"questionId\":284,\"optionNumber\":4,\"content\":\"事業者は、法令に基づき事業用自動車の運転者を常時選任するために新たに雇い入れた場合には、当該運転者について、自動車安全運転センターが交付する無事故・無違反証明書又は運転記録証明書等により、雇い入れる前の事故歴を把握し、事故惹起運転者に該当するか否かを確認すること。\",\"isCorrect\":true,\"explanation\":null,\"structuredData\":null}],\"explanation\":null,\"correctOptions\":[],\"attempts\":[],\"_count\":{\"attempts\":0},\"isDebated\":false,\"isBookmarked\":false},{\"id\":285,\"year\":\"令和5年 (CBT)\",\"questionNumber\":8,\"field\":\"貨物自動車運送事業法\",\"majorField\":null,\"subField\":null,\"content\":\"【貨物自動車運送事業法関係】\\n\\n一般貨物自動車運送事業者（以下「事業者」という。）の運行指示書による指示等に関する次の記述のうち、正しいものを2つ選びなさい。なお、解答にあたっては、各選択肢に記載されている事項以外は考慮しないものとする。\",\"imageUrl\":null,\"sourceSheet\":null,\"knowledgeTags\":null,\"riskCategory\":null,\"situationCategory\":null,\"format\":\"SINGLE\",\"pdfUrl\":null,\"pdfPage\":null,\"options\":[{\"id\":1126,\"questionId\":285,\"optionNumber\":1,\"content\":\"事業者は、業務前及び業務後の点呼のいずれも対面等で行うことができない乗務を含む運行ごとに、「運行に際して注意を要する箇所の位置」等の所定の事項を記載した運行指示書を作成し、これにより事業用自動車の運転者等に対し適切な指示を行い、及びこれを当該運転者等に携行させなければならない。\",\"isCorrect\":true,\"explanation\":null,\"structuredData\":null},{\"id\":1127,\"questionId\":285,\"optionNumber\":2,\"content\":\"事業者は、運行指示書の作成を要する運行の途中において、「運行の経路並びに主な経過地における発車及び到着の日時」に変更が生じた場合には、運行指示書の写しに当該変更の内容を記載し、これにより運転者等に対し電話その他の方法により、当該変更の内容について適切な指示を行わなければならない。この場合、当該運転者等が携行している運行指示書への当該変更内容の記載を省略させることができる。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":1128,\"questionId\":285,\"optionNumber\":3,\"content\":\"事業者は、運行指示書の作成を要しない運行の途中において、事業用自動車の運転者等に業務前及び業務後の点呼のいずれも対面等で行うことができない業務を行わせることとなった場合には、当該業務以後の運行について、所定の事項を記載した運行指示書を作成し、及びこれにより当該運転者等に対し電話その他の方法により適切な指示を行わなければならない。\",\"isCorrect\":true,\"explanation\":null,\"structuredData\":null},{\"id\":1129,\"questionId\":285,\"optionNumber\":4,\"content\":\"事業者は、法令の規定により運行指示書を作成した場合には、当該運行指示書を、運行を計画した日から1年間保存しなければならない。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null}],\"explanation\":{\"id\":50,\"questionId\":285,\"content\":\"$2a\",\"isDebated\":true},\"correctOptions\":[],\"attempts\":[],\"_count\":{\"attempts\":0},\"isDebated\":false,\"isBookmarked\":false},{\"id\":286,\"year\":\"令和5年 (CBT)\",\"questionNumber\":9,\"field\":\"道路運送車両法\",\"majorField\":null,\"subField\":null,\"content\":\"【道路運送車両法関係】\\n\\n自動車の登録等についての次の記述のうち、誤っているものを1つ選びなさい。なお、解答にあたっては、各選択肢に記載されている事項以外は考慮しないものとする。\",\"imageUrl\":null,\"sourceSheet\":null,\"knowledgeTags\":\"#自動車の登録・車検\",\"riskCategory\":null,\"situationCategory\":null,\"format\":\"SINGLE\",\"pdfUrl\":null,\"pdfPage\":null,\"options\":[{\"id\":1130,\"questionId\":286,\"optionNumber\":1,\"content\":\"登録を受けた自動車（自動車抵当法第2条ただし書きに規定する大型特殊自動車を除く。）の所有権の得喪は、登録を受けなければ、第三者に対抗することができない。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":1131,\"questionId\":286,\"optionNumber\":2,\"content\":\"登録自動車の所有者は、当該自動車が滅失し、解体し（整備又は改造のために解体する場合を除く。）、又は自動車の用途を廃止したときは、その事由があった日（使用済自動車の解体である場合には解体報告記録がなされたことを知った日）から15日以内に、永久抹消登録の申請をしなければならない。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":1132,\"questionId\":286,\"optionNumber\":3,\"content\":\"登録自動車の所有者は、当該自動車の自動車登録番号標の封印が滅失した場合には、国土交通大臣又は封印取付受託者の行う封印の取付けを受けなければならない。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":1133,\"questionId\":286,\"optionNumber\":4,\"content\":\"臨時運行の許可を受けた者は、臨時運行許可証の有効期間が満了したときは、その日から15日以内に、臨時運行許可証及び臨時運行許可番号標を許可に係る行政庁に返納しなければならない。\",\"isCorrect\":true,\"explanation\":null,\"structuredData\":null}],\"explanation\":{\"id\":52,\"questionId\":286,\"content\":\"$2b\",\"isDebated\":true},\"correctOptions\":[],\"attempts\":[],\"_count\":{\"attempts\":0},\"isDebated\":false,\"isBookmarked\":false},{\"id\":287,\"year\":\"令和5年 (CBT)\",\"questionNumber\":10,\"field\":\"道路運送車両法\",\"majorField\":null,\"subField\":null,\"content\":\"【道路運送車両法関係】\\n\\n自動車の検査等についての次の記述のうち、正しいものを2つ選びなさい。なお、解答にあたっては、各選択肢に記載されている事項以外は考慮しないものとする。\",\"imageUrl\":null,\"sourceSheet\":null,\"knowledgeTags\":\"#自動車の登録・車検\",\"riskCategory\":null,\"situationCategory\":null,\"format\":\"SINGLE\",\"pdfUrl\":null,\"pdfPage\":null,\"options\":[{\"id\":1134,\"questionId\":287,\"optionNumber\":1,\"content\":\"国土交通大臣は、一定の地域に使用の本拠の位置を有する自動車の使用者が、天災その他やむを得ない事由により、継続検査を受けることができないと認めるときは、当該地域に使用の本拠の位置を有する自動車の自動車検査証の有効期間を、期間を定めて伸長する旨を公示することができる。\",\"isCorrect\":true,\"explanation\":null,\"structuredData\":null},{\"id\":1135,\"questionId\":287,\"optionNumber\":2,\"content\":\"自動車の使用者は、自動車の長さ、幅又は高さを変更したときは、法令で定める場合を除き、その事由があった日から30日以内に、当該変更について、国土交通大臣が行う自動車検査証の変更記録を受けなければならない。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null},{\"id\":1136,\"questionId\":287,\"optionNumber\":3,\"content\":\"自動車（検査対象外軽自動車及び小型特殊自動車を除く。）は、国土交通大臣の行う検査を受け、有効な自動車検査証の交付を受けているものでなければ、これを運行の用に供してはならない。\",\"isCorrect\":true,\"explanation\":null,\"structuredData\":null},{\"id\":1137,\"questionId\":287,\"optionNumber\":4,\"content\":\"自動車は、自動車検査証又は当該自動車検査証の写しを備え付け、かつ、検査標章を表示しなければ、運行の用に供してはならない。\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":null}],\"explanation\":{\"id\":54,\"questionId\":287,\"content\":\"$2c\",\"isDebated\":true},\"correctOptions\":[],\"attempts\":[],\"_count\":{\"attempts\":0},\"isDebated\":false,\"isBookmarked\":false},{\"id\":288,\"year\":\"令和5年 (CBT)\",\"questionNumber\":11,\"field\":\"道路運送車両法\",\"majorField\":null,\"subField\":null,\"content\":\"【道路運送車両法関係】\\n\\n道路運送車両法に定める自動車の点検整備等に関する次の文中、A、B、C、Dに入るべき字句としていずれか正しいものを１つ選びなさい。\\n\\n1. 自動車運送事業の用に供する自動車の使用者は、点検整備記録簿を当該自動車に備え置き、道路運送車両法の規定により定期点検整備を実施したときは、遅滞なく、点検の結果、整備の概要等所定事項を記載して、その記載の日から A 間保存しなければならない。\\n\\n2. 自動車の使用者は、自動車の点検をし、及び必要に応じ B をすることにより、当該自動車を保安基準に適合するように維持しなければならない。\\n\\n3. 大型自動車使用者等は、整備管理者を選任したときは、その日から C 以内に、地方運輸局長にその旨を届け出なければならない。これを変更したときも同様である。\\n\\n4. 道路運送車両法第54条の2の規定による整備命令を受けた自動車の D は、当該命令を受けた日から15日以内に、地方運輸局長に対し、保安基準に適合させるために必要な整備を行った当該自動車及び当該自動車に係る自動車検査証を提示しなければならない。\",\"imageUrl\":null,\"sourceSheet\":null,\"knowledgeTags\":\"#保安基準(寸法・重量・灯火),#日常点検・定期点検,#自動車の登録・車検\",\"riskCategory\":null,\"situationCategory\":null,\"format\":\"MULTI_GROUP\",\"pdfUrl\":null,\"pdfPage\":null,\"options\":[{\"id\":1410,\"questionId\":288,\"optionNumber\":1,\"content\":\"A : ① 1年\",\"isCorrect\":true,\"explanation\":null,\"structuredData\":\"{\\\"title\\\":\\\"A\\\",\\\"choices\\\":[{\\\"num\\\":1,\\\"text\\\":\\\"1年\\\"},{\\\"num\\\":2,\\\"text\\\":\\\"2年\\\"}]}\"},{\"id\":1411,\"questionId\":288,\"optionNumber\":2,\"content\":\"A : ② 2年\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":\"{\\\"title\\\":\\\"A\\\",\\\"choices\\\":[{\\\"num\\\":1,\\\"text\\\":\\\"1年\\\"},{\\\"num\\\":2,\\\"text\\\":\\\"2年\\\"}]}\"},{\"id\":1412,\"questionId\":288,\"optionNumber\":3,\"content\":\"B : ① 整備\",\"isCorrect\":true,\"explanation\":null,\"structuredData\":\"{\\\"title\\\":\\\"B\\\",\\\"choices\\\":[{\\\"num\\\":1,\\\"text\\\":\\\"整備\\\"},{\\\"num\\\":2,\\\"text\\\":\\\"検査\\\"}]}\"},{\"id\":1413,\"questionId\":288,\"optionNumber\":4,\"content\":\"B : ② 検査\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":\"{\\\"title\\\":\\\"B\\\",\\\"choices\\\":[{\\\"num\\\":1,\\\"text\\\":\\\"整備\\\"},{\\\"num\\\":2,\\\"text\\\":\\\"検査\\\"}]}\"},{\"id\":1414,\"questionId\":288,\"optionNumber\":5,\"content\":\"C : ① 15日\",\"isCorrect\":true,\"explanation\":null,\"structuredData\":\"{\\\"title\\\":\\\"C\\\",\\\"choices\\\":[{\\\"num\\\":1,\\\"text\\\":\\\"15日\\\"},{\\\"num\\\":2,\\\"text\\\":\\\"30日\\\"}]}\"},{\"id\":1415,\"questionId\":288,\"optionNumber\":6,\"content\":\"C : ② 30日\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":\"{\\\"title\\\":\\\"C\\\",\\\"choices\\\":[{\\\"num\\\":1,\\\"text\\\":\\\"15日\\\"},{\\\"num\\\":2,\\\"text\\\":\\\"30日\\\"}]}\"},{\"id\":1416,\"questionId\":288,\"optionNumber\":7,\"content\":\"D : ① 所有者\",\"isCorrect\":false,\"explanation\":null,\"structuredData\":\"{\\\"title\\\":\\\"D\\\",\\\"choices\\\":[{\\\"num\\\":1,\\\"text\\\":\\\"所有者\\\"},{\\\"num\\\":2,\\\"text\\\":\\\"使用者\\\"}]}\"},{\"id\":1417,\"questionId\":288,\"optionNumber\":8,\"content\":\"D : ② 使用者\",\"isCorrect\":true,\"explanation\":null,\"structuredData\":\"{\\\"title\\\":\\\"D\\\",\\\"choices\\\":[{\\\"num\\\":1,\\\"text\\\":\\\"所有者\\\"},{\\\"num\\\":2,\\\"text\\\":\\\"使用者\\\"}]}\"}],\"explanation\":null,\"correctOptions\":[],\"attempts\":[],\"_count\":{\"attempts\":0},\"isDebated\":false,\"isBookmarked\":false},{\"id\":289,\"year\":\"令和5年 (CBT)\",\"questionNumber\":12,\"field\":\"道路運送車両法\",\"majorField\":null,\"subField\":null,\"content\":\"【道路運送車両法関係】\\n\\n道路運送車両の保安基準及びその細目を定める告示についての次の記述のうち、誤っているものを１つ選びなさい。なお、解答にあたっては、各選択肢に記載されている事項以外は考慮しないものとする。\",\"imageUrl\":null,\"sourceSheet\":null,\"knowledgeTags\":\"#保安基準(寸法・重量・灯火)\",\"riskCategory\":null,\"situationCategory\":null,\"format\":\"SINGLE\",\"pdfUrl\":null,\"pdfPage\":null,\"options\":[{\"id\":1142,\"questionId\":289,\"optionNumber\":1,\"content\":\"貨物の運送の用に供する普通自動車であって、車両総重量が8トン以上又は最大積載量が5トン以上のものの原動機には、自動車が時速100キロメートルを超えて走行しないよう燃料の供給を調整し、かつ、自動車の速度の制御を円滑に行うことができるものとして、告示で定める基準に適合する速度抑制装置を備えなければならない。\",\"isCorrect\":true,\"explanation\":null,\"structuredData\":null},{\"id\":1143,\"questionId\":289,\"optionNumber\":2,\"content\":\"貨物の運送の用に供する普通自動車であって車両総重量が7トン以上のものの後面には、所定の後部反射器を備える
